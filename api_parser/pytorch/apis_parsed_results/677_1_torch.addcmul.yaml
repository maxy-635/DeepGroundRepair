2 api_name: torch.addcmul
3 api_description: Computes input + value * (tensor1 * tensor2) element-wise.
4 api_signature: torch.addcmul(input,tensor1,tensor2)
5 api_details: ''
6 api_parameters:
- input: The base tensor that receives the result of adding the scaled elementwise
    product.
- tensor1: The first tensor used in the elementwise multiplication term.
- tensor2: The second tensor used in the elementwise multiplication term.
7 api_usage_example:
- ' t = torch.randn(1, 3)'
