2 api_name: torch.nn.LazyConv3d
3 api_description: torch.nn.LazyConv3d is a 3D convolutional layer that defers the
  specification of input channels until the first input is provided, allowing for
  dynamic model architectures.
4 api_signature: torch.nn.LazyConv3d(out_channels,kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
- out_channels: Specifies the number of output channels generated by the convolution
    operation.
- kernel_size: Defines the dimensions of the filter that will slide over the input
    tensor.
- stride: Determines the step size at which the convolutional filter moves across
    the input.
- padding: Indicates the amount of zero-padding added to the input tensor to control
    the spatial dimensions of the output.
