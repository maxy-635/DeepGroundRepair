2 api_name: torch.autograd.function.BackwardCFunction
3 api_description: Internal autograd helper that represents the backward pass of a
  custom Function and is used by PyTorch to execute gradients; not intended for direct
  use.
4 api_signature: class torch.autograd.function.BackwardCFunction
5 api_details: ''
6 api_parameters: []
7 api_usage_example:
- ' class Inplace(Function):'
- '     @staticmethod'
- '     def forward(ctx, x):'
- '         x_npy = x.numpy() # x_npy shares storage with x'
- '         x_npy += 1'
- '         ctx.mark_dirty(x)'
- '         return x'
- '     @staticmethod'
- '     @once_differentiable'
- '     def backward(ctx, grad_output):'
- '         return grad_output'
- ' a = torch.tensor(1., requires_grad=True, dtype=torch.double).clone()'
- ' b = a * a'
- ' Inplace.apply(a)  # This would lead to wrong gradients!'
- '                   # but the engine would not know unless we mark_dirty'
- ' b.backward() # RuntimeError: one of the variables needed for gradient'
- '              # computation has been modified by an inplace operation'
