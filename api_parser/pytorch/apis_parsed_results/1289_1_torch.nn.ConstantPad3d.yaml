2 api_name: torch.nn.ConstantPad3d
3 api_description: torch.nn.ConstantPad3d pads a 3D input tensor's boundaries with
  a specified constant value.
4 api_signature: torch.nn.ConstantPad3d(padding,value)
5 api_details: ''
6 api_parameters:
- padding: Defines the size of the padding to be added; if an integer, the same padding
    is applied to all boundaries, and if a 6-tuple, different padding sizes can be
    specified for each boundary.
7 api_usage_example:
- ' m = nn.ConstantPad3d(3, 3.5)'
- ' input = torch.randn(16, 3, 10, 20, 30)'
- ' output = m(input)'
- ' # using different paddings for different sides'
- ' m = nn.ConstantPad3d((3, 3, 6, 6, 0, 1), 3.5)'
- ' output = m(input)'
8 api_shape:
  input tensor shape: (N, Channel_in, Depth_in, Height_in, Width_in)
  output tensor shape: (N, Channel_out, Depth_out, Height_out, Width_out)
  tensor shape transform formulas: {}
