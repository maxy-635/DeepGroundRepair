2 api_name: torch.trapezoid
3 api_description: Computes the trapezoidal rule integration of values along a dimension,
  using unit spacing by default, a constant `dx`, or optional sample points `x` for
  irregular spacing.
4 api_signature: torch.trapezoid(y,x,dim)
5 api_details: ''
6 api_parameters:
- y: The values to integrate using the trapezoidal rule.
- x: The spacing values that define the interval widths between `y` samples.
7 api_usage_example:
- ' # Computes the trapezoidal rule in 1D, spacing is implicitly 1'
- ' y = torch.tensor([1, 5, 10])'
- ' torch.trapezoid(y)'
- ' # Computes the same trapezoidal rule directly to verify'
- ' (1 + 10 + 10) / 2'
- ' # Computes the trapezoidal rule in 1D with constant spacing of 2'
- ' # NOTE: the result is the same as before, but multiplied by 2'
- ' torch.trapezoid(y, dx=2)'
- ' # Computes the trapezoidal rule in 1D with arbitrary spacing'
- ' x = torch.tensor([1, 3, 6])'
- ' torch.trapezoid(y, x)'
- ' # Computes the same trapezoidal rule directly to verify'
- ' ((3 - 1) * (1 + 5) + (6 - 3) * (5 + 10)) / 2'
- ' # Computes the trapezoidal rule for each row of a 3x3 matrix'
- ' y = torch.arange(9).reshape(3, 3)'
- ' torch.trapezoid(y)'
- ' # Computes the trapezoidal rule for each column of the matrix'
- ' torch.trapezoid(y, dim=0)'
- ' # Computes the trapezoidal rule for each row of a 3x3 ones matrix'
- ' #   with the same arbitrary spacing'
- ' y = torch.ones(3, 3)'
- ' x = torch.tensor([1, 3, 6])'
- ' torch.trapezoid(y, x)'
- ' # Computes the trapezoidal rule for each row of a 3x3 ones matrix'
- ' #   with different arbitrary spacing per row'
- ' y = torch.ones(3, 3)'
- ' x = torch.tensor([[1, 2, 3], [1, 3, 5], [1, 4, 7]])'
- ' torch.trapezoid(y, x)'
8 api_shape: null
