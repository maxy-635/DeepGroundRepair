2 api_name: torch.std_mean
3 api_description: Computes the standard deviation and mean of a tensor across a specified
  dimension or dimensions, or across all dimensions if none are given.
4 api_signature: torch.std_mean(input,dim,correction,keepdim)
5 api_details: ''
6 api_parameters:
- input: Specifies the tensor whose standard deviation and mean will be computed.
- dim: Selects the dimension or dimensions to reduce; if `None`, all dimensions are
    reduced.
