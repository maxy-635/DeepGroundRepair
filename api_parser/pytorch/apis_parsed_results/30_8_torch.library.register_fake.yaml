2 api_name: torch.library.register_fake
3 api_description: Registers a FakeTensor implementation for an operator so it can
  run with fake tensor inputs during shape and metadata inference.
4 api_signature: torch.library.register_fake(op,func)
5 api_details: ''
6 api_parameters:
- func: Defines the fake-tensor implementation to register for the operator.
- lib: Specifies the library object that receives the fake-tensor registration.
7 api_usage_example:
- ' import torch'
- ' import numpy as np'
- ' from torch import Tensor'
- ' # Example 1: an operator without data-dependent output shape'
- ' @torch.library.custom_op("mylib::custom_linear", mutates_args=())'
- ' def custom_linear(x: Tensor, weight: Tensor, bias: Tensor) -> Tensor:'
- '     raise NotImplementedError("Implementation goes here")'
- ' @torch.library.register_fake("mylib::custom_linear")'
- ' def _(x, weight, bias):'
- '     assert x.dim() == 2'
- '     assert weight.dim() == 2'
- '     assert bias.dim() == 1'
- '     assert x.shape[1] == weight.shape[1]'
- '     assert weight.shape[0] == bias.shape[0]'
- '     assert x.device == weight.device'
- '     return (x @ weight.t()) + bias'
- ' with torch._subclasses.fake_tensor.FakeTensorMode():'
- '     x = torch.randn(2, 3)'
- '     w = torch.randn(3, 3)'
- '     b = torch.randn(3)'
- '     y = torch.ops.mylib.custom_linear(x, w, b)'
- ' assert y.shape == (2, 3)'
- ' # Example 2: an operator with data-dependent output shape'
- ' @torch.library.custom_op("mylib::custom_nonzero", mutates_args=())'
- ' def custom_nonzero(x: Tensor) -> Tensor:'
- '     x_np = x.numpy(force=True)'
- '     res = np.stack(np.nonzero(x_np), axis=1)'
- '     return torch.tensor(res, device=x.device)'
- ' @torch.library.register_fake("mylib::custom_nonzero")'
- ' def _(x):'
- ' # Number of nonzero-elements is data-dependent.'
- ' # Since we cannot peek at the data in an fake impl,'
- ' # we use the ctx object to construct a new symint that'
- ' # represents the data-dependent size.'
- '     ctx = torch.library.get_ctx()'
- '     nnz = ctx.new_dynamic_size()'
- '     shape = [nnz, x.dim()]'
- '     result = x.new_empty(shape, dtype=torch.int64)'
- '     return result'
- ' from torch.fx.experimental.proxy_tensor import make_fx'
- ' x = torch.tensor([0, 1, 2, 3, 4, 0])'
- ' trace = make_fx(torch.ops.mylib.custom_nonzero, tracing_mode="symbolic")(x)'
- ' trace.print_readable()'
- ' assert torch.allclose(trace(x), torch.ops.mylib.custom_nonzero(x))'
