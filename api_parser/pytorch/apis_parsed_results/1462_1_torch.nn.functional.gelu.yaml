3 api_description: The torch.nn.functional.gelu function applies the Gaussian Error
  Linear Unit (GELU) activation, computed as GELU(x) = x * Φ(x), where Φ(x) is the
  cumulative distribution function of the standard normal distribution, to each element
  of the input tensor.
