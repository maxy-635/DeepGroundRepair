2 api_name: torch.logical_xor
3 api_description: Returns the element-wise logical XOR of two tensors, treating zero
  values as False and nonzero values as True.
4 api_signature: torch.logical_xor(input,other)
5 api_details: ''
6 api_parameters:
- input: The tensor whose boolean values are compared for exclusive OR.
- other: The tensor used as the second operand for the exclusive OR comparison.
