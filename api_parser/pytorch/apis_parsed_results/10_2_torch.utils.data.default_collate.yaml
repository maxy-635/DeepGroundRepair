2 api_name: torch.utils.data.default_collate
3 api_description: Combines a batch of samples into tensors or nested structures,
  adding a leading batch dimension.
4 api_signature: '"torch.utils.data.default_collate(batch)"'
5 api_details: ''
6 api_parameters:
- batch: The batch of samples to combine into a single collated output.
7 api_usage_example:
