2 api_name: torch.nn.utils.rnn.pad_packed_sequence
3 api_description: Convert a packed batch of variable-length sequences back into a
  padded tensor, optionally restoring a specified batch-first layout and returning
  the original sequence lengths.
4 api_signature: torch.nn.utils.rnn.pad_packed_sequence(sequence,batch_first,padding_value)
5 api_details: ''
6 api_parameters:
- sequence: The packed batch of sequences to convert back into a padded tensor.
- batch_first: Controls whether the output tensor is shaped as `B x T x *` instead
    of `T x B x *`.
- padding_value: Sets the value used to fill padded positions in the output.
7 api_usage_example:
- ' from torch.nn.utils.rnn import pack_padded_sequence, pad_packed_sequence'
- ' seq = torch.tensor([[1, 2, 0], [3, 0, 0], [4, 5, 6]])'
- ' lens = [2, 1, 3]'
- ' packed = pack_padded_sequence('
- '...     seq, lens, batch_first=True, enforce_sorted=False'
- '... )'
- ' packed'
- ' seq_unpacked, lens_unpacked = pad_packed_sequence(packed, batch_first=True)'
- ' seq_unpacked'
- ' lens_unpacked'
8 api_shape: null
