2 api_name: torch.movedim
3 api_description: Reorders one or more tensor dimensions by moving specified source
  dimensions to new destination positions.
4 api_signature: torch.movedim(input,source,destination)
5 api_details: ''
6 api_parameters:
- input: The tensor to be rearranged by moving its dimensions.
- source: The unique original dimension positions to move.
- destination: The unique target positions where the source dimensions should be placed.
