  tensors, it performs logical XOR.
4 api_signature: torch.bitwise_xor(input,other)
5 api_details: ''
6 api_parameters:
- input: The first tensor whose values are bitwise XORed with the second tensor.
- other: The second tensor used as the bitwise XOR operand.
7 api_usage_example:
