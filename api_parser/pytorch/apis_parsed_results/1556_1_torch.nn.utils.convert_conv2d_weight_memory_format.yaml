2 api_name: torch.nn.utils.convert_conv2d_weight_memory_format
3 api_description: Converts an `nn.Conv2d` layer’s weight tensor to the specified
  memory format, typically to improve performance with channels-last layouts.
4 api_signature: torch.nn.utils.convert_conv2d_weight_memory_format(module,memory_format)
5 api_details: ''
6 api_parameters:
- module: The convolution module or container module whose 2D convolution weights
    will be converted to the target memory format.
- memory_format: The desired tensor memory layout to apply, such as `torch.channels_last`
    or `torch.contiguous_format`.
7 api_usage_example:
- ' input = torch.randint('
- '...     1, 10, (2, 8, 4, 4), dtype=torch.float16, device="cuda"'
- '... )'
- ' model = nn.Sequential('
- '     nn.Conv2d(8, 4, 3)).cuda().half()'
- ' # This is identical to:'
- ' # nn.utils.convert_conv2d_weight_memory_format(model, torch.channels_last)'
- ' model = nn.utils.convert_conv2d_weight_memory_format('
- '...     model, torch.channels_last'
- '... )'
- ' out = model(input)'
8 api_shape: null
