2 api_name: torch.nn.ModuleDict
3 api_description: A dictionary-like container that stores and manages named submodules,
  allowing them to be accessed, added, or removed by key while being properly registered
  as part of the model.
4 api_signature: torch.nn.ModuleDict(modules)
5 api_details: ''
6 api_parameters:
- modules: Specifies the modules to store in the ModuleDict, either as a dictionary
    mapping names to modules or as an iterable of (name, module) pairs.
7 api_usage_example:
- 'class MyModule(nn.Module):'
- '    def __init__(self) -> None:'
- '        super().__init__()'
- '        self.choices = nn.ModuleDict('
- '            {"conv": nn.Conv2d(10, 10, 3), "pool": nn.MaxPool2d(3)}'
- '        )'
- '        self.activations = nn.ModuleDict('
- '            [["lrelu", nn.LeakyReLU()], ["prelu", nn.PReLU()]]'
- '        )'
- '    def forward(self, x, choice, act):'
- '        x = self.choices[choice](x)'
- '        x = self.activations[act](x)'
- '        return x'
