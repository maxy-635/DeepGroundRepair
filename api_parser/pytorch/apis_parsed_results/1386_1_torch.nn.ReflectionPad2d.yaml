2 api_name: torch.nn.ReflectionPad2d
3 api_description: torch.nn.ReflectionPad2d pads a 2D input tensor by reflecting its
  boundary values.
4 api_signature: torch.nn.ReflectionPad2d(padding)
5 api_details: ''
6 api_parameters:
- padding: Specifies the size of the padding to be applied; if an integer, applies
    the same padding to all boundaries, and if a 4-tuple, applies different padding
    to each boundary.
7 api_usage_example:
- ' m = nn.ReflectionPad2d(2)'
- ' input = torch.arange(9, dtype=torch.float).reshape(1, 1, 3, 3)'
- ' input'
- ' m(input)'
- ' # using different paddings for different sides'
- ' m = nn.ReflectionPad2d((1, 1, 2, 0))'
- ' m(input)'
