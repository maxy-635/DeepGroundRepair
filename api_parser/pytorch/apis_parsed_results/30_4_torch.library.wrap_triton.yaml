2 api_name: torch.library.wrap_triton
3 api_description: Wraps a Triton kernel so it can be captured into an FX graph or
  non-strict torch.export trace.
4 api_signature: torch.library.wrap_triton(triton_kernel)
5 api_details: ''
6 api_parameters: []
7 api_usage_example:
- ' import torch'
- ' import triton'
- ' from triton import language as tl'
- ' from torch.fx.experimental.proxy_tensor import make_fx'
- ' from torch.library import wrap_triton'
- ' @triton.jit'
- ' def add_kernel('
- '     in_ptr0,'
- '     in_ptr1,'
- '     out_ptr,'
- '     n_elements,'
- '     BLOCK_SIZE: "tl.constexpr",'
- ' ):'
- '     pid = tl.program_id(axis=0)'
- '     block_start = pid * BLOCK_SIZE'
- '     offsets = block_start + tl.arange(0, BLOCK_SIZE)'
- '     mask = offsets < n_elements'
- '     x = tl.load(in_ptr0 + offsets, mask=mask)'
- '     y = tl.load(in_ptr1 + offsets, mask=mask)'
- '     output = x + y'
- '     tl.store(out_ptr + offsets, output, mask=mask)'
- ' def add(x, y):'
- '     output = torch.empty_like(x)'
- '     n_elements = output.numel()'
- '     def grid_fn(meta):'
- '         return (triton.cdiv(n_elements, meta["BLOCK_SIZE"]),)'
- '     wrap_triton(add_kernel)[grid_fn](x, y, output, n_elements, 16)'
- '     return output'
- ' x = torch.randn(3, device="cuda")'
- ' y = torch.randn(3, device="cuda")'
- ' gm = make_fx(add)(x, y)'
- ' print(gm.code)'
