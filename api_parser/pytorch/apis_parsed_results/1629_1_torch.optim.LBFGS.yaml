2 api_name: torch.optim.LBFGS
3 api_description: Implements the L-BFGS optimization algorithm, a limited-memory
  quasi-Newton method used to minimize a differentiable objective function.
4 api_signature: torch.optim.LBFGS(params,lr,max_iter,line_search_fn)
5 api_details: ''
6 api_parameters:
- params: The parameters to optimize; they must be real-valued tensors.
- lr: Sets the optimizer’s learning rate step size.
- max_iter: Limits the maximum number of optimization iterations per step.
- line_search_fn: Chooses the line search method to use, either `strong_wolfe` or
    `None`.
7 api_usage_example:
- ' model = torch.nn.Linear(10, 10)'
- ' optim = torch.optim.SGD(model.parameters(), lr=3e-4)'
- ' scheduler1 = torch.optim.lr_scheduler.LinearLR('
- '...     optim,'
- '...     start_factor=0.1,'
- '...     end_factor=1,'
- '...     total_iters=20,'
- '... )'
- ' scheduler2 = torch.optim.lr_scheduler.CosineAnnealingLR('
- '...     optim,'
- '...     T_max=80,'
- '...     eta_min=3e-5,'
- '... )'
- ' lr = torch.optim.lr_scheduler.SequentialLR('
- '...     optim,'
- '...     schedulers=[scheduler1, scheduler2],'
- '...     milestones=[20],'
- '... )'
- ' lr.load_state_dict(torch.load("./save_seq.pt"))'
- ' # now load the optimizer checkpoint after loading the LRScheduler'
- ' optim.load_state_dict(torch.load("./save_optim.pt"))'
8 api_shape: null
