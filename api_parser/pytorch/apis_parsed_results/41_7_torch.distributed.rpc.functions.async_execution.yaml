2 api_name: torch.distributed.rpc.functions.async_execution
3 api_description: Marks an RPC callee function as asynchronously returning a Future;
  the callee waits for that Future to complete, then sends its resolved value back
  as the RPC response instead of transmitting the Future itself.
4 api_signature: torch.distributed.rpc.functions.async_execution(fn)
5 api_details: ''
6 api_parameters: []
7 api_usage_example:
- ' from torch.distributed import rpc'
- ' # omitting setup and shutdown RPC'
- ' # On all workers'
- ' @rpc.functions.async_execution'
- ' def async_add_chained(to, x, y, z):'
- '     # This function runs on "worker1" and returns immediately when'
- '     # the callback is installed through the `then(cb)` API. In the'
- '     # mean time, the `rpc_async` to "worker2" can run concurrently.'
- '     # When the return value of that `rpc_async` arrives at'
- '     # "worker1", "worker1" will run the lambda function accordingly'
- '     # and set the value for the previously returned `Future`, which'
- '     # will then trigger RPC to send the result back to "worker0".'
- '     return rpc.rpc_async(to, torch.add, args=(x, y)).then('
- '         lambda fut: fut.wait() + z'
- '     )'
- ' # On worker0'
- ' ret = rpc.rpc_sync('
- '     "worker1",'
- '     async_add_chained,'
- '     args=("worker2", torch.ones(2), 1, 1)'
- ' )'
- ' print(ret)  # prints tensor([3., 3.])'
8 api_shape: null
