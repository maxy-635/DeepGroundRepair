2 api_name: torch.utils.tensorboard.writer.SummaryWriter.__init__
3 api_description: Creates a TensorBoard SummaryWriter that logs events and summaries
  to event files for later visualization.
4 api_signature: __init__(log_dir,purge_step,max_queue,flush_secs)
5 api_details: ''
6 api_parameters:
- log_dir: Sets the directory where TensorBoard event files are saved, using a default
    run-specific folder if not provided.
- purge_step: Removes logged events at or after a restart step so resumed runs hide
    duplicate data from a crashed session.
- max_queue: Controls how many pending events can be buffered before an add call triggers
    a disk flush.
- flush_secs: Sets how often pending events are automatically written to disk in seconds.
7 api_usage_example:
- from torch.utils.tensorboard import SummaryWriter
- '# create a summary writer with automatically generated folder name.'
- writer = SummaryWriter()
- '# folder location: runs/May04_22-14-54_s-MacBook-Pro.local/'
- '# create a summary writer using the specified folder name.'
- writer = SummaryWriter("my_experiment")
- '# folder location: my_experiment'
- '# create a summary writer with comment appended.'
- writer = SummaryWriter(comment="LR_0.1_BATCH_16")
- '# folder location: runs/May04_22-14-54_s-MacBook-Pro.localLR_0.1_BATCH_16/'
