2 api_name: torch.triu_indices
3 api_description: Returns row and column index pairs for the upper triangular part
  of a matrix as a 2-by-N tensor, ordered by row then column.
4 api_signature: torch.triu_indices(row,col,offset)
5 api_details: ''
6 api_parameters:
- row: Specifies the number of rows in the 2-D matrix.
- col: Specifies the number of columns in the 2-D matrix.
- offset: Specifies which diagonal to start from relative to the main diagonal.
7 api_usage_example:
