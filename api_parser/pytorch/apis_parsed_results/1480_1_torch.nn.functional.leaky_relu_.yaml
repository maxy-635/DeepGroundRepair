2 api_name: torch.nn.functional.leaky_relu_
3 api_description: torch.nn.functional.leaky_relu_ applies the leaky ReLU activation
  function in-place, modifying the input directly without allocating new memory.
4 api_signature: torch.nn.functional.leaky_relu_(input,negative_slope)
5 api_details: ''
6 api_parameters:
- input: The input tensor on which the element-wise Leaky ReLU activation function
