2 api_name: torch.optim.lr_scheduler.LambdaLR
3 api_description: Applies a user-defined lambda function to scale each parameter
  group's learning rate over training steps, based on the initial learning rate.
4 api_signature: torch.optim.lr_scheduler.LambdaLR(optimizer,lr_lambda)
5 api_details: ''
6 api_parameters:
- optimizer: The wrapped optimizer whose learning rates will be updated by the scheduler.
- lr_lambda: A function or list of functions that returns a multiplicative factor
    for each epoch, optionally one per parameter group.
7 api_usage_example:
- ' # Assuming optimizer has two groups.'
- ' num_epochs = 100'
- ' lambda1 = lambda epoch: epoch // 30'
- ' lambda2 = lambda epoch: 0.95**epoch'
- ' scheduler = LambdaLR(optimizer, lr_lambda=[lambda1, lambda2])'
- ' for epoch in range(num_epochs):'
- '     train(...)'
- '     validate(...)'
- '     scheduler.step()'
- ' # Alternatively, you can use a single lambda function for all groups.'
- ' scheduler = LambdaLR(opt, lr_lambda=lambda epoch: epoch // 30)'
- ' for epoch in range(num_epochs):'
- '     train(...)'
- '     validate(...)'
- '     scheduler.step()'
8 api_shape: null
