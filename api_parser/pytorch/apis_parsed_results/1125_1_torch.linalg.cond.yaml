- ' torch.linalg.cond(A, -2)'
- ' A = torch.randn(2, 3, 3)'
- ' torch.linalg.cond(A)'
- ' A = torch.randn(2, 3, 3, dtype=torch.complex64)'
- ' torch.linalg.cond(A)'
