2 api_name: torch.nn.LazyConvTranspose3d
3 api_description: torch.nn.LazyConvTranspose3d is a 3D transposed convolution layer
  that defers the specification of input channels until the first forward pass, allowing
  for flexible model design.
4 api_signature: torch.nn.LazyConvTranspose3d(out_channels,kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
- out_channels: Specifies the number of output channels produced by the transposed
    convolution.
- kernel_size: Defines the dimensions of the kernel used for the transposed convolution.
- stride: Determines the step size for moving the kernel across the input.
- padding: Indicates the amount of zero-padding added to each side of the input dimensions
    before the transposed convolution.
