2 api_name: torch.jit.isinstance
3 api_description: Refines a TorchScript value’s container type by checking whether
  it is an instance of a specified type, enabling safer typed access after the check.
4 api_signature: torch.jit.isinstance(obj,target_type)
5 api_details: ''
6 api_parameters:
- obj: The object whose type you want to narrow.
- target_type: The type you want to check against and refine `obj` to if it matches.
7 api_usage_example:
- import torch
- from typing import Any, Dict, List
- 'class MyModule(torch.nn.Module):'
- '    def __init__(self) -> None:'
- '        super().__init__()'
- '    def forward(self, input: Any): # note the Any type'
- '        if torch.jit.isinstance(input, List[torch.Tensor]):'
- '            for t in input:'
- '                y = t.clamp(0, 0.5)'
- '        elif torch.jit.isinstance(input, Dict[str, str]):'
- '            for val in input.values():'
- '                print(val)'
- m = torch.jit.script(MyModule())
- x = [torch.rand(3,3), torch.rand(4,3)]
- m(x)
- y = {"key1":"val1","key2":"val2"}
- m(y)
