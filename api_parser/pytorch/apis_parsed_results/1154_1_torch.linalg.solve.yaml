2 api_name: torch.linalg.solve
3 api_description: Solves a square linear system with a unique solution for the unknown
  matrix or vector.
4 api_signature: torch.linalg.solve(A,B,*,left)
5 api_details: ''
6 api_parameters:
- A: The square coefficient matrix (or batched matrices) used to solve the linear
    system.
- B: The right-hand side vector or matrix (or batched versions) whose solution is
    computed.
7 api_usage_example:
- ' A = torch.randn(3, 3)'
- ' b = torch.randn(3)'
- ' x = torch.linalg.solve(A, b)'
- ' torch.allclose(A @ x, b)'
- ' A = torch.randn(2, 3, 3)'
- ' B = torch.randn(2, 3, 4)'
- ' X = torch.linalg.solve(A, B)'
- ' X.shape'
- ' torch.allclose(A @ X, B)'
- ' A = torch.randn(2, 3, 3)'
- ' b = torch.randn(3, 1)'
- ' x = torch.linalg.solve(A, b) # b is broadcasted to size (2, 3, 1)'
- ' x.shape'
- ' torch.allclose(A @ x, b)'
- ' b = torch.randn(3)'
- ' x = torch.linalg.solve(A, b) # b is broadcasted to size (2, 3)'
- ' x.shape'
- ' Ax = A @ x.unsqueeze(-1)'
- ' torch.allclose(Ax, b.unsqueeze(-1).expand_as(Ax))'
8 api_shape: null
