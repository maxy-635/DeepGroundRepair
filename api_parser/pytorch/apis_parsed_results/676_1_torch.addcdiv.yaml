2 api_name: torch.addcdiv
3 api_description: Adds to the input tensor the element-wise result of tensor1 divided
  by tensor2, scaled by a given value.
4 api_signature: torch.addcdiv(input,tensor1,tensor2,value,out)
5 api_details: ''
6 api_parameters:
- input: The tensor that receives the additive update.
- tensor1: The tensor providing the numerator values for the division term.
- tensor2: The tensor providing the denominator values for the division term.
7 api_usage_example:
- ' t = torch.randn(1, 3)'
- ' t1 = torch.randn(3, 1)'
- ' t2 = torch.randn(1, 3)'
- ' torch.addcdiv(t, t1, t2, value=0.1)'
