2 api_name: torch.utils.tensorboard.writer.SummaryWriter.add_images
3 api_description: Logs a batch of image tensors to TensorBoard so they can be visualized
  as images in the summary.
4 api_signature: add_images(tag,img_tensor,global_step)
5 api_details: ''
6 api_parameters:
- tag: Names the image group or category being logged to TensorBoard.
- img_tensor: Provides the image data tensor to be written as images.
- global_step: Sets the training step associated with the logged images.
7 api_usage_example:
- from torch.utils.tensorboard import SummaryWriter
- import numpy as np
- img_batch = np.zeros((16, 3, 100, 100))
