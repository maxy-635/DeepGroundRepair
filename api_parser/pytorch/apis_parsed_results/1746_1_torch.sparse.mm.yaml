2 api_name: torch.sparse.mm
3 api_description: Multiplies a 2D sparse matrix by a compatible sparse or dense matrix,
  producing a result with matching matrix multiplication dimensions.
4 api_signature: torch.sparse.mm(mat1,mat2)
5 api_details: ''
6 api_parameters:
- mat1: The sparse matrix used as the left-hand operand in the matrix multiplication.
- mat2: The matrix used as the right-hand operand in the multiplication, which may
    be sparse or dense.
