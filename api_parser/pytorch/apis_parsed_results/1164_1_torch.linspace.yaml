2 api_name: torch.linspace
3 api_description: Creates a 1D tensor of evenly spaced values from start to end,
  inclusive, with a specified number of steps.
4 api_signature: torch.linspace(start,end,steps)
5 api_details: ''
6 api_parameters:
- start: Defines the first value in the evenly spaced sequence.
- end: Defines the last value in the evenly spaced sequence.
- steps: Specifies how many points to generate in the output tensor.
7 api_usage_example:
- ' torch.linspace(3, 10, steps=5)'
- ' torch.linspace(-10, 10, steps=5)'
- ' torch.linspace(start=-10, end=10, steps=5)'
- ' torch.linspace(start=-10, end=10, steps=1)'
