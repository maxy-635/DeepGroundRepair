2 api_name: torch.resolve_conj
3 api_description: Returns the input tensor unchanged unless its conjugate bit is
  set, in which case it returns a new tensor with conjugation materialized and the
  conjugate bit cleared.
4 api_signature: torch.resolve_conj(input)
5 api_details: ''
6 api_parameters:
- input: The input tensor whose conjugate flag is resolved.
