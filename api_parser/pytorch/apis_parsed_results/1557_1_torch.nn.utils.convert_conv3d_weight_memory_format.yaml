2 api_name: torch.nn.utils.convert_conv3d_weight_memory_format
3 api_description: Recursively converts `nn.Conv3d.weight` tensors in a module to
  the requested memory format without changing tensor semantics, helping models use
  NHWC CUDA kernels more efficiently.
4 api_signature: torch.nn.utils.convert_conv3d_weight_memory_format(module,memory_format)
5 api_details: ''
6 api_parameters:
- module: The `nn.Module` containing `nn.Conv3d` or `nn.ConvTranspose3d` layers whose
    weights will be converted.
- memory_format: The target memory format to apply to the 3D convolution weights,
    such as `torch.channels_last` or `torch.contiguous_format`.
7 api_usage_example:
- ' input = torch.randint('
- '...     1, 10, (2, 8, 4, 4, 4), dtype=torch.float16, device="cuda"'
- '... )'
- ' model = nn.Sequential('
- '     nn.Conv3d(8, 4, 3)).cuda().half()'
- ' # This is identical to:'
- ' # nn.utils.convert_conv3d_weight_memory_format(model, torch.channels_last_3d)'
- ' model = nn.utils.convert_conv3d_weight_memory_format('
- '...     model, torch.channels_last_3d'
- '... )'
- ' out = model(input)'
8 api_shape: null
