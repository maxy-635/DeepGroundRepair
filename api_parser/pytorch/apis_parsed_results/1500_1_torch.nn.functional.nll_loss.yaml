2 api_name: torch.nn.functional.nll_loss
3 api_description: Computes the negative log likelihood loss between input predictions
  and target labels, used for training classification models.
4 api_signature: torch.nn.functional.nll_loss(input,target,weight,ignore_index,reduction)
5 api_details: ''
6 api_parameters:
- input: The input tensor containing log-probabilities for each class.
- target: The target tensor containing class indices for each sample.
- weight: A tensor for rescaling the loss of each class individually.
- ignore_index: A target value that is ignored during loss computation.
- reduction: 'Specifies how the computed loss is aggregated: none, mean, or sum.'
7 api_usage_example:
- ' # input is of size N x C = 3 x 5'
- ' input = torch.randn(3, 5, requires_grad=True)'
- ' # each element in target has to have 0 <= value < C'
- ' target = torch.tensor([1, 0, 4])'
- ' output = F.nll_loss(F.log_softmax(input, dim=1), target)'
- ' output.backward()'
8 api_shape: null
