2 api_name: torch.nn.ZeroPad3d
3 api_description: torch.nn.ZeroPad3d pads a 5D input tensor with zeros along its
  boundaries in three spatial dimensions.
4 api_signature: torch.nn.ZeroPad3d(padding)
5 api_details: ''
6 api_parameters:
- padding: Defines the size of the padding, where a single integer applies the same
    padding to all boundaries, and a 6-tuple allows for different padding sizes for
    each boundary.
7 api_usage_example:
- ' m = nn.ZeroPad3d(3)'
- ' input = torch.randn(16, 3, 10, 20, 30)'
- ' output = m(input)'
- ' # using different paddings for different sides'
- ' m = nn.ZeroPad3d((3, 3, 6, 6, 0, 1))'
- ' output = m(input)'
8 api_shape:
  input tensor shape: (N, Channel_in, Depth_in, Height_in, Width_in)
  output tensor shape: (N, Channel_out, Depth_out, Height_out, Width_out)
  tensor shape transform formulas: {}
