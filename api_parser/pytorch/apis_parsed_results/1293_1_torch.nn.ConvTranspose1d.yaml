2 api_name: torch.nn.ConvTranspose1d
3 api_description: Applies a 1D transposed convolution to upsample input data, effectively
  reversing the operation of a standard 1D convolution.
4 api_signature: torch.nn.ConvTranspose1d(in_channels,out_channels,kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
- in_channels: Specifies the number of input channels that the convolutional layer
    will process.
- out_channels: Indicates the number of output channels produced by the transposed
    convolution.
- kernel_size: Defines the size of the filter or kernel used for the transposed convolution.
- stride: Determines the step size with which the kernel moves across the input.
- padding: Specifies the amount of zero-padding added to both sides of the input,
    adjusted by the dilation.
7 api_usage_example: null
8 api_shape:
  input tensor shape: (N, Channel_in, L_in)
  output tensor shape: (N, Channel_out, L_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = out_channels
    L_out: L_out = (L_in - 1) * stride - 2 * padding + kernel_size + output_padding
