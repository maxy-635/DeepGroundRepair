2 api_name: torch.nn.parallel.DistributedDataParallel.register_comm_hook
3 api_description: Registers a custom communication hook to control how DistributedDataParallel
  aggregates and reduces gradients across workers during backpropagation.
4 api_signature: register_comm_hook(state,hook)
5 api_details: ''
6 api_parameters:
- state: Holds per-worker state shared across all gradient buckets during training,
    such as compression feedback or peer communication data.
- hook: Processes each ready gradient bucket and returns a Future containing the updated
    tensor values, optionally performing async communication.
