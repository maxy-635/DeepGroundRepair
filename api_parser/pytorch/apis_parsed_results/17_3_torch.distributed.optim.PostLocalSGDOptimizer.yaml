2 api_name: torch.distributed.optim.PostLocalSGDOptimizer
3 api_description: Wraps a standard optimizer to run local SGD every step, then periodically
  averages parameters across workers after a warm-up period.
4 api_signature: torch.distributed.optim.PostLocalSGDOptimizer(optim,averager)
5 api_details: ''
6 api_parameters:
- optim: The local optimizer used to update model parameters during training.
- averager: The model averager that applies the post-local SGD synchronization algorithm.
7 api_usage_example:
- ' import torch'
- ' import torch.distributed as dist'
- ' import torch.distributed.algorithms.model_averaging.averagers as averagers'
- ' import torch.nn as nn'
- ' from torch.distributed.optim import PostLocalSGDOptimizer'
- ' from torch.distributed.algorithms.ddp_comm_hooks.post_localSGD_hook import ('
- '   PostLocalSGDState,'
- '   post_localSGD_hook,'
- ' )'
- ' model = nn.parallel.DistributedDataParallel('
- '    module, device_ids=[rank], output_device=rank'
- ' )'
- ' # Register a post-localSGD communication hook.'
- ' state = PostLocalSGDState(process_group=None, subgroup=None, start_localSGD_iter=100)'
- ' model.register_comm_hook(state, post_localSGD_hook)'
- ' # Create a post-localSGD optimizer that wraps a local optimizer.'
- ' # Note that ``warmup_steps`` used in ``PostLocalSGDOptimizer`` must be the same
  as'
- ' # ``start_localSGD_iter`` used in ``PostLocalSGDState``.'
- ' local_optim = torch.optim.SGD(params=model.parameters(), lr=0.01)'
- ' opt = PostLocalSGDOptimizer('
- '     optim=local_optim,'
- '     averager=averagers.PeriodicModelAverager(period=4, warmup_steps=100)'
- ' )'
- ' # In the first 100 steps, DDP runs global gradient averaging at every step.'
- ' # After 100 steps, DDP runs gradient averaging within each subgroup (intra-node
  by default),'
- ' # and post-localSGD optimizer runs global model averaging every 4 steps after
  applying the local optimizer.'
- ' for step in range(0, 200):'
- '    opt.zero_grad()'
- '    loss = loss_fn(output, labels)'
- '    loss.backward()'
- '    opt.step()'
