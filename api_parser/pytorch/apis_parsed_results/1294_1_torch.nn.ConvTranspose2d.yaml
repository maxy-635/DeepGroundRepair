2 api_name: torch.nn.ConvTranspose2d
3 api_description: Applies a 2D transposed convolution to upsample an input image
  with multiple channels, enabling the generation of higher-dimensional feature maps.
4 api_signature: torch.nn.ConvTranspose2d(in_channels,out_channels,kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
- in_channels: Specifies the number of input channels from the input image.
- out_channels: Determines the number of output channels produced by the transposed
    convolution.
- kernel_size: Defines the dimensions of the kernel used for the transposed convolution.
- stride: Indicates the step size at which the kernel moves across the input.
- padding: Specifies the amount of zero-padding added to both sides of each dimension
    in the input.
7 api_usage_example:
- ' # With square kernels and equal stride'
- ' m = nn.ConvTranspose2d(16, 33, 3, stride=2)'
- ' # non-square kernels and unequal stride and with padding'
- ' m = nn.ConvTranspose2d(16, 33, (3, 5), stride=(2, 1), padding=(4, 2))'
- ' input = torch.randn(20, 16, 50, 100)'
- ' output = m(input)'
- ' # exact output size can be also specified as an argument'
- ' input = torch.randn(1, 16, 12, 12)'
- ' downsample = nn.Conv2d(16, 16, 3, stride=2, padding=1)'
- ' upsample = nn.ConvTranspose2d(16, 16, 3, stride=2, padding=1)'
- ' h = downsample(input)'
- ' h.size()'
- ' output = upsample(h, output_size=input.size())'
- ' output.size()'
8 api_shape:
  input tensor shape: (N, Channel_in, Height_in, Width_in)
  output tensor shape: (N, Channel_out, Height_out, Width_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = out_channels
    tensor height: Height_out = (Height_in - 1) * stride_height - 2 * padding_height + kernel_size_height + output_padding_height
    tensor width: Width_out = (Width_in - 1) * stride_width - 2 * padding_width + kernel_size_width + output_padding_width
