2 api_name: torch.nn.MaxUnpool2d
3 api_description: MaxUnpool2d performs the inverse operation of MaxPool2d, reconstructing
  an input tensor by using the indices of the maximum values from the pooling operation
  to restore the original spatial dimensions.
4 api_signature: torch.nn.MaxUnpool2d(kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
- kernel_size: Defines the dimensions of the window used for unpooling.
- stride: Specifies the step size for moving the unpooling window, defaulting to the
    value of kernel_size.
- padding: Indicates the amount of zero-padding that was added to the input before
    the pooling operation.
7 api_usage_example:
- ' pool = nn.MaxPool2d(2, stride=2, return_indices=True)'
- ' unpool = nn.MaxUnpool2d(2, stride=2)'
- ' input = torch.tensor([[[[ 1.,  2.,  3.,  4.],'
- ' output, indices = pool(input)'
- ' unpool(output, indices)'
- ' # Now using output_size to resolve an ambiguous size for the inverse'
- ' input = torch.tensor([[[[ 1.,  2.,  3.,  4.,  5.],'
- ' output, indices = pool(input)'
- ' # This call will not work without specifying output_size'
- ' unpool(output, indices, output_size=input.size())'
8 api_shape:
  input tensor shape: (N, Channel_in, Height_in, Width_in)
  output tensor shape: (N, Channel_out, Height_out, Width_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = Channel_in
    tensor height: Height_out = (Height_in - 1) * stride_height - 2 * padding_height + kernel_size_height
    tensor width: Width_out = (Width_in - 1) * stride_width - 2 * padding_width + kernel_size_widths
