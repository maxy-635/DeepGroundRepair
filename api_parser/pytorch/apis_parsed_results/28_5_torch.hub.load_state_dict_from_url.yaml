2 api_name: torch.hub.load_state_dict_from_url
3 api_description: Downloads and loads a Torch-serialized object from a URL, typically
  a model state dict or checkpoint.
4 api_signature: torch.hub.load_state_dict_from_url(url,map_location,progress,check_hash)
5 api_details: ''
6 api_parameters:
