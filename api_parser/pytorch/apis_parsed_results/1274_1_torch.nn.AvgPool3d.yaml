2 api_name: torch.nn.AvgPool3d
3 api_description: Applies 3D average pooling to reduce the spatial dimensions of
  input data while preserving the number of input planes.
4 api_signature: torch.nn.AvgPool3d(kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
- kernel_size: Defines the dimensions of the window that will be used to compute the
    average.
- stride: Specifies the step size by which the window moves; defaults to the value
    of kernel_size if not provided.
- padding: Indicates the amount of implicit zero padding added to each side of the
    input before applying the pooling operation.
7 api_usage_example:
- ' # pool of square window of size=3, stride=2'
- ' m = nn.AvgPool3d(3, stride=2)'
- ' # pool of non-square window'
- ' m = nn.AvgPool3d((3, 2, 2), stride=(2, 1, 2))'
- ' input = torch.randn(20, 16, 50, 44, 31)'
- ' output = m(input)'
8 api_shape:
  input tensor shape: (N, Channel_in, Depth_in, Height_in, Width_in)
  output tensor shape: (N, Channel_out, Depth_out, Height_out, Width_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = Channel_in
    tensor depth: Depth_out = floor((Depth_in + 2 * padding_depth - kernel_size_depth) / stride_depth + 1)
    tensor height: Height_out = floor((Height_in + 2 * padding_height - kernel_size_height) / stride_height + 1)
    tensor width: Width_out = floor((Width_in + 2 * padding_width - kernel_size_width) / stride_width + 1)
