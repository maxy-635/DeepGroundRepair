2 api_name: torch.nn.functional.avg_pool3d
3 api_description: torch.nn.functional.avg_pool3d applies a 3D average pooling operation
  over input data, reducing its dimensions by averaging values in specified kernel
  regions with defined step sizes.
4 api_signature: torch.nn.functional.avg_pool3d(input,kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
- input: The input tensor with dimensions (minibatch, in_channels, iT, iH, iW) representing
    the data to be pooled.
- kernel_size: Defines the size of the pooling region, which can be specified as a
    single number or a tuple (kT, kH, kW).
- stride: Specifies the stride of the pooling operation, which can be a single number
    or a tuple (sT, sH, sW).
- padding: Determines the implicit zero paddings on both sides of the input, which
    can be a single number or a tuple (padT, padH, padW) and should not exceed half
    of the effective kernel size.
7 api_usage_example: null
8 api_shape:
  input tensor shape: (N, Channel_in, Depth_in, Height_in, Width_in)
  output tensor shape: (N, Channel_out, Depth_out, Height_out, Width_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = Channel_in
    tensor depth: Depth_out = floor((Depth_in + 2 * padding_depth - kernel_size_depth) / stride_depth + 1)
    tensor height: Height_out = floor((Height_in + 2 * padding_height - kernel_size_height) / stride_height + 1)
    tensor width: Width_out = floor((Width_in + 2 * padding_width - kernel_size_width) / stride_width + 1)
