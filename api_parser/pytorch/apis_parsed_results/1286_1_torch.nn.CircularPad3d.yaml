2 api_name: torch.nn.CircularPad3d
3 api_description: torch.nn.CircularPad3d applies circular padding to a 3D input tensor,
  wrapping around the boundaries to extend the input dimensions.
4 api_signature: torch.nn.CircularPad3d(padding)
5 api_details: ''
6 api_parameters:
- padding: Defines the size of the padding to be applied; if an integer, the same
    padding is applied to all boundaries, while a 6-tuple allows for different padding
    sizes on each side.
7 api_usage_example:
- ' m = nn.CircularPad3d(3)'
- ' input = torch.randn(16, 3, 8, 320, 480)'
- ' output = m(input)'
- ' # using different paddings for different sides'
- ' m = nn.CircularPad3d((3, 3, 6, 6, 1, 1))'
- ' output = m(input)'
8 api_shape:
  input tensor shape: (N, Channel_in, Depth_in, Height_in, Width_in)
  output tensor shape: (N, Channel_out, Depth_out, Height_out, Width_out)
  tensor shape transform formulas: {}
