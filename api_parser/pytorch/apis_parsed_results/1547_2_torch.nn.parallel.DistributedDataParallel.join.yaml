2 api_name: torch.nn.parallel.DistributedDataParallel.join
3 api_description: Context manager that lets DDP training continue safely when different
  processes run out of inputs at different times.
4 api_signature: join(divide_by_initial_world_size,enable)
5 api_details: ''
6 api_parameters:
- divide_by_initial_world_size: Controls whether gradients are always scaled by the
    original world size or by the number of still-active ranks when inputs become
    uneven.
- enable: Turns uneven-input detection and join behavior on or off.
7 api_usage_example:
- ' import torch'
- ' import torch.distributed as dist'
- ' import os'
- ' import torch.multiprocessing as mp'
- ' import torch.nn as nn'
- ' # On each spawned worker'
- ' def worker(rank):'
- '     dist.init_process_group("nccl", rank=rank, world_size=2)'
- '     torch.cuda.set_device(rank)'
- '     model = nn.Linear(1, 1, bias=False).to(rank)'
- '     model = torch.nn.parallel.DistributedDataParallel('
- '         model, device_ids=[rank], output_device=rank'
- '     )'
- '     # Rank 1 gets one more input than rank 0.'
- '     inputs = [torch.tensor([1]).float() for _ in range(10 + rank)]'
- '     with model.join():'
- '         for _ in range(5):'
- '             for inp in inputs:'
- '                 loss = model(inp).sum()'
- '                 loss.backward()'
- '     # Without the join() API, the below synchronization will hang'
- '     # blocking for rank 1''s allreduce to complete.'
- '     torch.cuda.synchronize(device=rank)'
8 api_shape: null
