2 api_name: torch.nn.Unflatten
3 api_description: Unflattens a tensor along a specified dimension, expanding it to
  a desired shape, typically used in neural network architectures with Sequential.
4 api_signature: torch.nn.Unflatten(dim,unflattened_size)
5 api_details: ''
6 api_parameters:
- dim: Specifies the dimension of the input tensor that will be unflattened.
- unflattened_size: Defines the new shape that the specified dimension will take after
    unflattening.
7 api_usage_example:
- ' input = torch.randn(2, 50)'
- ' # With tuple of ints'
- ' m = nn.Sequential('
- '     nn.Linear(50, 50),'
- '     nn.Unflatten(1, (2, 5, 5))'
- ' )'
- ' output = m(input)'
- ' output.size()'
- ' # With torch.Size'
- ' m = nn.Sequential('
- '     nn.Linear(50, 50),'
- '     nn.Unflatten(1, torch.Size([2, 5, 5]))'
- ' )'
- ' output = m(input)'
- ' output.size()'
- ' # With namedshape (tuple of tuples)'
- ' input = torch.randn(2, 50, names=(''N'', ''features''))'
- ' unflatten = nn.Unflatten(''features'', ((''C'', 2), (''H'', 5), (''W'', 5)))'
- ' output = unflatten(input)'
- ' output.size()'
8 api_shape:
  input tensor shape: (*, S_{\text{dim}}, *), where S_{\text{dim}} is the size at
    dimension dim and * means any number of dimensions including none.
  output tensor shape: (*, U_1,..., U_n, *), where U = unflattened_size and \prod_i=1^n
    U_i = S_{\text{dim}}.
  tensor shape transform formulas: {}
