2 api_name: torch.sparse_coo_tensor
3 api_description: Creates a sparse COO tensor from specified indices and values.
4 api_signature: torch.sparse_coo_tensor(indices,values,size,*,dtype,device,requires_grad)
5 api_details: ''
6 api_parameters:
- indices: Specifies the coordinates of the non-zero entries in the sparse tensor.
- values: Provides the values stored at the given non-zero coordinates.
- size: Sets the overall shape of the sparse tensor, or is inferred if omitted.
7 api_usage_example:
- ' i = torch.tensor([[0, 1, 1],'
- '...                   [2, 0, 2]])'
- ' v = torch.tensor([3, 4, 5], dtype=torch.float32)'
- ' torch.sparse_coo_tensor(i, v, [2, 4])'
- ' torch.sparse_coo_tensor(i, v)  # Shape inference'
- ' torch.sparse_coo_tensor(i, v, [2, 4],'
- '...                         dtype=torch.float64,'
- '...                         device=torch.device(''cuda:0''))'
- ' S = torch.sparse_coo_tensor(torch.empty([1, 0]), [], [1])'
- ' S = torch.sparse_coo_tensor(torch.empty([1, 0]), torch.empty([0, 2]), [1, 2])'
8 api_shape: null
