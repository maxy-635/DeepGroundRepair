2 api_name: torch.autograd.profiler.record_function
3 api_description: Marks a code block or function with a custom label for autograd
  profiling, shown only when CPU activity tracing is enabled.
4 api_signature: '"torch.autograd.profiler.record_function(name)"'
5 api_details: ''
6 api_parameters:
- name: The label assigned to the profiled block of code.
7 api_usage_example:
- ' x = torch.randn((1, 1), requires_grad=True)'
- ' with torch.autograd.profiler.profile() as prof:'
- '...     y = x**2'
- '...     with torch.autograd.profiler.record_function('
- '...         "label-z"'
- '...     ):  # label the block'
- '...         z = y**3'
- '...     y.backward()'
- ' # NOTE: some columns were removed for brevity'
- ' print(prof.key_averages().table(sort_by="self_cpu_time_total"))'
8 api_shape: null
