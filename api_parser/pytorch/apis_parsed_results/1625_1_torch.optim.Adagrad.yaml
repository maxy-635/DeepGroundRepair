2 api_name: torch.optim.Adagrad
3 api_description: Implements the Adagrad optimizer, which adapts each parameter’s
  learning rate based on the history of past gradients.
4 api_signature: torch.optim.Adagrad(params,lr,weight_decay,eps,*,maximize,differentiable)
5 api_details: ''
6 api_parameters:
- params: Specifies the parameters or parameter groups to optimize.
- lr: Sets the learning rate used for each Adagrad update.
- weight_decay: Applies L2 regularization to penalize large parameter values.
- eps: Adds a small constant to the denominator for numerical stability.
- maximize: If True, performs gradient ascent instead of gradient descent.
- differentiable: Controls whether the optimizer step is tracked by autograd.
7 api_usage_example:
- ' model = torch.nn.Linear(10, 10)'
- ' optim = torch.optim.SGD(model.parameters(), lr=3e-4)'
- ' scheduler1 = torch.optim.lr_scheduler.LinearLR('
- '...     optim,'
- '...     start_factor=0.1,'
- '...     end_factor=1,'
- '...     total_iters=20,'
- '... )'
- ' scheduler2 = torch.optim.lr_scheduler.CosineAnnealingLR('
- '...     optim,'
- '...     T_max=80,'
- '...     eta_min=3e-5,'
- '... )'
- ' lr = torch.optim.lr_scheduler.SequentialLR('
- '...     optim,'
- '...     schedulers=[scheduler1, scheduler2],'
- '...     milestones=[20],'
- '... )'
- ' lr.load_state_dict(torch.load("./save_seq.pt"))'
- ' # now load the optimizer checkpoint after loading the LRScheduler'
- ' optim.load_state_dict(torch.load("./save_optim.pt"))'
8 api_shape: null
