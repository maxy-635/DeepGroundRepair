2 api_name: torch.nn.CircularPad2d
3 api_description: torch.nn.CircularPad2d applies circular padding to a 2D input tensor,
  wrapping the edges to create a continuous boundary effect.
4 api_signature: torch.nn.CircularPad2d(padding)
5 api_details: ''
6 api_parameters:
- padding: Defines the size of the circular padding to be applied to the input tensor,
    where an integer applies the same padding to all sides, and a 4-tuple allows for
    specifying different padding sizes for each boundary.
7 api_usage_example:
- ' m = nn.CircularPad2d(2)'
- ' input = torch.arange(9, dtype=torch.float).reshape(1, 1, 3, 3)'
- ' input'
- ' m(input)'
- ' # using different paddings for different sides'
- ' m = nn.CircularPad2d((1, 1, 2, 0))'
- ' m(input)'
8 api_shape:
  input tensor shape: (N, Channel_in, Height_in, Width_in)
  output tensor shape: (N, Channel_out, Height_out, Width_out)
  tensor shape transform formulas: {}
