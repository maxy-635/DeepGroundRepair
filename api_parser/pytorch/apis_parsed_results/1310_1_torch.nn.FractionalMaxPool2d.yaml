2 api_name: torch.nn.FractionalMaxPool2d
3 api_description: Applies 2D fractional max pooling to downsample input feature maps
  by selecting the maximum values within defined pooling regions, allowing for non-integer
  downsampling ratios.
4 api_signature: torch.nn.FractionalMaxPool2d(kernel_size,output_size)
5 api_details: ''
6 api_parameters:
- kernel_size: Specifies the size of the window for the max pooling operation, which
    can be a single integer or a tuple.
- output_size: Defines the desired output dimensions of the pooled image, which can
    be a single integer for a square image or a tuple for rectangular shapes.
7 api_usage_example:
- ' # pool of square window of size=3, and target output size 13x12'
- ' m = nn.FractionalMaxPool2d(3, output_size=(13, 12))'
- ' # pool of square window and target output size being half of input image size'
- ' m = nn.FractionalMaxPool2d(3, output_ratio=(0.5, 0.5))'
- ' input = torch.randn(20, 16, 50, 32)'
- ' output = m(input)'
8 api_shape:
  input tensor shape: (N, Channel_in, Height_in, Width_in)
  output tensor shape: (N, Channel_out, Height_out, Width_out)
  tensor shape transform formulas: {}
