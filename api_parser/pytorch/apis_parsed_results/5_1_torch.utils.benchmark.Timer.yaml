3 api_description: Measures the execution time of PyTorch statements for benchmarking
  and performance comparison.
4 api_signature: torch.utils.benchmark.Timer(stmt,setup,globals,num_threads)
5 api_details: ''
6 api_parameters:
- stmt: The code to benchmark repeatedly in the timed loop.
