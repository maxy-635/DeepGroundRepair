2 api_name: torch.distributions.fishersnedecor.FisherSnedecor
3 api_description: Represents the Fisher-Snedecor F distribution, supporting sampling,
  probability density and log-density evaluation, cumulative and inverse cumulative
  probabilities, and basic distribution properties like mean, variance, and entropy
  when defined.
4 api_signature: torch.distributions.fishersnedecor.FisherSnedecor(df1,df2)
5 api_details: ''
6 api_parameters:
- df1: Controls the numerator degrees of freedom, shaping the Fisher-Snedecor distribution's
    left tail and overall form.
- df2: Controls the denominator degrees of freedom, affecting the distribution's spread
    and right tail behavior.
7 api_usage_example:
- ' m = FisherSnedecor(torch.tensor([1.0]), torch.tensor([2.0]))'
- ' m.sample()  # Fisher-Snedecor-distributed with df1=1 and df2=2'
