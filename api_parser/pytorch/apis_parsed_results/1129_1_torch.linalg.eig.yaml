2 api_name: torch.linalg.eig
3 api_description: Computes the eigenvalue decomposition of a square matrix, returning
  its eigenvalues and eigenvectors when the decomposition exists.
4 api_signature: torch.linalg.eig(A)
5 api_details: ''
