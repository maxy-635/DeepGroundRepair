2 api_name: torch.profiler._KinetoProfile.toggle_collection_dynamic
3 api_description: Dynamically enables or disables profiling activity collection during
  a running Kineto profile, currently for Torch ops (CPU) and CUDA activities.
4 api_signature: toggle_collection_dynamic(enable)
5 api_details: ''
6 api_parameters: []
7 api_usage_example:
- with torch.profiler.profile(
- '    activities=['
- '        torch.profiler.ProfilerActivity.CPU,'
- '        torch.profiler.ProfilerActivity.CUDA,'
- '    ]'
- ') as p:'
- '    code_to_profile_0()'
- '    // turn off collection of all CUDA activity'
- '    p.toggle_collection_dynamic(False, [torch.profiler.ProfilerActivity.CUDA])'
- '    code_to_profile_1()'
- '    // turn on collection of all CUDA activity'
- '    p.toggle_collection_dynamic(True, [torch.profiler.ProfilerActivity.CUDA])'
- '    code_to_profile_2()'
- print(p.key_averages().table(
- '    sort_by="self_cuda_time_total", row_limit=-1))'
8 api_shape: null
