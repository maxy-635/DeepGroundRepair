2 api_name: torch.lerp
3 api_description: Computes the linear interpolation between `input` and `end` using
  a scalar or tensor `weight`, and returns the interpolated tensor.
4 api_signature: torch.lerp(input,end,weight)
5 api_details: ''
6 api_parameters:
- input: Provides the starting tensor values used as the base for interpolation.
- end: Provides the target tensor values that the interpolation moves toward.
- weight: Controls how far the result shifts from input toward end, with 0 meaning
    input and 1 meaning end.
7 api_usage_example:
- ' start = torch.arange(1., 5.)'
- ' end = torch.empty(4).fill_(10)'
- ' start'
- ' end'
- ' torch.lerp(start, end, 0.5)'
- ' torch.lerp(start, end, torch.full_like(start, 0.5))'
8 api_shape: null
