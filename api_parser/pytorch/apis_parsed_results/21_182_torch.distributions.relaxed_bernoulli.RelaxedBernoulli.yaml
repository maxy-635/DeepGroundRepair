2 api_name: torch.distributions.relaxed_bernoulli.RelaxedBernoulli
3 api_description: Continuous relaxation of a Bernoulli distribution that produces
  differentiable samples in (0, 1) for gradient-based optimization, parameterized
  by temperature and Bernoulli probabilities or logits.
4 api_signature: '"RelaxedBernoulli(temperature,probs,logits)"'
5 api_details: ''
6 api_parameters:
- temperature: Controls how soft or discrete the relaxed Bernoulli samples are.
- probs: Specifies the probability of sampling 1.
- logits: Specifies the log-odds of sampling 1.
7 api_usage_example:
