2 api_name: torch.nn.functional.avg_pool2d
3 api_description: torch.nn.functional.avg_pool2d performs a 2D average pooling operation
  over an input signal composed of several input planes, reducing its spatial dimensions
  by computing the average of elements in defined kernel regions with specified stride
  steps.
4 api_signature: torch.nn.functional.avg_pool2d(input,kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
- input: Specifies the input tensor with dimensions (minibatch, in_channels, iH, iW).
- kernel_size: Defines the size of the pooling region, which can be a single number,
    a single-element tuple, or a tuple (kH, kW).
- stride: Determines the stride of the pooling operation, which can be a single number,
    a single-element tuple, or a tuple (sH, sW).
- padding: Specifies the implicit zero padding on both sides of the input, which can
    be a single number, a single-element tuple, or a tuple (padH, padW), and should
    not exceed half of the effective kernel size.
7 api_usage_example: null
8 api_shape:
  input tensor shape: (N, Channel_in, Height_in, Width_in)
  output tensor shape: (N, Channel_out, Height_out, Width_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = Channel_in
    tensor height: Height_out = floor((Height_in + 2 * padding_height - kernel_size_height) / stride_height + 1)
    tensor width: Width_out = floor((Width_in + 2 * padding_width - kernel_size_width) / stride_width + 1)
