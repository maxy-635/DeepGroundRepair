2 api_name: torch.nn.ConstantPad2d
3 api_description: Pads the boundaries of a 2D tensor with a specified constant value.
4 api_signature: torch.nn.ConstantPad2d(padding,value)
5 api_details: ''
6 api_parameters:
- padding: Specifies the size of the padding to be applied; if an integer, the same
    padding is applied to all boundaries, and if a 4-tuple, different padding sizes
    can be specified for each boundary.
