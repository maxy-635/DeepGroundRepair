2 api_name: torch.library.register_vmap
3 api_description: Registers a batching rule for a custom operator so it can be transformed
  by `torch.vmap()` and correctly handle batched inputs.
4 api_signature: '"torch.library.register_vmap(op,func,*,lib)"'
5 api_details: ''
6 api_parameters: []
7 api_usage_example:
- ' import torch'
- ' import numpy as np'
- ' from torch import Tensor'
- ' from typing import Tuple'
- ' def to_numpy(tensor):'
- '     return tensor.cpu().numpy()'
- ' lib = torch.library.Library("mylib", "FRAGMENT")'
- ' @torch.library.custom_op("mylib::numpy_cube", mutates_args=())'
- ' def numpy_cube(x: Tensor) -> Tuple[Tensor, Tensor]:'
- '     x_np = to_numpy(x)'
- '     dx = torch.tensor(3 * x_np ** 2, device=x.device)'
- '     return torch.tensor(x_np ** 3, device=x.device), dx'
- ' def numpy_cube_vmap(info, in_dims, x):'
- '     result = numpy_cube(x)'
- '     return result, (in_dims[0], in_dims[0])'
- ' torch.library.register_vmap(numpy_cube, numpy_cube_vmap)'
- ' x = torch.randn(3)'
- ' torch.vmap(numpy_cube)(x)'
- ' @torch.library.custom_op("mylib::numpy_mul", mutates_args=())'
- ' def numpy_mul(x: Tensor, y: Tensor) -> Tensor:'
- '     return torch.tensor(to_numpy(x) * to_numpy(y), device=x.device)'
- ' @torch.library.register_vmap("mylib::numpy_mul")'
- ' def numpy_mul_vmap(info, in_dims, x, y):'
- '     x_bdim, y_bdim = in_dims'
- '     x = x.movedim(x_bdim, -1) if x_bdim is not None else x.unsqueeze(-1)'
- '     y = y.movedim(y_bdim, -1) if y_bdim is not None else y.unsqueeze(-1)'
- '     result = x * y'
- '     result = result.movedim(-1, 0)'
- '     return result, 0'
- ' x = torch.randn(3)'
- ' y = torch.randn(3)'
- ' torch.vmap(numpy_mul)(x, y)'
