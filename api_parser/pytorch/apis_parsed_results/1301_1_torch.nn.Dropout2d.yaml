2 api_name: torch.nn.Dropout2d
3 api_description: torch.nn.Dropout2d randomly sets entire channels of the input tensor
  to zero during training to prevent overfitting.
4 api_signature: torch.nn.Dropout2d(p)
5 api_details: ''
6 api_parameters:
- p: The probability of an element in the input tensor to be set to zero during training,
    helping to prevent overfitting.
