2 api_name: torch.optim.Adam.state_dict
3 api_description: Returns a dictionary snapshot of the optimizer’s internal state,
  including parameter groups and per-parameter values needed to restore or inspect
  Adam’s configuration and progress.
4 api_signature: state_dict()
5 api_details: ''
6 api_parameters:
- params: Iterable of parameters or parameter groups whose optimization state is being
    saved or loaded.
- state: Dictionary holding per-parameter optimizer state such as momentum and step
    counts.
- param_groups: List of parameter-group settings like learning rate and hyperparameters
    for each group.
