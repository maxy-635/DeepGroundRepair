2 api_name: torch.distributed.fsdp.FullyShardedDataParallel.set_state_dict_type
3 api_description: Sets the state_dict type for all descendant FSDP modules so their
  state_dict behavior is consistent during save/load.
4 api_signature: staticset_state_dict_type(module,state_dict_type)
5 api_details: ''
6 api_parameters:
- module: The root module whose FSDP state-dict type configuration will be set.
- state_dict_type: The state-dict type to apply when saving or loading the module
    state.
7 api_usage_example:
- ' model = DDP(FSDP(...))'
