2 api_name: torch.special.logit
3 api_description: Computes the logit of each input element, clamping values to [eps,
  1 - eps] when eps is provided and returning NaN for out-of-range values when eps
  is None.
4 api_signature: torch.special.logit(input,eps)
5 api_details: ''
6 api_parameters:
- input: The input tensor whose values are transformed by the logit function.
- eps: A small epsilon used to clamp the input away from 0 and 1 for numerical stability.
7 api_usage_example:
- ' a = torch.rand(5)'
- ' a'
- ' torch.special.logit(a, eps=1e-6)'
