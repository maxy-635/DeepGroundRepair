2 api_name: torch.Tensor.refine_names
3 api_description: Assigns or updates a tensor’s dimension names to the specified
  names.
4 api_signature: '"refine_names(*names)"'
5 api_details: ''
6 api_parameters:
- names: Sets the output tensor’s dimension names, allowing at most one `Ellipsis`
    to preserve unspecified names.
7 api_usage_example:
- ' imgs = torch.randn(32, 3, 128, 128)'
