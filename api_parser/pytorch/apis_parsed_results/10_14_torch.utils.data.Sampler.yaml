2 api_name: torch.utils.data.Sampler
3 api_description: Base class for data samplers that define how to iterate over dataset
  indices, typically controlling the order and subset of samples returned to a DataLoader.
4 api_signature: class torch.utils.data.Sampler
5 api_details: ''
