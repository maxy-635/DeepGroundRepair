2 api_name: torch.cuda.jiterator._create_multi_output_jit_fn
3 api_description: Creates a JIT-compiled CUDA elementwise kernel that can produce
  one or more outputs per input element.
4 api_signature: torch.cuda.jiterator._create_multi_output_jit_fn(code_string,num_outputs)
5 api_details: ''
6 api_parameters:
