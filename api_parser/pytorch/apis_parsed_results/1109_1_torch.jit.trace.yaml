2 api_name: torch.jit.trace
3 api_description: Traces a function to produce an executable TorchScript graph for
  JIT-compiled execution.
4 api_signature: torch.jit.trace(func,example_inputs,check_trace,strict)
5 api_details: ''
6 api_parameters:
- func: The Python function or `torch.nn.Module` to execute and trace using the provided
    example inputs.
7 api_usage_example:
- import torch
- 'def foo(x, y):'
- '    return 2 * x + y'
- '# Run `foo` with the provided inputs and record the tensor operations'
- traced_foo = torch.jit.trace(foo, (torch.rand(3), torch.rand(3)))
- '# `traced_foo` can now be run with the TorchScript interpreter or saved'
- '# and loaded in a Python-free environment'
8 api_shape: null
