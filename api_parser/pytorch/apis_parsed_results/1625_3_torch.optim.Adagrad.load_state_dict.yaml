2 api_name: torch.optim.Adagrad.load_state_dict
3 api_description: Loads saved optimizer state into Adagrad, restoring parameter-specific
  state and optimizer settings from a state_dict.
4 api_signature: load_state_dict(state_dict)
5 api_details: ''
6 api_parameters:
- state_dict: The saved optimizer state to load, as produced by a previous call to
    `state_dict()`.
7 api_usage_example:
- ' model = torch.nn.Linear(10, 10)'
- ' optim = torch.optim.SGD(model.parameters(), lr=3e-4)'
- ' scheduler1 = torch.optim.lr_scheduler.LinearLR('
- '...     optim,'
- '...     start_factor=0.1,'
- '...     end_factor=1,'
- '...     total_iters=20,'
- '... )'
- ' scheduler2 = torch.optim.lr_scheduler.CosineAnnealingLR('
- '...     optim,'
- '...     T_max=80,'
- '...     eta_min=3e-5,'
- '... )'
- ' lr = torch.optim.lr_scheduler.SequentialLR('
- '...     optim,'
- '...     schedulers=[scheduler1, scheduler2],'
- '...     milestones=[20],'
- '... )'
- ' lr.load_state_dict(torch.load("./save_seq.pt"))'
- ' # now load the optimizer checkpoint after loading the LRScheduler'
- ' optim.load_state_dict(torch.load("./save_optim.pt"))'
