2 api_name: torch.optim.swa_utils.SWALR
3 api_description: Anneals each optimizer parameter group's learning rate to a fixed
  target value according to a schedule.
4 api_signature: torch.optim.swa_utils.SWALR(optimizer,swa_lr,anneal_epochs,anneal_strategy)
5 api_details: ''
6 api_parameters:
- optimizer: The optimizer whose learning rate will be adjusted by SWALR.
