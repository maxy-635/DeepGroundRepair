2 api_name: torch.nn.Conv1d
3 api_description: Applies a 1D convolutional layer to input signals with multiple
  channels, transforming the input by sliding filters across the data.
4 api_signature: torch.nn.Conv1d(in_channels,out_channels,kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
- in_channels: Specifies the number of input feature channels.
- out_channels: Defines the number of output feature channels produced by the convolution.
- kernel_size: Indicates the dimensions of the filter applied during convolution.
- stride: Determines the step size at which the convolutional filter moves across
    the input.
- padding: Specifies the number of zero-padding layers added to both sides of the
    input.
7 api_usage_example:
- ' m = nn.Conv1d(16, 33, 3, stride=2)'
- ' input = torch.randn(20, 16, 50)'
- ' output = m(input)'
8 api_shape:
  input tensor shape: (N, Channel_in, L_in)
  output tensor shape: (N, Channel_out, L_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = out_channels
    L_out: L_out = floor((L_in + 2 * padding - kernel_size) / stride + 1)
