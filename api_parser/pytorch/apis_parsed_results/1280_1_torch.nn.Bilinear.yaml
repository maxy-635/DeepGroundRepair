2 api_name: torch.nn.Bilinear
3 api_description: The torch.nn.Bilinear module computes a bilinear transformation
  of two input tensors, producing an output by applying the formula y = x1^T A x2
  + b, where A is a learnable weight matrix and b is a learnable bias.
4 api_signature: torch.nn.Bilinear(in1_features,in2_features,out_features)
5 api_details: ''
6 api_parameters:
- in1_features: Specifies the dimensionality of each sample from the first input.
- in2_features: Specifies the dimensionality of each sample from the second input.
- out_features: Specifies the dimensionality of each output sample produced by the
    bilinear operation.
7 api_usage_example:
- ' m = nn.Bilinear(20, 30, 40)'
- ' input1 = torch.randn(128, 20)'
- ' input2 = torch.randn(128, 30)'
- ' output = m(input1, input2)'
- ' print(output.size())'
8 api_shape:
  input tensor shape: null
  output tensor shape: (*, H_\text{out}) where H_\text{out}=\text{out_features} and
    all but the last dimension are the same shape as the input.
  tensor shape transform formulas: {}
