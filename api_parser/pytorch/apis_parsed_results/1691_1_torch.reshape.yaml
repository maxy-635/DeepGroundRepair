2 api_name: torch.reshape
3 api_description: Returns a tensor with the same data rearranged to a specified shape,
  using a view when possible and a copy when needed.
4 api_signature: torch.reshape(input,shape)
5 api_details: ''
6 api_parameters:
- input: The tensor whose elements will be rearranged into a new shape.
- shape: The target dimensions that define the tensor’s new shape.
7 api_usage_example:
