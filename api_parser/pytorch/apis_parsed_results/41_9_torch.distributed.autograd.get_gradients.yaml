2 api_name: torch.distributed.autograd.get_gradients
3 api_description: Returns the accumulated gradients for tensors in a specified distributed
  autograd context.
4 api_signature: torch.distributed.autograd.get_gradients(context_id)
5 api_details: ''
6 api_parameters:
- context_id: Identifies the autograd context whose gradients should be retrieved.
7 api_usage_example:
- ' import torch.distributed.autograd as dist_autograd'
- ' with dist_autograd.context() as context_id:'
- '     t1 = torch.rand((3, 3), requires_grad=True)'
- '     t2 = torch.rand((3, 3), requires_grad=True)'
- '     loss = t1 + t2'
- '     dist_autograd.backward(context_id, [loss.sum()])'
- '     grads = dist_autograd.get_gradients(context_id)'
- '     print(grads[t1])'
- '     print(grads[t2])'
