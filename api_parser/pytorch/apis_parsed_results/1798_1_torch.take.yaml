2 api_name: torch.take
3 api_description: Returns a new tensor containing elements from the input selected
  by the given indices, treating the input as a flattened 1-D tensor and matching
  the indices' shape.
4 api_signature: torch.take(input,index)
5 api_details: ''
6 api_parameters:
- input: The tensor whose values will be gathered from.
- index: A tensor of indices specifying which elements to take from the input.
7 api_usage_example:
