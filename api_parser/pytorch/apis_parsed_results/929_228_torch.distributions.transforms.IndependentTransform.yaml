2 api_name: torch.distributions.transforms.IndependentTransform
3 api_description: Wraps another transform so the specified number of rightmost batch
  dimensions are treated as dependent, leaving the forward and inverse mappings unchanged
  while summing those dimensions in the log-det Jacobian.
4 api_signature: torch.distributions.transforms.IndependentTransform(base_transform,reinterpreted_batch_ndims)
5 api_details: ''
6 api_parameters:
- base_transform: The underlying transform to wrap and apply independently across
    batch dimensions.
- reinterpreted_batch_ndims: How many of the rightmost batch dimensions should be
    treated as dependent rather than independent.
