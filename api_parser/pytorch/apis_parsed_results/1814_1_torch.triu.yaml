2 api_name: torch.triu
3 api_description: Returns the upper triangular part of a 2D matrix or batched matrices,
  setting all other elements to 0.
4 api_signature: torch.triu(input,diagonal)
5 api_details: ''
6 api_parameters:
- input: The tensor whose upper triangular portion is extracted.
- diagonal: The diagonal offset that determines which diagonal is treated as the main
    cutoff.
