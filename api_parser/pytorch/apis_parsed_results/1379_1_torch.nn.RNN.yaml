2 api_name: torch.nn.RNN
3 api_description: The torch.nn.RNN API implements a multi-layer Elman RNN that processes
  input sequences using either tanh or ReLU non-linearity, computing hidden states
  for each element in the sequence across multiple layers.
4 api_signature: torch.nn.RNN(input_size,hidden_size,num_layers,nonlinearity)
5 api_details: ''
6 api_parameters:
- input_size: Specifies the number of features in the input data.
- hidden_size: Defines the number of features in the hidden state of the RNN.
- num_layers: Indicates the number of stacked recurrent layers in the RNN.
- nonlinearity: Chooses the activation function used in the RNN, either 'tanh' or
    'relu'.
7 api_usage_example:
- '# Efficient implementation equivalent to the following with bidirectional=False'
- 'def forward(x, hx=None):'
- '    if batch_first:'
- '        x = x.transpose(0, 1)'
- '    seq_len, batch_size, _ = x.size()'
- '    if hx is None:'
- '        hx = torch.zeros(num_layers, batch_size, hidden_size)'
- '    h_t_minus_1 = hx'
- '    h_t = hx'
- '    output = []'
- '    for t in range(seq_len):'
- '        for layer in range(num_layers):'
- '            h_t[layer] = torch.tanh('
- '                x[t] @ weight_ih[layer].T'
- '                + bias_ih[layer]'
- '                + h_t_minus_1[layer] @ weight_hh[layer].T'
- '                + bias_hh[layer]'
- '            )'
- '        output.append(h_t[-1])'
- '        h_t_minus_1 = h_t'
- '    output = torch.stack(output)'
- '    if batch_first:'
- '        output = output.transpose(0, 1)'
- '    return output, h_t'
