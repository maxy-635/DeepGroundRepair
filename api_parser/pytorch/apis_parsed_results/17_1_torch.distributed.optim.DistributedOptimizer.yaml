2 api_name: torch.distributed.optim.DistributedOptimizer
3 api_description: Applies a local optimizer to parameters that are remotely referenced
  and distributed across workers.
4 api_signature: '"torch.distributed.optim.DistributedOptimizer(optimizer_class ,params_rref)"'
5 api_details: ''
6 api_parameters:
- optimizer_class: Specifies the optimizer class to create on each worker.
- params_rref: Provides the list of parameter RRefs, local or remote, that the optimizer
    should update.
7 api_usage_example:
- ' import torch.distributed.autograd as dist_autograd'
- ' import torch.distributed.rpc as rpc'
- ' from torch import optim'
- ' from torch.distributed.optim import DistributedOptimizer'
- ' with dist_autograd.context() as context_id:'
- '   # Forward pass.'
- '   rref1 = rpc.remote("worker1", torch.add, args=(torch.ones(2), 3))'
- '   rref2 = rpc.remote("worker1", torch.add, args=(torch.ones(2), 1))'
- '   loss = rref1.to_here() + rref2.to_here()'
- '   # Backward pass.'
- '   dist_autograd.backward(context_id, [loss.sum()])'
- '   # Optimizer.'
- '   dist_optim = DistributedOptimizer('
- '      optim.SGD,'
- '      [rref1, rref2],'
- '      lr=0.05,'
- '   )'
- '   dist_optim.step(context_id)'
8 api_shape: null
