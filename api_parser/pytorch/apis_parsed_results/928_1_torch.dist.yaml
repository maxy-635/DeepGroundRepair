2 api_name: torch.dist
3 api_description: Computes the p-norm distance between two tensors by returning the
  norm of their elementwise difference.
4 api_signature: torch.dist(input,other,p)
5 api_details: ''
6 api_parameters:
- input: The first tensor whose distance to `other` is computed.
- other: The second tensor used as the reference for the distance calculation.
- p: The norm degree used to compute the distance between the two tensors.
7 api_usage_example:
