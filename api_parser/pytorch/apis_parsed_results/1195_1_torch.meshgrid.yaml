2 api_name: torch.meshgrid
3 api_description: Creates coordinate grids from 1D input tensors, returning a mesh
  of all coordinate combinations.
4 api_signature: torch.meshgrid(*tensors)
5 api_details: ''
6 api_parameters:
- tensors: One or more 0D or 1D inputs that define the coordinate vectors to expand
    into a mesh grid; scalars are treated as length-1 tensors.
7 api_usage_example:
- ' x = torch.tensor([1, 2, 3])'
- ' y = torch.tensor([4, 5, 6])'
- ' grid_x, grid_y = torch.meshgrid(x, y, indexing=''ij'')'
- ' grid_x'
- ' grid_y'
- ' torch.equal(torch.cat(tuple(torch.dstack([grid_x, grid_y]))),'
- '...             torch.cartesian_prod(x, y))'
- ' import matplotlib.pyplot as plt'
- ' xs = torch.linspace(-5, 5, steps=100)'
- ' ys = torch.linspace(-5, 5, steps=100)'
- ' x, y = torch.meshgrid(xs, ys, indexing=''xy'')'
- ' z = torch.sin(torch.sqrt(x * x + y * y))'
- ' ax = plt.axes(projection=''3d'')'
- ' ax.plot_surface(x.numpy(), y.numpy(), z.numpy())'
- ' plt.show()'
