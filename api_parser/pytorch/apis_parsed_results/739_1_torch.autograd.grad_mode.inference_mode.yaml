2 api_name: torch.autograd.grad_mode.inference_mode
3 api_description: Context manager that toggles PyTorch inference mode to run operations
  without autograd tracking for faster, lower-overhead inference.
4 api_signature: torch.autograd.grad_mode.inference_mode(mode)
5 api_details: ''
6 api_parameters:
- mode: Turns inference mode on or off, or acts as a decorator to run a function with
    inference mode enabled.
