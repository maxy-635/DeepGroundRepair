2 api_name: torch.nn.ConvTranspose3d
3 api_description: Applies a 3D transposed convolution to input data, using learnable
  kernels to perform upsampling and feature extraction across multiple input planes.
4 api_signature: torch.nn.ConvTranspose3d(in_channels,out_channels,kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
- in_channels: Specifies the number of input channels in the image to be processed.
- out_channels: Defines the number of output channels produced after the transposed
    convolution.
- kernel_size: Indicates the dimensions of the kernel used for the transposed convolution
    operation.
- stride: Determines the step size with which the kernel moves across the input volume.
- padding: Specifies the amount of zero-padding added to each side of the input dimensions
    before the transposed convolution.
7 api_usage_example:
- ' # With square kernels and equal stride'
- ' m = nn.ConvTranspose3d(16, 33, 3, stride=2)'
- ' # non-square kernels and unequal stride and with padding'
- ' m = nn.ConvTranspose3d(16, 33, (3, 5, 2), stride=(2, 1, 1), padding=(0, 4, 2))'
- ' input = torch.randn(20, 16, 10, 50, 100)'
- ' output = m(input)'
8 api_shape:
  input tensor shape: (N, Channel_in, Depth_in, Height_in, Width_in)
  output tensor shape: (N, Channel_out, Depth_out, Height_out, Width_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = out_channels
    tensor depth: Depth_out = (Depth_in - 1) * stride_depth - 2 * padding_depth + kernel_size_depth + output_padding_depth
    tensor height: Height_out = (Height_in - 1) * stride_height - 2 * padding_height + kernel_size_height + output_padding_height
    tensor width: Width_out = (Width_in - 1) * stride_width - 2 * padding_width + kernel_size_width + output_padding_width
