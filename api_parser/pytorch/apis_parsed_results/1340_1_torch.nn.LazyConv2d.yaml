3 api_description: torch.nn.LazyConv2d is a convolutional layer that defers the initialization
  of the in_channels parameter until the input size is known, allowing for flexible
  model architecture.
4 api_signature: torch.nn.LazyConv2d(out_channels,kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
- out_channels: Specifies the number of output channels generated by the convolution
