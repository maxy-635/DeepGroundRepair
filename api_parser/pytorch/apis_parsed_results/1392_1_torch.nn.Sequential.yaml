2 api_name: torch.nn.Sequential
3 api_description: torch.nn.Sequential is a container that allows you to build neural
  networks by stacking layers in a sequential manner, where the output of one layer
  is the input to the next.
4 api_signature: torch.nn.Sequential(*args:Module)
5 api_details: ''
6 api_parameters: []
7 api_usage_example:
- '# Using Sequential to create a small model. When `model` is run,'
- '# input will first be passed to `Conv2d(1,20,5)`. The output of'
- '# `Conv2d(1,20,5)` will be used as the input to the first'
- '# `ReLU`; the output of the first `ReLU` will become the input'
- '# for `Conv2d(20,64,5)`. Finally, the output of'
- '# `Conv2d(20,64,5)` will be used as input to the second `ReLU`'
- model = nn.Sequential(
- '          nn.Conv2d(1,20,5),'
- '          nn.ReLU(),'
- '          nn.Conv2d(20,64,5),'
- '          nn.ReLU()'
- '        )'
- '# Using Sequential with OrderedDict. This is functionally the'
- '# same as the above code'
- model = nn.Sequential(OrderedDict([
- '          (''conv1'', nn.Conv2d(1,20,5)),'
- '          (''relu1'', nn.ReLU()),'
- '          (''conv2'', nn.Conv2d(20,64,5)),'
- '          (''relu2'', nn.ReLU())'
- '        ]))'
8 api_shape: null
