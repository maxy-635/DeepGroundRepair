2 api_name: torch.optim.Adadelta
3 api_description: Implements the Adadelta optimizer, which adaptively adjusts learning
  rates using running averages of squared gradients and parameter updates.
4 api_signature: torch.optim.Adadelta(params,lr,rho,eps,weight_decay)
5 api_details: ''
6 api_parameters:
- params: Specifies the parameters or parameter groups to optimize, including optionally
    named parameters.
- lr: Sets the step size used to scale the parameter update.
- rho: Controls the running average of squared gradients, affecting how quickly the
    optimizer adapts.
- eps: Adds a small value for numerical stability when computing updates.
- weight_decay: Applies L2 regularization to penalize large parameter values.
7 api_usage_example:
- ' model = torch.nn.Linear(10, 10)'
- ' optim = torch.optim.SGD(model.parameters(), lr=3e-4)'
- ' scheduler1 = torch.optim.lr_scheduler.LinearLR('
- '...     optim,'
- '...     start_factor=0.1,'
- '...     end_factor=1,'
- '...     total_iters=20,'
- '... )'
- ' scheduler2 = torch.optim.lr_scheduler.CosineAnnealingLR('
- '...     optim,'
- '...     T_max=80,'
- '...     eta_min=3e-5,'
- '... )'
- ' lr = torch.optim.lr_scheduler.SequentialLR('
- '...     optim,'
- '...     schedulers=[scheduler1, scheduler2],'
- '...     milestones=[20],'
- '... )'
- ' lr.load_state_dict(torch.load("./save_seq.pt"))'
- ' # now load the optimizer checkpoint after loading the LRScheduler'
- ' optim.load_state_dict(torch.load("./save_optim.pt"))'
8 api_shape: null
