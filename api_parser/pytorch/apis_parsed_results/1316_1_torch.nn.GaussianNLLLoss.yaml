2 api_name: torch.nn.GaussianNLLLoss
3 api_description: Computes the Gaussian negative log likelihood loss between predicted
  mean and variance and target values.
4 api_signature: torch.nn.GaussianNLLLoss(full,eps,reduction)
5 api_details: ''
6 api_parameters:
- full: If set to True, includes the constant term in the loss calculation.
- eps: A small value used to clamp the variance for numerical stability.
- reduction: 'Determines how the output loss is aggregated: ''none'', ''mean'', or
    ''sum''.'
7 api_usage_example:
- ' loss = nn.GaussianNLLLoss()'
- ' input = torch.randn(5, 2, requires_grad=True)'
- ' target = torch.randn(5, 2)'
- ' var = torch.ones(5, 2, requires_grad=True)  # heteroscedastic'
- ' output = loss(input, target, var)'
- ' output.backward()'
8 api_shape:
  input tensor shape: (N, *)
  output tensor shape: scalar if reduction is 'mean' (default)
  tensor shape transform formulas: {}
