2 api_name: torch.fft.rfftfreq
3 api_description: Returns the frequency bins for a real-input FFT of length n, giving
  the non-negative sample frequencies used by rfft().
4 api_signature: torch.fft.rfftfreq(n,d)
5 api_details: ''
6 api_parameters:
