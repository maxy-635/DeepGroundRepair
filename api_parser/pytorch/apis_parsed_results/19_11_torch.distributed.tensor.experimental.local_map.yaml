2 api_name: torch.distributed.tensor.experimental.local_map
3 api_description: Runs a Tensor-only function on the local shards of DTensors, then
  wraps the results back into DTensors using the specified output placements.
4 api_signature: torch.distributed.tensor.experimental.local_map(func,device_mesh,*,redistribute_inputs)
5 api_details: ''
6 api_parameters:
- func: The function to apply to each local shard of the input DTensors.
- device_mesh: The device mesh to place the output DTensors on, inferred from the
    first input DTensor if omitted.
7 api_usage_example:
- ' def mm_allreduce_forward(device_mesh, W, X):'
- '     partial_sum_tensor = torch.mm(W, X)'
- '     reduced_tensor = funcol.all_reduce(partial_sum_tensor, "sum", device_mesh)'
- '     return reduced_tensor'
- ' W = torch.randn(12, 8, requires_grad=False)'
- ' X = torch.randn(8, 16, requires_grad=False)'
- ' Y = torch.mm(W, X)'
- ' row_wise = [Shard(0)]  # row-wise sharding placements on 1-d mesh'
- ' col_wise = [Shard(1)]  # col-wise sharding placements on 1-d mesh'
- ' # local_mm_allreduce_forward is the function wrapped with DTensor/Tensor conversion'
- ' local_mm_allreduce_forward = local_map('
- '     mm_allreduce_forward,'
- '     out_placements=[Replicate()],'
- '     in_placements=[col_wise, row_wise],'
- '     device_mesh=device_mesh,'
- ' )'
- ' W_dt = distribute_tensor('
- '...     W, device_mesh, (col_wise)'
- '... )  # col-wisely sharded W tensor'
- ' X_dt = distribute_tensor('
- '...     X, device_mesh, (row_wise)'
- '... )  # row-wisely sharded X tensor'
- ' Y_dt = local_mm_allreduce_forward('
- '...     device_mesh, W_dt, X_dt'
- '... )  # apply local_mm_allreduce_forward to DTensors'
8 api_shape: null
