2 api_name: torch.distributed.rpc.TensorPipeRpcBackendOptions.set_device_map
3 api_description: Configures per-RPC caller/callee device mappings for TensorPipe,
  and can be called repeatedly to add placement rules incrementally.
4 api_signature: set_device_map(device_map)
5 api_details: ''
6 api_parameters:
- device_map: Specifies how this worker's devices are mapped to the callee's devices,
    and the mapping must be invertible.
7 api_usage_example:
- ' # both workers'
- ' def add(x, y):'
- '     print(x)  # tensor([1., 1.], device=''cuda:1'')'
- '     return x + y, (x + y).to(2)'
- ' # on worker 0'
- ' options = TensorPipeRpcBackendOptions('
- '     num_worker_threads=8,'
- '     device_maps={"worker1": {0: 1}}'
- ' # maps worker0''s cuda:0 to worker1''s cuda:1'
- ' )'
- ' options.set_device_map("worker1", {1: 2})'
- ' # maps worker0''s cuda:1 to worker1''s cuda:2'
- ' rpc.init_rpc('
- '     "worker0",'
- '     rank=0,'
- '     world_size=2,'
- '     backend=rpc.BackendType.TENSORPIPE,'
- '     rpc_backend_options=options'
- ' )'
- ' x = torch.ones(2)'
- ' rets = rpc.rpc_sync("worker1", add, args=(x.to(0), 1))'
- ' # The first argument will be moved to cuda:1 on worker1. When'
- ' # sending the return value back, it will follow the invert of'
- ' # the device map, and hence will be moved back to cuda:0 and'
- ' # cuda:1 on worker0'
- ' print(rets[0])  # tensor([2., 2.], device=''cuda:0'')'
- ' print(rets[1])  # tensor([2., 2.], device=''cuda:1'')'
8 api_shape: null
