2 api_name: torch.utils.tensorboard.writer.SummaryWriter.add_embedding
3 api_description: Adds embedding data and optional metadata to TensorBoard summary
  files for visualization in the Embedding Projector.
4 api_signature: add_embedding(mat,metadata,global_step,tag)
5 api_details: ''
6 api_parameters:
- mat: Provides the feature matrix, with each row representing one data point’s embedding
    vector.
- metadata: Supplies labels or annotations for each row, converted to strings for
    display.
- global_step: Records the embedding at a specific training step for tracking over
    time.
- tag: Sets the name used to identify the embedding in TensorBoard.
