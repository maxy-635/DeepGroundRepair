2 api_name: paddle.renorm
3 api_description: Renormalizes each row or column of a tensor so its p-norm stays
  within a specified maximum value.
4 api_signature: paddle.renorm(x,p,axis,max_norm)
5 api_details: ''
6 api_parameters:
- x: The tensor whose values are being normalized.
- p: The exponent that determines which norm is computed.
- axis: The dimension along which the tensor is sliced for normalization.
7 api_usage_example:
- import paddle
- input = [[[2.0, 2.0, -2.0], [3.0, 0.3, 3.0]],
- '         [[2.0, -8.0, 2.0], [3.1, 3.7, 3.0]]]'
- x = paddle.to_tensor(input,dtype='float32')
- y = paddle.renorm(x, 1.0, 2, 2.05)
- print(y)
