2 api_name: paddle.nanmean
3 api_description: Computes the arithmetic mean along a specified axis while ignoring
  NaN values.
4 api_signature: paddle.nanmean(x,axis,keepdim)
5 api_details: ''
6 api_parameters:
- x: The input tensor whose elements are used to compute the NaN-ignoring mean.
- axis: Specifies the dimension or dimensions over which to calculate the nanmean,
    or `None` to reduce over all elements.
- keepdim: Determines whether the reduced dimensions remain in the output tensor as
    size-1 dimensions.
7 api_usage_example:
- import paddle
- '# x is a 2-D Tensor:'
- x = paddle.to_tensor([[float('nan'), 0.3, 0.5, 0.9],
- '                      [0.1, 0.2, float(''-nan''), 0.7]])'
- out1 = paddle.nanmean(x)
- out1
- Tensor(shape=[], dtype=float32, place=Place(cpu), stop_gradient=True,
- 0.44999996)
- out2 = paddle.nanmean(x, axis=0)
- out2
- Tensor(shape=[4], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[0.10000000, 0.25000000, 0.50000000, 0.79999995])'
- out3 = paddle.nanmean(x, axis=0, keepdim=True)
- out3
- Tensor(shape=[1, 4], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[0.10000000, 0.25000000, 0.50000000, 0.79999995]])'
- out4 = paddle.nanmean(x, axis=1)
- out4
- Tensor(shape=[2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[0.56666666, 0.33333334])'
- out5 = paddle.nanmean(x, axis=1, keepdim=True)
- out5
- Tensor(shape=[2, 1], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[0.56666666],'
- '[0.33333334]])'
- '# y is a 3-D Tensor:'
- y = paddle.to_tensor([[[1, float('nan')], [3, 4]],
- '                      [[5, 6], [float(''-nan''), 8]]])'
- out6 = paddle.nanmean(y, axis=[1, 2])
- out6
- Tensor(shape=[2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[2.66666675, 6.33333349])'
- out7 = paddle.nanmean(y, axis=[0, 1])
- out7
- Tensor(shape=[2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[3., 6.])'
