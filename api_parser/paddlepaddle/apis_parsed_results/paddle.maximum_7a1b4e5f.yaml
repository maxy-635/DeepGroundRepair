2 api_name: paddle.maximum
3 api_description: Returns a new tensor with the element-wise maximum values from
  two input tensors.
4 api_signature: paddle.maximum(x,y)
5 api_details: ''
6 api_parameters:
- x: The first input tensor whose values are compared to compute the elementwise maximum.
- y: The second input tensor whose values are compared to compute the elementwise
    maximum.
7 api_usage_example:
- import paddle
- x = paddle.to_tensor([[1, 2], [7, 8]])
- y = paddle.to_tensor([[3, 4], [5, 6]])
- res = paddle.maximum(x, y)
- print(res)
- Tensor(shape=[2, 2], dtype=int64, place=Place(cpu), stop_gradient=True,
- '[[3, 4],'
- '[7, 8]])'
- x = paddle.to_tensor([[1, 2, 3], [1, 2, 3]])
- y = paddle.to_tensor([3, 0, 4])
- res = paddle.maximum(x, y)
- print(res)
- Tensor(shape=[2, 3], dtype=int64, place=Place(cpu), stop_gradient=True,
- '[[3, 2, 4],'
- '[3, 2, 4]])'
- x = paddle.to_tensor([2, 3, 5], dtype='float32')
- y = paddle.to_tensor([1, float("nan"), float("nan")], dtype='float32')
- res = paddle.maximum(x, y)
- print(res)
- Tensor(shape=[3], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[2. , nan, nan])'
- x = paddle.to_tensor([5, 3, float("inf")], dtype='float32')
- y = paddle.to_tensor([1, -float("inf"), 5], dtype='float32')
- res = paddle.maximum(x, y)
- print(res)
- Tensor(shape=[3], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[5.  , 3.  , inf.])'
