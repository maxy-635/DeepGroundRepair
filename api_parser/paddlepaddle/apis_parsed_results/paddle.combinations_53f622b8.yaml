2 api_name: paddle.combinations
3 api_description: Computes length-r combinations from a tensor, optionally allowing
  repeated elements.
4 api_signature: paddle.combinations(x,r,with_replacement)
5 api_details: ''
6 api_parameters:
- x: The 1-D input tensor containing the values to generate combinations from.
- r: The number of elements to select in each combination, defaulting to 2.
- with_replacement: Whether elements may be reused within a combination, defaulting
    to False.
7 api_usage_example:
- import paddle
- x = paddle.to_tensor([1, 2, 3], dtype='int32')
