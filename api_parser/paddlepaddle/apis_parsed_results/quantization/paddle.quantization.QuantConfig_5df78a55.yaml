2 api_name: paddle.quantization.QuantConfig
3 api_description: Defines quantization settings for a model or model భాగ, mapping
  layers to SingleLayerConfig instances and letting you choose different quantization
  strategies.
4 api_signature: paddle.quantization.QuantConfig(activation,weight)
5 api_details: ''
6 api_parameters:
- activation: Defines the global quantizer applied to activations.
- weight: Defines the global quantizer applied to weights.
7 api_usage_example:
