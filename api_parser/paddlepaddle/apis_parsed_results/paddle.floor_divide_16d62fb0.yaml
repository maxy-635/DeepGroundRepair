2 api_name: paddle.floor_divide
3 api_description: Element-wise floor division of two tensors, rounding each quotient
  down toward negative infinity.
4 api_signature: paddle.floor_divide(x,y,out)
5 api_details: ''
6 api_parameters:
- x: The left-hand input tensor whose values are floor-divided by `y`.
- y: The right-hand input tensor or number used as the divisor.
- out: An optional tensor that stores the result of the floor division.
7 api_usage_example:
