2 api_name: paddle.unstack
3 api_description: Splits a tensor into multiple tensors by unstacking it along a
  specified axis.
4 api_signature: paddle.unstack(x,axis)
5 api_details: ''
6 api_parameters:
- x: The input tensor to be split into multiple tensors.
- axis: The dimension along which the tensor is unstacked.
7 api_usage_example:
- import paddle
