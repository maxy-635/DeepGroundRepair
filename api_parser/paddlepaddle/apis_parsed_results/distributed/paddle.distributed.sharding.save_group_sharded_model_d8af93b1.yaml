2 api_name: paddle.distributed.sharding.save_group_sharded_model
3 api_description: Saves a sharded model and optimizer state for a distributed training
  group by grouping parameters, partitioning state across ranks, and writing the grouped
  shards to storage.
4 api_signature: paddle.distributed.sharding.save_group_sharded_model(model,output)
5 api_details: ''
6 api_parameters:
- model: The wrapped group-sharded model to be saved.
- output: The directory where the model checkpoint will be written.
7 api_usage_example:
- '# type: ignore'
- '>>>'
- import paddle
- from paddle.nn import Linear
- from paddle.distributed import fleet
- from paddle.distributed.sharding import group_sharded_parallel, save_group_sharded_model
- fleet.init(is_collective=True)
- group = paddle.distributed.new_group([0, 1])
- model = Linear(1000, 1000)
- clip = paddle.nn.ClipGradByGlobalNorm(clip_norm=1.0)
- optimizer = paddle.optimizer.AdamW(learning_rate=0.001, parameters=model.parameters(),
  weight_decay=0.00001, grad_clip=clip)
- '# wrap sharding model, optimizer and scaler'
- model, optimizer, scaler = group_sharded_parallel(model, optimizer, "p_g", scaler=scaler)
- img, label = data
- label.stop_gradient = True
- img.stop_gradient = True
- out = model(img)
- loss = paddle.nn.functional.cross_entropy(input=out, label=label)
- loss.backward()
- optimizer.step()
- optimizer.clear_grad()
- '# save model and optimizer state_dict'
- save_group_sharded_model(model, optimizer, output=output_dir)
