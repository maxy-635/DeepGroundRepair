2 api_name: paddle.distributed.gloo_init_parallel_env
3 api_description: Initializes a CPU-only distributed parallel environment using Gloo.
4 api_signature: paddle.distributed.gloo_init_parallel_env(rank_id,rank_num,server_endpoint)
5 api_details: ''
6 api_parameters:
- rank_id: The local rank index used to identify this process in the distributed group.
- rank_num: The total number of ranks participating in the distributed parallel environment.
- server_endpoint: The endpoint address and port used to connect the processes in
    the group.
7 api_usage_example:
- import paddle
- import multiprocessing
- from contextlib import closing
- import socket
- 'port_set = set() # type: ignore'
- 'def find_free_port():'
- '    def _free_port():'
- '        with closing(socket.socket(socket.AF_INET,'
- '            socket.SOCK_STREAM)) as s:'
- '            s.bind(('''', 0))'
- '            return s.getsockname()[1]'
- '    while True:'
- '        port = _free_port()'
- '        if port not in port_set:'
- '            port_set.add(port)'
- '            return port'
- 'def test_gloo_init(id, rank_num, server_endpoint):'
- '    paddle.distributed.gloo_init_parallel_env('
- '        id, rank_num, server_endpoint)'
- 'def test_gloo_init_with_multiprocess(num_of_ranks):'
- '    jobs = []'
- '    server_endpoint = "127.0.0.1:%s" % (find_free_port())'
- '    for id in range(num_of_ranks):'
- '        p = multiprocessing.Process('
- '            target=test_gloo_init,'
- '            args=(id, num_of_ranks, server_endpoint))'
- '        jobs.append(p)'
- '        p.start()'
- '    for proc in jobs:'
- '        proc.join()'
- 'if __name__ == ''__main__'':'
- '    # Arg: number of ranks (processes)'
- '    test_gloo_init_with_multiprocess(2)'
