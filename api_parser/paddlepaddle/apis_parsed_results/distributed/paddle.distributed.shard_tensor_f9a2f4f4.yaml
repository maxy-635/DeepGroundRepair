2 api_name: paddle.distributed.shard_tensor
3 api_description: Creates a distributed tensor from scalar, tuple, list, numpy.ndarray,
  or paddle.Tensor input, attaching distributed attributes for sharded tensor usage.
4 api_signature: paddle.distributed.shard_tensor(data,mesh,placements)
5 api_details: ''
6 api_parameters:
- data: Provides the initial values used to create the tensor.
- mesh: Specifies the process mesh topology across which the tensor is distributed.
- placements: Defines how the tensor is placed on the process mesh, such as sharded,
    replicated, or partial.
- place: Sets the device place where the tensor is allocated.
7 api_usage_example:
- import paddle
- import paddle.distributed as dist
- mesh = dist.ProcessMesh([[2, 4, 5], [0, 1, 3]], dim_names=['x', 'y'])
- '# dense tensor'
- a = paddle.to_tensor([[1,2,3],
- '                      [5,6,7]])'
- '>>>'
- '# distributed tensor'
- d_tensor = dist.shard_tensor(a, mesh, [dist.Shard(0), dist.Shard(1)])
- print(d_tensor)
