2 api_name: paddle.distributed.ParallelEnv
3 api_description: Represents a distributed parallel training environment, storing
  cluster and rank information such as endpoints, trainer count, current endpoint,
  and current trainer id for Paddle distributed execution.
4 api_signature: ''
5 api_details: ''
