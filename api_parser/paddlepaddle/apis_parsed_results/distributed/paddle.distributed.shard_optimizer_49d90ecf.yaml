2 api_name: paddle.distributed.shard_optimizer
3 api_description: Wraps a global optimizer so it can operate on sharded parameters
  in distributed training, converting optimizer behavior to the distributed view.
4 api_signature: paddle.distributed.shard_optimizer(optimizer,shard_fn,gradient_accumulation_steps)
5 api_details: ''
6 api_parameters:
- optimizer: The optimizer that will be wrapped and sharded across distributed workers.
- shard_fn: A function that determines how optimizer accumulators are sharded, or
    defaults to using the parameters' distributed attributes.
7 api_usage_example:
- import paddle
- import paddle.distributed as dist
- mesh = dist.ProcessMesh([0, 1], dim_names=["x"])
- 'class MLP(paddle.nn.Layer):'
- '    def __init__(self):'
- '        super().__init__()'
- '        self.fc1 = paddle.nn.Linear(8, 8)'
- '        self.fc2 = paddle.nn.Linear(8, 8)'
- '...'
- '    def forward(self, input):'
- '        return self.fc2(self.fc1(input))'
- layer = MLP()
- batch = paddle.rand(shape=[8, 8])
- opt = paddle.optimizer.AdamW(parameters=layer.parameters())
- opt = dist.shard_optimizer(opt)
- 'for _ in range(5):'
- '    loss = layer(batch)'
- '    loss.backward()'
- '    opt.step()'
- '    opt.clear_grad()'
- '# This case need to be executed in multi-card environment'
- '# python -m paddle.distributed.launch --gpus=0,1 {test_case}.py'
8 api_shape: {}
