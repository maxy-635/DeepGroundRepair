2 api_name: paddle.distributed.gather
3 api_description: Collects tensors from all participating processes and gathers them
  together, typically on a designated destination rank.
4 api_signature: paddle.distributed.gather(tensor,dst,group)
5 api_details: ''
6 api_parameters:
- tensor: The input tensor whose data is gathered from all ranks.
- dst: The destination rank that receives the gathered tensors, defaulting to rank
    0.
- group: The process group to use for the gather operation, or `None` to use the default
    global group.
7 api_usage_example:
- '>>>'
- import paddle
- import paddle.distributed as dist
- dist.init_parallel_env()
- 'gather_list = [] # type: ignore'
- 'if dist.get_rank() == 0:'
- '    data = paddle.to_tensor([1, 2, 3])'
- '    dist.gather(data, gather_list, dst=0)'
- 'else:'
- '    data = paddle.to_tensor([4, 5, 6])'
- '    dist.gather(data, gather_list, dst=0)'
- print(gather_list)
- '# [[1, 2, 3], [4, 5, 6]] (2 GPUs, out for rank 0)'
- '# [] (2 GPUs, out for rank 1)'
8 api_shape: {}
