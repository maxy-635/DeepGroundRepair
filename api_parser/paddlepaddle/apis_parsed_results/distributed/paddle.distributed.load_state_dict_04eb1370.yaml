2 api_name: paddle.distributed.load_state_dict
3 api_description: Loads model state from a checkpoint path into the existing state_dict
  in place.
4 api_signature: paddle.distributed.load_state_dict(state_dict,path,process_group,coordinator_rank)
5 api_details: ''
6 api_parameters:
- state_dict: Provides the model state dictionary to be loaded and updated in place.
- path: Specifies the checkpoint directory to read the saved files from.
- process_group: Defines the group of ranks used to synchronize loading across distributed
    workers.
- coordinator_rank: Sets which rank coordinates the checkpoint loading, defaulting
    to rank 0.
7 api_usage_example:
- '>>>'
- import paddle
- import paddle.distributed as dist
- ckpt_path = "./checkpoint"
- w1 = paddle.arange(32).reshape([4, 8])
- mesh = dist.ProcessMesh([0, 1])
- sharded_w1 = dist.shard_tensor(w1, mesh, [dist.Shard(0)])
- 'state_dict = {"w1": sharded_w1}'
- dist.save_state_dict(state_dict, ckpt_path)
- w1_to_load = paddle.zeros_like(w1)
- sharded_w1_to_load = dist.shard_tensor(w1, mesh, [dist.Replicate()])
- 'state_dict_to_load = {"w1": sharded_w1_to_load}'
- dist.load_state_dict(state_dict_to_load, ckpt_path)
- print(f"state_dict_to_load:{state_dict_to_load}")
