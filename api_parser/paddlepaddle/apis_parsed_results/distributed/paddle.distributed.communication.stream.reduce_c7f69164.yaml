2 api_name: paddle.distributed.communication.stream.reduce
3 api_description: Performs a specified reduction on a tensor across devices and sends
  the result to the destination device.
4 api_signature: paddle.distributed.communication.stream.reduce(tensor,dst,op,group)
5 api_details: ''
6 api_parameters:
- tensor: Provides the input tensor on each rank, which will be overwritten by the
    reduced result.
- dst: Specifies the destination rank that receives the reduction result, defaulting
    to rank 0 if omitted.
- op: Chooses the reduction operation to apply, defaulting to `ReduceOp.SUM` if omitted.
- group: Selects the communication group to use, defaulting to the global group if
    omitted.
7 api_usage_example:
- '>>>'
- import paddle
- import paddle.distributed as dist
- dist.init_parallel_env()
- local_rank = dist.get_rank()
- 'if local_rank == 0:'
- '    data = paddle.to_tensor([[4, 5, 6], [4, 5, 6]])'
- 'else:'
- '    data = paddle.to_tensor([[1, 2, 3], [1, 2, 3]])'
- task = dist.stream.reduce(data, dst=0, sync_op=False)
- 'task.wait()  # type: ignore[union-attr]'
- out = data.numpy()
- print(out)
- '# [[5, 7, 9], [5, 7, 9]] (2 GPUs, out for rank 0)'
- '# [[1, 2, 3], [1, 2, 3]] (2 GPUs, out for rank 1)'
8 api_shape: {}
