2 api_name: paddle.copysign
3 api_description: Returns a new floating-point tensor with each element taking the
  magnitude of x and the sign of y.
4 api_signature: paddle.copysign(x,y)
5 api_details: ''
6 api_parameters:
- x: The input tensor whose magnitudes are used as the values to copy signs onto.
- y: The tensor providing the sign bits that are applied to the magnitudes in `x`.
7 api_usage_example:
