2 api_name: paddle.to_tensor
3 api_description: Converts scalars, sequences, NumPy arrays, or existing Paddle tensors
  into a Paddle Tensor.
4 api_signature: paddle.to_tensor(data,dtype,place)
5 api_details: ''
6 api_parameters:
- data: Provides the initial values used to create the tensor.
- dtype: Sets the tensor’s data type for the returned result.
- place: Specifies the device or memory location where the tensor is allocated.
7 api_usage_example:
