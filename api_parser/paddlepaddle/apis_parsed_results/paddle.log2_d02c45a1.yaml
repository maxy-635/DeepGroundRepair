2 api_name: paddle.log2
3 api_description: Computes the base-2 logarithm of each element in the input tensor.
4 api_signature: paddle.log2(x,out)
5 api_details: ''
6 api_parameters:
- x: Input tensor whose base-2 logarithm is computed.
- out: Optional output tensor that receives the result in place.
7 api_usage_example:
- import paddle
- '# example 1: x is a float'
