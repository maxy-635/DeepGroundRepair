2 api_name: paddle.ones
3 api_description: Creates a tensor with the given shape and dtype, filled entirely
  with ones.
4 api_signature: paddle.ones(shape,dtype,name)
5 api_details: ''
6 api_parameters:
- shape: Specifies the tensor shape to create.
- dtype: Specifies the output tensor’s data type, defaulting to `float32` if `None`.
- name: Optionally assigns a name to the operation; usually not needed.
7 api_usage_example:
- import paddle
- '# shape is a list/tuple'
- data1 = paddle.ones(shape=[3, 2])
- print(data1.numpy())
- '[[1. 1.]'
- '[1. 1.]'
- '[1. 1.]]'
- '# shape is a Tensor'
- shape = paddle.to_tensor([3, 2])
- data2 = paddle.ones(shape=shape)
- print(data2.numpy())
- '[[1. 1.]'
- '[1. 1.]'
- '[1. 1.]]'
- '# shape is a Tensor List'
- shape = [paddle.to_tensor(3), paddle.to_tensor(2)]
- data3 = paddle.ones(shape=shape)
- print(data3.numpy())
- '[[1. 1.]'
- '[1. 1.]'
- '[1. 1.]]'
8 api_shape: {}
