2 api_name: paddle.io.DataLoader
3 api_description: An iterator that loads a dataset once in batches using a batch
  sampler.
4 api_signature: paddle.io.DataLoader(dataset,batch_size,shuffle,drop_last,num_workers,collate_fn,persistent_workers)
5 api_details: ''
6 api_parameters:
- dataset: Specifies the dataset or iterable dataset to load samples from.
- batch_size: Sets how many samples are grouped into each mini-batch.
- shuffle: Controls whether sample indices are shuffled before batching.
- drop_last: Determines whether to discard the final incomplete batch.
- collate_fn: Defines how individual samples are merged into a mini-batch.
- num_workers: Sets the number of subprocesses used to load data.
- persistent_workers: Controls whether worker processes stay alive between iterations.
7 api_usage_example:
- '>>>'
- import numpy as np
- import paddle
- import paddle.nn as nn
- import paddle.nn.functional as F
- from paddle.io import Dataset, BatchSampler, DataLoader
- BATCH_NUM = 20
- BATCH_SIZE = 16
- EPOCH_NUM = 4
- IMAGE_SIZE = 784
- CLASS_NUM = 10
- '# define a random dataset'
- 'class RandomDataset(Dataset):  # type: ignore[type-arg]'
- '    def __init__(self, num_samples):'
- '        self.num_samples = num_samples'
- '...'
- '    def __getitem__(self, idx):'
- '        image = np.random.random([IMAGE_SIZE]).astype(''float32'')'
- '        label = np.random.randint(0, CLASS_NUM - 1, (1, )).astype(''int64'')'
- '        return image, label'
- '...'
- '    def __len__(self):'
- '        return self.num_samples'
- '...'
- dataset = RandomDataset(BATCH_NUM * BATCH_SIZE)
- 'class SimpleNet(nn.Layer):'
- '    def __init__(self):'
- '        super().__init__()'
- '        self.fc = nn.Linear(IMAGE_SIZE, CLASS_NUM)'
- '...'
- '    def forward(self, image, label=None):'
- '        return self.fc(image)'
- '...'
- simple_net = SimpleNet()
- opt = paddle.optimizer.SGD(learning_rate=1e-3,
- '                            parameters=simple_net.parameters())'
- '...'
- loader = DataLoader(dataset,
- '                    batch_size=BATCH_SIZE,'
- '                    shuffle=True,'
- '                    drop_last=True,'
- '                    num_workers=2)'
- '...'
- 'for e in range(EPOCH_NUM):'
- '    for i, (image, label) in enumerate(loader()):'
- '        out = simple_net(image)'
- '        loss = F.cross_entropy(out, label)'
- '        avg_loss = paddle.mean(loss)'
- '        avg_loss.backward()'
- '        opt.minimize(avg_loss)'
- '        simple_net.clear_gradients()'
- '        print("Epoch {} batch {}: loss = {}".format(e, i, np.mean(loss.numpy())))'
