2 api_name: paddle.io.Subset
3 api_description: Represents a view of a dataset containing only the samples at the
  specified indices.
4 api_signature: '"class paddle.io.Subset(dataset,indices)"'
5 api_details: ''
6 api_parameters:
- dataset: The full dataset to draw a subset from.
- indices: The positions in the dataset to include in the subset.
7 api_usage_example:
- import paddle
- 'class RangeDataset(paddle.io.Dataset):  # type: ignore[type-arg]'
- '    def __init__(self, start, stop):'
- '        self.start = start'
- '        self.stop = stop'
- '...'
- '    def __getitem__(self, index):'
- '        return index + self.start'
- '...'
- '    def __len__(self):'
- '        return self.stop - self.start'
- '# Example 1:'
- a = paddle.io.Subset(dataset=RangeDataset(1, 4), indices=[0, 2])
