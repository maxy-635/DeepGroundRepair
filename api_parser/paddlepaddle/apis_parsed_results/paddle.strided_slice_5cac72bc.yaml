2 api_name: paddle.strided_slice
3 api_description: Slices a tensor along specified axes using per-axis start, end,
  and stride values, supporting negative indices, reverse slicing, and clipping out-of-range
  bounds.
4 api_signature: paddle.strided_slice(x,axes,starts,ends,strides)
5 api_details: ''
6 api_parameters:
- x: The input N-D tensor to be sliced.
- axes: The axes along which to apply the start, end, and stride indices; defaults
    to the first len(starts) axes if omitted.
- starts: The starting index for each selected axis.
- ends: The ending index for each selected axis.
- strides: The step size used to move through each selected axis during slicing.
7 api_usage_example:
- import paddle
- x = paddle.zeros(shape=[3,4,5,6], dtype="float32")
- '# example 1:'
- '# attr starts is a list which doesn''t contain Tensor.'
- axes = [1, 2, 3]
- starts = [-3, 0, 2]
- ends = [3, 2, 4]
- strides_1 = [1, 1, 1]
- strides_2 = [1, 1, 2]
- sliced_1 = paddle.strided_slice(x, axes=axes, starts=starts, ends=ends, strides=strides_1)
- '# sliced_1 is x[:, 1:3:1, 0:2:1, 2:4:1].'
- '# example 2:'
- '# attr starts is a list which contain tensor Tensor.'
- minus_3 = paddle.full(shape=[1], fill_value=-3, dtype='int32')
- sliced_2 = paddle.strided_slice(x, axes=axes, starts=[minus_3, 0, 2], ends=ends,
  strides=strides_2)
- '# sliced_2 is x[:, 1:3:1, 0:2:1, 2:4:2].'
8 api_shape: {}
