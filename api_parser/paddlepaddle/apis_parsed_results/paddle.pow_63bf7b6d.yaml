2 api_name: paddle.pow
3 api_description: Raises each Tensor element to a specified power, computing elementwise
  exponentiation.
4 api_signature: paddle.pow(x,y)
5 api_details: ''
6 api_parameters:
- x: The input tensor whose values will be raised to a power.
- y: The exponent value, provided as a tensor with the same data type as `x`.
7 api_usage_example:
