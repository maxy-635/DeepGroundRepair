2 api_name: paddle.scatter
3 api_description: Computes a scatter operation by distributing values into a new
  tensor according to index positions, supporting different update modes based on
  the provided parameters.
4 api_signature: paddle.scatter(x,index,updates,overwrite)
5 api_details: ''
6 api_parameters:
- x: The tensor to be updated.
- index: A 0-D or 1-D tensor that specifies which positions to update.
- updates: The values used to replace or accumulate into `x` at the given indices.
- overwrite: Controls whether repeated indices overwrite previous values or are accumulated.
7 api_usage_example:
- import paddle
- x = paddle.to_tensor([[1, 1], [2, 2], [3, 3]], dtype='float32')
- index = paddle.to_tensor([2, 1, 0, 1], dtype='int64')
- updates = paddle.to_tensor([[1, 1], [2, 2], [3, 3], [4, 4]], dtype='float32')
- output1 = paddle.scatter(x, index, updates, overwrite=False)
- print(output1)
- Tensor(shape=[3, 2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[3., 3.],'
- '[6., 6.],'
- '[1., 1.]])'
- output2 = paddle.scatter(x, index, updates, overwrite=True)
- '# CPU device:'
- '# [[3., 3.],'
- '#  [4., 4.],'
- '#  [1., 1.]]'
- '# GPU device maybe have two results because of the repeated numbers in index'
- '# result 1:'
- '# [[3., 3.],'
- '#  [4., 4.],'
- '#  [1., 1.]]'
- '# result 2:'
- '# [[3., 3.],'
- '#  [2., 2.],'
- '#  [1., 1.]]'
8 api_shape: {}
