2 api_name: paddle.metric.Auc
3 api_description: Computes the Area Under the ROC Curve (AUC) for binary classification,
  using Python implementation.
4 api_signature: paddle.metric.Auc(curve,num_thresholds,name)
5 api_details: ''
6 api_parameters:
- curve: Chooses whether to compute the ROC curve or the Precision-Recall curve.
- num_thresholds: Sets how many thresholds are used to discretize the curve.
- name: Assigns a name to the metric instance.
7 api_usage_example:
- import numpy as np
- import paddle
- m = paddle.metric.Auc()
- n = 8
- class0_preds = np.random.random(size = (n, 1))
- class1_preds = 1 - class0_preds
- preds = np.concatenate((class0_preds, class1_preds), axis=1)
- labels = np.random.randint(2, size = (n, 1))
- m.update(preds=preds, labels=labels)
- res = m.accumulate()
8 api_shape: {}
