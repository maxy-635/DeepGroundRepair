2 api_name: paddle.text.WMT16
3 api_description: Loads and provides access to the WMT16 test dataset for multimodal
  machine translation evaluation.
4 api_signature: paddle.text.WMT16(data_file,mode,lang)
5 api_details: ''
6 api_parameters:
- data_file: Specifies the path to the data tar file, or can be left `None` when downloading
    the dataset.
- mode: 'Chooses which dataset split to use: `train`, `test`, or `val`.'
- lang: Sets the source language for the dataset, either `en` or `de`.
7 api_usage_example:
- import paddle
- from paddle.text.datasets import WMT16
- 'class SimpleNet(paddle.nn.Layer):'
- '    def __init__(self):'
- '        super().__init__()'
- '...'
- '    def forward(self, src_ids, trg_ids, trg_ids_next):'
- '        return paddle.sum(src_ids), paddle.sum(trg_ids), paddle.sum(trg_ids_next)'
- wmt16 = WMT16(mode='train', src_dict_size=50, trg_dict_size=50)
- 'for i in range(10):'
- '    src_ids, trg_ids, trg_ids_next = wmt16[i]'
- '    src_ids = paddle.to_tensor(src_ids)'
- '    trg_ids = paddle.to_tensor(trg_ids)'
- '    trg_ids_next = paddle.to_tensor(trg_ids_next)'
- '...'
- '    model = SimpleNet()'
- '    src_ids, trg_ids, trg_ids_next = model(src_ids, trg_ids, trg_ids_next)'
- '    print(src_ids.item(), trg_ids.item(), trg_ids_next.item())'
