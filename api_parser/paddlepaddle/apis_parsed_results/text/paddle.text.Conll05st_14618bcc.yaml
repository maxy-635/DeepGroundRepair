2 api_name: paddle.text.Conll05st
3 api_description: Provides access to the CoNLL-2005 ST test dataset, including downloading,
  reading, and iterating over test samples in Paddle Text.
4 api_signature: paddle.text.Conll05st(data_file,download)
5 api_details: ''
6 api_parameters:
- data_file: Specifies the path to the dataset tar file, or can be left as `None`
    when `download` is enabled.
- download: Controls whether the dataset is automatically downloaded when required
    files are not provided.
7 api_usage_example:
- import paddle
- from paddle.text.datasets import Conll05st
- 'class SimpleNet(paddle.nn.Layer):'
- '    def __init__(self):'
- '        super().__init__()'
- '...'
- '    def forward(self, pred_idx, mark, label):'
- '        return paddle.sum(pred_idx), paddle.sum(mark), paddle.sum(label)'
- conll05st = Conll05st()
- 'for i in range(10):'
- '    pred_idx, mark, label= conll05st[i][-3:]'
- '    pred_idx = paddle.to_tensor(pred_idx)'
- '    mark = paddle.to_tensor(mark)'
- '    label = paddle.to_tensor(label)'
- '...'
- '    model = SimpleNet()'
- '    pred_idx, mark, label= model(pred_idx, mark, label)'
- '    print(pred_idx.item(), mark.item(), label.item())'
- '>>>'
