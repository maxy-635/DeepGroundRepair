2 api_name: paddle.text.WMT14
3 api_description: Downloads and provides a small WMT14 test dataset for use in Paddle,
  exposing the WMT14 test data from the bundled archive.
4 api_signature: paddle.text.WMT14(data_file,mode)
5 api_details: ''
6 api_parameters:
- data_file: Specifies the path to the dataset tar file, or can be left as `None`
    when `download` is `True`.
- mode: Selects the operating mode, such as `train`, `test`, or `gen`, with `train`
    as the default.
7 api_usage_example:
- import paddle
- from paddle.text.datasets import WMT14
- 'class SimpleNet(paddle.nn.Layer):'
- '    def __init__(self):'
- '        super().__init__()'
- '...'
- '    def forward(self, src_ids, trg_ids, trg_ids_next):'
- '        return paddle.sum(src_ids), paddle.sum(trg_ids), paddle.sum(trg_ids_next)'
- wmt14 = WMT14(mode='train', dict_size=50)
- 'for i in range(10):'
- '    src_ids, trg_ids, trg_ids_next = wmt14[i]'
- '    src_ids = paddle.to_tensor(src_ids)'
- '    trg_ids = paddle.to_tensor(trg_ids)'
- '    trg_ids_next = paddle.to_tensor(trg_ids_next)'
- '...'
- '    model = SimpleNet()'
- '    src_ids, trg_ids, trg_ids_next = model(src_ids, trg_ids, trg_ids_next)'
- '    print(src_ids.item(), trg_ids.item(), trg_ids_next.item())'
