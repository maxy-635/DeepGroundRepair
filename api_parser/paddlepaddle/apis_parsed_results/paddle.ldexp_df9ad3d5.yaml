2 api_name: paddle.ldexp
3 api_description: Returns x multiplied by 2 raised to the power y, effectively scaling
  x by a power of two.
4 api_signature: paddle.ldexp(x,y)
5 api_details: ''
6 api_parameters:
- x: The input tensor whose values will be scaled by powers of 2.
- y: The tensor of exponents that determines the power-of-2 scaling applied to `x`.
