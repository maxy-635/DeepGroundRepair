2 api_name: paddle.zeros_like
3 api_description: Creates a zero-filled tensor with the same shape as `x`, and uses
  `dtype` if provided.
4 api_signature: paddle.zeros_like(x,dtype)
5 api_details: ''
6 api_parameters:
- x: Specifies the shape and default data type of the output tensor.
