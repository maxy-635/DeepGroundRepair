2 api_name: paddle.column_stack
3 api_description: Stacks tensors horizontally after reshaping any tensor with fewer
  than 2 dimensions into a column; all inputs must share the same dtype.
4 api_signature: paddle.column_stack(x)
5 api_details: ''
6 api_parameters:
- x: A list or tuple of tensors to stack as columns; all tensors must have the same
    shape and dtype.
7 api_usage_example:
- import paddle
- '# column_stack with 0-D tensors'
- x1 = paddle.to_tensor(1.0)
- x2 = paddle.to_tensor(2.0)
- out = paddle.column_stack((x1, x2))
- print(out)
- Tensor(shape=[1, 2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[1., 2.]])'
- '# column_stack mix with 1-D & 2-D tensors'
- x1 = paddle.to_tensor([[1.0], [2.0], [3.0]])
- x2 = paddle.to_tensor([3.0, 4.0, 5.0])
- out = paddle.column_stack((x1, x2))
- print(out)
- Tensor(shape=[3, 2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[1., 3.],'
- '[2., 4.],'
- '[3., 5.]])'
- '# column_stack with 3-D tensors'
- x1 = paddle.to_tensor([[[1.0, 2.0], [3.0, 4.0]]])
- x2 = paddle.to_tensor([[[3.0, 4.0], [5.0, 6.0]]])
- out = paddle.column_stack((x1, x2))
- print(out)
- Tensor(shape=[1, 4, 2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[[1., 2.],'
- '[3., 4.],'
- '[3., 4.],'
- '[5., 6.]]])'
