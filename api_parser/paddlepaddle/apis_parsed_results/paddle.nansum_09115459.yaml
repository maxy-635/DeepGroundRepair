2 api_name: paddle.nansum
3 api_description: Sum tensor elements along the specified axis while treating NaNs
  as zero.
4 api_signature: paddle.nansum(x,axis,dtype,keepdim)
5 api_details: ''
6 api_parameters:
- x: The input tensor whose elements are summed while ignoring NaN values.
- axis: The axis or axes over which to compute the NaN-aware sum, or all elements
    if None.
- dtype: The output tensor data type, defaulting to the input tensor’s dtype.
- keepdim: Whether to keep reduced dimensions in the output tensor.
7 api_usage_example:
- import paddle
- '# x is a Tensor with following elements:'
- '#    [[nan, 0.3, 0.5, 0.9]'
- '#     [0.1, 0.2, -nan, 0.7]]'
- '# Each example is followed by the corresponding output tensor.'
- x = paddle.to_tensor([[float('nan'), 0.3, 0.5, 0.9],
- '                      [0.1, 0.2, float(''-nan''), 0.7]],dtype="float32")'
- out1 = paddle.nansum(x)
- out1
- Tensor(shape=[], dtype=float32, place=Place(cpu), stop_gradient=True,
- 2.69999981)
- out2 = paddle.nansum(x, axis=0)
- out2
- Tensor(shape=[4], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[0.10000000, 0.50000000, 0.50000000, 1.59999990])'
- out3 = paddle.nansum(x, axis=-1)
- out3
- Tensor(shape=[2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[1.70000005, 1.        ])'
- out4 = paddle.nansum(x, axis=1, keepdim=True)
- out4
- Tensor(shape=[2, 1], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[1.70000005],'
- '[1.        ]])'
- '# y is a Tensor with shape [2, 2, 2] and elements as below:'
- '#      [[[1, nan], [3, 4]],'
- '#       [[5, 6], [-nan, 8]]]'
- '# Each example is followed by the corresponding output tensor.'
- y = paddle.to_tensor([[[1, float('nan')], [3, 4]],
- '                      [[5, 6], [float(''-nan''), 8]]])'
- out5 = paddle.nansum(y, axis=[1, 2])
- out5
- Tensor(shape=[2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[8. , 19.])'
- out6 = paddle.nansum(y, axis=[0, 1])
- out6
- Tensor(shape=[2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[9. , 18.])'
