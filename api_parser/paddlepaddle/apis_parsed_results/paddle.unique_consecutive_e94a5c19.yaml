2 api_name: paddle.unique_consecutive
3 api_description: Removes consecutive duplicate elements, keeping only the first
  item in each run of equal values.
4 api_signature: paddle.unique_consecutive(x,axis)
5 api_details: ''
6 api_parameters:
- x: Input tensor whose consecutive duplicate values will be removed; it must be float32,
    float64, int32, or int64.
- axis: Axis along which to apply unique consecutive; if `None`, the input is flattened
    first.
7 api_usage_example:
- import paddle
- x = paddle.to_tensor([1, 1, 2, 2, 3, 1, 1, 2])
- 'output = paddle.unique_consecutive(x) #'
- print(output)
- Tensor(shape=[5], dtype=int64, place=Place(cpu), stop_gradient=True,
- '[1, 2, 3, 1, 2])'
- _, inverse, counts = paddle.unique_consecutive(x, return_inverse=True, return_counts=True)
- print(inverse)
- Tensor(shape=[8], dtype=int64, place=Place(cpu), stop_gradient=True,
- '[0, 0, 1, 1, 2, 3, 3, 4])'
- print(counts)
- Tensor(shape=[5], dtype=int64, place=Place(cpu), stop_gradient=True,
- '[2, 2, 1, 2, 1])'
- x = paddle.to_tensor([[2, 1, 3], [3, 0, 1], [2, 1, 3], [2, 1, 3]])
- 'output = paddle.unique_consecutive(x, axis=0) #'
- print(output)
- Tensor(shape=[3, 3], dtype=int64, place=Place(cpu), stop_gradient=True,
- '[[2, 1, 3],'
- '[3, 0, 1],'
- '[2, 1, 3]])'
- x = paddle.to_tensor([[2, 1, 3], [3, 0, 1], [2, 1, 3], [2, 1, 3]])
- 'output = paddle.unique_consecutive(x, axis=0) #'
- print(output)
- Tensor(shape=[3, 3], dtype=int64, place=Place(cpu), stop_gradient=True,
- '[[2, 1, 3],'
- '[3, 0, 1],'
- '[2, 1, 3]])'
