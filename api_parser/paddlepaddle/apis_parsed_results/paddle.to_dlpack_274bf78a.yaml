2 api_name: paddle.to_dlpack
3 api_description: Converts a Paddle tensor into a DLPack capsule for zero-copy sharing
  with other frameworks.
4 api_signature: paddle.to_dlpack(x)
5 api_details: ''
6 api_parameters: []
7 api_usage_example:
- import paddle
- '# x is a tensor with shape [2, 4]'
- x = paddle.to_tensor([[0.2, 0.3, 0.5, 0.9],
- '                      [0.1, 0.2, 0.6, 0.7]])'
- dlpack = paddle.to_dlpack(x)
- print(dlpack)
- '>>>'
- <capsule object "dltensor" at 0x7f6103c681b0>
- '>>>'
- '# dlpack capsule will be renamed to ''used_dltensor'' after decoded'
- y = paddle.from_dlpack(dlpack)
- print(dlpack)
- '>>>'
- <capsule object "used_dltensor" at 0x7f6103c681b0>
8 api_shape: {}
