2 api_name: paddle.pdist
3 api_description: Computes the p-norm distance between each pair of row vectors in
  the input matrix.
4 api_signature: paddle.pdist(x)
5 api_details: ''
6 api_parameters:
- x: "Provides the input tensor of shape \\(N \times M\\) whose vectors are used to\
    \ compute pairwise distances."
- p: Specifies the p-norm used when calculating the distance between each pair of
    vectors.
7 api_usage_example:
- import paddle
- paddle.seed(2023)
- a = paddle.randn([4, 5])
- print(a)
- Tensor(shape=[4, 5], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[ 0.06132207,  1.11349595,  0.41906244, -0.24858207, -1.85169315],'
- '[-1.50370061,  1.73954511,  0.13331604,  1.66359663, -0.55764782],'
- '[-0.59911072, -0.57773495, -1.03176904, -0.33741450, -0.29695082],'
- '[-1.50258386,  0.67233968, -1.07747352,  0.80170447, -0.06695852]])'
- pdist_out=paddle.pdist(a)
- print(pdist_out)
- Tensor(shape=[6], dtype=float32, place=Place(cpu), stop_gradient=True,
