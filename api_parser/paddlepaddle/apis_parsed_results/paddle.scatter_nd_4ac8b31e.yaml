2 api_name: paddle.scatter_nd
3 api_description: Updates a tensor by scattering values from a source tensor into
  specified indices of a new or existing output tensor, with element-wise accumulation
  for repeated indices.
4 api_signature: paddle.scatter_nd(index,updates,shape)
5 api_details: ''
6 api_parameters:
- index: Specifies the positions in the output tensor where values will be scattered.
- updates: Provides the values to write into the output tensor at the indexed positions.
- shape: Defines the shape of the output tensor to create.
7 api_usage_example:
- import paddle
- index = paddle.to_tensor([[1, 1],
- '                          [0, 1],'
- '                          [1, 3]], dtype="int64")'
- updates = paddle.rand(shape=[3, 9, 10], dtype='float32')
- shape = [3, 5, 9, 10]
