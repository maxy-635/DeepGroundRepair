2 api_name: paddle.DataParallel
3 api_description: Runs a Paddle dygraph module across multiple devices using data
  parallelism, splitting input batches and synchronizing model updates.
4 api_signature: paddle.DataParallel(layers,strategy,group)
5 api_details: ''
6 api_parameters:
- layers: The model or module to run in parallel across multiple devices or processes.
- strategy: Deprecated; the parallel execution strategy and environment settings for
    data parallelism.
7 api_usage_example:
- '>>>'
- import paddle
- import paddle.nn as nn
- import paddle.optimizer as opt
- import paddle.distributed as dist
- 'class LinearNet(nn.Layer):'
- '    def __init__(self):'
- '        super().__init__()'
- '        self._linear1 = nn.Linear(10, 10)'
- '        self._linear2 = nn.Linear(10, 1)'
- '    def forward(self, x):'
- '        return self._linear2(self._linear1(x))'
- 'def train():'
- '    # 1. initialize parallel environment'
- '    dist.init_parallel_env()'
- '    # 2. create data parallel layer & optimizer'
- '    layer = LinearNet()'
- '    dp_layer = paddle.DataParallel(layer)'
- '    loss_fn = nn.MSELoss()'
- '    adam = opt.Adam('
- '        learning_rate=0.001, parameters=dp_layer.parameters())'
- '    # 3. run layer'
- '    inputs = paddle.randn([10, 10], ''float32'')'
- '    outputs = dp_layer(inputs)'
- '    labels = paddle.randn([10, 1], ''float32'')'
- '    loss = loss_fn(outputs, labels)'
- '    loss.backward()'
- '    adam.step()'
- '    adam.clear_grad()'
- 'if __name__ == ''__main__'':'
- '    # 1. start by ``paddle.distributed.spawn`` (default)'
- '    dist.spawn(train, nprocs=2)'
- '    # 2. start by ``paddle.distributed.launch``'
- '    # train()'
8 api_shape: {}
