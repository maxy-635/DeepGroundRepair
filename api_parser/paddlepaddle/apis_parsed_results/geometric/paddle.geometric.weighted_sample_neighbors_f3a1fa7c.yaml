2 api_name: paddle.geometric.weighted_sample_neighbors
3 api_description: Samples neighboring nodes from a graph using edge weights to bias
  the selection, returning a weighted random neighborhood.
4 api_signature: paddle.geometric.weighted_sample_neighbors(input_nodes,sample_size,edge_weight,name)
5 api_details: ''
6 api_parameters:
- edge_weight: Provides the edge weights used to guide weighted neighbor sampling
    from the CSC graph.
- input_nodes: Specifies the nodes whose neighbors will be sampled.
- sample_size: Sets how many neighbors to sample per input node, or returns all neighbors
    when set to -1.
- name: Optionally assigns a name to the operation.
7 api_usage_example:
- import paddle
- '# edges: (3, 0), (7, 0), (0, 1), (9, 1), (1, 2), (4, 3), (2, 4),'
- '#        (9, 5), (3, 5), (9, 6), (1, 6), (9, 8), (7, 8)'
- row = [3, 7, 0, 9, 1, 4, 2, 9, 3, 9, 1, 9, 7]
- colptr = [0, 2, 4, 5, 6, 7, 9, 11, 11, 13, 13]
- weight = [0.1, 0.5, 0.2, 0.5, 0.9, 1.9, 2.0, 2.1, 0.01, 0.9, 0,12, 0.59, 0.67]
- nodes = [0, 8, 1, 2]
- sample_size = 2
- row = paddle.to_tensor(row, dtype="int64")
- colptr = paddle.to_tensor(colptr, dtype="int64")
- weight = paddle.to_tensor(weight, dtype="float32")
- nodes = paddle.to_tensor(nodes, dtype="int64")
- out_neighbors, out_count = paddle.geometric.weighted_sample_neighbors(
- '    row, colptr, weight, nodes, sample_size=sample_size, return_eids=False'
- )
8 api_shape: {}
