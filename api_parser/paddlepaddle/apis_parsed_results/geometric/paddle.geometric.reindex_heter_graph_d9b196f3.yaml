2 api_name: paddle.geometric.reindex_heter_graph
3 api_description: Reindexes a heterogeneous graph into a new contiguous ID space,
  remapping selected node and edge types for efficient processing while preserving
  graph structure.
4 api_signature: paddle.geometric.reindex_heter_graph(x,neighbors,count)
5 api_details: ''
6 api_parameters:
- x: Specifies the input nodes whose neighbors will be sampled.
- neighbors: Provides the neighbor nodes for each input node across different graphs.
- count: Gives the number of neighbors associated with each input node.
7 api_usage_example:
- import paddle
- x = [0, 1, 2]
- neighbors_a = [8, 9, 0, 4, 7, 6, 7]
- count_a = [2, 3, 2]
- x = paddle.to_tensor(x, dtype="int64")
- neighbors_a = paddle.to_tensor(neighbors_a, dtype="int64")
- count_a = paddle.to_tensor(count_a, dtype="int32")
- neighbors_b = [0, 2, 3, 5, 1]
- count_b = [1, 3, 1]
- neighbors_b = paddle.to_tensor(neighbors_b, dtype="int64")
- count_b = paddle.to_tensor(count_b, dtype="int32")
- neighbors = [neighbors_a, neighbors_b]
- count = [count_a, count_b]
- reindex_src, reindex_dst, out_nodes = paddle.geometric.reindex_heter_graph(x, neighbors,
  count)
- print(reindex_src.numpy())
- '[3 4 0 5 6 7 6 0 2 8 9 1]'
- print(reindex_dst.numpy())
- '[0 0 1 1 1 2 2 0 1 1 1 2]'
- print(out_nodes.numpy())
- '[0 1 2 8 9 4 7 6 3 5]'
8 api_shape: {}
