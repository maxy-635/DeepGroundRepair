2 api_name: paddle.geometric.send_uv
3 api_description: Sends UV data along graph edges for geometric message passing,
  supporting graph learning workflows.
4 api_signature: paddle.geometric.send_uv(x,src_index,dst_index,message_op)
5 api_details: ''
6 api_parameters:
- x: Source node feature tensor used as the input values to be sent.
- src_index: 1-D tensor of source node indices that specifies where messages originate.
- dst_index: 1-D tensor of destination node indices, matching `src_index` in shape,
    that specifies where messages are sent.
- message_op: Operation used to combine or transform `x` and `y` messages, such as
    add, sub, mul, or div.
7 api_usage_example:
- import paddle
- x = paddle.to_tensor([[0, 2, 3], [1, 4, 5], [2, 6, 7]], dtype="float32")
- y = paddle.to_tensor([[0, 1, 2], [2, 3, 4], [4, 5, 6]], dtype="float32")
- indexes = paddle.to_tensor([[0, 1], [1, 2], [2, 1], [0, 0]], dtype="int32")
- src_index = indexes[:, 0]
- dst_index = indexes[:, 1]
- out = paddle.geometric.send_uv(x, y, src_index, dst_index, message_op="add")
- print(out.numpy())
- '[[ 2. 5. 7.]'
- '[ 5. 9. 11.]'
- '[ 4. 9. 11.]'
- '[ 0. 3. 5.]]'
8 api_shape: {}
