2 api_name: paddle.geometric.reindex_graph
3 api_description: Reindexes a graph’s node and edge indices into a new contiguous
  order, returning the remapped graph structure and related index mappings.
4 api_signature: paddle.geometric.reindex_graph(x,neighbors,count)
5 api_details: ''
6 api_parameters:
- x: Input node IDs used to sample neighbors.
- neighbors: Neighbor IDs corresponding to the input nodes, matching the data type
    of `x`.
- count: The number of neighbors for each input node, stored as `int32`.
7 api_usage_example:
- import paddle
- x = [0, 1, 2]
- neighbors = [8, 9, 0, 4, 7, 6, 7]
- count = [2, 3, 2]
- x = paddle.to_tensor(x, dtype="int64")
- neighbors = paddle.to_tensor(neighbors, dtype="int64")
- count = paddle.to_tensor(count, dtype="int32")
- reindex_src, reindex_dst, out_nodes = paddle.geometric.reindex_graph(x, neighbors,
  count)
- print(reindex_src.numpy())
- '[3 4 0 5 6 7 6]'
- print(reindex_dst.numpy())
- '[0 0 1 1 1 2 2]'
- print(out_nodes.numpy())
- '[0 1 2 8 9 4 7 6]'
8 api_shape: {}
