2 api_name: paddle.geometric.sample_neighbors
3 api_description: Samples neighbor nodes from a graph for given seed nodes, with
  configurable fanout, edge types, and sampling strategy.
4 api_signature: paddle.geometric.sample_neighbors(input_nodes,sample_size,return_eids)
5 api_details: ''
6 api_parameters:
- input_nodes: Specifies the nodes whose neighbors will be sampled.
- sample_size: Sets how many neighbors to sample per input node, or all neighbors
    when `-1`.
- eids: Provides the edge IDs for the input graph when edge IDs need to be returned.
- return_eids: Controls whether the sampled edges' edge IDs are included in the output.
7 api_usage_example:
- import paddle
- '# edges: (3, 0), (7, 0), (0, 1), (9, 1), (1, 2), (4, 3), (2, 4),'
- '#        (9, 5), (3, 5), (9, 6), (1, 6), (9, 8), (7, 8)'
- row = [3, 7, 0, 9, 1, 4, 2, 9, 3, 9, 1, 9, 7]
- colptr = [0, 2, 4, 5, 6, 7, 9, 11, 11, 13, 13]
- nodes = [0, 8, 1, 2]
- sample_size = 2
- row = paddle.to_tensor(row, dtype="int64")
- colptr = paddle.to_tensor(colptr, dtype="int64")
- nodes = paddle.to_tensor(nodes, dtype="int64")
- out_neighbors, out_count = paddle.geometric.sample_neighbors(row, colptr, nodes,
  sample_size=sample_size, return_eids=False)
8 api_shape: {}
