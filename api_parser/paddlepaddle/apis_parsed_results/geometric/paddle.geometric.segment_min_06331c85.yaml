2 api_name: paddle.geometric.segment_min
3 api_description: Computes the minimum value associated with each segment in a segmented
  geometric input.
4 api_signature: paddle.geometric.segment_min(data,segment_ids)
5 api_details: ''
6 api_parameters:
- data: The input tensor containing the values to be reduced by segment.
- segment_ids: A 1-D tensor of segment labels matching the first dimension of `data`,
    used to group elements for the minimum operation.
7 api_usage_example:
- import paddle
- data = paddle.to_tensor([[1, 2, 3], [3, 2, 1], [4, 5, 6]], dtype='float32')
- segment_ids = paddle.to_tensor([0, 0, 1], dtype='int32')
- out = paddle.geometric.segment_min(data, segment_ids)
- print(out.numpy())
- '[[1. 2. 1.]'
- '[4. 5. 6.]]'
