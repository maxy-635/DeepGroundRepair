2 api_name: paddle.geometric.send_ue_recv
3 api_description: Performs graph message passing by sending node/edge features through
  a graph and receiving aggregated updates on the target side.
4 api_signature: paddle.geometric.send_ue_recv(x,src_index,dst_index,message_op,reduce_op,out_size)
5 api_details: ''
6 api_parameters:
- x: The node feature tensor to send messages from, supporting float32, float64, int32,
    int64, and float16 on GPU.
- src_index: A 1-D tensor of source node indices, supporting int32 or int64.
- dst_index: A 1-D tensor of destination node indices matching `src_index` in shape,
    supporting int32 or int64.
- message_op: The operation used to combine `x` and edge information when forming
    messages, such as add, sub, mul, or div.
- reduce_op: The operation used to aggregate incoming messages at destination nodes,
    such as sum, mean, max, or min.
- out_size: An optional output size that determines the result shape when set to a
    positive value at least `max(dst_index) + 1`.
7 api_usage_example:
- import paddle
- x = paddle.to_tensor([[0, 2, 3], [1, 4, 5], [2, 6, 7]], dtype="float32")
- y = paddle.to_tensor([1, 1, 1, 1], dtype="float32")
- indexes = paddle.to_tensor([[0, 1], [1, 2], [2, 1], [0, 0]], dtype="int32")
- src_index, dst_index = indexes[:, 0], indexes[:, 1]
- out = paddle.geometric.send_ue_recv(x, y, src_index, dst_index, message_op="add",
  reduce_op="sum")
- print(out.numpy())
- '[[ 1. 3. 4.]'
- '[ 4. 10. 12.]'
- '[ 2. 5. 6.]]'
- x = paddle.to_tensor([[0, 2, 3], [1, 4, 5], [2, 6, 7]], dtype="float32")
- y = paddle.to_tensor([1, 1, 1], dtype="float32")
- indexes = paddle.to_tensor([[0, 1], [2, 1], [0, 0]], dtype="int32")
- src_index, dst_index = indexes[:, 0], indexes[:, 1]
- out_size = paddle.max(dst_index) + 1
- out = paddle.geometric.send_ue_recv(x, y, src_index, dst_index, message_op="add",
  reduce_op="sum", out_size=out_size)
- print(out.numpy())
- '[[ 1. 3. 4.]'
- '[ 4. 10. 12.]]'
- x = paddle.to_tensor([[0, 2, 3], [1, 4, 5], [2, 6, 7]], dtype="float32")
- y = paddle.to_tensor([1, 1, 1], dtype="float32")
- indexes = paddle.to_tensor([[0, 1], [2, 1], [0, 0]], dtype="int32")
- src_index, dst_index = indexes[:, 0], indexes[:, 1]
- out = paddle.geometric.send_ue_recv(x, y, src_index, dst_index, message_op="add",
  reduce_op="sum")
- print(out.numpy())
