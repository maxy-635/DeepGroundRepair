2 api_name: paddle.static.nn.while_loop
3 api_description: Builds a static-graph while loop that repeatedly executes a block
  of ops while a condition remains true.
4 api_signature: paddle.static.nn.while_loop(cond,body,loop_vars)
5 api_details: ''
6 api_parameters: []
7 api_usage_example:
- import paddle
- paddle.enable_static()
- 'def cond(i, ten):'
- '    return i < ten'
- 'def body(i, ten):'
- '    i = i + 1'
- '    return [i, ten]'
- main_program = paddle.static.default_main_program()
- startup_program = paddle.static.default_startup_program()
- 'with paddle.static.program_guard(main_program, startup_program):'
- '    i = paddle.full(shape=[1], fill_value=0, dtype=''int64'')     # loop counter'
- '    ten = paddle.full(shape=[1], fill_value=10, dtype=''int64'')  # loop length'
- '    i, ten = paddle.static.nn.while_loop(cond, body, [i, ten])'
- '    exe = paddle.static.Executor(paddle.CPUPlace())'
- '    res = exe.run(main_program, feed={}, fetch_list=[i])'
- '    print(res)'
- '[array([10], dtype=int64)]'
