2 api_name: paddle.static.nn.nce
3 api_description: Builds a noise-contrastive estimation loss layer for static graphs,
  using sampled negative classes to efficiently train large-vocabulary models.
4 api_signature: paddle.static.nn.nce(input,label,num_total_class es,num_neg_samples,sampler,seed)
5 api_details: ''
6 api_parameters: []
7 api_usage_example:
- import paddle
- import numpy as np
- paddle.enable_static()
- window_size = 5
- words = []
- 'for i in range(window_size):'
- '    words.append(paddle.static.data('
- '        name=''word_{0}''.format(i), shape=[-1, 1], dtype=''int64''))'
- dict_size = 10000
- label_word = int(window_size / 2) + 1
- embs = []
- 'for i in range(window_size):'
- '    if i == label_word:'
- '        continue'
- '...'
- '    emb = paddle.static.nn.embedding(input=words[i], size=[dict_size, 32],'
- '                        param_attr=''embed'', is_sparse=True)'
- '    embs.append(emb)'
- 'embs = paddle.concat(x=embs, axis=1)                # concat from 4 * [(-1, 1,
  32)] to (-1, 4, 32)'
- 'embs = paddle.reshape(x=embs, shape=(-1, 4 * 32))   # reshape to (batch_size =
  -1, dim = 4*32)'
- loss = paddle.static.nn.nce(input=embs, label=words[label_word],
- '            num_total_classes=dict_size, param_attr=''nce.w_0'','
- '            bias_attr=''nce.b_0'')'
- '# or use custom distribution'
- dist = np.array([0.05,0.5,0.1,0.3,0.05])
- loss = paddle.static.nn.nce(input=embs, label=words[label_word],
- '        num_total_classes=5, param_attr=''nce.w_1'','
- '        bias_attr=''nce.b_1'','
- '        num_neg_samples=3,'
- '        sampler="custom_dist",'
- '        custom_dist=dist)'
