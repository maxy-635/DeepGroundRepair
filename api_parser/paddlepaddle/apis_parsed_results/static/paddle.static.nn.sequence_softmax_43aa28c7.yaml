2 api_name: paddle.static.nn.sequence_softmax
3 api_description: Applies softmax across each sequence independently, using the `lod_level`
  to treat variable-length sequences separately and return normalized probabilities
  for each element within its sequence.
4 api_signature: paddle.static.nn.sequence_softmax(input)
5 api_details: ''
6 api_parameters:
- input: The input tensor containing the sequence scores to be normalized with softmax
    along each sequence.
