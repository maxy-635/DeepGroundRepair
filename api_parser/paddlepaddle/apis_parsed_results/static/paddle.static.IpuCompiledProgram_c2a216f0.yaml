2 api_name: paddle.static.IpuCompiledProgram
3 api_description: Transforms a Paddle static program into an IPU-targeted program
  by applying graph extraction, computation-graph transformations, and cleanup of
  redundant operations.
4 api_signature: paddle.static.IpuCompiledProgram(program,ipu_strategy)
5 api_details: ''
6 api_parameters:
- program: The program to execute, defaulting to `paddle.static.default_main_program()`
    when not provided.
- ipu_strategy: The configuration used to build the program, including options like
    training or inference mode, half computation, and the number of IPUs.
7 api_usage_example:
- '>>>'
- import paddle
- import paddle.static as static
- paddle.enable_static()
- a = static.data(name='data', shape=[None, 1], dtype='int32')
- b = a + 1
- main_prog = static.default_main_program()
- ipu_strategy = static.IpuStrategy()
- ipu_strategy.set_graph_config(num_ipus=1, is_training=True, micro_batch_size=1)
- ipu_strategy.set_pipelining_config(enable_pipelining=False, batches_per_step=1,
  enable_gradient_accumulation=False, accumulation_factor=1)
- ipu_strategy.set_precision_config(enable_fp16=False)
- ipu_compiled_program = static.IpuCompiledProgram(
- '    main_prog,'
- '    ipu_strategy=ipu_strategy)'
8 api_shape: {}
