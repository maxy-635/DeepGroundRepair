2 api_name: paddle.static.nn.row_conv
3 api_description: Applies a row convolution over a sequence by sliding a fixed-size
  window across time steps, combining neighboring rows to produce an output feature
  map in Paddle's static graph.
4 api_signature: paddle.static.nn.row_conv(input,future_context_size)
5 api_details: ''
