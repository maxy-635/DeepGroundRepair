2 api_name: paddle.static.scope_guard
3 api_description: Context manager that switches to a new variable scope so variables
  created inside a `with` block are recorded separately and same-named variables do
  not overwrite each other.
4 api_signature: paddle.static.scope_guard(scope)
5 api_details: ''
6 api_parameters: []
7 api_usage_example:
