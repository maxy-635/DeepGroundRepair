2 api_name: paddle.static.nn.sparse_embedding
3 api_description: Creates a sparse embedding lookup layer in Paddle static graphs,
  mapping input IDs to dense vectors using a parameter table optimized for sparse
  updates.
4 api_signature: paddle.static.nn.sparse_embedding(input,size,padding_idx,dtype,slot)
5 api_details: ''
6 api_parameters: []
7 api_usage_example:
- '>>>'
- import paddle
- paddle.enable_static()
- sparse_feature_dim = 1024
- embedding_size = 64
- '# Only when the feature appear more than 10 times or more will be participated
  in the training.'
- entry = paddle.distributed.CountFilterEntry(10)
- input = paddle.static.data(name='ins', shape=[1], dtype='int64')
- emb = paddle.static.nn.sparse_embedding(
- '    input=input,'
- '    size=[sparse_feature_dim, embedding_size],'
- '    is_test=False,'
- '    entry=entry,'
- '    param_attr=paddle.ParamAttr(name="SparseFeatFactors",'
- '    initializer=paddle.nn.initializer.Uniform()))'
8 api_shape: {}
