2 api_name: paddle.static.save
3 api_description: Saves model parameters, optimizer state, and network description
  to the specified model path.
4 api_signature: paddle.static.save(program,model_path)
5 api_details: ''
6 api_parameters:
- program: The program object to be saved.
- model_path: The file prefix used to save the program, in `dirname/file_prefix` format;
    an exception is raised if the prefix is empty.
7 api_usage_example:
- import paddle
- import paddle.static as static
- paddle.enable_static()
- x = static.data(name="x", shape=[10, 10], dtype='float32')
- y = static.nn.fc(x, 10)
- z = static.nn.fc(y, 10)
- place = paddle.CPUPlace()
- exe = static.Executor(place)
- exe.run(static.default_startup_program())
- prog = static.default_main_program()
- static.save(prog, "./temp")
8 api_shape: {}
