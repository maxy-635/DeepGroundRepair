2 api_name: paddle.static.nn.conv3d_transpose
3 api_description: Performs 3D transposed convolution to upsample an input tensor
  using a filter, stride, dilation, and padding, with optional bias addition and activation.
4 api_signature: paddle.static.nn.conv3d_transpose(input,num_filters,output_size,filter_size,padding,stride,data_format)
5 api_details: ''
6 api_parameters:
- input: The 5-D input tensor that the transposed 3D convolution operates on.
- num_filters: Sets the number of output channels produced by the layer.
- output_size: Specifies the desired output volume size and is used to infer filter
    size when `filter_size` is not given.
- filter_size: Defines the 3D convolution kernel size, or can be left `None` to infer
    it from `output_size`.
- padding: Controls how much zero-padding is applied to the input or which padding
    rule (`VALID` or `SAME`) to use.
- stride: Sets the step size used by the transposed convolution along depth, height,
    and width.
- data_format: Chooses the tensor layout format for input and output data.
7 api_usage_example:
- import paddle
- import numpy as np
- paddle.seed(1107)
- np.random.seed(1107)
- paddle.enable_static()
- data = paddle.static.data(name='data', shape=[None, 3, 12, 32, 32], dtype='float32')
- param_attr = paddle.framework.ParamAttr(name='conv3d.weight', initializer=paddle.nn.initializer.XavierNormal(),
  learning_rate=0.001)
- res = paddle.static.nn.conv3d_transpose(input=data, num_filters=2, filter_size=3,
  act="relu", param_attr=param_attr)
- place = paddle.CPUPlace()
- exe = paddle.static.Executor(place)
- exe.run(paddle.static.default_startup_program())
- x = np.random.rand(1, 3, 12, 32, 32).astype("float32")
- 'output = exe.run(feed={"data": x}, fetch_list=[res.mean()])'
- print(output)
- '[array(0.5148856, dtype=float32)]'
