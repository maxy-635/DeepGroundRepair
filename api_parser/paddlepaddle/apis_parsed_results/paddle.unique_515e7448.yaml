2 api_name: paddle.unique
3 api_description: Returns the unique elements of x in ascending order.
4 api_signature: paddle.unique(x,axis,sorted)
5 api_details: ''
6 api_parameters:
- x: Input tensor whose unique values will be computed.
- axis: Axis along which to find unique values, or `None` to flatten the input first.
- sorted: Ignored for the result; included for PyTorch compatibility.
7 api_usage_example:
- import paddle
- x = paddle.to_tensor([2, 3, 3, 1, 5, 3])
- unique = paddle.unique(x)
- print(unique)
