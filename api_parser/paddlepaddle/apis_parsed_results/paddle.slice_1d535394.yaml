2 api_name: paddle.slice
3 api_description: Slices a tensor along one or more specified axes using matching
  starts and ends for each axis, with support for negative indices, out-of-range bounds,
  and INT_MAX to slice to the end.
4 api_signature: paddle.slice(input,axes,starts,ends)
5 api_details: ''
6 api_parameters:
- input: The tensor to slice.
- axes: The axes along which slicing is applied.
- starts: The starting indices for each selected axis.
- ends: The ending indices for each selected axis.
7 api_usage_example:
- import paddle
- input = paddle.rand(shape=[4, 5, 6], dtype='float32')
- '# example 1:'
- '# attr starts is a list which doesn''t contain tensor.'
- axes = [0, 1, 2]
- starts = [-3, 0, 2]
- ends = [3, 2, 4]
- sliced_1 = paddle.slice(input, axes=axes, starts=starts, ends=ends)
- '# sliced_1 is input[1:3, 0:2, 2:4].'
- '# example 2:'
- '# attr starts is a list which contain tensor.'
- minus_3 = paddle.full([1], -3, "int32")
- sliced_2 = paddle.slice(input, axes=axes, starts=[minus_3, 0, 2], ends=ends)
- '# sliced_2 is input[1:3, 0:2, 2:4].'
8 api_shape: {}
