2 api_name: paddle.multinomial
3 api_description: Samples random values from a multinomial distribution using input
  probabilities, with optional replacement allowing repeated categories.
4 api_signature: paddle.multinomial(x,num_samples,replacement)
5 api_details: ''
6 api_parameters:
- x: Input tensor containing the sampling probabilities used to generate random numbers.
- num_samples: Specifies how many samples to draw, with a default of 1.
- replacement: Indicates whether sampling is done with replacement, with a default
    of False.
7 api_usage_example:
- import paddle
- 'paddle.seed(100) # on CPU device'
- x = paddle.rand([2,4])
- print(x)
- '>>>'
- Tensor(shape=[2, 4], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[0.55355281, 0.20714243, 0.01162981, 0.51577556],'
- '[0.36369765, 0.26091650, 0.18905126, 0.56219709]])'
- '>>>'
- 'paddle.seed(200) # on CPU device'
- out1 = paddle.multinomial(x, num_samples=5, replacement=True)
- print(out1)
- '>>>'
- Tensor(shape=[2, 5], dtype=int64, place=Place(cpu), stop_gradient=True,
- '[[3, 3, 0, 0, 0],'
- '[3, 3, 3, 1, 0]])'
- '>>>'
- '# out2 = paddle.multinomial(x, num_samples=5)'
- '# InvalidArgumentError: When replacement is False, number of samples'
- '#  should be less than non-zero categories'
- 'paddle.seed(300) # on CPU device'
- out3 = paddle.multinomial(x, num_samples=3)
- print(out3)
- '>>>'
- Tensor(shape=[2, 3], dtype=int64, place=Place(cpu), stop_gradient=True,
- '[[3, 0, 1],'
- '[3, 1, 0]])'
- '>>>'
