2 api_name: paddle.nn.functional.layer_norm
3 api_description: The paddle.nn.functional.layer_norm function applies layer normalization
  to the input, normalizing across the last certain number of dimensions as specified,
  to stabilize the learning process and improve convergence.
4 api_signature: paddle.nn.functional.layer_norm(x,normalized_shape)
5 api_details: ''
6 api_parameters:
- x: The input tensor to be normalized, with data types including bfloat16, float16,
    float32, or float64.
- normalized_shape: Specifies the shape over which normalization is applied, inferred
    from the expected input size.
7 api_usage_example:
- import paddle
- paddle.seed(2023)
- x = paddle.rand((2, 2, 2, 3))
- layer_norm_out = paddle.nn.functional.layer_norm(x, x.shape[1:])
- print(layer_norm_out)
