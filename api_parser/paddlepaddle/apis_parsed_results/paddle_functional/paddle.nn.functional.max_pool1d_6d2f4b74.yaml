2 api_name: paddle.nn.functional.max_pool1d
3 api_description: The paddle.nn.functional.max_pool1d API performs a 1D max pooling
  operation, reducing the dimensionality of input data by selecting the maximum value
  within specified kernel regions.
4 api_signature: paddle.nn.functional.max_pool1d(x,kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
- x: The input tensor for the pooling operation, a 3-D tensor with shape [N, C, L]
    where N is batch size, C is the number of channels, and L is the feature length.
- kernel_size: Specifies the size of the pooling window, which can be an integer or
    a tuple/list containing an integer.
- stride: Defines the step size for moving the pooling window, which can be an integer
    or a tuple/list containing an integer.
- padding: Determines the padding method or size for the feature map, which can be
    a string, integer, or list/tuple of integers specifying how much padding to apply.
7 api_usage_example: []
8 api_shape:
  input tensor shape: (N, Channel_in, Length_in)
  output tensor shape: (N, Channel_out, Length_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = Channel_in
    tensor length: Length_out = floor((Length_in + 2 * padding - kernel_size) / stride
      + 1)
