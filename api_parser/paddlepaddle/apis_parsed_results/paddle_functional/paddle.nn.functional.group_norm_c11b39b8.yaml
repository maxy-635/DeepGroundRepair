2 api_name: paddle.nn.functional.group_norm
3 api_description: The paddle.nn.functional.group_norm API applies group normalization
  over a mini-batch of inputs, dividing channels into groups to normalize each group
  separately, improving training stability and performance.
4 api_signature: paddle.nn.functional.group_norm(x,num_groups,epsilon)
5 api_details: ''
6 api_parameters:
- x: Represents the input tensor which includes the batch size, number of features,
    and additional dimensions.
- num_groups: Specifies how many groups the channels are divided into for normalization.
- epsilon: A small constant added to the variance to avoid division by zero during
    normalization.
7 api_usage_example:
- import paddle
- paddle.seed(100)
- x = paddle.arange(48, dtype="float32").reshape((2, 6, 2, 2))
- group_norm_out = paddle.nn.functional.group_norm(x, num_groups=6)
- print(group_norm_out)
