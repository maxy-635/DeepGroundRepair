2 api_name: paddle.nn.functional.dropout2d
3 api_description: The paddle.nn.functional.dropout2d API randomly zeroes out entire
  channels in a 4D NCHW tensor with a given probability on each forward pass, using
  Bernoulli distribution.
4 api_signature: paddle.nn.functional.dropout2d(x,p)
5 api_details: ''
6 api_parameters:
- x: The input tensor with dimensions for batch, channels, height, and width, and
    a data type of float16, float32, or float64.
- p: The probability that each element in the input tensor will be set to zero during
    dropout.
7 api_usage_example:
- import paddle
- paddle.seed(1)
- x = paddle.randn(shape=(2, 3, 4, 5)).astype(paddle.float32)
- 'y_train = paddle.nn.functional.dropout2d(x)  #train'
- 'y_test = paddle.nn.functional.dropout2d(x, training=False) #test'
- 'for i in range(2):'
- '    for j in range(3):'
- '        print(x[i,j,:,:])'
- '        print(y_train[i,j,:,:]) # may all 0'
- '        print(y_test[i,j,:,:])'
