2 api_name: paddle.nn.functional.dropout
3 api_description: The paddle.nn.functional.dropout API applies dropout regularization
  by randomly setting some outputs to zero and scaling others, reducing overfitting
  during training.
4 api_signature: paddle.nn.functional.dropout(x,p,training)
5 api_details: ''
6 api_parameters:
- x: The input tensor on which dropout will be applied, with data types float16, float32,
    or float64.
- p: The probability that each unit in the input tensor will be set to zero during
    dropout.
- training: A boolean flag indicating whether the dropout operation should be applied
    in training mode.
7 api_usage_example:
- import paddle
- paddle.seed(2023)
- x = paddle.to_tensor([[1,2,3], [4,5,6]]).astype(paddle.float32)
- y_train = paddle.nn.functional.dropout(x, 0.5)
- y_test = paddle.nn.functional.dropout(x, 0.5, training=False)
- y_0 = paddle.nn.functional.dropout(x, axis=0)
- y_1 = paddle.nn.functional.dropout(x, axis=1)
- y_01 = paddle.nn.functional.dropout(x, axis=[0,1])
- print(x)
- Tensor(shape=[2, 3], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[1., 2., 3.],'
- '[4., 5., 6.]])'
- print(y_train)
- Tensor(shape=[2, 3], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[2., 4., 0.],'
- '[8., 0., 0.]])'
- print(y_test)
- Tensor(shape=[2, 3], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[1., 2., 3.],'
- '[4., 5., 6.]])'
- print(y_0)
- Tensor(shape=[2, 3], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[2., 4., 6.],'
- '[8. , 10., 12.]])'
- print(y_1)
- Tensor(shape=[2, 3], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[2. , 4. , 6. ],'
- '[8. , 10., 12.]])'
- print(y_01)
- Tensor(shape=[2, 3], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[0., 0., 6.],'
- '[0., 0., 0.]])'
8 api_shape: null
