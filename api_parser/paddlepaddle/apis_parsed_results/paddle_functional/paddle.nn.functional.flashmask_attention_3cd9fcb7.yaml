2 api_name: paddle.nn.functional.flashmask_attention
3 api_description: The paddle.nn.functional.flashmask_attention API implements the
  FlashMask attention mechanism, optimizing attention computation by efficiently handling
  masked sequences for improved performance in neural network models.
4 api_signature: paddle.nn.functional.flashmask_attention(query,key,value,startend_row_indices,*,dropout,causal,window_size)
5 api_details: ''
6 api_parameters:
- query: The query tensor for attention, a 4-D tensor with shape [batch_size, q_seq_len,
    num_heads, head_dim], supporting float16 or bfloat16.
- key: The key tensor for attention, a 4-D tensor with shape [batch_size, k_seq_len,
    k_num_heads, head_dim], supporting float16 or bfloat16.
- value: The value tensor for attention, a 4-D tensor with shape [batch_size, k_seq_len,
    k_num_heads, head_dim], supporting float16 or bfloat16.
- startend_row_indices: A parameter with unspecified functionality in the given description.
- dropout: The ratio of dropout applied during attention, defaulting to 0.0.
- causal: A boolean indicating if causal mode is enabled, defaulting to False.
- window_size: Defines the range of attention based on position, with behavior differing
    based on causal mode.
7 api_usage_example:
- '>>>'
- import paddle
- paddle.seed(2023)
- 'q = paddle.rand((1, 10, 2, 32),dtype="bfloat16") # shape: [batch_size, seq_len,
  num_heads, head_dim]'
- 'k = paddle.rand((1, 10, 2, 32),dtype="bfloat16") # shape: [batch_size, seq_len,
  num_heads, head_dim]'
- 'v = paddle.rand((1, 10, 2, 32),dtype="bfloat16") # shape: [batch_size, seq_len,
  num_heads, head_dim]'
- startend_row_indices = paddle.to_tensor([8]*10 + [5]*10, dtype="int32").reshape([1,
  2, 10, 1])
- output = paddle.nn.functional.flashmask_attention(q, k, v, startend_row_indices,
  causal=True)
- print(output)
