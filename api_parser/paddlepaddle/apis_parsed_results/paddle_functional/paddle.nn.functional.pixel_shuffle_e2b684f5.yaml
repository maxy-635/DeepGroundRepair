  the spatial resolution by a factor of r.
4 api_signature: paddle.nn.functional.pixel_shuffle(x,upscale_factor)
5 api_details: ''
6 api_parameters:
- x: A 4-D tensor input whose spatial resolution will be increased, with the data
    type being either float32 or float64.
- upscale_factor: An integer factor by which the spatial resolution of the input tensor
    will be increased.
