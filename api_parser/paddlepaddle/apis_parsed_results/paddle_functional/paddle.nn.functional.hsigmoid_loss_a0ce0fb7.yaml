2 api_name: paddle.nn.functional.hsigmoid_loss
3 api_description: The paddle.nn.functional.hsigmoid_loss API implements hierarchical
  sigmoid loss, organizing classes into a binary tree to reduce computational complexity
  and accelerate model training, particularly for language models.
4 api_signature: paddle.nn.functional.hsigmoid_loss(input,label,num_class es,weight,bias)
5 api_details: ''
6 api_parameters:
- input: Represents the feature tensor for the mini-batch with a shape of [N, D].
- label: Contains the labels for the training data with a shape of [N, 1] and data
    type int64.
- weight: Specifies the weight tensor with a shape of (num_classes - 1, D) used in
    the computation.
- bias: Optional bias tensor with shape (num_classes - 1, 1) added to the computation
    if provided.
7 api_usage_example:
- import paddle
- import paddle.nn.functional as F
- paddle.set_device('cpu')
- paddle.seed(2023)
- input = paddle.uniform([4, 3])
- print(input)
