2 api_name: paddle.nn.functional.triplet_margin_with_distance_loss
3 api_description: The paddle.nn.functional.triplet_margin_with_distance_loss API
  calculates triplet loss to evaluate relative similarity between samples, using input,
  positive, and negative examples with a specified margin. All input tensors must
  have the shape (N, D).
4 api_signature: paddle.nn.functional.triplet_margin_with_distance_loss(input,positive,negative,distance_function,margin)
5 api_details: ''
6 api_parameters:
- input: The input tensor with a shape of [N, *] and dtype of float32 or float64,
    representing the anchor examples.
- positive: The positive tensor with the same shape and dtype as the input, representing
    examples similar to the anchor.
- negative: The negative tensor with the same shape and dtype as the input, representing
    examples dissimilar to the anchor.
- distance_function: A function to compute the distance between two tensors, defaulting
    to the 2-norm if unspecified.
- margin: A nonnegative value indicating the minimum required difference between positive
    and negative distances for the loss to be zero, defaulting to 1.
7 api_usage_example:
- import paddle
- import paddle.nn.functional as F
- input = paddle.to_tensor([[1, 5, 3], [0, 3, 2], [1, 4, 1]], dtype=paddle.float32)
- positive = paddle.to_tensor([[5, 1, 2], [3, 2, 1], [3, -1, 1]], dtype=paddle.float32)
- negative = paddle.to_tensor([[2, 1, -3], [1, 1, -1], [4, -2, 1]], dtype=paddle.float32)
- loss = F.triplet_margin_with_distance_loss(input, positive, negative, margin=1.0,
  reduction='none')
- print(loss)
