2 api_name: paddle.nn.functional.affine_grid
3 api_description: Generates a coordinate grid based on affine transformation parameters
  for sampling input feature maps to produce transformed outputs.
4 api_signature: paddle.nn.functional.affine_grid(theta,out_shape)
5 api_details: ''
6 api_parameters:
- theta: A tensor specifying affine transformation parameters for each batch, with
    shape [N, 2, 3] or [N, 3, 4].
- out_shape: Specifies the desired shape of the output grid, either [N, C, H, W] or
    [N, C, D, H, W], with data type int32.
7 api_usage_example:
- import paddle
- import paddle.nn.functional as F
- '# theta.shape = [1, 2, 3]'
- theta = paddle.to_tensor([[[-0.7, -0.4, 0.3],
- '                           [ 0.6,  0.5, 1.5]]], dtype="float32")'
- y_t = F.affine_grid(
- '    theta,'
- '    [1, 2, 3, 3],'
- '    align_corners=False'
- )
- print(y_t)
