2 api_name: paddle.nn.functional.alpha_dropout
3 api_description: Alpha Dropout is a dropout technique that preserves the mean and
  standard deviation of inputs, maintaining self-normalizing properties, and is compatible
  with SELU activation by setting activations to negative saturation values.
4 api_signature: paddle.nn.functional.alpha_dropout(x,p)
5 api_details: ''
6 api_parameters:
- x: The input tensor to be processed by the alpha dropout function, which must be
    of type bfloat16, float16, float32, or float64.
- p: The probability of setting units in the input tensor to zero, with a default
    value of 0.5.
7 api_usage_example:
- import paddle
- paddle.seed(1)
- x = paddle.to_tensor([[-1, 1], [-1, 1]]).astype(paddle.float32)
- y_train = paddle.nn.functional.alpha_dropout(x, 0.5)
- y_test = paddle.nn.functional.alpha_dropout(x, 0.5, training=False)
- print(y_train)
