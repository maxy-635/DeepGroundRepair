2 api_name: paddle.nn.functional.max_pool3d
3 api_description: paddle.nn.functional.max_pool3d performs a 3D max pooling operation,
  reducing the spatial dimensions of the input by selecting the maximum value within
  a specified kernel size, stride, and padding.
4 api_signature: paddle.nn.functional.max_pool3d(x,kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
- x: The input tensor for the pooling operation, a 5-D tensor with shape [N, C, D,
    H, W], where N is batch size, C is the number of channels, and D, H, W are the
    depth, height, and width respectively.
- kernel_size: The size of the pooling kernel, specified as either a single integer
    or a tuple/list of three integers (depth, height, width).
- stride: The stride size for the pooling operation, specified as either a single
    integer or a tuple/list of three integers (depth, height, width).
- padding: The padding size, which can be specified as a string ('valid' or 'same'),
    an integer, a tuple/list of three integers, a tuple/list of six integers, or a
    list of pairs of integers for each dimension.
7 api_usage_example: []
8 api_shape:
  input tensor shape: (N, Channel_in, Depth_in, Height_in, Width_in)
  output tensor shape: (N, Channel_out, Depth_out, Height_out, Width_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = Channel_in
    tensor depth: Depth_out = floor((Depth_in + 2 * padding_depth - kernel_size_depth) / stride_depth + 1)
    tensor height: Height_out = floor((Height_in + 2 * padding_height - kernel_size_height) / stride_height + 1)
    tensor width: Width_out = floor((Width_in + 2 * padding_width - kernel_size_width) / stride_width + 1)
