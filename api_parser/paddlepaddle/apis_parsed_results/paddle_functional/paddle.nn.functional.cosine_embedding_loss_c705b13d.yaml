2 api_name: paddle.nn.functional.cosine_embedding_loss
3 api_description: The paddle.nn.functional.cosine_embedding_loss API computes the
  cosine embedding loss between two input tensors based on their cosine similarity
  and a specified label, useful for tasks like measuring similarity between samples.
4 api_signature: paddle.nn.functional.cosine_embedding_loss(input1,input2,label,margin)
5 api_details: ''
6 api_parameters:
- input1: First input tensor representing a batch of samples for comparison.
- input2: Second input tensor representing another batch of samples for comparison.
- label: Tensor containing target labels indicating whether pairs are similar (1)
    or dissimilar (-1).
- margin: A threshold value that adjusts the boundary for dissimilar pairs, typically
    set between 0 and 0.5.
7 api_usage_example:
- import paddle
- input1 = paddle.to_tensor([[1.6, 1.2, -0.5], [3.2, 2.6, -5.8]], 'float32')
- input2 = paddle.to_tensor([[0.5, 0.5, -1.8], [2.3, -1.4, 1.1]], 'float32')
- label = paddle.to_tensor([1, -1], 'int64')
- output = paddle.nn.functional.cosine_embedding_loss(input1, input2, label, margin=0.5,
  reduction='mean')
- 'print(output)  # 0.21155193'
