2 api_name: paddle.nn.functional.pad
3 api_description: The paddle.nn.functional.pad API pads a tensor according to the
  specified 'pad' dimensions and 'mode', allowing for various padding strategies.
4 api_signature: paddle.nn.functional.pad(x,pad,mode)
5 api_details: ''
6 api_parameters:
- x: Specifies the input tensor to be padded, with various supported data types including
    float and complex types.
- pad: Defines the size of the padding to be added around the tensor, specified as
    an integer.
- mode: Indicates the padding mode to be used, such as constant, reflect, or replicate.
7 api_usage_example:
- import paddle
- import paddle.nn.functional as F
- '# example 1'
- x_shape = (1, 1, 3)
- x = paddle.arange(paddle.prod(paddle.to_tensor(x_shape)), dtype="float32").reshape(x_shape)
  + 1
- y = F.pad(x, [0, 0, 0, 0, 2, 3], value=1, mode='constant', data_format="NCL")
- print(y)
- Tensor(shape=[1, 1, 8], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[[1., 1., 1., 2., 3., 1., 1., 1.]]])'
- '# example 2'
- x_shape = (1, 1, 3)
- x = paddle.arange(paddle.prod(paddle.to_tensor(x_shape)), dtype="float32").reshape(x_shape)
  + 1
- y = F.pad(x, [2, 3], value=1, mode='constant', data_format="NCL")
- print(y)
- Tensor(shape=[1, 1, 8], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[[1., 1., 1., 2., 3., 1., 1., 1.]]])'
- '# example 3'
- x_shape = (1, 1, 2, 3)
- x = paddle.arange(paddle.prod(paddle.to_tensor(x_shape)), dtype="float32").reshape(x_shape)
  + 1
- y = F.pad(x, [1, 2, 1, 1], value=1, mode='circular')
- print(y)
- Tensor(shape=[1, 1, 4, 6], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[[[6., 4., 5., 6., 4., 5.],'
- '[3., 1., 2., 3., 1., 2.],'
- '[6., 4., 5., 6., 4., 5.],'
- '[3., 1., 2., 3., 1., 2.]]]])'
- '# example 4'
- x_shape = (1, 1, 3)
- x = paddle.arange(paddle.prod(paddle.to_tensor(x_shape)), dtype="float32").reshape(x_shape)
  + 1
- y = F.pad(x, [1, 0, 0, 1, 0, 0], value=0, mode='constant', pad_from_left_axis=True)
- print(y)
- Tensor(shape=[2, 2, 3], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[[0., 0., 0.],'
- '[0., 0., 0.]],'
- '[[1., 2., 3.],'
- '[0., 0., 0.]]])'
- '# example 5'
- x_shape = (1, 1, 3)
- x = paddle.arange(paddle.prod(paddle.to_tensor(x_shape)), dtype="float32").reshape(x_shape)
  + 1
- y = F.pad(x, [1, 0, 0, 1, 0, 0], value=0, mode='constant', pad_from_left_axis=False)
- print(y)
- Tensor(shape=[1, 2, 4], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[[0., 1., 2., 3.],'
- '[0., 0., 0., 0.]]])'
- '# example 6'
- x_shape = (1, 1, 3)
- x = paddle.arange(paddle.prod(paddle.to_tensor(x_shape)), dtype="float32").reshape(x_shape)
  + 1
- y = F.pad(x, [1, 0, 0, 1], value=0, mode='constant')
- print(y)
- Tensor(shape=[1, 2, 4], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[[0., 1., 2., 3.],'
- '[0., 0., 0., 0.]]])'
