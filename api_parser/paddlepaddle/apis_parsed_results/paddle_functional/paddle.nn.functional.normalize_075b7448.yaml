2 api_name: paddle.nn.functional.normalize
3 api_description: Normalizes a tensor along a specified dimension using the L_p norm.
4 api_signature: paddle.nn.functional.normalize(x,p,axis)
5 api_details: ''
6 api_parameters:
- x: Specifies the input tensor, which can be an N-D tensor with data types float32
    or float64.
- p: Defines the exponent value used in the norm calculation for normalization.
- axis: Indicates the axis along which normalization is performed, with support for
    negative indexing to specify dimensions.
7 api_usage_example:
- import paddle
- import paddle.nn.functional as F
- paddle.disable_static()
- x = paddle.arange(6, dtype="float32").reshape([2,3])
- y = F.normalize(x)
- print(y)
- Tensor(shape=[2, 3], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[0.        , 0.44721359, 0.89442718],'
- '[0.42426404, 0.56568539, 0.70710671]])'
- y = F.normalize(x, p=1.5)
- print(y)
- Tensor(shape=[2, 3], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[0.        , 0.40862012, 0.81724024],'
- '[0.35684016, 0.47578689, 0.59473360]])'
- y = F.normalize(x, axis=0)
- print(y)
- Tensor(shape=[2, 3], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[0.        , 0.24253564, 0.37139067],'
