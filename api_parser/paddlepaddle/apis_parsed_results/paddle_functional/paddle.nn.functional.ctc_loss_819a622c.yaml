2 api_name: paddle.nn.functional.ctc_loss
3 api_description: The paddle.nn.functional.ctc_loss API computes Connectionist Temporal
  Classification (CTC) loss using the Warp-CTC library, integrating a native softmax
  activation to normalize input tensor values by row.
4 api_signature: paddle.nn.functional.ctc_loss(log_probs,labels,input_lengths,label_lengths,blank)
5 api_details: ''
6 api_parameters:
- log_probs: 3-D Tensor of unscaled probabilities with padding, having shape [max_logit_length,
    batch_size, num_classes + 1].
- labels: 3-D Tensor of ground truth sequences with padding, having shape [batch_size,
    max_label_length].
- input_lengths: 1-D Tensor indicating the length of each input sequence, with shape
    [batch_size].
- label_lengths: 1-D Tensor indicating the length of each label sequence, with shape
    [batch_size].
- blank: Index for the blank label in CTC loss, within the range [0, num_classes +
    1).
