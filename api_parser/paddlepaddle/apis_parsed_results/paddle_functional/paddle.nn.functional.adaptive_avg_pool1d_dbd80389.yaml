2 api_name: paddle.nn.functional.adaptive_avg_pool1d
3 api_description: The paddle.nn.functional.adaptive_avg_pool1d API performs a 1D
  adaptive average pooling operation on input data to achieve a specified output size.
4 api_signature: paddle.nn.functional.adaptive_avg_pool1d(x,output_size)
5 api_details: ''
6 api_parameters:
- x: The input tensor to be pooled, which is a 3-D tensor with dimensions representing
    batch size, number of channels, and feature length.
- output_size: The desired size of the output after pooling, specified as an integer.
7 api_usage_example:
- '# average adaptive pool1d'
- '# suppose input data in shape of [N, C, L], `output_size` is m or [m],'
- '# output shape is [N, C, m], adaptive pool divide L dimension'
- '# of input data into m grids averagely and performs poolings in each'
- '# grid to get output.'
- '# adaptive max pool performs calculations as follow:'
- '#'
- '#     for i in range(m):'
- '#         lstart = floor(i * L / m)'
- '#         lend = ceil((i + 1) * L / m)'
- '#         output[:, :, i] = sum(input[:, :, lstart: lend])/(lstart - lend)'
- '#'
- import paddle
- import paddle.nn.functional as F
- data = paddle.uniform([1, 3, 32])
- pool_out = F.adaptive_avg_pool1d(data, output_size=16)
- print(pool_out.shape)
- '[1, 3, 16]'
