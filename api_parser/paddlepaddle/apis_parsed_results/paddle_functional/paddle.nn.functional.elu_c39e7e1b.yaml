2 api_name: paddle.nn.functional.elu
3 api_description: Applies the Exponential Linear Unit (ELU) activation function,
  which scales inputs below zero using an exponential function and retains inputs
  above zero unchanged.
4 api_signature: paddle.nn.functional.elu(x,alpha)
5 api_details: ''
6 api_parameters:
- x: Specifies the input tensor for the ELU operation, which must be of data type
    float32 or float64.
- alpha: Defines the alpha value in the ELU formula, with a default setting of 1.0,
    influencing the function's curve.
7 api_usage_example:
- import paddle
- import paddle.nn.functional as F
- x = paddle.to_tensor([[-1., 6.], [1., 15.6]])
- out = F.elu(x, alpha=0.2)
- print(out)
