2 api_name: paddle.nn.functional.nll_loss
3 api_description: The paddle.nn.functional.nll_loss API computes the negative log
  likelihood loss between predicted probabilities and target labels, useful for classification
  tasks.
4 api_signature: paddle.nn.functional.nll_loss(input,label,reduction)
5 api_details: ''
6 api_parameters:
- input: The input tensor containing predicted log probabilities for each class, with
    shape [N, C] or [N, C, d_1, d_2, ..., d_K].
- label: The tensor containing the true class labels, with shape [N] or [N, d_1, d_2,
    ..., d_K].
- reduction: 'Specifies the method to reduce the loss output: ''none'' for no reduction,
    ''mean'' for averaging, or ''sum'' for summing the losses.'
7 api_usage_example:
- import paddle
- from paddle.nn.functional import nll_loss
