2 api_name: paddle.nn.functional.max_unpool2d
3 api_description: The paddle.nn.functional.max_unpool2d API performs a 2D max unpooling
  operation, reversing the max pooling process by restoring the input to its original
  size using the indices of the maximum values from the previous max pooling layer.
4 api_signature: paddle.nn.functional.max_unpool2d(x,indices,kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
