2 api_name: paddle.nn.functional.feature_alpha_dropout
3 api_description: feature_alpha_dropout randomly masks entire channels, maintaining
  input's mean and std, and complements SELU by setting activations to negative saturation.
4 api_signature: paddle.nn.functional.feature_alpha_dropout(x,p,training)
5 api_details: ''
6 api_parameters:
- x: Specifies the input tensor with data types bfloat16, float16, float32, or float64.
- p: Defines the probability of setting units to zero, with a default value of 0.5.
- training: Indicates whether the function is in training mode, defaulting to True.
7 api_usage_example:
- import paddle
- paddle.seed(1)
- x = paddle.to_tensor([[-1, 1], [-1, 1]]).astype(paddle.float32)
- y_train = paddle.nn.functional.feature_alpha_dropout(x, 0.5)
- y_test = paddle.nn.functional.feature_alpha_dropout(x, 0.5, training=False)
- print(y_train)
