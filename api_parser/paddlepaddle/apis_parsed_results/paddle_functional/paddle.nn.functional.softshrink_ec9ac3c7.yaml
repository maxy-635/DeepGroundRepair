2 api_name: paddle.nn.functional.softshrink
3 api_description: The paddle.nn.functional.softshrink function applies the soft shrinkage
  activation, reducing input values below a threshold to zero and linearly scaling
  others.
4 api_signature: paddle.nn.functional.softshrink(x,threshold)
5 api_details: ''
6 api_parameters:
- x: The input tensor that the softshrink function will be applied to, requiring a
    data type of either float32 or float64.
- threshold: The threshold value that determines the range within which the input
    tensor values are shrunk, with a default of 0.5 and must be non-negative.
7 api_usage_example:
- import paddle
- import paddle.nn.functional as F
- x = paddle.to_tensor([-0.9, -0.2, 0.1, 0.8])
- out = F.softshrink(x)
- print(out)
