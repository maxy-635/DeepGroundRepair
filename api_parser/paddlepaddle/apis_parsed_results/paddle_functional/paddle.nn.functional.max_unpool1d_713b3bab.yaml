2 api_name: paddle.nn.functional.max_unpool1d
3 api_description: paddle.nn.functional.max_unpool1d performs a 1D max unpooling operation,
  taking the output and indices from max_pool1d to partially invert the pooling by
  restoring the maximum values to their original positions while setting non-maximum
  values to zero.
4 api_signature: paddle.nn.functional.max_unpool1d(x,indices,kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
- x: The input tensor for the unpooling operation, formatted as a 3-D tensor with
    shape [N, C, L], where N is batch size, C is the number of channels, and L is
    the length of the feature.
- indices: The indices tensor provided by maxpooling1d, formatted as a 3-D tensor
    with shape [N, C, L], used to determine where to place the unpooled values.
- kernel_size: Specifies the size of the unpooling kernel, which can be an integer
    or a list/tuple containing an integer.
- stride: Defines the stride size for the unpooling operation, which can be an integer
    or a list/tuple containing an integer.
- padding: Indicates the amount of padding added to the input during the pooling operation.
