2 api_name: paddle.nn.functional.avg_pool3d
3 api_description: paddle.nn.functional.avg_pool3d performs 3D average pooling on
  input tensors, reducing their spatial dimensions by computing the average of elements
  in a defined window.
4 api_signature: paddle.nn.functional.avg_pool3d(x,kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
- x: The input tensor for the pooling operation, a 5-D tensor with shape [N, C, D,
    H, W].
- kernel_size: Specifies the size of the pooling kernel, either as a single int or
    a tuple/list of three integers for depth, height, and width.
- stride: Defines the stride size for the pooling operation, either as a single int
    or a tuple/list of three integers for depth, height, and width.
- padding: Determines the padding applied before the pooling operation, which can
    be a string ('valid' or 'same'), an int, a list/tuple of three integers, a list/tuple
    of six integers, or a list/tuple of pairs of integers.
7 api_usage_example: []
8 api_shape:
  input tensor shape: (N, Channel_in, Depth_in, Height_in, Width_in)
  output tensor shape: (N, Channel_out, Depth_out, Height_out, Width_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = Channel_in
    tensor depth: Depth_out = floor((Depth_in + 2 * padding_depth - kernel_size_depth) / stride_depth + 1)
    tensor height: Height_out = floor((Height_in + 2 * padding_height - kernel_size_height) / stride_height + 1)
    tensor width: Width_out = floor((Width_in + 2 * padding_width - kernel_size_width) / stride_width + 1)
