2 api_name: paddle.nn.functional.gather_tree
3 api_description: paddle.nn.functional.gather_tree backtraces through the beam search
  tree to reconstruct full sequences from selected ids and their parent indices across
  time steps.
4 api_signature: paddle.nn.functional.gather_tree(ids,parents)
5 api_details: ''
6 api_parameters:
- ids: A Tensor indicating the selected ids at each time step across all beams for
    each batch.
- parents: A Tensor indicating the parent indices corresponding to the selected ids
    for beam search tracking.
7 api_usage_example:
- import paddle
- ids = paddle.to_tensor([[[2, 2], [6, 1]], [[3, 9], [6, 1]], [[0, 1], [9, 0]]])
- parents = paddle.to_tensor([[[0, 0], [1, 1]], [[1, 0], [1, 0]], [[0, 0], [0, 1]]])
- final_sequences = paddle.nn.functional.gather_tree(ids, parents)
