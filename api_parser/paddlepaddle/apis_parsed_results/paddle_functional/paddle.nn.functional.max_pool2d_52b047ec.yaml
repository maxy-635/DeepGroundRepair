2 api_name: paddle.nn.functional.max_pool2d
3 api_description: paddle.nn.functional.max_pool2d performs a 2D max pooling operation,
  reducing the spatial dimensions of the input by selecting the maximum value within
  specified kernel windows.
4 api_signature: paddle.nn.functional.max_pool2d(x,kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
- x: Specifies the input tensor with dimensions [N, C, H, W] for the pooling operation.
- kernel_size: Defines the size of the pooling window, either as a square or a rectangular
    tuple/list.
- stride: Sets the step size for moving the pooling window, either uniformly or with
    separate height and width values.
- padding: Determines the padding applied to the input, which can be specified in
    multiple formats, including strings, integers, or lists/tuples of integers.
7 api_usage_example: []
8 api_shape:
  input tensor shape: (N, Channel_in, Height_in, Width_in)
  output tensor shape: (N, Channel_out, Height_out, Width_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = Channel_in
    tensor height: Height_out = floor((Height_in + 2 * padding_height - kernel_size_height) / stride_height + 1)
    tensor width: Width_out = floor((Width_in + 2 * padding_width - kernel_size_width) / stride_width + 1)
