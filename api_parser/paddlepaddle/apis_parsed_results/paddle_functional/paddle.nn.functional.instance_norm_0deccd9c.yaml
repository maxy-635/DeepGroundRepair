2 api_name: paddle.nn.functional.instance_norm
3 api_description: The paddle.nn.functional.instance_norm API applies instance normalization
  to input data, normalizing each instance in a batch independently, and is recommended
  to be used via InstanceNorm1D, InstanceNorm2D, or InstanceNorm3D for different input
  dimensions.
4 api_signature: paddle.nn.functional.instance_norm(x,running_mean,running_var,weight,bias,use_input_stats,eps)
5 api_details: ''
6 api_parameters:
- x: The input tensor for instance normalization, requiring data types of float32
    or float64.
- running_mean: Previously used running mean, now obsolete and no longer usable.
- running_var: Previously used running variance, now obsolete and no longer usable.
- weight: The weight tensor applied in the instance normalization process.
- bias: The bias tensor applied in the instance normalization process.
- eps: A small constant added for numerical stability during normalization, defaulting
    to 1e-5.
- use_input_stats: Previously used flag for using input statistics, now obsolete and
    no longer usable.
7 api_usage_example:
- import paddle
- paddle.seed(2023)
- x = paddle.rand((2, 2, 2, 3))
- instance_norm_out = paddle.nn.functional.instance_norm(x)
- print(instance_norm_out)
