2 api_name: paddle.randint_like
3 api_description: Returns a tensor of random integers with the same shape as `x`,
  sampled uniformly from `[low, high)` or `[0, low)` when `high` is not provided.
4 api_signature: paddle.randint_like(x,low,high)
5 api_details: ''
6 api_parameters:
- x: Provides the reference tensor whose shape determines the output size and whose
    dtype must be one of the supported types.
- low: Sets the inclusive lower bound for generated random integers, or acts as the
    exclusive upper bound when `high` is not provided.
- high: Sets the exclusive upper bound for generated random integers, defining the
    range together with `low`.
7 api_usage_example:
- import paddle
- '# example 1:'
- '# dtype is None and the dtype of x is float32'
- x = paddle.zeros((1,2)).astype("float32")
- out1 = paddle.randint_like(x, low=-5, high=5)
- print(out1)
- '>>>'
- Tensor(shape=[1, 2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[0., 0.]])'
- '>>>'
- print(out1.dtype)
- paddle.float32
- '# example 2:'
- '# dtype is None and the dtype of x is float64'
- x = paddle.zeros((1,2)).astype("float64")
