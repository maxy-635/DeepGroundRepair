2 api_name: paddle.optimizer.RMSProp
3 api_description: Adaptive optimizer that adjusts learning rates using a running
  average of squared gradients, helping stabilize and speed up training.
4 api_signature: paddle.optimizer.RMSProp(learning_rate,rho,epsilon,momentum,centered,parameters)
5 api_details: ''
6 api_parameters:
- learning_rate: Controls the step size used to update parameters, either as a fixed
    float or via a learning rate scheduler.
- rho: Sets the decay rate for the moving average used in RMSProp.
- epsilon: Adds a small constant for numerical stability to prevent division by zero.
- momentum: Applies momentum to smooth parameter updates and accelerate optimization.
- centered: Chooses whether to normalize gradients using estimated variance instead
    of the uncentered second moment.
- parameters: Specifies the tensors or parameter groups to optimize, and can include
    per-group options such as learning rate and weight decay.
7 api_usage_example:
- import paddle
- inp = paddle.rand([10,10], dtype="float32")
- linear = paddle.nn.Linear(10, 10)
- out = linear(inp)
- loss = paddle.mean(out)
- rmsprop = paddle.optimizer.RMSProp(
- '    learning_rate=0.1,'
- '    parameters=linear.parameters(),'
- '    weight_decay=0.01'
- )
- out.backward()
- rmsprop.step()
- rmsprop.clear_grad()
- '# Note that the learning_rate of linear_2 is 0.01.'
- linear_1 = paddle.nn.Linear(10, 10)
- linear_2 = paddle.nn.Linear(10, 10)
- inp = paddle.uniform(shape=[10, 10], min=-0.1, max=0.1)
- out = linear_1(inp)
- out = linear_2(out)
- loss = paddle.mean(out)
- rmsprop = paddle.optimizer.RMSProp(
- '    learning_rate=0.1,'
- '    parameters=[{  # type: ignore'
- '        ''params'': linear_1.parameters()'
- '    }, {'
- '        ''params'': linear_2.parameters(),'
- '        ''weight_decay'': 0.001,'
- '        ''learning_rate'': 0.1'
- '    }],'
- '    weight_decay=0.01'
- )
- out.backward()
- rmsprop.step()
- rmsprop.clear_grad()
8 api_shape: {}
