2 api_name: paddle.optimizer.Adadelta
3 api_description: Adadelta is an optimizer that updates model parameters using a
  unit-wise adaptive learning-rate method with accumulated gradients, and it does
  not support sparse parameter optimization.
4 api_signature: paddle.optimizer.Adadelta(learning_rate,parameters,weight_decay,grad_clip)
5 api_details: ''
6 api_parameters:
- learning_rate: Sets the step size used to update parameters.
- parameters: Specifies which model parameters the optimizer should update, optionally
    with per-group settings.
- weight_decay: Applies regularization to parameters during optimization to help prevent
    overfitting.
- grad_clip: Defines how gradients are clipped before updates to improve training
    stability.
7 api_usage_example:
- import paddle
- inp = paddle.uniform([10, 10], dtype="float32", min=-0.1, max=0.1)
- linear = paddle.nn.Linear(10, 10)
- out = linear(inp)
- loss = paddle.mean(out)
- beta1 = paddle.to_tensor([0.9], dtype="float32")
- beta2 = paddle.to_tensor([0.99], dtype="float32")
- adadelta = paddle.optimizer.Adadelta(learning_rate=0.1, parameters=linear.parameters(),
  weight_decay=0.01)
- back = out.backward()
- adadelta.step()
- adadelta.clear_grad()
