2 api_name: paddle.optimizer.SGD
3 api_description: Implements stochastic gradient descent optimization to update model
  parameters using gradients.
4 api_signature: paddle.optimizer.SGD(learning_rate,parameters,weight_decay,grad_clip)
5 api_details: ''
6 api_parameters:
- learning_rate: Controls the step size used to update parameters during optimization.
- parameters: Specifies the tensors to be optimized; required in dynamic graph mode
    and optional in static graph mode.
- weight_decay: Applies L1 or L2 regularization to help prevent overfitting unless
    a parameter already defines its own regularizer.
- grad_clip: Sets the gradient clipping method to limit gradients and improve training
    stability.
7 api_usage_example:
- import paddle
- inp = paddle.uniform(min=-0.1, max=0.1, shape=[10, 10], dtype='float32')
- linear = paddle.nn.Linear(10, 10)
- inp = paddle.to_tensor(inp)
- out = linear(inp)
- loss = paddle.mean(out)
- sgd = paddle.optimizer.SGD(
- '    learning_rate=0.1,'
- '    parameters=linear.parameters(),'
- '    weight_decay=0.01'
- )
- out.backward()
- sgd.step()
- sgd.clear_grad()
8 api_shape: {}
