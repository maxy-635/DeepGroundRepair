2 api_name: paddle.optimizer.LBFGS
3 api_description: Implements the L-BFGS optimizer for unconstrained differentiable
  minimization using a limited-memory quasi-Newton update to approximate second-order
  information and iteratively refine parameters.
4 api_signature: paddle.optimizer.LBFGS(learning_rate,max_iter,parameters,name)
5 api_details: ''
6 api_parameters:
- learning_rate: Sets the step size used to update the model parameters during optimization.
- max_iter: Limits the number of optimization iterations performed in each LBFGS step.
- parameters: Specifies the Tensor parameters to optimize and minimize the loss.
- name: Assigns an optional name to the optimizer instance for identification.
7 api_usage_example:
- import paddle
- import numpy as np
- paddle.disable_static()
- np.random.seed(0)
- np_w = np.random.rand(1).astype(np.float32)
- np_x = np.random.rand(1).astype(np.float32)
- inputs = [np.random.rand(1).astype(np.float32) for i in range(10)]
- '# y = 2x'
- targets = [2 * x for x in inputs]
- 'class Net(paddle.nn.Layer):'
- '    def __init__(self):'
- '        super().__init__()'
- '        w = paddle.to_tensor(np_w)'
- '        self.w = paddle.create_parameter(shape=w.shape, dtype=w.dtype, default_initializer=paddle.nn.initializer.Assign(w))'
- '...'
- '    def forward(self, x):'
- '        return self.w * x'
- '...'
- net = Net()
- opt = paddle.optimizer.LBFGS(learning_rate=1, max_iter=1, max_eval=None, tolerance_grad=1e-07,
  tolerance_change=1e-09, history_size=100, line_search_fn='strong_wolfe', parameters=net.parameters())
- 'def train_step(inputs, targets):'
- '    def closure():'
- '        outputs = net(inputs)'
- '        loss = paddle.nn.functional.mse_loss(outputs, targets)'
- '        print(''loss: '', loss.item())'
- '        opt.clear_grad()'
- '        loss.backward()'
- '        return loss'
- '    opt.step(closure)'
- '...'
- 'for input_np, target_np in zip(inputs, targets):'
- '    input = paddle.to_tensor(input_np)'
- '    target = paddle.to_tensor(target_np)'
- '    train_step(input, target)'
8 api_shape: {}
