2 api_name: paddle.optimizer.Adagrad
3 api_description: Adagrad is an optimizer that adapts each parameter’s learning rate
  based on the accumulated history of its gradients, making larger updates for infrequent
  features and smaller updates for frequently updated ones.
4 api_signature: paddle.optimizer.Adagrad(learning_rate,parameters,epsilon)
5 api_details: ''
6 api_parameters:
- learning_rate: Sets the step size used to update parameters during optimization.
- epsilon: Adds a small constant for numerical stability when computing updates.
- parameters: Specifies the tensors or parameter groups to optimize and optionally
    their individual options.
7 api_usage_example:
- import paddle
- inp = paddle.rand(shape=[10, 10])
- linear = paddle.nn.Linear(10, 10)
- out = linear(inp)
- loss = paddle.mean(out)
- adagrad = paddle.optimizer.Adagrad(learning_rate=0.1,
- '        parameters=linear.parameters())'
- out.backward()
- adagrad.step()
- adagrad.clear_grad()
- '# Note that the learning_rate of linear_2 is 0.01.'
- linear_1 = paddle.nn.Linear(10, 10)
- linear_2 = paddle.nn.Linear(10, 10)
- inp = paddle.uniform(shape=[10, 10], min=-0.1, max=0.1)
- out = linear_1(inp)
- out = linear_2(out)
- loss = paddle.mean(out)
- adagrad = paddle.optimizer.Adagrad(
- '    learning_rate=0.1,'
- '    parameters=[{  # type: ignore'
- '        ''params'': linear_1.parameters()'
- '    }, {'
- '        ''params'': linear_2.parameters(),'
- '        ''weight_decay'': 0.001,'
- '        ''learning_rate'': 0.1,'
- '    }],'
- '    weight_decay=0.01)'
- out.backward()
- adagrad.step()
- adagrad.clear_grad()
