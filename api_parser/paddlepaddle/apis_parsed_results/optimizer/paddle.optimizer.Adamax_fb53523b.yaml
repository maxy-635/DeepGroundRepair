2 api_name: paddle.optimizer.Adamax
3 api_description: Adamax is an adaptive optimizer that updates model parameters using
  momentum and the infinite norm of past gradients for stable, robust learning-rate
  scaling.
4 api_signature: paddle.optimizer.Adamax(learning_rate,parameters,weight_decay)
5 api_details: ''
6 api_parameters:
- learning_rate: Sets the step size used to update parameters, either as a fixed float
    or a learning-rate scheduler.
- parameters: Specifies the tensors or parameter groups to optimize, with optional
    per-group settings like learning rate and weight decay.
- weight_decay: Applies regularization to parameters to help prevent overfitting,
    unless a parameter already defines its own regularizer.
7 api_usage_example:
- import paddle
- inp = paddle.uniform([10, 10], dtype="float32", min=-0.1, max=0.1)
- linear = paddle.nn.Linear(10, 10)
- inp = paddle.to_tensor(inp)
- out = linear(inp)
- loss = paddle.mean(out)
- beta1 = paddle.to_tensor([0.9], dtype="float32")
- beta2 = paddle.to_tensor([0.99], dtype="float32")
- adamax = paddle.optimizer.Adamax(
- '    learning_rate=0.1,'
- '    parameters=linear.parameters(),'
- '    beta1=beta1,'
- '    beta2=beta2,'
- '    weight_decay=0.01'
- )
- out.backward()
- adamax.step()
- adamax.clear_grad()
- '# Note that the learning_rate of linear_2 is 0.01.'
- linear_1 = paddle.nn.Linear(10, 10)
- linear_2 = paddle.nn.Linear(10, 10)
- inp = paddle.uniform(shape=[10, 10], min=-0.1, max=0.1)
- out = linear_1(inp)
- out = linear_2(out)
- loss = paddle.mean(out)
- adamax = paddle.optimizer.Adamax(
- '    learning_rate=0.1,'
- '    parameters=[{  # type: ignore'
- '        ''params'': linear_1.parameters()'
- '    }, {'
- '        ''params'': linear_2.parameters(),'
- '        ''weight_decay'': 0.001,'
- '        ''learning_rate'': 0.1,'
- '        ''beta1'': 0.8'
- '    }],'
- '    weight_decay=0.01,'
- '    beta1=0.9'
- )
- out.backward()
- adamax.step()
- adamax.clear_grad()
8 api_shape: {}
