2 api_name: paddle.optimizer.lr.LinearLR
3 api_description: Linearly scales the learning rate from a starting factor to the
  target end rate over time.
4 api_signature: paddle.optimizer.lr.LinearLR(learning_rate,total_steps,start_factor,end_factor)
5 api_details: ''
6 api_parameters:
- learning_rate: Sets the initial learning rate as a Python float.
- total_steps: Specifies how many iterations it takes to reach the end learning rate.
- start_factor: Scales the initial learning rate to determine the starting learning
    rate.
- end_factor: Sets the final scaling factor, which is 1.0.
7 api_usage_example:
- import paddle
- value = paddle.arange(26, dtype='float32')
- a = paddle.reshape(value, [2, 13])
- linear = paddle.nn.Linear(13, 5)
- adadelta = paddle.optimizer.Adadelta(learning_rate=0.0003, epsilon=1e-06, rho=0.95,
- '                            parameters = linear.parameters())'
- out = linear(a)
- out.backward()
- adadelta.step()
- adadelta.clear_grad()
