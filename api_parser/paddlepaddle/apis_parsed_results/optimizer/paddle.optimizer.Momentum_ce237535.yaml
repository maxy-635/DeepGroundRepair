2 api_name: paddle.optimizer.Momentum
3 api_description: Implements momentum-based gradient descent by maintaining a velocity
  state that smooths updates and helps accelerate optimization.
4 api_signature: paddle.optimizer.Momentum(learning_rate,momentum,parameters,weight_decay,grad_clip,use_nesterov)
5 api_details: ''
6 api_parameters:
- learning_rate: Controls the step size used to update parameters.
- momentum: Sets how much past gradients influence the current update.
- parameters: Specifies which tensors or parameter groups the optimizer should update.
- use_nesterov: Turns on Nesterov momentum for the update rule.
- weight_decay: Applies regularization to reduce overfitting during optimization.
- grad_clip: Limits gradient values to stabilize training and prevent exploding gradients.
7 api_usage_example:
- import paddle
- inp = paddle.uniform([10, 10], dtype="float32", min=-0.1, max=0.1)
- linear = paddle.nn.Linear(10, 10)
- inp = paddle.to_tensor(inp)
- out = linear(inp)
- loss = paddle.mean(out)
- momentum = paddle.optimizer.Momentum(
- '    learning_rate=0.1,'
- '    parameters=linear.parameters(),'
- '    weight_decay=0.01'
- )
- back = out.backward()
- momentum.step()
- momentum.clear_grad()
- '# Note that the learning_rate of linear_2 is 0.01.'
- linear_1 = paddle.nn.Linear(10, 10)
- linear_2 = paddle.nn.Linear(10, 10)
- inp = paddle.uniform(shape=[10, 10], min=-0.1, max=0.1)
- out = linear_1(inp)
- out = linear_2(out)
- loss = paddle.mean(out)
- momentum = paddle.optimizer.Momentum(
- '    learning_rate=0.1,'
- '    parameters=[{ # type: ignore'
- '        ''params'': linear_1.parameters()'
- '    }, {'
- '        ''params'': linear_2.parameters(),'
- '        ''weight_decay'': 0.001,'
- '        ''learning_rate'': 0.1'
- '    }],'
- '    weight_decay=0.01,'
- '    momentum=0.9'
- )
- out.backward()
- momentum.step()
- momentum.clear_grad()
