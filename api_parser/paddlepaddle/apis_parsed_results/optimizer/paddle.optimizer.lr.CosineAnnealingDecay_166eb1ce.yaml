2 api_name: paddle.optimizer.lr.CosineAnnealingDecay
3 api_description: Adjusts the learning rate with a cosine annealing schedule, starting
  from the initial rate and gradually decreasing it based on epochs since the last
  restart.
4 api_signature: paddle.optimizer.lr.CosineAnnealingDecay(learning_rate,T_max,eta_min)
5 api_details: ''
6 api_parameters:
- learning_rate: Sets the starting learning rate, which acts as the maximum value
    of the cosine decay schedule.
- T_max: Specifies how many iterations make up half of one cosine decay cycle.
- eta_min: Sets the lowest learning rate the schedule can decay to.
7 api_usage_example:
- import paddle
- value = paddle.arange(26, dtype='float32')
- a = paddle.reshape(value, [2, 13])
- linear = paddle.nn.Linear(13, 5)
- adadelta = paddle.optimizer.Adadelta(learning_rate=0.0003, epsilon=1e-06, rho=0.95,
- '                            parameters = linear.parameters())'
- out = linear(a)
- out.backward()
- adadelta.step()
- adadelta.clear_grad()
