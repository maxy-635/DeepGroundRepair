2 api_name: paddle.optimizer.lr.InverseTimeDecay
3 api_description: Returns a learning rate that decays over time using inverse time
  decay from an initial value.
4 api_signature: paddle.optimizer.lr.InverseTimeDecay(learning_rate,gamma)
5 api_details: ''
6 api_parameters:
- learning_rate: Sets the initial learning rate used before any inverse-time decay
    is applied.
- gamma: Controls the decay ratio by scaling the learning rate down each step; it
    should be less than 1.0.
7 api_usage_example:
- import paddle
- value = paddle.arange(26, dtype='float32')
- a = paddle.reshape(value, [2, 13])
- linear = paddle.nn.Linear(13, 5)
- adadelta = paddle.optimizer.Adadelta(learning_rate=0.0003, epsilon=1e-06, rho=0.95,
- '                            parameters = linear.parameters())'
- out = linear(a)
- out.backward()
- adadelta.step()
- adadelta.clear_grad()
8 api_shape: {}
