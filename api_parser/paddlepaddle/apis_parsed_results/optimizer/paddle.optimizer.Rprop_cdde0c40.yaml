2 api_name: paddle.optimizer.Rprop
3 api_description: Implements the Rprop optimizer, an adaptive full-batch training
  algorithm that adjusts parameter updates based on gradient sign changes for faster
  backpropagation.
4 api_signature: paddle.optimizer.Rprop(learning_rate,parameters,name)
5 api_details: ''
6 api_parameters:
- learning_rate: Sets the initial step size used to update parameters while minimizing
    the loss.
- parameters: Specifies the tensors or parameter list to be optimized, with dygraph
    mode requiring it explicitly.
- name: Optionally assigns a name to the optimizer instance; usually left unset.
7 api_usage_example:
- import paddle
- inp = paddle.uniform(min=-0.1, max=0.1, shape=[1, 100], dtype='float32')
- linear = paddle.nn.Linear(100, 10)
- inp = paddle.to_tensor(inp)
- out = linear(inp)
- loss = paddle.mean(out)
- rprop = paddle.optimizer.Rprop(
- '    learning_rate=0.001,'
- '    learning_rate_range=(0.0001, 0.1),'
- '    parameters=linear.parameters(),'
- '    etas=(0.5, 1.2)'
- )
- out.backward()
- rprop.step()
- rprop.clear_grad()
8 api_shape: {}
