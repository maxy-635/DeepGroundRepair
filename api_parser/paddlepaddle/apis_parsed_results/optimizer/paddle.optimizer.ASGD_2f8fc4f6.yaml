2 api_name: paddle.optimizer.ASGD
3 api_description: Implements the ASGD optimizer to minimize finite-sum objectives
  using stochastic averaging, maintaining and updating parameter states to support
  efficient convergence.
4 api_signature: paddle.optimizer.ASGD(learning_rate,parameters,name)
5 api_details: ''
