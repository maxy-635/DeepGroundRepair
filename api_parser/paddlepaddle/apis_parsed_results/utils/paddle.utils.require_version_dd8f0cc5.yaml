2 api_name: paddle.utils.require_version
3 api_description: Checks that the installed PaddlePaddle version falls within the
  specified minimum and maximum version bounds, raising an exception if it does not.
4 api_signature: paddle.utils.require_version(min_version,max_version)
5 api_details: ''
6 api_parameters:
- min_version: Specifies the lowest acceptable version.
- max_version: Specifies the highest acceptable version; if omitted, any version at
    or above `min_version` is allowed.
7 api_usage_example:
- import paddle
- '# any version >= 0.1.0 is acceptable.'
- paddle.utils.require_version('0.1.0')
- '# if 0.1.0 <= version <= 10.0.0, it is acceptable.'
- paddle.utils.require_version(min_version='0.1.0', max_version='10.0.0')
8 api_shape: {}
