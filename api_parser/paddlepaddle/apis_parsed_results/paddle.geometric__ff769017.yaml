2 api_name: paddle.geometric_
3 api_description: Fills a tensor with random values sampled from a geometric distribution.
4 api_signature: paddle.geometric_(x,probs)
5 api_details: ''
6 api_parameters:
- x: The output tensor to fill, with float32 or float64 data type.
- probs: The positive probability of success used by the geometric distribution, either
    as a scalar or per-trial tensor.
7 api_usage_example:
- import paddle
- x = paddle.randn([3, 4])
- x.geometric_(0.3)
- '>>>'
- print(x)
