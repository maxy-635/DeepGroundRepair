2 api_name: paddle.poisson
3 api_description: Generates a tensor of random samples drawn from a Poisson distribution.
4 api_signature: paddle.poisson(x)
5 api_details: ''
6 api_parameters:
- x: Specifies the Poisson rate parameter tensor that controls the expected count,
    with supported dtypes bfloat16, float16, float32, or float64.
7 api_usage_example:
- import paddle
- paddle.set_device('cpu')
- paddle.seed(100)
