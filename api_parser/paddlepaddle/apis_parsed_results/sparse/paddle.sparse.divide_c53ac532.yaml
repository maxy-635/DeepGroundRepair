2 api_name: paddle.sparse.divide
3 api_description: Element-wise divides two sparse tensors of the same shape and sparse
  type, returning a sparse tensor with matching sparse dimensions for COO inputs.
4 api_signature: paddle.sparse.divide(x,y)
5 api_details: ''
6 api_parameters:
- x: The numerator tensor to be divided.
- y: The denominator tensor used to divide `x`.
7 api_usage_example:
- import paddle
- paddle.device.set_device("cpu")
- x = paddle.to_tensor([[0, -1, 0, 2], [0, 0, -3, 0], [4, 5, 0, 0]], 'float32')
- y = paddle.to_tensor([[0, 0, 0, -2], [0, 2, -3, 0], [2, 3, 4, 8]], 'float32')
- sparse_x = x.to_sparse_csr()
- sparse_y = y.to_sparse_csr()
- sparse_z = paddle.sparse.divide(sparse_x, sparse_y)
- print(sparse_z.to_dense())
- Tensor(shape=[3, 4], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[ nan      , -inf.     ,  nan      , -1.       ],'
- '[ nan      ,  0.       ,  1.       ,  nan      ],'
- '[ 2.       , 1.66666663,  0.       ,  0.       ]])'
8 api_shape: {}
