2 api_name: paddle.sparse.slice
3 api_description: Slices a sparse tensor along multiple specified axes using matching
  start and end indices, handling negative indices, out-of-range bounds, and open-ended
  slices.
4 api_signature: paddle.sparse.slice(x,axes,starts,ends)
5 api_details: ''
6 api_parameters:
- x: The sparse input tensor to be sliced.
- axes: The axes along which to apply the slice operation.
- starts: The starting indices for each selected axis.
- ends: The ending indices for each selected axis.
7 api_usage_example:
- import paddle
- import numpy as np
- format = 'coo'
- np_x = np.asarray([[4, 0, 7, 0], [0, 0, 5, 0], [-4, 2, 0, 0]])
- dense_x = paddle.to_tensor(np_x)
- 'if format == ''coo'':'
- '    sp_x = dense_x.to_sparse_coo(len(np_x.shape))'
- 'else:'
- '    sp_x = dense_x.to_sparse_csr()'
- '...'
- axes = [0, 1]
- starts = [1, 0]
- ends = [3, -2]
- sp_out = paddle.sparse.slice(sp_x, axes, starts, ends)
- '# sp_out is x[1:3, 0:-2]'
- print(sp_out)
- Tensor(shape=[2, 2], dtype=paddle.int64, place=Place(cpu), stop_gradient=True,
- indices=[[1, 1],
- '[0, 1]],'
- values=[-4,  2])
8 api_shape: {}
