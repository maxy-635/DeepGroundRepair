2 api_name: paddle.sparse.masked_matmul
3 api_description: Performs matrix multiplication between two dense tensors.
4 api_signature: paddle.sparse.masked_matmul(x,y,mask)
5 api_details: ''
6 api_parameters:
- x: The left input dense tensor to be multiplied.
- y: The right input dense tensor to be multiplied.
- mask: The sparse tensor that defines which coordinates are kept in the masked matrix
    multiplication.
7 api_usage_example:
- '>>>'
- import paddle
- paddle.device.set_device('gpu')
- paddle.seed(100)
- '# dense @ dense * csr_mask -> csr'
- crows = [0, 2, 3, 5]
- cols = [1, 3, 2, 0, 1]
- values = [1., 2., 3., 4., 5.]
- dense_shape = [3, 4]
- mask = paddle.sparse.sparse_csr_tensor(crows, cols, values, dense_shape)
- print(mask)
- Tensor(shape=[3, 4], dtype=paddle.float32, place=Place(gpu:0), stop_gradient=True,
- crows=[0, 2, 3, 5],
- cols=[1, 3, 2, 0, 1],
- values=[1., 2., 3., 4., 5.])
- x = paddle.rand([3, 5])
- y = paddle.rand([5, 4])
- out = paddle.sparse.masked_matmul(x, y, mask)
- print(out)
- Tensor(shape=[3, 4], dtype=paddle.float32, place=Place(gpu:0), stop_gradient=True,
- crows=[0, 2, 3, 5],
- cols=[1, 3, 2, 0, 1],
- values=[0.98986477, 0.97800624, 1.14591956, 0.68561077, 0.94714981])
8 api_shape: {}
