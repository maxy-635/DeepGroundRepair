2 api_name: paddle.sparse.mv
3 api_description: Computes the matrix-vector product of a sparse matrix and a dense
  vector.
4 api_signature: paddle.sparse.mv(x,vec)
5 api_details: ''
6 api_parameters:
- x: Sparse 2D input tensor in COO or CSR format, with float32 or float64 data.
- vec: Dense 1D input vector in float32 or float64 to multiply with `x`.
7 api_usage_example:
- '>>>'
- import paddle
- paddle.device.set_device('gpu')
- paddle.seed(100)
- '# csr @ dense -> dense'
- crows = [0, 2, 3, 5]
- cols = [1, 3, 2, 0, 1]
- values = [1., 2., 3., 4., 5.]
- dense_shape = [3, 4]
- csr = paddle.sparse.sparse_csr_tensor(crows, cols, values, dense_shape)
- print(csr)
- Tensor(shape=[3, 4], dtype=paddle.float32, place=Place(gpu:0), stop_gradient=True,
- crows=[0, 2, 3, 5],
- cols=[1, 3, 2, 0, 1],
- values=[1., 2., 3., 4., 5.])
- vec = paddle.randn([4])
- out = paddle.sparse.mv(csr, vec)
- print(out)
- Tensor(shape=[3], dtype=float32, place=Place(gpu:0), stop_gradient=True,
- '[-3.85499096, -2.42975140, -1.75087738])'
8 api_shape: {}
