2 api_name: paddle.sparse.addmm
3 api_description: Computes sparse matrix multiplication with `x` and `y`, then adds
  the input tensor to the result.
4 api_signature: paddle.sparse.addmm(x,y,beta,alpha)
5 api_details: ''
6 api_parameters:
- x: Sparse input tensor to be multiplied, with shape [*, M, K].
- y: Dense input tensor to be multiplied with x, with shape [*, K, N].
- beta: Scalar coefficient applied to the input when combining results.
- alpha: Scalar coefficient applied to the x * y product.
7 api_usage_example:
- '>>>'
- import paddle
- paddle.device.set_device('gpu')
- '# dense + csr @ dense -> dense'
- input = paddle.rand([3, 2])
- crows = [0, 1, 2, 3]
- cols = [1, 2, 0]
- values = [1., 2., 3.]
- x = paddle.sparse.sparse_csr_tensor(crows, cols, values, [3, 3])
- y = paddle.rand([3, 2])
- out = paddle.sparse.addmm(input, x, y, 3.0, 2.0)
- '# dense + coo @ dense -> dense'
- input = paddle.rand([3, 2])
- indices = [[0, 1, 2], [1, 2, 0]]
- values = [1., 2., 3.]
- x = paddle.sparse.sparse_coo_tensor(indices, values, [3, 3])
- y = paddle.rand([3, 2])
- out = paddle.sparse.addmm(input, x, y, 3.0, 2.0)
8 api_shape: {}
