2 api_name: paddle.incubate.nn.functional.fused_rotary_position_embedding
3 api_description: Applies fused rotary positional embeddings to input tensors, combining
  rotation-based position encoding into a single efficient operation.
4 api_signature: paddle.incubate.nn.functional.fused_rotary_position_embedding(q,k,sin,cos)
5 api_details: ''
6 api_parameters:
- q: Query tensor to which rotary position embeddings are applied.
- k: Key tensor to which rotary position embeddings are applied.
- sin: Sine values used to compute the rotary position embedding transformation.
- cos: Cosine values used to compute the rotary position embedding transformation.
7 api_usage_example:
- '>>>'
- import paddle
- from paddle.incubate.nn.functional import fused_rotary_position_embedding
- paddle.set_device('gpu')
- '# batch_size = 2'
- '# seq_len = 2'
- '# num_heads = 2'
- '# head_dim = 2'
- paddle.seed(1204)
- '# q, k, v: [batch_size, seq_len, num_heads, head_dim]'
- q = paddle.randn([2, 2, 2, 2], dtype='float16')
- k = paddle.randn([2, 2, 2, 2], dtype='float16')
- v = paddle.randn([2, 2, 2, 2], dtype='float16')
- '# sin, cos: [1, seq_len, 1, head_dim]'
- x = paddle.randn([1, 2, 1, 2], dtype='float16')
- y = paddle.randn([1, 2, 1, 2], dtype='float16')
- sin = paddle.sin(x)
- cos = paddle.cos(y)
- '# position_ids: [batch_size, seq_len]'
- position_ids = paddle.randint(high=2, shape=[2, 2], dtype='int64')
- '# out_q, out_k, out_v: [batch_size, seq_len, num_heads, head_dim]'
- out_q, out_k, out_v = fused_rotary_position_embedding(q, k, v, sin=sin, cos=cos,
  position_ids=position_ids, use_neox_rotary_style=False)
- print(out_q)
