2 api_name: paddle.incubate.graph_khop_sampler
3 api_description: Samples k-hop neighborhoods from a graph for each seed node, returning
  the connected subgraph structure needed for neighborhood-based graph learning.
4 api_signature: paddle.incubate.graph_khop_sampler(input_nodes,sample_sizes,sorted_eids,return_eids,name)
5 api_details: ''
6 api_parameters:
- input_nodes: Nodes to start sampling from; must have the same data type as `row`.
- sample_sizes: 1D integer list or array specifying how many neighbors to sample at
    each layer.
- sorted_eids: Pre-sorted edge IDs to use when `return_eids` is enabled; must match
    `row` type and have shape `[num_edges, 1]`.
- return_eids: Controls whether the sampler returns the IDs of the sampled edges.
- name: Optional name for the operation.
7 api_usage_example:
- '.. code-block:: python'
- '# doctest: +SKIP(''Number of sample edges mismatch, the sample kernel has error.'')'
- import paddle
- row = [3, 7, 0, 9, 1, 4, 2, 9, 3, 9, 1, 9, 7]
- colptr = [0, 2, 4, 5, 6, 7, 9, 11, 11, 13, 13]
- nodes = [0, 8, 1, 2]
- sample_sizes = [2, 2]
- row = paddle.to_tensor(row, dtype="int64")
- colptr = paddle.to_tensor(colptr, dtype="int64")
- nodes = paddle.to_tensor(nodes, dtype="int64")
- 'edge_src, edge_dst, sample_index, reindex_nodes = paddle.incubate.graph_khop_sampler(row,
  colptr, nodes, sample_sizes, False)   # type: ignore[operator]'
8 api_shape: {}
