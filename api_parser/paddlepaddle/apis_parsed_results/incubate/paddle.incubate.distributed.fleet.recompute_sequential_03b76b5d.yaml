2 api_name: paddle.incubate.distributed.fleet.recompute_sequential
3 api_description: Recomputes intermediate activations during sequential model execution
  to reduce memory usage, using `ctx` to pass context parameters similar to `recompute_hybrid`.
4 api_signature: paddle.incubate.distributed.fleet.recompute_sequential(ctx,functions,*args,**kwargs)
5 api_details: ''
6 api_parameters:
- ctx: Controls recomputation settings, including how many segments to split the model
    into and whether to preserve the forward RNG state for backward recomputation.
- functions: Specifies the sequence of layers or functions whose intermediate activations
    are discarded in forward pass and recomputed in backward pass to save memory.
- '*args': Provides positional input arguments passed to the recomputed function.
- '**kwargs': Provides keyword input arguments passed to the recomputed function.
7 api_usage_example:
- '>>>'
- import paddle
- from paddle.incubate.distributed.fleet import recompute_sequential
- input = paddle.ones(shape=[8, 10])
- model = paddle.nn.Sequential(paddle.nn.Linear(10, 10), paddle.nn.Linear(10, 2))
- 'output = recompute_sequential({''segments'' : 1}, model, input)'
8 api_shape: {}
