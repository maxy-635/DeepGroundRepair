2 api_name: paddle.incubate.nn.functional.fused_multi_head_attention
3 api_description: Performs fused multi-head self-attention, computing parallel attention
  over queries, keys, and values to produce output representations.
4 api_signature: paddle.incubate.nn.functional.fused_multi_head_attention(x,qkv_weight,linear_weight,num_heads,attn_mask,dropout_rate,training,name)
5 api_details: ''
6 api_parameters:
- x: Provides the input sequence embeddings to be transformed by fused multi-head
    attention.
- qkv_weight: Supplies the learned weights used to compute the query, key, and value
    projections.
- linear_weight: Supplies the output projection weight applied after attention is
    computed.
- attn_mask: Masks out disallowed attention positions such as padding or future tokens.
- dropout_rate: Sets the probability of dropping attention weights during dropout.
- training: Indicates whether the operation should run in training mode or inference
    mode.
- num_heads: Specifies the number of attention heads when the QKV weight layout is
    transposed.
- name: Optionally assigns a name to the operation for API or graph tracking purposes.
