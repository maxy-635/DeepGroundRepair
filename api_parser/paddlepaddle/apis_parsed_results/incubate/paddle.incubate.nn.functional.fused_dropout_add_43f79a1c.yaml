2 api_name: paddle.incubate.nn.functional.fused_dropout_add
3 api_description: Applies dropout and then adds the result to another tensor in one
  fused operation.
4 api_signature: paddle.incubate.nn.functional.fused_dropout_add(x,y,p,training)
5 api_details: ''
6 api_parameters:
- x: Provides the first input tensor to be combined with dropout and addition.
- y: Provides the second input tensor that is added after applying dropout.
- p: Sets the dropout probability, controlling how often values are zeroed out.
- training: Specifies whether to apply dropout behavior during training or use inference
    mode.
7 api_usage_example:
- '>>>'
- import paddle
- from paddle.incubate.nn.functional import fused_dropout_add
- paddle.set_device('gpu')
- paddle.seed(2023)
- x = paddle.randn([4, 10], dtype="float32")
- y = paddle.randn([4, 10], dtype="float32")
- out = fused_dropout_add(x, y, p=0.5)
- print(out)
