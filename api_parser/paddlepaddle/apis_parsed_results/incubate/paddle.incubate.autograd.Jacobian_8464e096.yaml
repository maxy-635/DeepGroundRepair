2 api_name: paddle.incubate.autograd.Jacobian
3 api_description: Computes the Jacobian matrix of a function by measuring how each
  output changes with respect to each input.
4 api_signature: paddle.incubate.autograd.Jacobian(func,xs)
5 api_details: ''
6 api_parameters:
- func: The function to differentiate, which takes batched tensor inputs and returns
    a tensor or sequence of tensors.
- xs: The input tensor or sequence of tensors passed to `func`.
