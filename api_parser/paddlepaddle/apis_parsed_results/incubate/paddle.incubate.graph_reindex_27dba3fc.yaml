2 api_name: paddle.incubate.graph_reindex
3 api_description: Rebuilds graph indexes for a Paddle graph, updating reindex mappings
  to keep node and edge relationships consistent after structural changes.
4 api_signature: paddle.incubate.graph_reindex(x,neighbors)
5 api_details: ''
6 api_parameters:
- x: The input node IDs whose neighbors are sampled.
- neighbors: The neighbor node IDs corresponding to `x`, using the same data type
    as `x`.
7 api_usage_example:
