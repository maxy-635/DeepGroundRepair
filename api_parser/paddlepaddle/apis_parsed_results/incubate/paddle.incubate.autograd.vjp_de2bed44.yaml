2 api_name: paddle.incubate.autograd.vjp
3 api_description: Computes the vector-Jacobian product for reverse-mode automatic
  differentiation, returning gradients of outputs with respect to inputs in a functional
  form.
4 api_signature: paddle.incubate.autograd.vjp(func,xs,v)
5 api_details: ''
6 api_parameters:
- func: The target function to differentiate; it is called with `xs` and must return
    a Tensor or a sequence of Tensors.
- xs: The input argument(s) passed positionally to `func` when evaluating it for the
    VJP computation.
- v: The cotangent vector used in the VJP calculation, matching `func`'s output shape
    and defaulting to all ones if omitted.
7 api_usage_example:
- import paddle
- 'def func(x):'
- '    return paddle.matmul(x, x)'
- '...'
- x = paddle.ones(shape=[2, 2], dtype='float32')
- _, vjp_result = paddle.incubate.autograd.vjp(func, x)
- print(vjp_result)
- Tensor(shape=[2, 2], dtype=float32, place=Place(cpu), stop_gradient=False,
- '[[4., 4.],'
- '[4., 4.]])'
- v = paddle.to_tensor([[1.0, 0.0], [0.0, 0.0]])
- _, vjp_result = paddle.incubate.autograd.vjp(func, x, v)
- print(vjp_result)
- Tensor(shape=[2, 2], dtype=float32, place=Place(cpu), stop_gradient=False,
- '[[2., 1.],'
- '[1., 0.]])'
8 api_shape: {}
