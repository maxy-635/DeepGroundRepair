2 api_name: paddle.incubate.LookAhead
3 api_description: Implements the Lookahead optimizer, which wraps a base optimizer
  and periodically synchronizes slow weights with fast weights to improve training
  stability and convergence.
4 api_signature: paddle.incubate.LookAhead(inner_optimizer,alpha,k)
5 api_details: ''
6 api_parameters:
- inner_optimizer: The base optimizer used to update the fast parameters at each step.
- alpha: The lookahead learning rate that controls how much the slow parameters move
    toward the fast parameters.
- k: The number of steps between slow parameter updates.
7 api_usage_example:
- import numpy as np
- import paddle
- import paddle.nn as nn
- BATCH_SIZE = 16
- BATCH_NUM = 4
- EPOCH_NUM = 4
- IMAGE_SIZE = 784
- CLASS_NUM = 10
- '# define a random dataset'
- 'class RandomDataset(paddle.io.Dataset): # type: ignore[type-arg]'
- '    def __init__(self, num_samples):'
- '        self.num_samples = num_samples'
- '    def __getitem__(self, idx):'
- '        image = np.random.random([IMAGE_SIZE]).astype(''float32'')'
- '        label = np.random.randint(0, CLASS_NUM - 1,'
- '                                (1, )).astype(''int64'')'
- '        return image, label'
- '    def __len__(self):'
- '        return self.num_samples'
- 'class LinearNet(nn.Layer):'
- '    def __init__(self):'
- '        super().__init__()'
- '        self._linear = nn.Linear(IMAGE_SIZE, CLASS_NUM)'
- '        self.bias = self._linear.bias'
- '    @paddle.jit.to_static'
- '    def forward(self, x):'
- '        return self._linear(x)'
- 'def train(layer, loader, loss_fn, opt):'
- '    for epoch_id in range(EPOCH_NUM):'
- '        for batch_id, (image, label) in enumerate(loader()):'
- '            out = layer(image)'
- '            loss = loss_fn(out, label)'
- '            loss.backward()'
- '            opt.step()'
- '            opt.clear_grad()'
- '            print("Train Epoch {} batch {}: loss = {}".format('
- '                epoch_id, batch_id, np.mean(loss.numpy())))'
- layer = LinearNet()
- loss_fn = nn.CrossEntropyLoss()
- optimizer = paddle.optimizer.SGD(learning_rate=0.1, parameters=layer.parameters())
- lookahead = paddle.incubate.LookAhead(optimizer, alpha=0.2, k=5)
- '# create data loader'
- dataset = RandomDataset(BATCH_NUM * BATCH_SIZE)
- loader = paddle.io.DataLoader(
- '    dataset,'
- '    batch_size=BATCH_SIZE,'
- '    shuffle=True,'
- '    drop_last=True,'
- '    num_workers=2)'
- '>>>'
- train(layer, loader, loss_fn, lookahead)
