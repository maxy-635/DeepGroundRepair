2 api_name: paddle.nonzero
3 api_description: Returns the indices of all non-zero elements in a tensor, either
  as a 2-D index tensor or as a tuple of per-dimension 1-D index tensors when `as_tuple=True`.
4 api_signature: paddle.nonzero(x)
5 api_details: ''
6 api_parameters:
- x: The input tensor whose non-zero elements will be found.
7 api_usage_example:
- import paddle
- x1 = paddle.to_tensor([[1.0, 0.0, 0.0],
- '                       [0.0, 2.0, 0.0],'
- '                       [0.0, 0.0, 3.0]])'
- x2 = paddle.to_tensor([0.0, 1.0, 0.0, 3.0])
- out_z1 = paddle.nonzero(x1)
- print(out_z1)
- Tensor(shape=[3, 2], dtype=int64, place=Place(cpu), stop_gradient=True,
- '[[0, 0],'
- '[1, 1],'
- '[2, 2]])'
- out_z1_tuple = paddle.nonzero(x1, as_tuple=True)
- 'for out in out_z1_tuple:'
- '    print(out)'
- Tensor(shape=[3], dtype=int64, place=Place(cpu), stop_gradient=True,
- '[0, 1, 2])'
- Tensor(shape=[3], dtype=int64, place=Place(cpu), stop_gradient=True,
- '[0, 1, 2])'
- out_z2 = paddle.nonzero(x2)
- print(out_z2)
- Tensor(shape=[2, 1], dtype=int64, place=Place(cpu), stop_gradient=True,
- '[[1],'
- '[3]])'
- out_z2_tuple = paddle.nonzero(x2, as_tuple=True)
- 'for out in out_z2_tuple:'
- '    print(out)'
- Tensor(shape=[2], dtype=int64, place=Place(cpu), stop_gradient=True,
- '[1, 3])'
