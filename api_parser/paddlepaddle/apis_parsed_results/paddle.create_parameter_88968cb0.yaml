2 api_name: paddle.create_parameter
3 api_description: Creates a learnable parameter tensor that can store gradients and
  be optimized during training.
4 api_signature: paddle.create_parameter(shape,dtype,name,default_initializer)
5 api_details: ''
6 api_parameters:
- shape: Specifies the dimensions of the parameter tensor.
- dtype: Specifies the parameter's data type, such as `float16`, `float32`, or `float64`.
