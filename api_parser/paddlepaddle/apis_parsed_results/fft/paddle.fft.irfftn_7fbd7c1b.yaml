2 api_name: paddle.fft.irfftn
3 api_description: Computes the inverse real n-dimensional FFT, reconstructing a real-valued
  signal from its frequency-domain representation.
4 api_signature: paddle.fft.irfftn(x,s,axes,norm)
5 api_details: ''
6 api_parameters:
- x: Input tensor containing the frequency-domain data to transform back to the spatial
    domain.
- s: Defines the output signal shape along the transformed dimensions.
- axes: Specifies which axes to apply the inverse FFT over; defaults to the last `len(s)`
    axes or all axes if `s` is not set.
- norm: Controls the normalization mode used for the inverse FFT computation.
7 api_usage_example:
- import paddle
- x = paddle.to_tensor([2.+2.j, 2.+2.j, 3.+3.j]).astype(paddle.complex128)
- print(x)
- Tensor(shape=[3], dtype=complex128, place=Place(cpu), stop_gradient=True,
- '[(2+2j), (2+2j), (3+3j)])'
- irfftn_x = paddle.fft.irfftn(x)
- print(irfftn_x)
- Tensor(shape=[4], dtype=float64, place=Place(cpu), stop_gradient=True,
- '[2.25000000, -1.25000000, 0.25000000, 0.75000000])'
8 api_shape: {}
