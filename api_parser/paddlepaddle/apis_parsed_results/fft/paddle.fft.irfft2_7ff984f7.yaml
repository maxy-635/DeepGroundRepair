2 api_name: paddle.fft.irfft2
3 api_description: Computes the 2D inverse real FFT, reconstructing a real-valued
  array from its half-spectrum frequency representation.
4 api_signature: paddle.fft.irfft2(x,s,axes,norm)
5 api_details: ''
6 api_parameters:
- x: The input tensor containing the frequency-domain data to transform.
- s: Specifies the output shape along the two transformed axes, with cropping or zero-padding
    applied as needed.
- axes: Specifies the two axes over which to perform the inverse FFT, defaulting to
    the last two axes.
- norm: Controls the normalization mode used for the inverse FFT.
7 api_usage_example:
- import paddle
- x = paddle.to_tensor([[3.+3.j, 2.+2.j, 3.+3.j], [2.+2.j, 2.+2.j, 3.+3.j]])
- irfft2_x = paddle.fft.irfft2(x)
- print(irfft2_x)
