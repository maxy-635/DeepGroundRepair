2 api_name: paddle.Tensor.fill_diagonal_
3 api_description: Fills the main diagonal of a tensor in place with a specified value,
  leaving off-diagonal elements unchanged.
4 api_signature: paddle.Tensor.fill_diagonal_(x,value,offset,wrap)
5 api_details: ''
6 api_parameters:
- x: The tensor to modify in place.
- value: The value used to fill the selected diagonal elements.
- offset: The diagonal offset relative to the main diagonal.
- wrap: Whether to wrap the diagonal after `N` columns for tall matrices.
7 api_usage_example:
- import paddle
- x = paddle.ones((4, 3)) * 2
- x.fill_diagonal_(1.0)
- print(x.tolist())
- '[[1.0, 2.0, 2.0], [2.0, 1.0, 2.0], [2.0, 2.0, 1.0], [2.0, 2.0, 2.0]]'
8 api_shape: {}
