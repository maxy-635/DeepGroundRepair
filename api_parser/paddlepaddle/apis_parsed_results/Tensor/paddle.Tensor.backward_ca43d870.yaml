2 api_name: paddle.Tensor.backward
3 api_description: Computes gradients by running backpropagation from the current
  tensor through the current computation graph.
4 api_signature: paddle.Tensor.backward(self,grad_tensor,retain_graph)
5 api_details: ''
6 api_parameters:
- grad_tensor: Provides the initial gradient for the current Tensor, defaulting to
    a Tensor of 1.0 values when not supplied.
- retain_graph: Controls whether to keep the computation graph after backward for
    further ops, or free it to save memory.
7 api_usage_example:
- import paddle
- x = paddle.to_tensor(5., stop_gradient=False)
- 'for i in range(5):'
- '    y = paddle.pow(x, 4.0)'
- '    y.backward()'
- '    print("{}: {}".format(i, x.grad))'
- '0: 500.0'
- '1: 1000.0'
- '2: 1500.0'
- '3: 2000.0'
- '4: 2500.0'
- x.clear_grad()
- print("{}".format(x.grad))
- '0.0'
- grad_tensor=paddle.to_tensor(2.)
- 'for i in range(5):'
- '    y = paddle.pow(x, 4.0)'
- '    y.backward(grad_tensor)'
- '    print("{}: {}".format(i, x.grad))'
- '0: 1000.0'
- '1: 2000.0'
- '2: 3000.0'
- '3: 4000.0'
- '4: 5000.0'
8 api_shape: {}
