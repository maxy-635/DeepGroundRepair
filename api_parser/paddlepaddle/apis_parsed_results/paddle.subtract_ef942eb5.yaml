2 api_name: paddle.subtract
3 api_description: Element-wise subtracts one tensor from another and returns the
  result.
4 api_signature: paddle.subtract(x,y)
5 api_details: ''
6 api_parameters:
- x: The first input tensor to subtract from.
- y: The second input tensor to subtract from `x`.
7 api_usage_example:
- import paddle
- x = paddle.to_tensor([[1, 2], [7, 8]])
- y = paddle.to_tensor([[5, 6], [3, 4]])
- res = paddle.subtract(x, y)
- print(res)
- Tensor(shape=[2, 2], dtype=int64, place=Place(cpu), stop_gradient=True,
- '[[-4, -4],'
- '[ 4,  4]])'
