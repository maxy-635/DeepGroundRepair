2 api_name: paddle.diag_embed
3 api_description: Creates a tensor with the input values placed along the diagonals
  of selected 2D planes, using the last two dimensions by default.
4 api_signature: paddle.diag_embed(input)
5 api_details: ''
6 api_parameters:
- input: The tensor whose values are placed on the diagonal of the output tensor.
7 api_usage_example:
- import paddle
- diag_embed_input = paddle.arange(6)
- diag_embed_output1 = paddle.diag_embed(diag_embed_input)
- print(diag_embed_output1)
