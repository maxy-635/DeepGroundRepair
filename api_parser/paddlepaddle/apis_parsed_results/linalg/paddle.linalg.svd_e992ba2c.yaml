2 api_name: paddle.linalg.svd
3 api_description: Computes the singular value decomposition of a matrix or batch
  of matrices, returning its singular vectors and singular values.
4 api_signature: paddle.linalg.svd(x,full_matrices)
5 api_details: ''
6 api_parameters:
- x: The input tensor to decompose, with shape `[..., N, M]` and a supported floating-point
    or complex dtype.
- full_matrices: Controls whether `svd` returns full-sized `U` and `V` matrices or
    the reduced economical form.
7 api_usage_example:
- import paddle
- x = paddle.to_tensor([[1.0, 2.0], [1.0, 3.0], [4.0, 6.0]]).astype('float64')
- x = x.reshape([3, 2])
- u, s, vh = paddle.linalg.svd(x)
- print (u)
- Tensor(shape=[3, 2], dtype=float64, place=Place(cpu), stop_gradient=True,
- '[[-0.27364809, -0.21695147],'
- '[-0.37892198, -0.87112408],'
- '[-0.88404460,  0.44053933]])'
- print (s)
- Tensor(shape=[2], dtype=float64, place=Place(cpu), stop_gradient=True,
- '[8.14753743, 0.78589688])'
- print (vh)
- Tensor(shape=[2, 2], dtype=float64, place=Place(cpu), stop_gradient=True,
- '[[-0.51411221, -0.85772294],'
- '[ 0.85772294, -0.51411221]])'
- '# one can verify : U * S * VT == X'
- '#                  U * UH == I'
- '#                  V * VH == I'
8 api_shape: {}
