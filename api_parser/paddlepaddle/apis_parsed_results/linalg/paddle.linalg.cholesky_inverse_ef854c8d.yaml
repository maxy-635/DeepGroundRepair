2 api_name: paddle.linalg.cholesky_inverse
3 api_description: Computes the inverse of a symmetric positive definite matrix from
  its Cholesky factor.
4 api_signature: paddle.linalg.cholesky_inverse(x,upper)
5 api_details: ''
6 api_parameters:
- x: Provides the lower or upper triangular Cholesky factor of a symmetric matrix
    to invert.
- upper: Indicates whether `x` is an upper-triangular factor (`True`) or a lower-triangular
    factor (`False`).
7 api_usage_example:
- import paddle
- '# lower triangular matrix'
- x = paddle.to_tensor([[3.,.0,.0], [5.,3.,.0], [-1.,1.,2.]])
- out = paddle.linalg.cholesky_inverse(x)
- print(out)
- Tensor(shape=[3, 3], dtype=float32, place=Place(gpu:0), stop_gradient=True,
- '[[ 0.61728382, -0.25925916,  0.22222219],'
- '[-0.25925916,  0.13888884, -0.08333331],'
- '[ 0.22222218, -0.08333331,  0.25000000]])'
- '# upper triangular matrix'
- out = paddle.linalg.cholesky_inverse(x.T, upper=True)
- print(out)
- Tensor(shape=[3, 3], dtype=float32, place=Place(gpu:0), stop_gradient=True,
- '[[ 0.61728382, -0.25925916,  0.22222219],'
- '[-0.25925916,  0.13888884, -0.08333331],'
- '[ 0.22222218, -0.08333331,  0.25000000]])'
8 api_shape: {}
