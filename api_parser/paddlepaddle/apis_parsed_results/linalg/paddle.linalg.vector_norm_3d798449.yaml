2 api_name: paddle.linalg.vector_norm
3 api_description: Computes the p-order vector norm of a tensor along a specified
  dimension, including 1-norm, 2-norm, and general p-norms.
4 api_signature: paddle.linalg.vector_norm(x,p,axis,keepdim,dtype)
5 api_details: ''
6 api_parameters:
- x: The input tensor whose vector norm is computed.
- p: The order of the norm to compute; defaults to 2 when `None`.
- axis: The dimension or dimensions along which to compute the vector norm; defaults
    to the last dimension when `None`.
- keepdim: Controls whether the reduced dimensions are retained in the output.
- dtype: Specifies the computation dtype to use for better precision or performance.
