2 api_name: paddle.linalg.lstsq
3 api_description: Solves a linear least squares problem, returning the best-fit solution
  to Ax ≈ b.
4 api_signature: paddle.linalg.lstsq(x,y,rcond)
5 api_details: ''
6 api_parameters:
- x: The coefficient matrix whose least-squares solution is being computed.
- y: The right-hand-side tensor of target values to fit against the matrix `x`.
- rcond: A threshold for treating small singular values as zero when determining the
    effective rank of `x`.
7 api_usage_example:
- import paddle
- x = paddle.to_tensor([[1, 3], [3, 2], [5, 6.]])
- y = paddle.to_tensor([[3, 4, 6], [5, 3, 4], [1, 2, 1.]])
- results = paddle.linalg.lstsq(x, y, driver="gelsd")
- print(results[0])
- Tensor(shape=[2, 3], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[ 0.78350395, -0.22165027, -0.62371236],'
- '[-0.11340097,  0.78866047,  1.14948535]])'
- print(results[1])
- Tensor(shape=[3], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[19.81443405, 10.43814468, 30.56185532])'
- print(results[2])
- Tensor(shape=[], dtype=int32, place=Place(cpu), stop_gradient=True,
- 2)
- print(results[3])
- Tensor(shape=[2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[9.03455734, 1.54167950])'
- x = paddle.to_tensor([[10, 2, 3], [3, 10, 5], [5, 6, 12.]])
- y = paddle.to_tensor([[4, 2, 9], [2, 0, 3], [2, 5, 3.]])
- results = paddle.linalg.lstsq(x, y, driver="gels")
- print(results[0])
