2 api_name: paddle.linalg.householder_product
3 api_description: Computes the first n columns of a product of Householder reflection
  matrices.
4 api_signature: paddle.linalg.householder_product(x,tau)
5 api_details: ''
6 api_parameters:
- x: Input tensor containing the Householder vectors arranged in a matrix of shape
    (*, m, n), with optional batch dimensions.
- tau: Input tensor containing the scalar coefficients for the Householder reflections,
    shaped (*, k) with optional batch dimensions.
7 api_usage_example:
- import paddle
- x = paddle.to_tensor([[-1.1280,  0.9012, -0.0190],
- '        [ 0.3699,  2.2133, -1.4792],'
- '        [ 0.0308,  0.3361, -3.1761],'
- '        [-0.0726,  0.8245, -0.3812]])'
- tau = paddle.to_tensor([1.7497, 1.1156, 1.7462])
- Q = paddle.linalg.householder_product(x, tau)
- print(Q)
- Tensor(shape=[4, 3], dtype=float32, place=Place(gpu:0), stop_gradient=True,
- '[[-0.74969995, -0.02181768,  0.31115776],'
- '[-0.64721400, -0.12367040, -0.21738708],'
- '[-0.05389076, -0.37562513, -0.84836429],'
- '[ 0.12702821, -0.91822827,  0.36892807]])'
