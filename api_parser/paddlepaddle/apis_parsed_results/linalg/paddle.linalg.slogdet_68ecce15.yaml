2 api_name: paddle.linalg.slogdet
3 api_description: Computes the sign and natural log of the absolute determinant of
  a square matrix or batch of square matrices, allowing the determinant to be reconstructed
  as sign * exp(logabsdet).
4 api_signature: paddle.linalg.slogdet(x)
5 api_details: ''
6 api_parameters:
- x: The input batch of square matrices whose sign and logarithmic determinant are
    computed.
