2 api_name: paddle.linalg.cond
3 api_description: Computes the condition number of a matrix or batch of matrices
  for a specified matrix norm.
4 api_signature: paddle.linalg.cond(x,p)
5 api_details: ''
6 api_parameters:
- x: The input tensor, containing batched matrices or square invertible matrices,
    whose condition number will be computed.
- p: The norm order to use when computing the condition number, with 2 as the default.
7 api_usage_example:
- import paddle
- paddle.seed(2023)
- x = paddle.to_tensor([[1., 0, -1], [0, 1, 0], [1, 0, 1]])
- '# compute conditional number when p is None'
- out = paddle.linalg.cond(x)
- print(out)
