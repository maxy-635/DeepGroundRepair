2 api_name: paddle.kthvalue
3 api_description: Returns the k-th smallest value and its index along a specified
  axis.
4 api_signature: paddle.kthvalue(x,k,axis)
5 api_details: ''
6 api_parameters:
- x: The input tensor whose k-th smallest value is computed.
- k: The rank of the smallest element to find along the chosen axis.
- axis: The dimension along which to search for the k-th smallest value, defaulting
    to the last axis when not specified.
7 api_usage_example:
- import paddle
- x = paddle.randn((2,3,2))
- print(x)
- '>>>'
- Tensor(shape=[2, 3, 2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[[ 0.11855337, -0.30557564],'
- '[-0.09968963,  0.41220093],'
- '[ 1.24004936,  1.50014710]],'
- '[[ 0.08612321, -0.92485696],'
- '[-0.09276631,  1.15149164],'
- '[-1.46587241,  1.22873247]]])'
- '>>>'
- y = paddle.kthvalue(x, 2, 1)
- print(y)
- '>>>'
- (Tensor(shape=[2, 2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[ 0.11855337,  0.41220093],'
- '[-0.09276631,  1.15149164]]), Tensor(shape=[2, 2], dtype=int64, place=Place(cpu),
  stop_gradient=True,'
- '[[0, 1],'
- '[1, 1]]))'
- '>>>'
8 api_shape: {}
