2 api_name: paddle.amax
3 api_description: Returns the maximum value of a tensor along the specified axis.
4 api_signature: paddle.amax(x,axis,keepdim)
5 api_details: ''
6 api_parameters:
- x: Input tensor whose maximum values will be computed.
- axis: Dimension or dimensions to reduce when finding the maximum; if None, reduces
    over all elements.
- keepdim: Controls whether reduced dimensions are kept in the output tensor.
7 api_usage_example:
- import paddle
- '# data_x is a Tensor with shape [2, 4] with multiple maximum elements'
- '# the axis is a int element'
- x = paddle.to_tensor([[0.1, 0.9, 0.9, 0.9],
- '                        [0.9, 0.9, 0.6, 0.7]],'
- '                        dtype=''float64'', stop_gradient=False)'
- '# There are 5 maximum elements:'
- '# 1) amax evenly distributes gradient between these equal values,'
- '#    thus the corresponding gradients are 1/5=0.2;'
- '# 2) while max propagates gradient to all of them,'
- '#    thus the corresponding gradient are 1.'
- result1 = paddle.amax(x)
- result1.backward()
- result1
- Tensor(shape=[], dtype=float64, place=Place(cpu), stop_gradient=False,
- 0.90000000)
- x.grad
- Tensor(shape=[2, 4], dtype=float64, place=Place(cpu), stop_gradient=False,
- '[[0.        , 0.20000000, 0.20000000, 0.20000000],'
- '[0.20000000, 0.20000000, 0.        , 0.        ]])'
- x.clear_grad()
- result1_max = paddle.max(x)
- result1_max.backward()
- result1_max
- Tensor(shape=[], dtype=float64, place=Place(cpu), stop_gradient=False,
- 0.90000000)
- x.clear_grad()
- result2 = paddle.amax(x, axis=0)
- result2.backward()
- result2
- Tensor(shape=[4], dtype=float64, place=Place(cpu), stop_gradient=False,
- '[0.90000000, 0.90000000, 0.90000000, 0.90000000])'
- x.grad
- Tensor(shape=[2, 4], dtype=float64, place=Place(cpu), stop_gradient=False,
- '[[0.        , 0.50000000, 1.        , 1.        ],'
- '[1.        , 0.50000000, 0.        , 0.        ]])'
- x.clear_grad()
- result3 = paddle.amax(x, axis=-1)
- result3.backward()
- result3
- Tensor(shape=[2], dtype=float64, place=Place(cpu), stop_gradient=False,
- '[0.90000000, 0.90000000])'
- x.grad
- Tensor(shape=[2, 4], dtype=float64, place=Place(cpu), stop_gradient=False,
- '[[0.        , 0.33333333, 0.33333333, 0.33333333],'
- '[0.50000000, 0.50000000, 0.        , 0.        ]])'
- x.clear_grad()
- result4 = paddle.amax(x, axis=1, keepdim=True)
- result4.backward()
- result4
- Tensor(shape=[2, 1], dtype=float64, place=Place(cpu), stop_gradient=False,
- '[[0.90000000],'
- '[0.90000000]])'
- x.grad
- Tensor(shape=[2, 4], dtype=float64, place=Place(cpu), stop_gradient=False,
- '[[0.        , 0.33333333, 0.33333333, 0.33333333],'
- '[0.50000000, 0.50000000, 0.        , 0.        ]])'
- '# data_y is a Tensor with shape [2, 2, 2]'
- '# the axis is list'
- y = paddle.to_tensor([[[0.1, 0.9], [0.9, 0.9]],
- '                        [[0.9, 0.9], [0.6, 0.7]]],'
- '                        dtype=''float64'', stop_gradient=False)'
- result5 = paddle.amax(y, axis=[1, 2])
- result5.backward()
- result5
- Tensor(shape=[2], dtype=float64, place=Place(cpu), stop_gradient=False,
- '[0.90000000, 0.90000000])'
- y.grad
- Tensor(shape=[2, 2, 2], dtype=float64, place=Place(cpu), stop_gradient=False,
- '[[[0.        , 0.33333333],'
- '[0.33333333, 0.33333333]],'
- '[[0.50000000, 0.50000000],'
- '[0.        , 0.        ]]])'
- y.clear_grad()
- result6 = paddle.amax(y, axis=[0, 1])
- result6.backward()
- result6
- Tensor(shape=[2], dtype=float64, place=Place(cpu), stop_gradient=False,
- '[0.90000000, 0.90000000])'
- y.grad
- Tensor(shape=[2, 2, 2], dtype=float64, place=Place(cpu), stop_gradient=False,
- '[[[0.        , 0.33333333],'
- '[0.50000000, 0.33333333]],'
- '[[0.50000000, 0.33333333],'
- '[0.        , 0.        ]]])'
