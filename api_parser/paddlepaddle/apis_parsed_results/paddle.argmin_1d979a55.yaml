2 api_name: paddle.argmin
3 api_description: Returns the index of the minimum value along a specified axis of
  the input tensor.
4 api_signature: paddle.argmin(x,axis)
5 api_details: ''
6 api_parameters:
- x: Input tensor whose minimum-value index is computed.
- axis: Dimension along which to find the index of the minimum value, or flatten the
    tensor when `None`.
7 api_usage_example:
- import paddle
- x =  paddle.to_tensor([[5,8,9,5],
- '                       [0,0,1,7],'
- '                       [6,9,2,4]])'
- out1 = paddle.argmin(x)
- print(out1.numpy())
- '4'
- out2 = paddle.argmin(x, axis=0)
- print(out2.numpy())
- '[1 1 1 2]'
- out3 = paddle.argmin(x, axis=-1)
- print(out3.numpy())
- '[0 0 2]'
- out4 = paddle.argmin(x, axis=0, keepdim=True)
- print(out4.numpy())
- '[[1 1 1 2]]'
8 api_shape: {}
