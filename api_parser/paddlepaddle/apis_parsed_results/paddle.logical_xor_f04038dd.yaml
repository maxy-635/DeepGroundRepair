2 api_name: paddle.logical_xor
3 api_description: Computes the element-wise logical XOR of two tensors and returns
  a boolean tensor.
4 api_signature: paddle.logical_xor(x,y,out)
5 api_details: ''
6 api_parameters:
- x: Provides the first input tensor whose values are used in the logical XOR operation.
- y: Provides the second input tensor to XOR with `x`.
- out: Specifies an optional tensor to store the result; if omitted, a new output
    tensor is created.
7 api_usage_example:
- import paddle
- x = paddle.to_tensor([True, False], dtype="bool").reshape([2, 1])
- y = paddle.to_tensor([True, False, True, False], dtype="bool").reshape([2, 2])
- res = paddle.logical_xor(x, y)
- print(res)
