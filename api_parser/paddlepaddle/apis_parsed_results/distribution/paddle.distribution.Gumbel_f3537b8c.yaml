2 api_name: paddle.distribution.Gumbel
3 api_description: Represents the Gumbel distribution with location and scale parameters,
  used to model extreme-value random variables and to sample, evaluate probabilities,
  and compute distribution statistics.
4 api_signature: paddle.distribution.Gumbel(loc,scale)
5 api_details: ''
6 api_parameters:
- loc: Sets the location (mean/central shift) of the Gumbel distribution.
- scale: Sets the scale (spread) of the Gumbel distribution.
7 api_usage_example:
- import paddle
- from paddle.distribution.gumbel import Gumbel
- '# Gumbel distributed with loc=0, scale=1'
- dist = Gumbel(paddle.full([1], 0.0), paddle.full([1], 1.0))
- '>>>'
- print(dist.sample([2]))
- Tensor(shape=[2, 1], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[0.40484068],'
- '[3.19400501]])'
- print(dist.rsample([2]))
- Tensor(shape=[2, 1], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[-0.95093185],'
- '[ 0.32422572]])'
- '>>>'
- value = paddle.full([1], 0.5)
- print(dist.prob(value))
- Tensor(shape=[1], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[0.33070430])'
- print(dist.log_prob(value))
- Tensor(shape=[1], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[-1.10653067])'
- print(dist.cdf(value))
- Tensor(shape=[1], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[0.54523921])'
- print(dist.entropy())
- Tensor(shape=[1], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[1.57721567])'
