2 api_name: paddle.distribution.MultivariateNormal
3 api_description: 'Represents a multivariate normal distribution over real-valued
  vectors, parameterized by a mean vector and one covariance form: covariance matrix,
  precision matrix, or lower-triangular scale matrix; used to model and sample correlated
  continuous variables.'
4 api_signature: paddle.distribution.MultivariateNormal(loc)
5 api_details: ''
6 api_parameters:
- loc: Specifies the mean vector of the multivariate normal distribution, converting
    integer or float inputs into a 1-D Tensor with Paddle's global default dtype.
7 api_usage_example:
- import paddle
- from paddle.distribution import MultivariateNormal
- paddle.set_device("cpu")
- paddle.seed(100)
- rv = MultivariateNormal(loc=paddle.to_tensor([2.,5.]), covariance_matrix=paddle.to_tensor([[2.,1.],[1.,2.]]))
- print(rv.sample([3, 2]))
- Tensor(shape=[3, 2, 2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[[-0.00339603,  4.31556797],'
