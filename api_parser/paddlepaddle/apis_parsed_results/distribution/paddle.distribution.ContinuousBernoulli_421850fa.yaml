2 api_name: paddle.distribution.ContinuousBernoulli
3 api_description: Represents a continuous Bernoulli distribution on [0, 1] parameterized
  by `probs`, providing the distribution’s density and related sampling, log-probability,
  and shape-driven behavior.
4 api_signature: paddle.distribution.ContinuousBernoulli(probs)
5 api_details: ''
6 api_parameters:
- probs: Specifies the Bernoulli probability in [0, 1] that determines the shape of
    the Continuous Bernoulli distribution’s probability density function, and is converted
    to a 1-D Tensor with Paddle’s default dtype if given as an int or float.
7 api_usage_example:
- import paddle
- from paddle.distribution import ContinuousBernoulli
- paddle.set_device("cpu")
- paddle.seed(100)
- rv = ContinuousBernoulli(paddle.to_tensor([0.2, 0.5]))
- print(rv.sample([2]))
- Tensor(shape=[2, 2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[0.38694882, 0.20714243],'
- '[0.00631948, 0.51577556]])'
- print(rv.mean)
- Tensor(shape=[2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[0.38801414, 0.50000000])'
- print(rv.variance)
- Tensor(shape=[2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[0.07589778, 0.08333334])'
- print(rv.entropy())
- Tensor(shape=[2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[-0.07641457,  0.        ])'
- print(rv.cdf(paddle.to_tensor(0.1)))
- Tensor(shape=[2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[0.17259926, 0.10000000])'
- print(rv.icdf(paddle.to_tensor(0.1)))
- Tensor(shape=[2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[0.05623737, 0.10000000])'
- rv1 = ContinuousBernoulli(paddle.to_tensor([0.2, 0.8]))
- rv2 = ContinuousBernoulli(paddle.to_tensor([0.7, 0.5]))
- print(rv1.kl_divergence(rv2))
- Tensor(shape=[2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[0.20103608, 0.07641447])'
