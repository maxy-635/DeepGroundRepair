2 api_name: paddle.distribution.Uniform
3 api_description: Represents a uniform distribution defined by low and high bounds,
  used to sample values evenly across the specified range.
4 api_signature: paddle.distribution.Uniform(low,high)
5 api_details: ''
6 api_parameters:
- low: Sets the lower bound of the uniform distribution.
- high: Sets the upper bound of the uniform distribution.
7 api_usage_example:
- import paddle
- from paddle.distribution import Uniform
- paddle.seed(2023)
- '# Without broadcasting, a single uniform distribution [3, 4]:'
- u1 = Uniform(low=3.0, high=4.0)
- '# 2 distributions [1, 3], [2, 4]'
- u2 = Uniform(low=[1.0, 2.0], high=[3.0, 4.0])
- '# 4 distributions'
- u3 = Uniform(low=[[1.0, 2.0], [3.0, 4.0]],
- '            high=[[1.5, 2.5], [3.5, 4.5]])'
- '...'
- '# With broadcasting:'
- u4 = Uniform(low=3.0, high=[5.0, 6.0, 7.0])
- '# Complete example'
- value_tensor = paddle.to_tensor([0.8], dtype="float32")
- uniform = Uniform([0.], [2.])
- sample = uniform.sample([2])
- '# a random tensor created by uniform distribution with shape: [2, 1]'
- entropy = uniform.entropy()
- print(entropy)
- Tensor(shape=[1], dtype=float32, place=Place(cpu), stop_gradient=True,
