2 api_name: paddle.distribution.IndependentTransform
3 api_description: Wraps a base transform and treats some of its rightmost batch dimensions
  as event dimensions, so the transform operates over grouped outputs rather than
  independent scalar batches.
4 api_signature: paddle.distribution.IndependentTransform(base,reinterpreted_batch_rank)
5 api_details: ''
6 api_parameters:
- base: Specifies the underlying transformation to wrap and apply independently.
- reinterpreted_batch_rank: Sets how many rightmost batch dimensions are treated as
    event dimensions.
7 api_usage_example:
- import paddle
- x = paddle.to_tensor([[1., 2., 3.], [4., 5., 6.]])
- '# Exponential transform with event_rank = 1'
- multi_exp = paddle.distribution.IndependentTransform(
- '    paddle.distribution.ExpTransform(), 1)'
- print(multi_exp.forward(x))
- Tensor(shape=[2, 3], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[2.71828175  , 7.38905621  , 20.08553696 ],'
- '[54.59814835 , 148.41316223, 403.42880249]])'
- print(multi_exp.forward_log_det_jacobian(x))
- Tensor(shape=[2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[6. , 15.])'
8 api_shape: {}
