2 api_name: paddle.distribution.Beta
3 api_description: Represents a Beta distribution defined by alpha and beta parameters,
  used to model probabilities or proportions on the interval [0, 1].
4 api_signature: '"Beta(alpha,beta)"'
5 api_details: ''
6 api_parameters:
- alpha: Controls the Beta distribution’s first shape parameter and must be positive;
    supports broadcasting and batched independent distributions.
- beta: Controls the Beta distribution’s second shape parameter and must be positive;
    supports broadcasting and batched independent distributions.
7 api_usage_example:
- import paddle
- '# scale input'
- beta = paddle.distribution.Beta(alpha=0.5, beta=0.5)
- print(beta.mean)
- Tensor(shape=[], dtype=float32, place=Place(cpu), stop_gradient=True,
- 0.50000000)
- print(beta.variance)
- Tensor(shape=[], dtype=float32, place=Place(cpu), stop_gradient=True,
- 0.12500000)
- print(beta.entropy())
- Tensor(shape=[], dtype=float32, place=Place(cpu), stop_gradient=True,
- -0.24156499)
- '# tensor input with broadcast'
- beta = paddle.distribution.Beta(alpha=paddle.to_tensor([0.2, 0.4]), beta=0.6)
- print(beta.mean)
- Tensor(shape=[2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[0.25000000, 0.40000001])'
- print(beta.variance)
- Tensor(shape=[2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[0.10416666, 0.12000000])'
- print(beta.entropy())
- Tensor(shape=[2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[-1.91923141, -0.38095081])'
