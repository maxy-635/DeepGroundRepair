2 api_name: paddle.distribution.Gamma
3 api_description: Represents a Gamma distribution parameterized by concentration
  (alpha) and rate (beta), providing probability calculations and sampling for positive
  continuous values.
4 api_signature: '"paddle.distribution.Gamma(concentration,rate)"'
5 api_details: ''
6 api_parameters:
- concentration: Shapes the Gamma distribution and must be positive, with broadcasting
    support for batched independent distributions.
- rate: Controls the Gamma distribution’s inverse scale and must be positive, with
    broadcasting support for batched independent distributions.
7 api_usage_example:
- import paddle
- '# scale input'
- gamma = paddle.distribution.Gamma(0.5, 0.5)
- print(gamma.mean)
