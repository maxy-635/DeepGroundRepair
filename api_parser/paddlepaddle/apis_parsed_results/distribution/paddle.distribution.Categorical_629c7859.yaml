2 api_name: paddle.distribution.Categorical
3 api_description: Represents a discrete distribution over K categories, allowing
  you to specify and sample category probabilities for a categorical random variable.
4 api_signature: paddle.distribution.Categorical(logits)
5 api_details: ''
6 api_parameters:
- logits: Supplies the unnormalized log-probability scores used to define the categorical
    distribution.
