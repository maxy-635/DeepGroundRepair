2 api_name: paddle.distribution.TransformedDistribution
3 api_description: Wraps a base distribution and applies a sequence of transforms
  to produce a new transformed distribution.
4 api_signature: paddle.distribution.TransformedDistribution(base,transforms)
5 api_details: ''
6 api_parameters:
- base: The underlying distribution that is transformed to define the final distribution.
- transforms: An ordered sequence of transforms applied to the base distribution.
