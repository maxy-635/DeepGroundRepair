2 api_name: paddle.distribution.Normal
3 api_description: Represents a Normal (Gaussian) distribution parameterized by location
  and scale, and provides methods for sampling, computing probabilities, and evaluating
  distribution statistics.
4 api_signature: paddle.distribution.Normal(loc,scale)
5 api_details: ''
6 api_parameters:
- loc: Sets the mean of the normal distribution.
- scale: Sets the standard deviation of the normal distribution.
7 api_usage_example:
- import paddle
- from paddle.distribution import Normal
- '# Define a single scalar Normal distribution.'
- dist = Normal(loc=0., scale=3.)
- '# Define a batch of two scalar valued Normals.'
- '# The first has mean 1 and standard deviation 11, the second 2 and 22.'
- dist = Normal(loc=[1., 2.], scale=[11., 22.])
- '# Get 3 samples, returning a 3 x 2 tensor.'
- dist.sample([3])
- '# Define a batch of two scalar valued Normals.'
- '# Both have mean 1, but different standard deviations.'
- dist = Normal(loc=1., scale=[11., 22.])
- '# Complete example'
- value_tensor = paddle.to_tensor([0.8], dtype="float32")
- normal_a = Normal([0.], [1.])
- normal_b = Normal([0.5], [2.])
- sample = normal_a.sample([2])
- '# a random tensor created by normal distribution with shape: [2, 1]'
- entropy = normal_a.entropy()
- print(entropy)
- Tensor(shape=[1], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[1.41893852])'
- lp = normal_a.log_prob(value_tensor)
- print(lp)
- Tensor(shape=[1], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[-1.23893857])'
- p = normal_a.probs(value_tensor)
- print(p)
- Tensor(shape=[1], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[0.28969154])'
