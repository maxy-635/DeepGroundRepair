2 api_name: paddle.nn.TripletMarginLoss
3 api_description: The paddle.nn.TripletMarginLoss measures the triplet loss between
  input, positive, and negative examples to evaluate relative similarity, requiring
  input tensors of shape (N, *) and a positive margin.
4 api_signature: paddle.nn.TripletMarginLoss(margin,p,swap,reduction)
5 api_details: ''
6 api_parameters:
- margin: The margin value for the triplet loss function.
- p: The norm degree for pairwise distance.
- swap: Determines if the negative distance is swapped with the distance between the
    positive and negative samples.
- reduction: Specifies how to aggregate the loss across the batch, with options 'none',
    'mean', or 'sum'.
7 api_usage_example:
- import paddle
- input = paddle.to_tensor([[1, 5, 3], [0, 3, 2], [1, 4, 1]], dtype=paddle.float32)
- positive= paddle.to_tensor([[5, 1, 2], [3, 2, 1], [3, -1, 1]], dtype=paddle.float32)
- negative = paddle.to_tensor([[2, 1, -3], [1, 1, -1], [4, -2, 1]], dtype=paddle.float32)
- triplet_margin_loss = paddle.nn.TripletMarginLoss(reduction='none')
- loss = triplet_margin_loss(input, positive, negative)
- print(loss)
