2 api_name: paddle.nn.CTCLoss
3 api_description: The paddle.nn.CTCLoss API computes Connectionist Temporal Classification
  (CTC) loss using the Warp-CTC library, integrating a native softmax activation to
  normalize input tensor values per row.
4 api_signature: paddle.nn.CTCLoss(blank)
5 api_details: ''
6 api_parameters:
- blank: Specifies the index of the blank label used in the CTC loss computation,
    which should be an integer within the range [0, num_classes + 1), with a default
    value of 0.
7 api_usage_example:
- '# declarative mode'
- import paddle
- '# length of the longest logit sequence'
- max_seq_length = 4
- '#length of the longest label sequence'
- max_label_length = 3
- '# number of logit sequences'
- batch_size = 2
- '# num'
- class_num = 3
- log_probs = paddle.to_tensor([[[4.17021990e-01, 7.20324516e-01, 1.14374816e-04],
- '                               [3.02332580e-01, 1.46755889e-01, 9.23385918e-02]],'
- '                              [[1.86260208e-01, 3.45560730e-01, 3.96767467e-01],'
- '                               [5.38816750e-01, 4.19194520e-01, 6.85219526e-01]],'
- '                              [[2.04452246e-01, 8.78117442e-01, 2.73875929e-02],'
- '                               [6.70467496e-01, 4.17304814e-01, 5.58689833e-01]],'
- '                              [[1.40386939e-01, 1.98101491e-01, 8.00744593e-01],'
- '                               [9.68261600e-01, 3.13424170e-01, 6.92322612e-01]],'
- '                              [[8.76389146e-01, 8.94606650e-01, 8.50442126e-02],'
- '                               [3.90547849e-02, 1.69830427e-01, 8.78142476e-01]]],
  dtype="float32")'
- labels = paddle.to_tensor([[1, 2, 2], [1, 2, 2]], dtype="int32")
- input_lengths = paddle.to_tensor([5, 5], dtype="int64")
- label_lengths = paddle.to_tensor([3, 3], dtype="int64")
- loss = paddle.nn.CTCLoss(blank=0, reduction='none')(log_probs, labels, input_lengths,
  label_lengths)
- print(loss)
