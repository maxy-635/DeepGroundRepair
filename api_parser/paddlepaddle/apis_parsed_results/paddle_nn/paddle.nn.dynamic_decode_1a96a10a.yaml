3 api_description: The paddle.nn.dynamic_decode API repeatedly calls decoder.step()
  until all sequences are marked as finished or a specified maximum number of steps
  is reached.
4 api_signature: paddle.nn.dynamic_decode(decoder,inits,max_step_num)
5 api_details: ''
