2 api_name: paddle.nn.BeamSearchDecoder
3 api_description: BeamSearchDecoder executes beam search strategy for sequence decoding
  by wrapping a cell to obtain probabilities, computing scores, and selecting candidate
  token ids at each step.
4 api_signature: paddle.nn.BeamSearchDecoder(cell,start_token,end_token,beam_size)
5 api_details: ''
6 api_parameters:
- cell: Defines the RNN cell or compatible object used for generating predictions
    in the decoder.
- start_token: Specifies the token id that indicates the beginning of the sequence
    to be decoded.
- end_token: Specifies the token id that marks the end of the sequence to be decoded.
- beam_size: Determines the number of beams or hypotheses maintained during the beam
    search process.
