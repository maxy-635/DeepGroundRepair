2 api_name: paddle.nn.AvgPool1D
3 api_description: paddle.nn.AvgPool1D performs 1D average pooling on input data in
  NCL format, producing output of shape [N, C, output_size].
4 api_signature: paddle.nn.AvgPool1D(kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
- kernel_size: Defines the size of the pooling window.
- stride: Specifies the step size for moving the pooling window; defaults to kernel_size
    if not set.
- padding: Determines the padding applied to the input, which can be specified as
    a string, integer, or list/tuple of integers.
7 api_usage_example: []
8 api_shape:
  input tensor shape: (N, Channel_in, Length_in)
  output tensor shape: (N, Channel_out, Length_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = Channel_in
    tensor length: Length_out = floor((Length_in + 2 * padding - kernel_size) / stride
      + 1)
