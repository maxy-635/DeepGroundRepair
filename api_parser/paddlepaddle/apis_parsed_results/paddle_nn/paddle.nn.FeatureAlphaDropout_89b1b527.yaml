3 api_description: paddle.nn.FeatureAlphaDropout randomly masks entire feature map
  channels to maintain self-normalizing properties, preserving input mean and standard
  deviation, and complements SELU activation by setting activations to negative saturation.
4 api_signature: paddle.nn.FeatureAlphaDropout(p)
5 api_details: ''
6 api_parameters:
- p: Specifies the probability of each unit being set to zero during dropout.
