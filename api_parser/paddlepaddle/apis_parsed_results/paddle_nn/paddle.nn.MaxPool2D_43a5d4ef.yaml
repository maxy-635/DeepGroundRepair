2 api_name: paddle.nn.MaxPool2D
3 api_description: The paddle.nn.MaxPool2D API performs 2D max pooling on input features
  in NCHW format, using specified kernel size, stride, and padding to reduce the spatial
  dimensions while retaining the maximum values in each pooling region.
4 api_signature: paddle.nn.MaxPool2D(kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
- kernel_size: Defines the size of the pooling window, either as a single integer
    for a square window or as a tuple/list for a rectangular window.
- stride: Specifies the step size for moving the pooling window, defaulting to the
    kernel size if not provided.
- padding: Determines the amount of padding applied to the input, which can be specified
    in various forms including 'valid', 'same', or as integers/tuples/lists for precise
    padding control.
7 api_usage_example: []
8 api_shape:
  input tensor shape: (N, Channel_in, Height_in, Width_in)
  output tensor shape: (N, Channel_out, Height_out, Width_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = Channel_in
    tensor height: Height_out = floor((Height_in + 2 * padding_height - kernel_size_height) / stride_height + 1)
    tensor width: Width_out = floor((Width_in + 2 * padding_width - kernel_size_width) / stride_width + 1)
