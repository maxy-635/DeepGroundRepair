2 api_name: paddle.nn.utils.spectral_norm
3 api_description: The paddle.nn.utils.spectral_norm API applies spectral normalization
  to a parameter, which stabilizes the training of neural networks by constraining
  the spectral norm of the weights.
4 api_signature: paddle.nn.utils.spectral_norm(layer,n_power_iterations)
5 api_details: ''
6 api_parameters:
- layer: Specifies the Paddle layer whose weights are to be normalized using spectral
    normalization.
- n_power_iterations: Defines the number of iterations to perform in the power method
    for computing the spectral norm.
7 api_usage_example:
- import paddle
- from paddle.nn import Conv2D
- from paddle.nn.utils import spectral_norm
- paddle.seed(2023)
- conv = Conv2D(3, 1, 3)
- sn_conv = spectral_norm(conv)
- print(sn_conv)
- Conv2D(3, 1, kernel_size=[3, 3], data_format=NCHW)
- '# Conv2D(3, 1, kernel_size=[3, 3], data_format=NCHW)'
- print(sn_conv.weight)
