2 api_name: paddle.nn.Conv2DTranspose
3 api_description: paddle.nn.Conv2DTranspose constructs a transposed 2D convolution
  layer that processes input tensors in NCHW format, using specified filters, dilations,
  strides, and paddings, with optional bias and activation.
4 api_signature: paddle.nn.Conv2DTranspose(in_channels,out_channels,kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
- in_channels: Specifies the number of channels in the input image.
- out_channels: Determines the number of channels produced by the convolution operation.
- kernel_size: Defines the size of the convolutional kernel, either as a single integer
    for a square kernel or a tuple for different dimensions.
- stride: Sets the step size for traversing the input image, either as a single integer
    or a tuple for different dimensions.
- padding: Specifies the padding strategy or size applied to the input image, with
    multiple formats available including strings, integers, lists, or tuples.
7 api_usage_example: []
8 api_shape:
  input tensor shape: (N, Channel_in, Height_in, Width_in)
  output tensor shape: (N, Channel_out, Height_out, Width_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = out_channels
    tensor height: Height_out = (Height_in - 1) * stride_height - 2 * padding_height + kernel_size_height + output_padding_height
    tensor width: Width_out = (Width_in - 1) * stride_width - 2 * padding_width + kernel_size_width + output_padding_width
