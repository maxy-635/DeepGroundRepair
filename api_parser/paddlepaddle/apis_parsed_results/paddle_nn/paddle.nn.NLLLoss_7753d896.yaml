2 api_name: paddle.nn.NLLLoss
3 api_description: paddle.nn.NLLLoss computes the negative log likelihood loss for
  classification tasks with multiple classes.
4 api_signature: paddle.nn.NLLLoss(ignore_index,reduction)
5 api_details: ''
6 api_parameters:
- ignore_index: This parameter specifies a target value that should be ignored in
    the computation of the input gradient.
- reduction: This parameter determines how the loss is averaged, with options 'none',
    'mean', or 'sum', affecting whether no reduction, mean reduction, or sum reduction
    is applied.
