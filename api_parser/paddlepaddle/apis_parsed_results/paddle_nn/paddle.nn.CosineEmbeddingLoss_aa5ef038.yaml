2 api_name: paddle.nn.CosineEmbeddingLoss
3 api_description: The paddle.nn.CosineEmbeddingLoss API constructs a callable object
  to compute the cosine embedding loss between two input predictions and target labels,
  indicating similarity (label 1) or dissimilarity (label 0), useful for learning
  embeddings or semi-supervised learning.
4 api_signature: paddle.nn.CosineEmbeddingLoss(margin)
5 api_details: ''
6 api_parameters:
- margin: Specifies the threshold for determining whether the cosine similarity between
    two inputs is considered similar or dissimilar, with a suggested range of 0 to
    0.5 and a default of 0.
7 api_usage_example:
- import paddle
- input1 = paddle.to_tensor([[1.6, 1.2, -0.5], [3.2, 2.6, -5.8]], 'float32')
- input2 = paddle.to_tensor([[0.5, 0.5, -1.8], [2.3, -1.4, 1.1]], 'float32')
- label = paddle.to_tensor([1, -1], 'int64')
- cosine_embedding_loss = paddle.nn.CosineEmbeddingLoss(margin=0.5, reduction='mean')
- output = cosine_embedding_loss(input1, input2, label)
- print(output)
