2 api_name: paddle.nn.AvgPool3D
3 api_description: The paddle.nn.AvgPool3D API performs 3D average pooling on input
  features in NCDHW format, using specified kernel size, stride, and padding parameters.
4 api_signature: paddle.nn.AvgPool3D(kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
- kernel_size: Specifies the size of the pooling kernel, which can be a single integer
    for a cubic kernel or a tuple/list of three integers for different dimensions.
- stride: Determines the step size for the pooling operation, which can be a single
    integer or a tuple/list of three integers for different dimensions; defaults to
    the kernel_size if not provided.
- padding: Defines the padding added to each dimension of the input, allowing control
    over the spatial size of the output.
7 api_usage_example: []
8 api_shape:
  input tensor shape: (N, Channel_in, Depth_in, Height_in, Width_in)
  output tensor shape: (N, Channel_out, Depth_out, Height_out, Width_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = Channel_in
    tensor depth: Depth_out = floor((Depth_in + 2 * padding_depth - kernel_size_depth) / stride_depth + 1)
    tensor height: Height_out = floor((Height_in + 2 * padding_height - kernel_size_height) / stride_height + 1)
    tensor width: Width_out = floor((Width_in + 2 * padding_width - kernel_size_width) / stride_width + 1)
