2 api_name: paddle.nn.AdaptiveLogSoftmaxWithLoss
3 api_description: AdaptiveLogSoftmaxWithLoss is an efficient training strategy for
  models with large output spaces, optimizing performance on imbalanced label distributions
  by approximating softmax, particularly effective for tasks like natural language
  modeling.
4 api_signature: paddle.nn.AdaptiveLogSoftmaxWithLoss(in_features,n_class
