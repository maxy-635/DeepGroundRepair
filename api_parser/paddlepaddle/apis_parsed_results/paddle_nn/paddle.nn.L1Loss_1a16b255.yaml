2 api_name: paddle.nn.L1Loss
3 api_description: The paddle.nn.L1Loss API constructs a callable object to compute
  the L1 Loss between input and label.
4 api_signature: paddle.nn.L1Loss(reduction)
5 api_details: ''
6 api_parameters:
- reduction: Specifies how the computed loss should be aggregated, with options 'none',
    'mean', or 'sum', where 'none' returns the loss as is, 'mean' averages it, and
    'sum' adds it up; defaults to 'mean'.
7 api_usage_example:
- import paddle
- input = paddle.to_tensor([[1.5, 0.8], [0.2, 1.3]])
- label = paddle.to_tensor([[1.7, 1], [0.4, 0.5]])
- l1_loss = paddle.nn.L1Loss()
- output = l1_loss(input, label)
- print(output)
- Tensor(shape=[], dtype=float32, place=Place(cpu), stop_gradient=True,
- 0.34999999)
- l1_loss = paddle.nn.L1Loss(reduction='sum')
- output = l1_loss(input, label)
- print(output)
- Tensor(shape=[], dtype=float32, place=Place(cpu), stop_gradient=True,
- 1.39999998)
- l1_loss = paddle.nn.L1Loss(reduction='none')
- output = l1_loss(input, label)
- print(output)
- Tensor(shape=[2, 2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[0.20000005, 0.19999999],'
- '[0.20000000, 0.79999995]])'
