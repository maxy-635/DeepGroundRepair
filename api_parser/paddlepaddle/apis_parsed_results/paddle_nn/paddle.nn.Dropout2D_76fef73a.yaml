2 api_name: paddle.nn.Dropout2D
3 api_description: paddle.nn.Dropout2D randomly zeroes out entire channels in a 4D
  input tensor with shape NCHW, independently on each forward pass, based on a given
  probability p, to promote feature map independence.
4 api_signature: paddle.nn.Dropout2D(p)
5 api_details: ''
6 api_parameters:
- p: Defines the likelihood that each element in the input will be randomly set to
    zero during training.
7 api_usage_example:
- import paddle
- paddle.seed(100)
- x = paddle.rand([2, 2, 1, 3], dtype="float32")
- print(x)
- Tensor(shape=[2, 2, 1, 3], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[[[0.55355281, 0.20714243, 0.01162981]],'
- '[[0.51577556, 0.36369765, 0.26091650]]],'
- '[[[0.18905126, 0.56219709, 0.00808361]],'
- '[[0.78120756, 0.32112977, 0.90572405]]]])'
- m = paddle.nn.Dropout2D(p=0.5)
- y_train = m(x)
- print(y_train)
