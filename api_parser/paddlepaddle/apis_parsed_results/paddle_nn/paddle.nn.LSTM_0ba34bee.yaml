2 api_name: paddle.nn.LSTM
3 api_description: paddle.nn.LSTM processes input sequences and initial states to
  produce output sequences and final states using a multilayer LSTM architecture.
4 api_signature: paddle.nn.LSTM(input_size,hidden_size,num_layers,dropout)
5 api_details: ''
6 api_parameters:
- input_size: Specifies the dimensionality of the input features for the first LSTM
    layer.
- hidden_size: Defines the number of features in the hidden state for each LSTM layer.
- num_layers: Indicates how many stacked LSTM layers are in the model, with a default
    of 1.
- dropout: Sets the probability of dropping out units between LSTM layers to prevent
    overfitting, ranging from 0 to 1, with a default of 0.
