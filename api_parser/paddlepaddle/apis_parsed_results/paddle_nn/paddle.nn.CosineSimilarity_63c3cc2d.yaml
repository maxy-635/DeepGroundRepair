2 api_name: paddle.nn.CosineSimilarity
3 api_description: Computes the cosine similarity between two tensors along a specified
  axis.
4 api_signature: paddle.nn.CosineSimilarity(axis,eps)
5 api_details: ''
6 api_parameters:
- axis: Specifies the dimension along which the cosine similarity is computed, with
    a default value of 1.
- eps: Defines a small constant added to prevent division by zero during computation,
    with a default value of 1e-8.
7 api_usage_example:
- import paddle
- import paddle.nn as nn
- x1 = paddle.to_tensor([[1., 2., 3.],
- '                       [2., 3., 4.]], dtype="float32")'
- x2 = paddle.to_tensor([[8., 3., 3.],
- '                       [2., 3., 4.]], dtype="float32")'
- cos_sim_func = nn.CosineSimilarity(axis=0)
- result = cos_sim_func(x1, x2)
- print(result)
