2 api_name: paddle.nn.InstanceNorm3D
3 api_description: InstanceNorm3D applies instance normalization to 5D input tensors,
  normalizing each channel of 3D data independently within a mini-batch, enhancing
  fast style transfer.
4 api_signature: paddle.nn.InstanceNorm3D(num_features,epsilon)
5 api_details: ''
6 api_parameters:
- num_features: Specifies the number of input tensor channels for normalization.
- epsilon: Ensures numerical stability by adding a small constant to the denominator.
7 api_usage_example:
