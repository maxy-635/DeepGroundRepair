2 api_name: paddle.nn.GLU
3 api_description: GLU (Gated Linear Unit) applies a gating mechanism to the input,
  splitting it into two halves and returning the element-wise product of one half
  and the sigmoid activation of the other.
4 api_signature: paddle.nn.GLU(axis)
5 api_details: ''
6 api_parameters:
- axis: Specifies the axis along which the input tensor is split, with a default value
    of -1 and acceptable range [-D, D).
