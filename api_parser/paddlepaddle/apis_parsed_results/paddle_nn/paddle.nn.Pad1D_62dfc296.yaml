2 api_name: paddle.nn.Pad1D
3 api_description: Pad1D is a PaddlePaddle API that pads a 1D tensor based on specified
  padding, mode, and value, with restrictions on padding size when using the 'reflect'
  mode.
4 api_signature: paddle.nn.Pad1D(padding,mode)
5 api_details: ''
6 api_parameters:
- padding: Specifies the size of the padding to be applied to the left and right sides,
    either as a single int or as a tuple of two ints for asymmetric padding.
- mode: Determines the method of padding, with options including 'constant' for a
    fixed value, 'reflect' to mirror the edge values, 'replicate' to extend the edge
    values, and 'circular' to wrap around the values.
7 api_usage_example:
- import paddle
- import paddle.nn as nn
- input_shape = (1, 2, 3)
- pad = [1, 2]
- data = paddle.arange(paddle.prod(paddle.to_tensor(input_shape)), dtype="float32").reshape(input_shape)
  + 1
- my_pad = nn.Pad1D(padding=pad, mode="constant")
- result = my_pad(data)
- print(result)
- Tensor(shape=[1, 2, 6], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[[0., 1., 2., 3., 0., 0.],'
- '[0., 4., 5., 6., 0., 0.]]])'
8 api_shape: null
