2 api_name: paddle.nn.initializer.Bilinear
3 api_description: The paddle.nn.initializer.Bilinear API is used to initialize weights
  for transposed convolution layers to perform upsampling of feature maps by an integer
  factor.
4 api_signature: ''
5 api_details: ''
6 api_parameters: []
7 api_usage_example:
- import math
- import paddle
- import paddle.nn as nn
- from paddle.regularizer import L2Decay
- factor = 2
- C = 2
