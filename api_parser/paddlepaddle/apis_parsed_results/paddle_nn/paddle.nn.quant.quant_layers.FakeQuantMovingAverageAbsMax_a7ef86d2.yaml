    update the quantization scale.
- bit_length: An integer that determines the number of bits to use for quantization.
- dtype: The data type for the output of the quantized layer, typically 'float32'
    or 'int8'.
- quant_on_cpu: A boolean indicating whether to perform quantization on the CPU instead
    of the default device.
- quant_bits: An integer specifying the number of bits used for quantization, typically
    8 or 16.
