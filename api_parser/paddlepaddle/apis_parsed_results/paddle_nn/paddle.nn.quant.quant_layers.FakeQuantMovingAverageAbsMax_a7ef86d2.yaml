2 api_name: paddle.nn.quant.quant_layers.FakeQuantMovingAverageAbsMax
3 api_description: The FakeQuantMovingAverageAbsMax layer performs quantization and
  dequantization using a moving average of absolute maximum values, optimizing the
  representation of floating-point numbers in a reduced precision format.
4 api_signature: paddle.nn.quant.quant_layers.FakeQuantMovingAverageAbsMax(moving_rate,quant_bits)
5 api_details: ''
6 api_parameters:
- name: A string specifying the name of the layer.
