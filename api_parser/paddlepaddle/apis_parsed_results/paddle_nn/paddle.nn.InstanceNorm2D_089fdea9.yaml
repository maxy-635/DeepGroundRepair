2 api_name: paddle.nn.InstanceNorm2D
3 api_description: paddle.nn.InstanceNorm2D normalizes a 4D input tensor across each
  channel for each instance in a mini-batch, facilitating style transfer by reducing
  internal covariate shift.
4 api_signature: paddle.nn.InstanceNorm2D(num_features,epsilon,momentum)
5 api_details: ''
6 api_parameters:
- num_features: Specifies the number of input channels that the InstanceNorm2D layer
    will normalize.
- epsilon: Ensures numerical stability by adding a small constant to the variance
    denominator.
- momentum: Determines the rate at which the moving averages of mean and variance
    are updated.
7 api_usage_example:
- import paddle
- paddle.seed(100)
- x = paddle.rand((2, 2, 2, 3))
- instance_norm = paddle.nn.InstanceNorm2D(2)
- instance_norm_out = instance_norm(x)
- print(instance_norm_out)
