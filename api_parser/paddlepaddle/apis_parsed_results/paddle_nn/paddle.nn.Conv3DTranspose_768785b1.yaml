2 api_name: paddle.nn.Conv3DTranspose
3 api_description: paddle.nn.Conv3DTranspose is a 3D transposed convolution layer
  that computes the output using input, filters, dilations, strides, and paddings
  in NCDHW format. It supports optional bias addition and activation functions.
4 api_signature: paddle.nn.Conv3DTranspose(in_channels,out_channels,kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
- in_channels: Specifies the number of input channels for the 3D transposed convolution.
- out_channels: Determines the number of output channels generated by the 3D transposed
    convolution.
- kernel_size: Defines the size of the convolutional kernel, either as a single integer
    or a tuple of three integers for depth, height, and width.
- stride: Sets the stride of the transposed convolution, either as a single integer
    or a tuple of three integers for depth, height, and width.
- padding: Specifies the padding strategy or size for each spatial dimension, allowing
    for various forms including strings, integers, or tuples/lists of integers.
7 api_usage_example: []
8 api_shape:
  input tensor shape: (N, Channel_in, Depth_in, Height_in, Width_in)
  output tensor shape: (N, Channel_out, Depth_out, Height_out, Width_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = out_channels
    tensor depth: Depth_out = (Depth_in - 1) * stride_depth - 2 * padding_depth + kernel_size_depth + output_padding_depth
    tensor height: Height_out = (Height_in - 1) * stride_height - 2 * padding_height + kernel_size_height + output_padding_height
    tensor width: Width_out = (Width_in - 1) * stride_width - 2 * padding_width + kernel_size_width + output_padding_width
