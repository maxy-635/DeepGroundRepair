2 api_name: paddle.nn.MaxPool3D
3 api_description: paddle.nn.MaxPool3D performs 3D max pooling on input features in
  NCDHW format, using specified kernel size, stride, and padding, to reduce spatial
  dimensions while retaining the most significant features.
4 api_signature: paddle.nn.MaxPool3D(kernel_size,stride,padding)
5 api_details: ''
6 api_parameters:
- kernel_size: Defines the size of the pooling window, either as a single integer
    for a cubic window or a tuple/list of three integers for depth, height, and width.
- stride: Specifies the step size for moving the pooling window, either as a single
    integer for a cubic stride or a tuple/list of three integers for depth, height,
    and width, defaulting to kernel_size if not provided.
- padding: Determines the padding applied to the input, which can be a string ('valid'
    or 'same'), an integer, a tuple/list of three integers for each dimension, a tuple/list
    of six integers for each side, or a list of integer pairs for each dimension,
    with a default of 0.
7 api_usage_example: []
8 api_shape:
  input tensor shape: (N, Channel_in, Depth_in, Height_in, Width_in)
  output tensor shape: (N, Channel_out, Depth_out, Height_out, Width_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = Channel_in
    tensor depth: Depth_out = floor((Depth_in + 2 * padding_depth - kernel_size_depth) / stride_depth + 1)
    tensor height: Height_out = floor((Height_in + 2 * padding_height - kernel_size_height) / stride_height + 1)
    tensor width: Width_out = floor((Width_in + 2 * padding_width - kernel_size_width) / stride_width + 1)
