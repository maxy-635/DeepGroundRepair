2 api_name: paddle.broadcast_tensors
3 api_description: Broadcasts a list of tensors to a common shape using standard broadcasting
  rules.
4 api_signature: paddle.broadcast_tensors(input)
5 api_details: ''
6 api_parameters:
- input: A list or tuple of tensors to broadcast, all sharing the same supported data
    type and having rank no greater than 5.
7 api_usage_example:
- import paddle
- x1 = paddle.rand([1, 2, 3, 4]).astype('float32')
- x2 = paddle.rand([1, 2, 1, 4]).astype('float32')
- x3 = paddle.rand([1, 1, 3, 1]).astype('float32')
- out1, out2, out3 = paddle.broadcast_tensors(input=[x1, x2, x3])
- '# out1, out2, out3: tensors broadcasted from x1, x2, x3 with shape [1,2,3,4]'
8 api_shape: {}
