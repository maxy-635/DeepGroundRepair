2 api_name: paddle.atan2
3 api_description: Computes the element-wise arctangent of x divided by y, accounting
  for the correct quadrant.
4 api_signature: paddle.atan2(x,y)
5 api_details: ''
6 api_parameters:
- x: The input tensor whose element-wise values are used as the x-coordinates for
    computing the arctangent.
- y: The input tensor whose element-wise values are used as the y-coordinates for
    computing the arctangent, with the same data type as `x`.
7 api_usage_example:
- import paddle
- x = paddle.to_tensor([-1, +1, +1, -1]).astype('float32')
- x
- Tensor(shape=[4], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[-1,  1,  1, -1])'
- y = paddle.to_tensor([-1, -1, +1, +1]).astype('float32')
- y
- Tensor(shape=[4], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[-1,  -1,  1, 1])'
- out = paddle.atan2(x, y)
- out
- Tensor(shape=[4], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[-2.35619450,  2.35619450,  0.78539819, -0.78539819])'
