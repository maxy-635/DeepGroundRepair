2 api_name: paddle.enable_grad
3 api_description: Enables gradient tracking for operations in imperative mode so
  subsequent computations can be differentiated.
4 api_signature: ''
5 api_details: ''
6 api_parameters: []
7 api_usage_example:
- import paddle
- '# use as generator'
- x = paddle.to_tensor([1.], stop_gradient=False)
- 'with paddle.no_grad():'
- '    with paddle.enable_grad():'
- '        y = x * 2'
- assert(y.stop_gradient == False)
- y.backward()
- assert(x.grad is not None)
- '# use as decorator'
- '@paddle.enable_grad()'
- 'def double(x):'
- '    return x * 2'
- '...'
- 'with paddle.no_grad():'
- '    z = double(x)'
- '...'
- assert(z.stop_gradient == False)
8 api_shape: {}
