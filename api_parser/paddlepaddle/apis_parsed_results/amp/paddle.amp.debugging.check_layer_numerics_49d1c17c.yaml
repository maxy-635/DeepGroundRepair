2 api_name: paddle.amp.debugging.check_layer_numerics
3 api_description: Decorator that inspects a layer’s input and output tensors for
  numerical issues, helping detect invalid values during execution.
4 api_signature: paddle.amp.debugging.check_layer_numerics(func)
5 api_details: ''
6 api_parameters: []
7 api_usage_example:
- import paddle
- 'class MyLayer(paddle.nn.Layer):'
- '    def __init__(self, dtype):'
- '        super().__init__()'
- '        self._w = self.create_parameter([2, 3], dtype=dtype)'
- '        self._b = self.create_parameter([2, 3], dtype=dtype)'
- '    @paddle.amp.debugging.check_layer_numerics'
- '    def forward(self, x):'
- '        # return 1/x * self._w + self._b   open it you will see the error log'
- '        return x @ self._w + self._b'
- '...'
- dtype = 'float32'
- 'x = paddle.rand([10, 2, 2], dtype=dtype) # type: ignore[arg-type]'
- model = MyLayer(dtype)
- x[0] = float(0)
- loss = model(x)
- adam = paddle.optimizer.Adam(parameters=model.parameters())
- loss.backward()
- adam.step()
