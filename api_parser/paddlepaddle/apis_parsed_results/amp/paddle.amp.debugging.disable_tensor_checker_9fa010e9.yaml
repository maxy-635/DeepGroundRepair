2 api_name: paddle.amp.debugging.disable_tensor_checker
3 api_description: Disables tensor accuracy checking for Paddle AMP debugging, allowing
  model-level precision checks to be controlled with enable_tensor_checker(config).
4 api_signature: paddle.amp.debugging.disable_tensor_checker()
5 api_details: ''
6 api_parameters: []
7 api_usage_example:
- import paddle
- checker_config = paddle.amp.debugging.TensorCheckerConfig(enable=True, debug_mode=paddle.amp.debugging.DebugMode.CHECK_NAN_INF)
- paddle.amp.debugging.enable_tensor_checker(checker_config)
- x = paddle.to_tensor([1, 0, 3], place=paddle.CPUPlace(), dtype='float32', stop_gradient=False)
- y = paddle.to_tensor([0.2, 0, 0.5], place=paddle.CPUPlace(), dtype='float32')
- res = paddle.pow(x, y)
- paddle.autograd.backward(res, retain_graph=True)
- paddle.amp.debugging.disable_tensor_checker()
