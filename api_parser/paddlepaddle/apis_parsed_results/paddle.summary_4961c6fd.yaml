2 api_name: paddle.summary
3 api_description: Prints a string summary of the network architecture.
4 api_signature: paddle.summary(net,input_size)
5 api_details: ''
6 api_parameters:
- net: Specifies the Layer-based network to summarize.
- input_size: Defines the input tensor shape(s) used for summary generation.
- input: Provides example input data and overrides input_size and dtype.
7 api_usage_example:
- '# example 1: Single Input Demo'
- import paddle
- import paddle.nn as nn
- '# Define Network'
- 'class LeNet(nn.Layer):'
- '    def __init__(self, num_classes=10):'
- '        super().__init__()'
- '        self.num_classes = num_classes'
- '        self.features = nn.Sequential('
- '            nn.Conv2D(1, 6, 3, stride=1, padding=1),'
- '            nn.ReLU(),'
- '            nn.MaxPool2D(2, 2),'
- '            nn.Conv2D(6, 16, 5, stride=1, padding=0),'
- '            nn.ReLU(),'
- '            nn.MaxPool2D(2, 2))'
- '...'
- '        if num_classes > 0:'
- '            self.fc = nn.Sequential('
- '                nn.Linear(400, 120),'
- '                nn.Linear(120, 84),'
- '                nn.Linear(84, 10))'
- '...'
- '    def forward(self, inputs):'
- '        x = self.features(inputs)'
- '...'
- '        if self.num_classes > 0:'
- '            x = paddle.flatten(x, 1)'
- '            x = self.fc(x)'
- '        return x'
- '...'
- lenet = LeNet()
- params_info = paddle.summary(lenet, (1, 1, 28, 28))
- '---------------------------------------------------------------------------'
- 'Layer (type)       Input Shape          Output Shape         Param #'
- ===========================================================================
- Conv2D-1       [[1, 1, 28, 28]]      [1, 6, 28, 28]          60
- ReLU-1        [[1, 6, 28, 28]]      [1, 6, 28, 28]           0
- MaxPool2D-1     [[1, 6, 28, 28]]      [1, 6, 14, 14]           0
- Conv2D-2       [[1, 6, 14, 14]]     [1, 16, 10, 10]         2,416
- ReLU-2       [[1, 16, 10, 10]]     [1, 16, 10, 10]           0
- MaxPool2D-2    [[1, 16, 10, 10]]      [1, 16, 5, 5]            0
- Linear-1          [[1, 400]]            [1, 120]           48,120
- Linear-2          [[1, 120]]            [1, 84]            10,164
- Linear-3          [[1, 84]]             [1, 10]              850
- ===========================================================================
- 'Total params: 61,610'
- 'Trainable params: 61,610'
- 'Non-trainable params: 0'
- '---------------------------------------------------------------------------'
- 'Input size (MB): 0.00'
- 'Forward/backward pass size (MB): 0.11'
- 'Params size (MB): 0.24'
- 'Estimated Total Size (MB): 0.35'
- '---------------------------------------------------------------------------'
- print(params_info)
- '{''total_params'': 61610, ''trainable_params'': 61610}'
