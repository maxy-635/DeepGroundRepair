2 api_name: paddle.callbacks.ReduceLROnPlateau
3 api_description: Monitors a validation metric and reduces the learning rate by a
  set factor when it stops improving for a specified number of epochs.
4 api_signature: paddle.callbacks.ReduceLROnPlateau(monitor,factor,patience,mode,min_lr)
5 api_details: ''
6 api_parameters:
- monitor: Specifies the metric to track for detecting whether training has improved.
- factor: Sets how much to multiply the current learning rate by when it is reduced.
- patience: Defines how many epochs without improvement to wait before lowering the
    learning rate.
- mode: Chooses whether lower or higher monitored values count as improvement, or
    infers that automatically from the monitor name.
- min_lr: Sets the minimum learning rate allowed so reductions do not go below this
    bound.
7 api_usage_example:
- import paddle
- from paddle import Model
- from paddle.static import InputSpec
- from paddle.vision.models import LeNet
- from paddle.vision.datasets import MNIST
- from paddle.metric import Accuracy
- from paddle.nn.layer.loss import CrossEntropyLoss
- import paddle.vision.transforms as T
- sample_num = 200
- transform = T.Compose(
- '     [T.Transpose(), T.Normalize([127.5], [127.5])])'
- train_dataset = MNIST(mode='train', transform=transform)
- val_dataset = MNIST(mode='test', transform=transform)
- net = LeNet()
- optim = paddle.optimizer.Adam(
- '    learning_rate=0.001, parameters=net.parameters())'
- inputs = [InputSpec([None, 1, 28, 28], 'float32', 'x')]
- labels = [InputSpec([None, 1], 'int64', 'label')]
- model = Model(net, inputs=inputs, labels=labels)
- model.prepare(
- '    optim,'
- '    loss=CrossEntropyLoss(),'
- '    metrics=[Accuracy()])'
- callbacks = paddle.callbacks.ReduceLROnPlateau(patience=3, verbose=1)
- model.fit(train_dataset,
- '            val_dataset,'
- '            batch_size=64,'
- '            log_freq=200,'
- '            save_freq=10,'
- '            epochs=20,'
- '            callbacks=[callbacks])'
8 api_shape: {}
