2 api_name: paddle.diagonal
3 api_description: Returns the diagonals of an input tensor.
4 api_signature: paddle.diagonal(x,offset,axis1,axis2)
5 api_details: ''
6 api_parameters:
- x: The input tensor to extract diagonals from; it must be at least 2D and one of
    the supported data types.
- offset: Selects which diagonal of the input tensor to take.
- axis1: Specifies the first axis used to determine the diagonal.
- axis2: Specifies the second axis used to determine the diagonal.
7 api_usage_example:
- import paddle
- paddle.seed(2023)
- x = paddle.rand([2, 2, 3],'float32')
- print(x)
- Tensor(shape=[2, 2, 3], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[[0.86583614, 0.52014720, 0.25960937],'
- '[0.90525323, 0.42400089, 0.40641287]],'
- '[[0.97020894, 0.74437362, 0.51785129],'
- '[0.73292869, 0.97786582, 0.04315904]]])'
- out1 = paddle.diagonal(x)
- print(out1)
- Tensor(shape=[3, 2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[0.86583614, 0.73292869],'
- '[0.52014720, 0.97786582],'
- '[0.25960937, 0.04315904]])'
- out2 = paddle.diagonal(x, offset=0, axis1=2, axis2=1)
- print(out2)
- Tensor(shape=[2, 2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[0.86583614, 0.42400089],'
- '[0.97020894, 0.97786582]])'
- out3 = paddle.diagonal(x, offset=1, axis1=0, axis2=1)
- print(out3)
- Tensor(shape=[3, 1], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[0.90525323],'
- '[0.42400089],'
- '[0.40641287]])'
- out4 = paddle.diagonal(x, offset=0, axis1=1, axis2=2)
- print(out4)
- Tensor(shape=[2, 2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[0.86583614, 0.42400089],'
- '[0.97020894, 0.97786582]])'
