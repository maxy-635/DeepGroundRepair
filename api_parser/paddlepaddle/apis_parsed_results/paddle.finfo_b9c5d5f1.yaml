2 api_name: paddle.finfo
3 api_description: Returns an object describing the numerical properties of a floating-point
  paddle.dtype, similar to numpy.finfo.
4 api_signature: paddle.finfo(dtype)
5 api_details: ''
6 api_parameters:
- dtype: Specifies the numeric data type whose machine limits and precision information
    will be returned.
- type: Acts as an alias for `dtype` and behaves identically.
7 api_usage_example:
- import paddle
- finfo_float32 = paddle.finfo(paddle.float32)
- print(finfo_float32.min)
- '-3.4028234663852886e+38'
- print(finfo_float32.max)
- '3.4028234663852886e+38'
- print(finfo_float32.eps)
- '1.1920928955078125e-07'
- print(finfo_float32.resolution)
- 1e-06
- print(finfo_float32.smallest_normal)
- '1.1754943508222875e-38'
- print(finfo_float32.tiny)
- '1.1754943508222875e-38'
- print(finfo_float32.bits)
- '32'
- print(finfo_float32.dtype)
- float32
8 api_shape: {}
