2 api_name: paddle.set_printoptions
3 api_description: Configures how tensors are displayed when printed, such as precision,
  line width, and summarization options.
4 api_signature: paddle.set_printoptions(precision,threshold)
5 api_details: ''
6 api_parameters:
- precision: Sets how many digits are shown for floating-point numbers.
- threshold: Sets the maximum number of elements to print before summarizing output.
7 api_usage_example:
- import paddle
- paddle.seed(10)
- a = paddle.rand([10, 20])
- paddle.set_printoptions(4, 100, 3)
- print(a)
