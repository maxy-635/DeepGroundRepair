2 api_name: paddle.vision.transforms.adjust_brightness
3 api_description: Adjusts an image’s brightness by increasing or decreasing its pixel
  intensity.
4 api_signature: paddle.vision.transforms.adjust_brightness(img,brightness_factor)
5 api_details: ''
6 api_parameters:
- img: The image to adjust.
- brightness_factor: The non-negative factor used to change brightness, where 0 makes
    the image black, 1 leaves it unchanged, and values above 1 increase brightness.
