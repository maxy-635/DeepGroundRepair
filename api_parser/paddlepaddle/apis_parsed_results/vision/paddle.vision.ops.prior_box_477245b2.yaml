2 api_name: paddle.vision.ops.prior_box
3 api_description: Generates SSD prior boxes (anchor boxes) from feature map and image
  shapes for object detection.
4 api_signature: paddle.vision.ops.prior_box(input,image,min_sizes,max_sizes,aspect_ratios,variance,flip,clip,steps,offset,min_max_aspect_ratios_order,name)
5 api_details: ''
6 api_parameters:
- input: Provides the feature map tensor used to generate prior boxes.
- image: Provides the input image tensor that defines the spatial reference for prior
    boxes.
- min_sizes: Sets the minimum box sizes to generate at each feature location.
- max_sizes: Sets the optional maximum box sizes used to generate additional prior
    boxes.
- aspect_ratios: Specifies the aspect ratios used to create prior boxes of different
    shapes.
- variance: Defines the variance values encoded into each prior box.
- flip: Controls whether to include flipped versions of the specified aspect ratios.
- clip: Controls whether prior box coordinates are clipped to stay within image boundaries.
- steps: Sets the stride of prior boxes across width and height, or lets them be auto-computed
    when a step is zero.
- min_max_aspect_ratios_order: Controls whether boxes are ordered as min, max, then
    aspect ratios for Caffe compatibility.
- name: Optionally assigns a name to the operator for identification in the computation
    graph.
7 api_usage_example:
- import paddle
- input = paddle.rand((1, 3, 6, 9), dtype=paddle.float32)
- image = paddle.rand((1, 3, 9, 12), dtype=paddle.float32)
- box, var = paddle.vision.ops.prior_box(
- '    input=input,'
- '    image=image,'
- '    min_sizes=[2.0, 4.0],'
- '    clip=True,'
- '    flip=True)'
- '...'
8 api_shape: {}
