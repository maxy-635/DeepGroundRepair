2 api_name: paddle.vision.ops.generate_proposals
3 api_description: Generates region proposals from anchors, bounding-box deltas, and
  scores by ranking likely foreground boxes for detection training.
4 api_signature: paddle.vision.ops.generate_proposals(scores,bbox_deltas,img_size,anchors,variances,pre_nms_top_n,post_nms_top_n,nms_thresh,min_size)
5 api_details: ''
6 api_parameters:
- scores: Objectness scores for each anchor at every feature-map location.
- bbox_deltas: Predicted offsets used to adjust anchors into proposal boxes.
- img_size: Original image height and width for each batch item, used to clip proposals.
- anchors: Base anchor boxes laid out over the feature map.
- variances: Scaling factors that modulate how anchor offsets are decoded.
- pre_nms_top_n: Maximum number of top-scoring proposals to keep before NMS.
- post_nms_top_n: Maximum number of proposals to keep after NMS.
- nms_thresh: IoU threshold used to suppress overlapping proposals during NMS.
- min_size: Minimum proposal size required to keep a box.
7 api_usage_example:
- import paddle
- paddle.seed(2023)
- scores = paddle.rand((2,4,5,5), dtype=paddle.float32)
- bbox_deltas = paddle.rand((2, 16, 5, 5), dtype=paddle.float32)
- img_size = paddle.to_tensor([[224.0, 224.0], [224.0, 224.0]])
- anchors = paddle.rand((2,5,4,4), dtype=paddle.float32)
- variances = paddle.rand((2,5,10,4), dtype=paddle.float32)
- rois, roi_probs, roi_nums = paddle.vision.ops.generate_proposals(scores, bbox_deltas,
- '                img_size, anchors, variances, return_rois_num=True)'
- '>>>'
- print(rois, roi_probs, roi_nums)
