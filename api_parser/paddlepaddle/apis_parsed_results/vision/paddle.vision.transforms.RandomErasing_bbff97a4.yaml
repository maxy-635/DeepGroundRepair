2 api_name: paddle.vision.transforms.RandomErasing
3 api_description: Randomly erases a rectangular region in an image by replacing its
  pixels.
4 api_signature: paddle.vision.transforms.RandomErasing(prob,scale,ratio,value,inplace)
5 api_details: ''
6 api_parameters:
- prob: Sets the likelihood that the transform will erase the input image.
- scale: Defines the range of the erased region’s area as a fraction of the image
    area.
- ratio: Defines the allowed aspect ratio range for the erased region.
- value: Specifies what pixel values to fill the erased area with, either a constant,
    per-channel RGB values, or random values.
- inplace: Controls whether the input is modified in place or a new result is returned.
7 api_usage_example:
- import paddle
- fake_img = paddle.randn((1, 5, 5)).astype(paddle.float32)
- transform = paddle.vision.transforms.RandomErasing()
- result = transform(fake_img)
- '>>>'
- print(result)
