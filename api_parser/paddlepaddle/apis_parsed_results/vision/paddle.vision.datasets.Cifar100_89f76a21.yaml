2 api_name: paddle.vision.datasets.Cifar100
3 api_description: Loads and provides access to the CIFAR-100 image dataset, a 100-class
  dataset for image classification tasks.
4 api_signature: paddle.vision.datasets.Cifar100(mode,transform,download,backend)
5 api_details: ''
6 api_parameters:
- mode: Selects whether to load the training or test split, with `train` as the default.
- transform: Applies an optional image transform pipeline to each sample, or leaves
    images unchanged if `None`.
- download: Automatically downloads the dataset when the data files are missing if
    set to `True`.
- backend: Chooses the image output type, either PIL or OpenCV (`cv2`), or uses the
    global Paddle image backend when unset.
7 api_usage_example:
- '>>>'
- import itertools
- import paddle.vision.transforms as T
- from paddle.vision.datasets import Cifar100
- cifar100 = Cifar100()
- print(len(cifar100))
- '50000'
- 'for i in range(5):  # only show first 5 images'
- '    img, label = cifar100[i]'
- '    # do something with img and label'
- '    print(type(img), img.size, label)'
- '    # <class ''PIL.Image.Image''> (32, 32) 19'
- transform = T.Compose(
- '    ['
- '        T.Resize(64),'
- '        T.ToTensor(),'
- '        T.Normalize('
- '            mean=[0.5, 0.5, 0.5],'
- '            std=[0.5, 0.5, 0.5],'
- '            to_rgb=True,'
- '        ),'
- '    ]'
- )
- cifar100_test = Cifar100(
- '    mode="test",'
- '    transform=transform,  # apply transform to every image'
- '    backend="cv2",  # use OpenCV as image transform backend'
- )
- print(len(cifar100_test))
- '10000'
- 'for img, label in itertools.islice(iter(cifar100_test), 5):  # only show first
  5 images'
- '    # do something with img and label'
- '    print(type(img), img.shape, label)  # type: ignore'
- '    # <class ''paddle.Tensor''> [3, 64, 64] 49'
