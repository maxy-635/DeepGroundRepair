2 api_name: paddle.vision.datasets.VOC2012
3 api_description: Loads the VOC2012 semantic segmentation dataset, providing access
  to images and pixel-level labels with standard train/validation splits and optional
  preprocessing/transforms.
4 api_signature: paddle.vision.datasets.VOC2012(mode,transform,download,backend)
5 api_details: ''
6 api_parameters:
- mode: Selects whether the dataset is loaded in training or testing mode.
- transform: Applies the specified transform to each image, or leaves images unchanged
    if None.
- download: Automatically downloads the dataset when the data file is not already
    available.
- backend: Chooses the image output type and backend, either PIL or cv2, defaulting
    to Paddle's configured image backend.
7 api_usage_example:
- '>>>'
- import itertools
- import paddle.vision.transforms as T
- from paddle.vision.datasets import VOC2012
- voc2012 = VOC2012()
- print(len(voc2012))
- '2913'
- 'for i in range(5):  # only show first 5 images'
- '    img, label = voc2012[i]'
- '    # do something with img and label'
- '    print(type(img), img.size)'
- '    # <class ''PIL.JpegImagePlugin.JpegImageFile''> (500, 281)'
- '    print(type(label), label.size)'
- '    # <class ''PIL.PngImagePlugin.PngImageFile''> (500, 281)'
- transform = T.Compose(
- '    ['
- '        T.ToTensor(),'
- '        T.Normalize('
- '            mean=[0.5, 0.5, 0.5],'
- '            std=[0.5, 0.5, 0.5],'
- '            to_rgb=True,'
- '        ),'
- '    ]'
- )
- voc2012_test = VOC2012(
- '    mode="test",'
- '    transform=transform,  # apply transform to every image'
- '    backend="cv2",  # use OpenCV as image transform backend'
- )
- print(len(voc2012_test))
- '1464'
- 'for img, label in itertools.islice(iter(voc2012_test), 5):  # only show first 5
  images'
- '    # do something with img and label'
- '    print(type(img), img.shape) # type: ignore'
- '    # <class ''paddle.Tensor''> [3, 281, 500]'
- '    print(type(label), label.shape)'
- '    # <class ''numpy.ndarray''> (281, 500)'
