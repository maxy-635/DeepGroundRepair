2 api_name: paddle.vision.transforms.erase
3 api_description: Erase a selected region of an input image by replacing its pixels
  with a specified value.
4 api_signature: paddle.vision.transforms.erase(img,i,j,h,w)
5 api_details: ''
6 api_parameters:
- img: The image to modify, provided as a Tensor or NumPy array with the expected
    channel-first or channel-last shape.
- i: The y-coordinate of the top-left corner of the region to erase.
- j: The x-coordinate of the top-left corner of the region to erase.
- h: The height of the rectangular region to erase.
- w: The width of the rectangular region to erase.
- v: The replacement value used to fill the erased region, with NumPy array form required
    for NumPy array or PIL image inputs.
7 api_usage_example:
- import paddle
- paddle.seed(2023)
- fake_img = paddle.randn((3, 2, 4)).astype(paddle.float32)
- print(fake_img)
- Tensor(shape=[3, 2, 4], dtype=float32, place=Place(cpu), stop_gradient=True,
