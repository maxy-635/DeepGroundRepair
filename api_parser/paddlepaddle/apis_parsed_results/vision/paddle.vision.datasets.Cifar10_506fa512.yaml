2 api_name: paddle.vision.datasets.Cifar10
3 api_description: Loads and provides access to the CIFAR-10 image dataset with 10
  categories for training and evaluation.
4 api_signature: paddle.vision.datasets.Cifar10(data_file,mode,transform,download,backend)
5 api_details: ''
6 api_parameters:
- data_file: Specifies the path to the CIFAR-10 data file, or can be left `None` when
    `download` is `True`.
- mode: Chooses whether to load the training set or the test set.
- transform: Applies an optional transform pipeline to each image.
- download: Automatically downloads the dataset when `data_file` is `None`.
- backend: Sets the image representation backend to either `pil` or `cv2`.
7 api_usage_example:
- '>>>'
- import itertools
- import paddle.vision.transforms as T
- from paddle.vision.datasets import Cifar10
- cifar10 = Cifar10()
- print(len(cifar10))
- '50000'
- 'for i in range(5):  # only show first 5 images'
- '    img, label = cifar10[i]'
- '    # do something with img and label'
- '    print(type(img), img.size, label)'
- '    # <class ''PIL.Image.Image''> (32, 32) 6'
- transform = T.Compose(
- '    ['
- '        T.Resize(64),'
- '        T.ToTensor(),'
- '        T.Normalize('
- '            mean=[0.5, 0.5, 0.5],'
- '            std=[0.5, 0.5, 0.5],'
- '            to_rgb=True,'
- '        ),'
- '    ]'
- )
- cifar10_test = Cifar10(
- '    mode="test",'
- '    transform=transform,  # apply transform to every image'
- '    backend="cv2",  # use OpenCV as image transform backend'
- )
- print(len(cifar10_test))
- '10000'
- 'for img, label in itertools.islice(iter(cifar10_test), 5):  # only show first 5
  images'
- '    # do something with img and label'
- '    print(type(img), img.shape, label)  # type: ignore'
- '    # <class ''paddle.Tensor''> [3, 64, 64] 3'
8 api_shape: {}
