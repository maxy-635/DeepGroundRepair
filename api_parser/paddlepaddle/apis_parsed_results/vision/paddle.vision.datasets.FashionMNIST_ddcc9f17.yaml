2 api_name: paddle.vision.datasets.FashionMNIST
3 api_description: Loads the Fashion-MNIST image dataset and provides access to training
  and test samples for use in computer vision tasks.
4 api_signature: paddle.vision.datasets.FashionMNIST(mode,transform,download,backend)
5 api_details: ''
6 api_parameters:
- mode: Chooses whether to load the training set or the test set, defaulting to train.
- transform: Applies an optional transform to each image before it is returned.
- download: Automatically downloads the dataset if the local image and label paths
    are not already set.
- backend: Controls the image type returned, either `PIL.Image` or `numpy.ndarray`,
    or uses the global Paddle image backend if unset.
7 api_usage_example:
- import itertools
- import paddle.vision.transforms as T
- from paddle.vision.datasets import FashionMNIST
- fashion_mnist = FashionMNIST()
- print(len(fashion_mnist))
- '60000'
- 'for i in range(5):  # only show first 5 images'
- '    img, label = fashion_mnist[i]'
- '    # do something with img and label'
- '    print(type(img), img.size, label)'
- '    # <class ''PIL.Image.Image''> (28, 28) [9]'
- transform = T.Compose(
- '    ['
- '        T.ToTensor(),'
- '        T.Normalize('
- '            mean=[127.5],'
- '            std=[127.5],'
- '        ),'
- '    ]'
- )
- fashion_mnist_test = FashionMNIST(
- '    mode="test",'
- '    transform=transform,  # apply transform to every image'
- '    backend="cv2",  # use OpenCV as image transform backend'
- )
- print(len(fashion_mnist_test))
- '10000'
- 'for img, label in itertools.islice(iter(fashion_mnist_test), 5):  # only show first
  5 images'
- '    # do something with img and label'
- '    print(type(img), img.shape, label)  # type: ignore'
- '    # <class ''paddle.Tensor''> [1, 28, 28] [9]'
