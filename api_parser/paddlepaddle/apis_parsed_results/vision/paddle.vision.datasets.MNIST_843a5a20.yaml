2 api_name: paddle.vision.datasets.MNIST
3 api_description: Loads and provides access to the MNIST handwritten digits dataset
  for training and evaluation.
4 api_signature: paddle.vision.datasets.MNIST(image_path,label_path,mode,transform,download,backend)
5 api_details: ''
6 api_parameters:
- image_path: Specifies the path to the image file, or can be omitted when `download`
    is enabled.
- label_path: Specifies the path to the label file, or can be omitted when `download`
    is enabled.
- mode: Selects whether to load the training or test split, with `train` as the default.
- transform: Applies an optional transform to each image before returning it.
- download: Automatically downloads the dataset when `image_path` and `label_path`
    are not provided.
- backend: Chooses the image output type, either `PIL.Image` or `numpy.ndarray`, with
    the default taken from `paddle.vision.get_image_backend`.
7 api_usage_example:
- import itertools
- import paddle.vision.transforms as T
- from paddle.vision.datasets import MNIST
- mnist = MNIST()
- print(len(mnist))
- '60000'
- 'for i in range(5):  # only show first 5 images'
- '    img, label = mnist[i]'
- '    # do something with img and label'
- '    print(type(img), img.size, label)'
- '    # <class ''PIL.Image.Image''> (28, 28) [5]'
- transform = T.Compose(
- '    ['
- '        T.ToTensor(),'
- '        T.Normalize('
- '            mean=[127.5],'
- '            std=[127.5],'
- '        ),'
- '    ]'
- )
- mnist_test = MNIST(
- '    mode="test",'
- '    transform=transform,  # apply transform to every image'
- '    backend="cv2",  # use OpenCV as image transform backend'
- )
- print(len(mnist_test))
- '10000'
- 'for img, label in itertools.islice(iter(mnist_test), 5):  # only show first 5 images'
- '    # do something with img and label'
- '    print(type(img), img.shape, label)  # type: ignore'
- '    # <class ''paddle.Tensor''> [1, 28, 28] [7]'
8 api_shape: {}
