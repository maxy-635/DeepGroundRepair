2 api_name: paddle.argsort
3 api_description: Returns the indices that sort a tensor along a specified axis,
  in ascending order by default or descending when requested.
4 api_signature: paddle.argsort(x,axis,descending,stable)
5 api_details: ''
6 api_parameters:
- x: The input tensor whose elements are sorted and whose index order is returned.
- axis: The axis along which to sort the tensor and compute indices.
- descending: Whether to sort values in descending order instead of ascending order.
- stable: Whether to use a stable sort that preserves the order of equal elements.
7 api_usage_example:
- import paddle
- x = paddle.to_tensor([[[5,8,9,5],
- '                       [0,0,1,7],'
- '                       [6,9,2,4]],'
- '                      [[5,2,4,2],'
- '                       [4,7,7,9],'
- '                       [1,7,0,6]]],'
- '                     dtype=''float32'')'
- out1 = paddle.argsort(x, axis=-1)
- out2 = paddle.argsort(x, axis=0)
- out3 = paddle.argsort(x, axis=1)
- print(out1)
