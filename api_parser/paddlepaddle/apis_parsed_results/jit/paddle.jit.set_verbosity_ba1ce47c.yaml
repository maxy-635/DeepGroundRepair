2 api_name: paddle.jit.set_verbosity
3 api_description: Sets the logging verbosity for dygraph-to-static graph conversion,
  with an option to also print logs to stdout.
4 api_signature: paddle.jit.set_verbosity(level)
5 api_details: ''
6 api_parameters:
- level: Sets how much logging detail Paddle JIT outputs, with higher values producing
    more verbose logs and 0 disabling logging.
7 api_usage_example:
- import os
- import paddle
