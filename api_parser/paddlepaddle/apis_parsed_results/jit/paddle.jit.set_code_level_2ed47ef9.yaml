2 api_name: paddle.jit.set_code_level
3 api_description: Sets the code-printing level for a specific AST transformer and
  can also print the code to stdout.
4 api_signature: paddle.jit.set_code_level(level)
5 api_details: ''
6 api_parameters:
- level: Sets how much transformed code is printed, with the default showing code
    after all AST transformations.
7 api_usage_example:
- import os
- import paddle
- paddle.jit.set_code_level(2)
- '# It will print the transformed code at level 2, which means to print the code
  after second transformer,'
