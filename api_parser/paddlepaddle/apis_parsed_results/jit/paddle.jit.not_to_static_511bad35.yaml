2 api_name: paddle.jit.not_to_static
3 api_description: Decorator that prevents a function from being converted to static
  graph mode by Paddle JIT.
4 api_signature: paddle.jit.not_to_static(func)
5 api_details: ''
6 api_parameters: []
7 api_usage_example:
- '>>>'
- import paddle
- '@paddle.jit.not_to_static'
- 'def func_not_to_static(x):'
- '    res = x - 1'
- '    return res'
- '@paddle.jit.to_static'
- 'def func(x):'
- '    if paddle.mean(x) < 0:'
- '        out = func_not_to_static(x)'
- '    else:'
- '        out = x + 1'
- '    return out'
- '...'
- x = paddle.ones([1, 2], dtype='float32')
- out = func(x)
- print(out)
- Tensor(shape=[1, 2], dtype=float32, place=Place(cpu), stop_gradient=True,
- '[[2., 2.]])'
