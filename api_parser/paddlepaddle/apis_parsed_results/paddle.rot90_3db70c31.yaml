2 api_name: paddle.rot90
3 api_description: Rotates an n-D tensor by 90 degrees around the specified pair of
  axes, with the rotation direction determined by the sign of k and the number of
  quarter-turns by its absolute value.
4 api_signature: paddle.rot90(x,k,axes)
5 api_details: ''
6 api_parameters:
- x: Input tensor to rotate; supports float16, float32, float64, int32, int64, and
    bool, with float16 supported only on GPU.
- k: Number of 90-degree rotations to apply and the rotation direction, defaulting
    to 1.
- axes: Two axes that define the plane in which the tensor is rotated, defaulting
    to [0, 1].
7 api_usage_example:
- import paddle
- data = paddle.arange(4)
- data = paddle.reshape(data, (2, 2))
- print(data.numpy())
- '[[0 1]'
- '[2 3]]'
- y = paddle.rot90(data, 1, [0, 1])
- print(y.numpy())
- '[[1 3]'
- '[0 2]]'
- y= paddle.rot90(data, -1, [0, 1])
- print(y.numpy())
- '[[2 0]'
- '[3 1]]'
- data2 = paddle.arange(8)
- data2 = paddle.reshape(data2, (2,2,2))
- print(data2.numpy())
- '[[[0 1]'
- '[2 3]]'
- '[[4 5]'
- '[6 7]]]'
- y = paddle.rot90(data2, 1, [1, 2])
- print(y.numpy())
- '[[[1 3]'
- '[0 2]]'
- '[[5 7]'
- '[4 6]]]'
8 api_shape: {}
