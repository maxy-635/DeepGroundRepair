2 api_name: tensorflow.split
3 api_description: Splits a tensor into multiple sub-tensors along a specified axis,
  either into equal parts or into chunks sized by a list or 1-D tensor.
4 api_signature: tf.split(value,num_or_size_splits,axis)
5 api_details: ''
6 api_parameters:
- value: The tensor to be split into multiple parts.
- num_or_size_splits: Specifies either the number of equal splits or the sizes of
    each split along the chosen axis.
- axis: Chooses the dimension along which the tensor is split.
- num: Provides the number of output tensors when it cannot be inferred from `num_or_size_splits`.
7 api_usage_example:
- x = tf.Variable(tf.random.uniform([5, 30], -1, 1))
- '# Split `x` into 3 tensors along dimension 1'
- s0, s1, s2 = tf.split(x, num_or_size_splits=3, axis=1)
- tf.shape(s0).numpy()
- '# Split `x` into 3 tensors with sizes [4, 15, 11] along dimension 1'
- split0, split1, split2 = tf.split(x, [4, 15, 11], 1)
- tf.shape(split0).numpy()
- tf.shape(split1).numpy()
- tf.shape(split2).numpy()
8 api_shape: ''
