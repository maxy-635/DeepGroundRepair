2 api_name: tensorflow.custom_gradient
3 api_description: Decorator for defining a function with a custom backward gradient,
  letting you override or optimize how gradients are computed for a sequence of TensorFlow
  operations.
4 api_signature: tf.custom_gradient(f)
5 api_details: ''
6 api_parameters:
- f: Defines the forward computation and returns both the output tensor(s) and a custom
    gradient function for backpropagation.
7 api_usage_example:
- 'weights = tf.Variable(tf.ones([2]))  # Trainable variable weights'
- '@tf.custom_gradient'
- 'def linear_poly(x):'
- '  # Creating polynomial'
- '  poly = weights[1] * x + weights[0]'
- '  def grad_fn(dpoly, variables):'
- '    # dy/dx = weights[1] and we need to left multiply dpoly'
- '    grad_xs = dpoly * weights[1]  # Scalar gradient'
- '    grad_vars = []  # To store gradients of passed variables'
- '    assert variables is not None'
- '    assert len(variables) == 1'
- '    assert variables[0] is weights'
- '    # Manually computing dy/dweights'
- '    dy_dw = dpoly * tf.stack([x ** 1, x ** 0])'
- '    grad_vars.append('
- '        tf.reduce_sum(tf.reshape(dy_dw, [2, -1]), axis=1)'
- '    )'
- '    return grad_xs, grad_vars'
- '  return poly, grad_fn'
- x = tf.constant([1., 2., 3.])
- 'with tf.GradientTape(persistent=True) as tape:'
- '  tape.watch(x)'
- '  poly = linear_poly(x)'
- 'poly # poly = x + 1'
- 'tape.gradient(poly, x)  # conventional scalar gradient dy/dx'
- tape.gradient(poly, weights)
8 api_shape: ''
