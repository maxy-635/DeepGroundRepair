2 api_name: tensorflow.keras.layers.DepthwiseConv1D
3 api_description: DepthwiseConv1D applies a separate convolutional kernel to each
  input channel, allowing for efficient feature extraction by performing depthwise
  separable convolution.
4 api_signature: tf.keras.layers.DepthwiseConv1D(kernel_size, strides, padding, depth_multiplier, activation)
5 api_details: ''
6 api_parameters:
- kernel_size: Specifies the size of the depthwise convolution window.
- strides: Defines the stride length of the convolution, where strides > 1 is incompatible
    with dilation_rate > 1.
- padding: Determines the type of padding applied, either 'valid' (no padding) or
    'same' (even padding to maintain input size).
- depth_multiplier: Indicates the number of output channels generated for each input
    channel, resulting in total output channels equal to input_channel * depth_multiplier.
- activation: Specifies the activation function to be applied; if None, no activation
    is applied.
7 api_usage_example:
- x = np.random.rand(4, 10, 12)
- y = keras.layers.DepthwiseConv1D(3, 3, 2, activation='relu')(x)
- print(y.shape)
8 api_shape:
  input tensor shape: (N, Length_in, Channel_in)
  output tensor shape: (N, Length_out, Channel_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = Channel_in * depth_multiplier
    tensor length: If padding = "valid", Length_out = floor((Length_in - kernel_size) / strides + 1); 
                  If padding = "same", Length_out = floor((Length_in - 1) / strides + 1)
