2 api_name: tensorflow.keras.layers.Subtract
3 api_description: Subtracts two tensors elementwise, returning the result of inputs[0]
  - inputs[1], both of the same shape.
4 api_signature: tf.keras.layers.Subtract()
5 api_details: ''
6 api_parameters: []
7 api_usage_example:
- input1 = keras.layers.Input(shape=(16,))
- x1 = keras.layers.Dense(8, activation='relu')(input1)
- input2 = keras.layers.Input(shape=(32,))
- x2 = keras.layers.Dense(8, activation='relu')(input2)
- '# equivalent to `subtracted = keras.layers.subtract([x1, x2])`'
