2 api_name: tensorflow.keras.layers.subtract
3 api_description: The tf.keras.layers.subtract API allows for the element-wise subtraction
  of two input tensors, facilitating the creation of custom neural network architectures
  in a functional manner.
4 api_signature: tf.keras.layers.subtract(inputs)
5 api_details: ''
6 api_parameters:
- inputs: A list containing two input tensors that must have the same shape, which
    will be subtracted from each other.
7 api_usage_example:
- input1 = keras.layers.Input(shape=(16,))
- x1 = keras.layers.Dense(8, activation='relu')(input1)
- input2 = keras.layers.Input(shape=(32,))
- x2 = keras.layers.Dense(8, activation='relu')(input2)
- subtracted = keras.layers.subtract([x1, x2])
- out = keras.layers.Dense(4)(subtracted)
- model = keras.models.Model(inputs=[input1, input2], outputs=out)
