2 api_name: tensorflow.keras.layers.Embedding
3 api_description: The tf.keras.layers.Embedding layer transforms positive integer
  indices into dense, fixed-size vectors, enabling the representation of categorical
  data in a continuous vector space.
4 api_signature: tf.keras.layers.Embedding(input_dim, output_dim, mask_zero)
5 api_details: ''
6 api_parameters:
- input_dim: Specifies the size of the vocabulary, which is the maximum integer index
    plus one.
- output_dim: Defines the dimension of the dense embedding for each input integer.
- mask_zero: Indicates whether the input value 0 is treated as a special padding value
    that should be masked out during processing.
7 api_usage_example:
- model = keras.Sequential()
- model.add(keras.layers.Embedding(1000, 64))
- '# The model will take as input an integer matrix of size (batch,'
- '# input_length), and the largest integer (i.e. word index) in the input'
- '# should be no larger than 999 (vocabulary size).'
- '# Now model.output_shape is (None, 10, 64), where `None` is the batch'
- '# dimension.'
- input_array = np.random.randint(1000, size=(32, 10))
- model.compile('rmsprop', 'mse')
- output_array = model.predict(input_array)
- print(output_array.shape)
