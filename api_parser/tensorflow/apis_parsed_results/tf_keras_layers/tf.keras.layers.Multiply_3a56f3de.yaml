2 api_name: tensorflow.keras.layers.Multiply
3 api_description: tf.keras.layers.Multiply performs elementwise multiplication of
  a list of tensors with the same shape, returning a single tensor of the same shape.
4 api_signature: tf.keras.layers.Multiply()
5 api_details: ''
6 api_parameters: []
7 api_usage_example:
- input1 = keras.layers.Input(shape=(16,))
- x1 = keras.layers.Dense(8, activation='relu')(input1)
- input2 = keras.layers.Input(shape=(32,))
- x2 = keras.layers.Dense(8, activation='relu')(input2)
- '# equivalent to `y = keras.layers.multiply([x1, x2])`'
