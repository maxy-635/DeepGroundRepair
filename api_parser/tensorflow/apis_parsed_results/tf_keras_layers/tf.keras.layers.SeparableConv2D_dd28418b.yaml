2 api_name: tensorflow.keras.layers.SeparableConv2D
3 api_description: SeparableConv2D performs depthwise convolution on individual channels
  followed by pointwise convolution to combine channels, with optional bias and activation.
4 api_signature: tf.keras.layers.SeparableConv2D(filters, kernel_size, strides, padding,
  activation)
5 api_details: ''
6 api_parameters:
- filters: Specifies the number of output filters in the pointwise convolution.
- kernel_size: Defines the size of the window for the depthwise convolution.
- strides: Sets the stride length for the depthwise convolution, affecting how the
    filter moves across the input.
- padding: Determines the type of padding applied to the input, either 'valid' (no
    padding) or 'same' (padding to maintain output size).
- activation: Specifies the activation function to be applied to the output; if None,
    no activation is applied.
7 api_usage_example:
- x = np.random.rand(4, 10, 10, 12)
- y = keras.layers.SeparableConv2D(3, 4, 3, 2, activation='relu')(x)
- print(y.shape)
