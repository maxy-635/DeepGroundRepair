2 api_name: tensorflow.keras.layers.multiply
3 api_description: The tf.keras.layers.multiply API performs element-wise multiplication
  of two input tensors.
4 api_signature: tf.keras.layers.multiply(inputs)
5 api_details: ''
6 api_parameters:
- inputs: A list of input tensors that are multiplied element-wise, and all must have
    the same shape.
7 api_usage_example:
- input1 = keras.layers.Input(shape=(16,))
- x1 = keras.layers.Dense(8, activation='relu')(input1)
- input2 = keras.layers.Input(shape=(32,))
- x2 = keras.layers.Dense(8, activation='relu')(input2)
- y = keras.layers.multiply([x1, x2])
- out = keras.layers.Dense(4)(y)
- model = keras.models.Model(inputs=[input1, input2], outputs=out)
