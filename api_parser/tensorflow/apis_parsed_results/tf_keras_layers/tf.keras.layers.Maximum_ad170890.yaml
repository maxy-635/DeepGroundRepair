2 api_name: tensorflow.keras.layers.Maximum
3 api_description: Computes the element-wise maximum from a list of tensors with the
  same shape, returning a single tensor of the same shape.
4 api_signature: tf.keras.layers.Maximum()
5 api_details: ''
6 api_parameters: []
7 api_usage_example:
