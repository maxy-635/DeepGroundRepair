2 api_name: tensorflow.keras.layers.GRUCell
3 api_description: The tf.keras.layers.GRUCell class processes a single time step
  of input data in a Gated Recurrent Unit (GRU) architecture, enabling the building
  of custom recurrent layers by managing the internal state and updates for that step.
4 api_signature: tf.keras.layers.GRUCell(units, activation, use_bias, dropout, recurrent_dropout)
5 api_details: ''
6 api_parameters:
- units: Specifies the number of output dimensions for the GRU cell.
- activation: Defines the activation function applied to the output, with 'tanh' as
    the default.
- use_bias: Indicates whether to include a bias vector in the calculations, defaulting
    to True.
- dropout: Sets the fraction of input units to drop during training to prevent overfitting,
    defaulting to 0.
- recurrent_dropout: Determines the fraction of recurrent units to drop during training,
    also defaulting to 0.
7 api_usage_example:
