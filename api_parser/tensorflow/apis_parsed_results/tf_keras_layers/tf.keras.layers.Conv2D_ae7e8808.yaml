2 api_name: tensorflow.keras.layers.Conv2D
3 api_description: The tf.keras.layers.Conv2D layer applies a 2D convolution to the
  input, using a kernel to produce output tensors, with optional bias and activation
  functions.
4 api_signature: tf.keras.layers.Conv2D(filters, kernel_size, strides, padding, activation)
5 api_details: ''
6 api_parameters:
- filters: Specifies the number of output filters in the convolution.
- kernel_size: Defines the height and width of the 2D convolution window.
- strides: Determines the step size of the convolution operation.
- padding: Indicates whether to use 'valid' (no padding) or 'same' (padding to maintain
    size) padding.
- activation: Specifies the activation function to be applied to the output.
7 api_usage_example:
- x = np.random.rand(4, 10, 10, 128)
- y = keras.layers.Conv2D(32, 3, activation='relu')(x)
- print(y.shape)
8 api_shape:
  input tensor shape: (N, Height_in, Width_in, Channel_in)
  output tensor shape: (N, Height_out, Width_out, Channel_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = filter
    tensor height: If padding = "valid", Height_out = floor((Height_in - filter_height) / strides_height + 1); 
                  If padding = "same", Height_out = floor((Height_in - 1) / strides_height + 1)
    tensor width: If padding = "valid", Width_out = floor((Width_in - filter_width) / strides_width + 1); 
                  If padding = "same", Width_out = floor((Width_in - 1) / strides_width + 1)
