2 api_name: tensorflow.keras.layers.Normalization
3 api_description: The tf.keras.layers.Normalization layer normalizes continuous features
  by centering them around 0 and scaling to a standard deviation of 1, using precomputed
  or learned mean and variance values.
4 api_signature: tf.keras.layers.Normalization(axis, mean, variance)
5 api_details: ''
6 api_parameters:
- axis: Defines the axis or axes for which separate mean and variance values are tracked
    during normalization.
- mean: Specifies the mean value(s) used for normalization, which are broadcast to
    the appropriate shape.
- variance: Specifies the variance value(s) used for normalization, which are also
    broadcast to the appropriate shape.
