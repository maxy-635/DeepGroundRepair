2 api_name: tensorflow.keras.layers.Conv3D
3 api_description: The Conv3D layer performs 3D convolution on input data, applying
  a kernel over spatial or temporal dimensions, with optional bias and activation
  functions.
4 api_signature: tf.keras.layers.Conv3D(filters, kernel_size, strides, padding, activation)
5 api_details: ''
6 api_parameters:
- filters: Defines the number of output filters in the convolution.
- kernel_size: Specifies the dimensions of the convolution window.
- strides: Determines the step size of the convolution operation.
- padding: Controls the padding applied to the input, either 'valid' (no padding)
    or 'same' (padded to maintain size).
- activation: Specifies the activation function to be applied to the output.
7 api_usage_example:
- x = np.random.rand(4, 10, 10, 10, 128)
- y = keras.layers.Conv3D(32, 3, activation='relu')(x)
- print(y.shape)
8 api_shape:
  input tensor shape: (N, Depth_in, Height_in, Width_in, Channel_in)
  output tensor shape: (N, Depth_out, Height_out, Width_out, Channel_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = filter
    tensor depth: If padding = "valid", Depth_out = floor((Depth_in - filter_depth) / stride_depth + 1); 
                  If padding = "same", Depth_out = floor((Depth_in - 1) / stride_depth + 1)
    tensor height: If padding = "valid", Height_out = floor((Height_in - filter_height) / strides_height + 1); 
                  If padding = "same", Height_out = floor((Height_in - 1) / strides_height + 1)
    tensor width: If padding = "valid", Width_out = floor((Width_in - filter_width) / strides_width + 1); 
                  If padding = "same", Width_out = floor((Width_in - 1) / strides_width + 1)
