2 api_name: tensorflow.data.experimental.table_from_dataset
3 api_description: Builds a lookup table from a dataset of key-value pairs, returning
  hashed out-of-vocabulary bucket IDs when enabled or a default value otherwise.
4 api_signature: tf.data.experimental.table_from_dataset(dataset,vocab_size,default_value)
5 api_details: ''
6 api_parameters:
- dataset: Provides the (key, value) pairs used to build the lookup table.
- vocab_size: Specifies how many elements are in the vocabulary when that size is
    known.
- default_value: Sets the fallback value returned for out-of-vocabulary feature values,
    defaulting to -1.
7 api_usage_example:
- keys = tf.data.Dataset.range(100)
- values = tf.data.Dataset.range(100).map(
- '    lambda x: tf.strings.as_string(x * 2))'
- ds = tf.data.Dataset.zip((keys, values))
- table = tf.data.experimental.table_from_dataset(
- '                              ds, default_value=''n/a'', key_dtype=tf.int64)'
- table.lookup(tf.constant([0, 1, 2], dtype=tf.int64)).numpy()
8 api_shape: ''
