2 api_name: tensorflow.data.experimental.service.distribute
3 api_description: Distributes a tf.data pipeline to the tf.data service, using either
  split-across-workers processing for one-pass, ordered, splittable datasets or independent
  parallel processing on each worker for unsplittable or shuffled datasets.
4 api_signature: tf.data.experimental.service.distribute(processing_mode,service,job_name,target_workers)
5 api_details: ''
6 api_parameters:
- processing_mode: Controls how the dataset is sharded across tf.data workers, with
    compatibility aliases for non-sharded and dynamically sharded modes.
- service: Specifies the tf.data service dispatcher address, either as a connection
    string or as a (protocol, address) tuple.
- job_name: Optionally names the job so multiple datasets can share it; otherwise
    an anonymous exclusive job is created.
- target_workers: Chooses which tf.data service workers to read from, with options
    for automatic selection, any worker, or only local in-process workers.
7 api_usage_example:
- dispatcher = tf.data.experimental.service.DispatchServer()
- dispatcher_address = dispatcher.target.split("://")[1]
- workers = [
- '    tf.data.experimental.service.WorkerServer('
- '        tf.data.experimental.service.WorkerConfig('
- '            dispatcher_address=dispatcher_address)) for _ in range(2)'
- ']'
- dataset = tf.data.Dataset.range(5)
- 'dataset = dataset.map(lambda x: x*x)'
- dataset = dataset.apply(
- '   tf.data.experimental.service.distribute("parallel_epochs",'
- '                                           dispatcher.target))'
- 'dataset = dataset.map(lambda x: x+1)'
- print(sorted(list(dataset.as_numpy_iterator())))
8 api_shape: ''
