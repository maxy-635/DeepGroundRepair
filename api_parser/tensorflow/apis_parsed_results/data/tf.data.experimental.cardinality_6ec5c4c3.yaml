2 api_name: tensorflow.data.experimental.cardinality
3 api_description: Returns the dataset’s number of elements when it can be determined,
  or reports infinite/unknown cardinality when the dataset is unbounded or cannot
  be analyzed.
4 api_signature: tf.data.experimental.cardinality(dataset)
5 api_details: ''
6 api_parameters:
- dataset: The `tf.data.Dataset` whose cardinality is being determined.
7 api_usage_example:
