2 api_name: tensorflow.data.experimental.RandomDataset
3 api_description: Creates a deprecated dataset that yields an infinite sequence of
  pseudorandom values.
4 api_signature: tf.data.experimental.RandomDataset(seed,rerandomize_each_iteration)
