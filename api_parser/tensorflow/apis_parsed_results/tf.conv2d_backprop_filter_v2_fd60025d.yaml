2 api_name: tensorflow.conv2d_backprop_filter_v2
3 api_description: Computes the gradient of a convolution operation with respect to
  the filter weights, given the input and output gradients.
4 api_signature: tf.conv2d_backprop_filter_v2(input,filter,out_backprop,strides,padding)
5 api_details: ''
6 api_parameters:
- input: The input tensor whose shape and values define the convolution context for
    computing filter gradients.
- filter: The filter tensor whose shape is used to determine the size of the gradient
    being computed.
- out_backprop: The backpropagated gradient tensor from the convolution output, used
    to compute gradients with respect to the filter.
- strides: The sliding-window step sizes for the convolution along each input dimension.
- padding: The padding mode that determines how the convolution handles border regions.
