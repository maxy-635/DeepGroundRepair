2 api_name: tensorflow.io.decode_and_crop_jpeg
3 api_description: Decodes a JPEG-encoded image and crops it to a specified region,
  returning a uint8 tensor with the requested number of color channels.
4 api_signature: tf.io.decode_and_crop_jpeg(contents,crop_window,channels,ratio,name)
5 api_details: ''
6 api_parameters:
- contents: Holds the JPEG-encoded image data to decode.
