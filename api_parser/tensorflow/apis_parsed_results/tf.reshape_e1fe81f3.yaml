2 api_name: tensorflow.reshape
3 api_description: Returns a tensor with the same values in a new shape, preserving
  element order.
4 api_signature: tf.reshape(tensor,shape)
5 api_details: ''
6 api_parameters:
- tensor: The input tensor to be reshaped.
- shape: The target shape for the output tensor, specified as an int32 or int64 tensor.
7 api_usage_example:
- t = [[[1, 1, 1],
- '      [2, 2, 2]],'
- '     [[3, 3, 3],'
- '      [4, 4, 4]],'
- '     [[5, 5, 5],'
- '      [6, 6, 6]]]'
- print(tf.shape(t).numpy())
- '# Pass ''[-1]'' to flatten ''t''.'
- tf.reshape(t, [-1])
- '# -- Using -1 to infer the shape --'
- '# Here -1 is inferred to be 9:'
- tf.reshape(t, [2, -1])
- '# -1 is inferred to be 2:'
- tf.reshape(t, [-1, 9])
- '# -1 is inferred to be 3:'
- tf.reshape(t, [ 2, -1, 3])
8 api_shape: ''
