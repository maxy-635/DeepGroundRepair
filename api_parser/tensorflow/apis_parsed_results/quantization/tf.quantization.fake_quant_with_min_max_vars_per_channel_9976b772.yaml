3 api_description: Fake-quantizes a float tensor per channel using per-channel min
  and max values, returning an output tensor of the same shape as the input.
4 api_signature: tf.quantization.fake_quant_with_min_max_vars_per_channel(inputs,min,max,num_bits,narrow_range)
5 api_details: ''
6 api_parameters:
- inputs: The float32 tensor to be fake-quantized per channel.
