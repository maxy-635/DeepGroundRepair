2 api_name: tensorflow.nn.avg_pool2d
3 api_description: tensorflow.nn.avg_pool2d performs average pooling by computing
  the mean of elements within a specified window size over the input tensor.
4 api_signature: tf.nn.avg_pool2d(input,ksize,strides,padding)
5 api_details: ''
6 api_parameters:
- input: Specifies the input tensor with shape [batch, height, width, channels] and
    data type options including float32, float64, qint8, quint8, or qint32.
- ksize: Defines the size of the pooling window for each dimension of the input tensor,
    specified as an int or list of ints with length 1, 2, or 4.
- strides: Indicates the stride of the sliding window for each dimension of the input
    tensor, specified as an int or list of ints with length 1, 2, or 4.
- padding: Determines the padding algorithm to use, either 'VALID' (no padding) or
    'SAME' (padding to maintain input dimensions).
7 api_usage_example: null
8 api_shape:
  input tensor shape: (N, Height_in, Width_in, Channel_in)
  output tensor shape: (N, Height_out, Width_out, Channel_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = Channel_in
    tensor height: If padding = "VALID", Height_out = floor((Height_in - ksize_height) / strides_height + 1); 
                  If padding = "SAME", Height_out = floor((Height_in - 1) / strides_height + 1)
    tensor width: If padding = "VALID", Width_out = floor((Width_in - ksize_width) / strides_width + 1); 
                  If padding = "SAME", Width_out = floor((Width_in - 1) / strides_width + 1)
