2 api_name: tensorflow.nn.max_pool
3 api_description: The tensorflow.nn.max_pool API performs max pooling on input data
  by sliding a specified window size (ksize) and selecting the maximum value within
  each window, reducing computation and preventing overfitting.
4 api_signature: tf.nn.max_pool(input,ksize,strides,padding)
5 api_details: ''
6 api_parameters:
- input: Specifies the input tensor with a defined shape, where pooling is applied
    over spatial dimensions.
- ksize: Defines the size of the pooling window for each dimension of the input tensor.
- strides: Specifies the stride of the sliding window for each dimension of the input
    tensor.
- padding: Indicates the padding algorithm ('SAME', 'VALID', or explicit) to use for
    pooling.
7 api_usage_example:
- tf.nn.max_pool(reshaped, ksize=3, strides=3, padding="VALID")
8 api_shape: ''
