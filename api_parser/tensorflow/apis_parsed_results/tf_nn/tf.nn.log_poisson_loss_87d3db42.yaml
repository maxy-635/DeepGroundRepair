2 api_name: tensorflow.nn.log_poisson_loss
3 api_description: The tensorflow.nn.log_poisson_loss API computes the log-likelihood
  loss between predictions and targets assuming a Poisson distribution, omitting the
  log-factorial term by default for optimization purposes. To include an approximation
  of this term, set compute_full_loss=True.
4 api_signature: tf.nn.log_poisson_loss(targets,log_input)
5 api_details: ''
6 api_parameters:
- targets: The actual observed values that the model is trying to predict, represented
    as a Tensor with the same type and shape as log_input.
- log_input: The predicted log of the expected values (log of lambda) from the model,
    represented as a Tensor of type float32 or float64.
