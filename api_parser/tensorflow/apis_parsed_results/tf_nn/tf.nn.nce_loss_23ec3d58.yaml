2 api_name: tensorflow.nn.nce_loss
3 api_description: tensorflow.nn.nce_loss computes the noise-contrastive estimation
  (NCE) training loss, which is used to train models by distinguishing between true
  data and noise, often followed by calculating the full sigmoid loss for evaluation
  or inference.
4 api_signature: tf.nn.nce_loss(weights,biases,labels,inputs,num_sampled,num_classes)
5 api_details: ''
6 api_parameters:
- weights: Defines the class embeddings with shape [num_classes, dim] for the model.
- biases: Represents the biases for each class with shape [num_classes].
- labels: Specifies the target classes as a Tensor of shape [batch_size, num_true].
- inputs: Contains the forward activations of the input network with shape [batch_size,
    dim].
- num_sampled: Indicates the number of negative classes to sample per batch.
- num_classes: Denotes the total number of possible classes.
