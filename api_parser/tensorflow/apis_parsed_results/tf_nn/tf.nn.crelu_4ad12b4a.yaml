3 api_description: tensorflow.nn.crelu computes the Concatenated ReLU, which combines
  the positive and negative parts of an activation to double its depth.
4 api_signature: tf.nn.crelu(features,axis)
5 api_details: ''
6 api_parameters:
- features: Specifies the input tensor containing the data to be processed by the
    CReLU activation function.
