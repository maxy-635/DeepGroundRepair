2 api_name: tensorflow.nn.atrous_conv2d
3 api_description: tf.nn.atrous_conv2d performs 2-D atrous (dilated) convolution on
  4-D tensors. It uses a 'rate' parameter to insert zeros between filter values, allowing
  for larger receptive fields without increasing the number of parameters. A rate
  of 1 results in standard 2-D convolution.
4 api_signature: tf.nn.atrous_conv2d(value,filters,rate,padding)
5 api_details: ''
6 api_parameters:
- value: A 4-D Tensor representing the input data in 'NHWC' format with dimensions
    [batch, in_height, in_width, in_channels].
- filters: A 4-D Tensor of the same type as 'value' with shape [filter_height, filter_width,
    in_channels, out_channels], used to perform the convolution operation.
- rate: A positive integer indicating the dilation rate for atrous convolution, determining
    the stride for sampling input values and the upsampling of filter values.
- padding: A string ('VALID' or 'SAME') specifying the padding algorithm to use for
    the convolution operation.
7 api_usage_example: null
8 api_shape: ''
