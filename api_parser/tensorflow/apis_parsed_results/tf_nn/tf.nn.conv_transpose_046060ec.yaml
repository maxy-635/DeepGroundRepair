  the gradient of a 3D convolution rather than an actual deconvolution.
4 api_signature: tf.nn.conv_transpose(input,filters,output_shape,strides,padding)
5 api_details: ''
6 api_parameters:
- input: The input tensor with shape determined by batch size, spatial dimensions,
