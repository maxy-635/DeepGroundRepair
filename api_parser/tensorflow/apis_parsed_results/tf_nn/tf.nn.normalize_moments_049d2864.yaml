5 api_details: ''
6 api_parameters:
- counts: Represents the total number of elements in the dataset as a single Tensor
    value.
- mean_ss: Holds the sum of elements used to compute the mean, possibly adjusted for
    numerical stability.
- variance_ss: Contains the squared sum of elements used to calculate the variance,
    possibly adjusted for numerical stability.
