2 api_name: tensorflow.nn.max_pool3d
3 api_description: tensorflow.nn.max_pool3d performs max pooling on 3D input data
  by sliding a 3D window over the input and taking the maximum value within the window
  at each step, reducing the spatial dimensions.
4 api_signature: tf.nn.max_pool3d(input,ksize,strides,padding)
5 api_details: ''
6 api_parameters:
- input: Specifies the 5-D input tensor for the 3D max pooling operation, formatted
    as determined by data_format.
- ksize: Defines the size of the pooling window for each dimension, specified as an
    int or list of ints with length 1, 3, or 5.
- strides: Indicates the stride of the sliding window for each dimension, given as
    an int or list of ints with length 1, 3, or 5.
- padding: Determines the padding algorithm, either 'VALID' for no padding or 'SAME'
    for padding to maintain input size.
7 api_usage_example: null
8 api_shape:
  input tensor shape: (N, Depth_in, Height_in, Width_in, Channel_in)
  output tensor shape: (N, Depth_out, Height_out, Width_out, Channel_out)
  tensor shape transform formulas:
    tensor channel: Channel_out = Channel_in
    tensor depth: If padding = "VALID", Depth_out = floor((Depth_in - ksize_depth) / stride_depth + 1); 
                  If padding = "SAME", Depth_out = floor((Depth_in - 1) / stride_depth + 1)
    tensor height: If padding = "VALID", Height_out = floor((Height_in - ksize_height) / strides_height + 1); 
                  If padding = "SAME", Height_out = floor((Height_in - 1) / strides_height + 1)
    tensor width: If padding = "VALID", Width_out = floor((Width_in - ksize_width) / strides_width + 1); 
                  If padding = "SAME", Width_out = floor((Width_in - 1) / strides_width + 1)
