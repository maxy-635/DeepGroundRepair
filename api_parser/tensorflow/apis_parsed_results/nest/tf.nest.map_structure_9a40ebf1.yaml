2 api_name: tensorflow.nest.map_structure
3 api_description: Applies a function to corresponding elements across one or more
  nested structures, returning a new structure with the same layout.
4 api_signature: tf.nest.map_structure(func,*structure)
5 api_details: ''
6 api_parameters:
- func: A callable applied to corresponding elements from each structure.
- '*structure': One or more atoms or nested structures whose matching elements are
    traversed together.
7 api_usage_example:
- s1 = (((1, 2), 3), 4, (5, 6))
- s1_list = [[[1, 2], 3], 4, [5, 6]]
