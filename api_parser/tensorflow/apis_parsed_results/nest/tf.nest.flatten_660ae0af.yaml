2 api_name: tensorflow.nest.flatten
3 api_description: Flattens a nested TensorFlow structure into a deterministic list
  of leaf values, sorting dictionary keys and treating atoms as single-item lists;
  it is the inverse of `nest.pack_sequence_as`.
4 api_signature: tf.nest.flatten(structure)
5 api_details: ''
6 api_parameters:
- structure: The nested value to flatten into a list of leaf elements, treating atoms
    such as numpy arrays as single items.
7 api_usage_example:
- tensor = tf.ragged.constant([[3, 1, 4, 1], [], [5, 9, 2]])
- tf.nest.flatten(tensor, expand_composites=True)
8 api_shape: ''
