3 api_description: Rebuilds a nested structure from a flat sequence, using sorted
  dict keys for deterministic packing and requiring a single value when the target
  is an atom.
4 api_signature: tf.nest.pack_sequence_as(structure,flat_sequence)
5 api_details: ''
