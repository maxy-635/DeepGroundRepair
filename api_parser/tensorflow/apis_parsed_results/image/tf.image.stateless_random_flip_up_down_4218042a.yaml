2 api_name: tensorflow.image.stateless_random_flip_up_down
3 api_description: Deterministically flips an image vertically (upside down) based
  on a seed, producing the same result for the same seed regardless of call order
  or global random settings.
4 api_signature: tf.image.stateless_random_flip_up_down(image,seed)
5 api_details: ''
6 api_parameters:
- image: The input image tensor to randomly flip vertically, either as a single 3-D
    image or a batch of 4-D images.
- seed: A 2-element tensor that controls the random flip decision and must be an int32
    or int64 RNG seed.
7 api_usage_example:
- image = np.array([[[1], [2]], [[3], [4]]])
- seed = (2, 3)
- tf.image.stateless_random_flip_up_down(image, seed).numpy().tolist()
8 api_shape: ''
