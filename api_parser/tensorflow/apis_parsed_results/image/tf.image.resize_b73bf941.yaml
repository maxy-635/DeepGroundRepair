2 api_name: tensorflow.image.resize
3 api_description: Resizes images to a target size using the chosen method, even if
  this changes aspect ratio and may distort the image.
4 api_signature: tf.image.resize(images,size,method)
5 api_details: ''
6 api_parameters:
- images: The input image or batch of images to resize, provided as a 3-D or 4-D tensor.
- size: The target output height and width for the resized images.
- method: The interpolation method to use when resizing the images.
7 api_usage_example:
- max_10_20 = tf.image.resize(image, [10,20], preserve_aspect_ratio=True)
- max_10_20.shape.as_list()
