2 api_name: tensorflow.raw_ops.StringJoin
3 api_description: Joins a list of string tensors into a single tensor using an optional
  separator.
4 api_signature: tf.raw_ops.StringJoin(inputs,separator)
5 api_details: ''
6 api_parameters:
- inputs: String tensors to concatenate; they must share the same shape unless some
    are scalars, which are broadcast to match.
- separator: Optional string placed between joined values; defaults to an empty string.
7 api_usage_example:
- s = ["hello", "world", "tensorflow"]
