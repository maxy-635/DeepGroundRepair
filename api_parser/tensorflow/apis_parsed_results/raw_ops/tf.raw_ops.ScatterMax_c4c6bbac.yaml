2 api_name: tensorflow.raw_ops.ScatterMax
3 api_description: Applies sparse updates to a tensor by taking the elementwise maximum
  at the specified indices.
4 api_signature: tf.raw_ops.ScatterMax(ref,indices,updates)
5 api_details: ''
6 api_parameters:
- ref: The mutable tensor to be updated in place by taking the elementwise maximum
    with the provided updates.
- indices: The index tensor that specifies which slices in the first dimension of
    `ref` receive updates.
- updates: The tensor of values to scatter into `ref`, using a max reduction for any
    repeated indices.
