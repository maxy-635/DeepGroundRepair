2 api_name: tensorflow.raw_ops.ResourceApplyAdaMax
3 api_description: Applies the AdaMax optimization update to a variable using the
  current gradient, maintaining first-moment and exponentially weighted infinity-norm
  accumulators to adjust the variable value.
4 api_signature: tf.raw_ops.ResourceApplyAdaMax(var,m,v,grad,lr,beta1_power,beta1,beta2,epsilon)
5 api_details: ''
6 api_parameters:
- var: The model variable to be updated by the AdaMax optimization step.
- m: The first-moment accumulator variable that stores the running momentum estimate.
- v: The second-moment accumulator variable that stores the running infinity-norm
    estimate.
- beta1_power: A scalar tensor holding the current beta1 power used for bias correction.
- lr: A scalar tensor specifying the learning rate for the update.
- beta1: A scalar tensor controlling the decay rate of the first-moment estimate.
- beta2: A scalar tensor controlling the decay rate of the second-moment estimate.
- epsilon: A scalar tensor added for numerical stability in the denominator.
- grad: The gradient tensor used to compute the parameter update.
