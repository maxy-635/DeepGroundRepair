2 api_name: tensorflow.raw_ops.LoadDataset
3 api_description: Loads a dataset from serialized dataset parameters and returns
  it as a variant tensor for use in TensorFlow input pipelines.
4 api_signature: tf.raw_ops.LoadDataset(path,output_types,output_shapes,reader_func,name)
5 api_details: ''
6 api_parameters:
- path: Specifies the string tensor path from which the dataset is loaded.
- output_types: Defines the data types of the elements that the loaded dataset will
    produce.
- output_shapes: Defines the shapes of the elements that the loaded dataset will produce.
- reader_func: Provides the function used to read and construct the dataset from the
    input path.
- name: Optionally assigns a name to the operation.
