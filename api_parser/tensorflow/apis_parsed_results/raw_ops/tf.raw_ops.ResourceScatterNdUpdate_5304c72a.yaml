2 api_name: tensorflow.raw_ops.ResourceScatterNdUpdate
3 api_description: Scatters sparse updates into a variable by applying each value
  or slice in `updates` to the locations specified by integer `indices`.
4 api_signature: tf.raw_ops.ResourceScatterNdUpdate(ref,indices,updates)
5 api_details: ''
6 api_parameters:
- ref: The resource variable to update, provided as a handle from `VarHandleOp`.
- indices: The integer indices that specify which locations in `ref` to scatter the
    updates to.
- updates: The values to write into `ref` at the positions indicated by `indices`.
