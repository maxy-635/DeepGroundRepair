2 api_name: tensorflow.raw_ops.SegmentSum
3 api_description: Computes the sum of data values within each segment ID, returning
  0 for any segment with no elements.
4 api_signature: tf.raw_ops.SegmentSum(data,segment_ids)
5 api_details: ''
6 api_parameters:
- data: The input tensor whose first dimension is partitioned into segments and summed
    within each segment.
- segment_ids: A sorted 1-D tensor of segment labels, one per first-dimension element
    of `data`, indicating which segment each value belongs to.
7 api_usage_example:
- c = tf.constant([[1,2,3,4], [4, 3, 2, 1], [5,6,7,8]])
- tf.math.segment_sum(c, tf.constant([0, 0, 1])).numpy()
8 api_shape: ''
