3 api_description: Aggregates sparse gradients conditionally by global step, accepts
  only recent updates, and returns the average once enough gradients are collected,
  resetting the accumulator and advancing its global step.
4 api_signature: tf.raw_ops.SparseConditionalAccumulator(dtype,shape,reduction_type,name)
5 api_details: ''
6 api_parameters:
- dtype: Specifies the data type of the sparse values to accumulate.
