- num_true: Specifies how many true labels are provided per example.
- num_sampled: Sets the number of candidate classes to sample.
- unique: Controls whether sampled candidates must be unique within each batch.
- seed: Provides the primary random seed for reproducible sampling when non-zero.
- seed2: Provides a secondary random seed to help avoid seed collisions when non-zero.
