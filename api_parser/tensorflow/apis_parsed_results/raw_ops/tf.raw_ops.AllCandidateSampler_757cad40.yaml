2 api_name: tensorflow.raw_ops.AllCandidateSampler
3 api_description: Samples a shared set of candidate labels for each batch using a
  learned unigram distribution, to support efficient candidate sampling in training.
4 api_signature: tf.raw_ops.AllCandidateSampler(true_classes,num_true,num_sampled,unique,seed,seed2)
5 api_details: ''
6 api_parameters:
- true_classes: Holds the batch of true class IDs, with each row listing the target
