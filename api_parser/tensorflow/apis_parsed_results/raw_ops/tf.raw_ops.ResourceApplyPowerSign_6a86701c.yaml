2 api_name: tensorflow.raw_ops.ResourceApplyPowerSign
3 api_description: Applies the PowerSign optimizer update to a variable using the
  current gradient and accumulated momentum, scaling the gradient by an exponential
  factor based on the signs of the gradient and momentum before subtracting the result
  from the variable.
