2 api_name: tensorflow.raw_ops.RandomDatasetV2
3 api_description: Creates a dataset that yields a stream of uniformly distributed
  pseudorandom 64-bit signed integers, with an option to reapply seeds each epoch
  for repeatable sequences.
4 api_signature: tf.raw_ops.RandomDatasetV2(seed,output_types,output_shapes)
5 api_details: ''
6 api_parameters:
- seed: Sets the scalar int64 seed used to initialize the random number generator;
    if non-zero, it makes the dataset’s randomness reproducible.
- output_types: Specifies the data types of the dataset elements that the random dataset
    will produce.
- output_shapes: Specifies the shapes of the dataset elements that the random dataset
    will produce.
