2 api_name: tensorflow.raw_ops.UnicodeDecode
3 api_description: Decodes each input string into Unicode code points, returning all
  characters in a flat vector with row_splits marking each string’s start and end
  positions.
4 api_signature: tf.raw_ops.UnicodeDecode(input,input_encoding,errors,replacement_char,replace_control_characters)
5 api_details: ''
6 api_parameters:
- input: The string tensor containing text to decode, flattened to a vector of character
    values in the output.
- input_encoding: Specifies the text encoding used to interpret the input strings.
- errors: 'Controls how invalid input is handled: raise an error, replace invalid
    data, or ignore it.'
- replacement_char: Sets the Unicode codepoint used to replace invalid input when
    `errors='replace'`.
- replace_control_characters: Determines whether C0 control characters are also replaced
    with the replacement character.
