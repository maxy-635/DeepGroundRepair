  a dense tensor; supports negative axes and optional dimension retention with keep_dims.
4 api_signature: tf.raw_ops.SparseReduceSum(input_indices,input_values,input_shape,reduction_axes)
5 api_details: ''
6 api_parameters:
- input_indices: Specifies the coordinates of the non-empty elements in the sparse
    tensor.
