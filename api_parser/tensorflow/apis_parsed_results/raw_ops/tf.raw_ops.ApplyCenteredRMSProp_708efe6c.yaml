2 api_name: tensorflow.raw_ops.ApplyCenteredRMSProp
3 api_description: Applies the centered RMSProp optimizer update to `var`, using running
  averages of gradients and squared gradients to normalize the step and then updating
  the momentum term and variable value.
4 api_signature: tf.raw_ops.ApplyCenteredRMSProp(var,grad,lr,rho,momentum,epsilon)
5 api_details: ''
6 api_parameters:
- var: The variable being updated by the centered RMSProp optimization step.
- mom: The momentum accumulator used to store and update the running momentum term.
- lr: The learning rate that controls the size of each parameter update.
- rho: The decay rate used to update the running averages of gradients and squared
    gradients.
- momentum: The momentum coefficient that scales the accumulated momentum contribution.
- epsilon: A small constant added for numerical stability to prevent division by zero.
- grad: The gradient tensor used to compute the update for the variable.
