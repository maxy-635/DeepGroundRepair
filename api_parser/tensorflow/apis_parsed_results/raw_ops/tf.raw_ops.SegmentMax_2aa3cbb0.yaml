2 api_name: tensorflow.raw_ops.SegmentMax
3 api_description: Computes the maximum value for each segment ID in a tensor, returning
  0 for any segment with no elements.
4 api_signature: tf.raw_ops.SegmentMax(data,segment_ids)
5 api_details: ''
6 api_parameters:
- data: The input tensor whose values are grouped and reduced by segment to compute
    the maximum for each segment.
- segment_ids: A 1-D tensor of sorted, possibly repeated segment labels that assigns
    each first-dimension entry in `data` to a segment.
7 api_usage_example:
- c = tf.constant([[1,2,3,4], [4, 3, 2, 1], [5,6,7,8]])
- tf.math.segment_max(c, tf.constant([0, 0, 1])).numpy()
8 api_shape: ''
