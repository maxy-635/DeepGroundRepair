2 api_name: tensorflow.raw_ops.ResourceGather
3 api_description: Gathers slices from a resource variable at the given integer indices,
  returning a tensor shaped like indices.shape plus the variable’s remaining dimensions.
4 api_signature: tf.raw_ops.ResourceGather(resource,indices,batch_dims)
5 api_details: ''
6 api_parameters:
- resource: The resource handle to the tensor or variable that will be gathered from.
