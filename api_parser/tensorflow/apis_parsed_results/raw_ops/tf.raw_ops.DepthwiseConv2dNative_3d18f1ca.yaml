2 api_name: tensorflow.raw_ops.DepthwiseConv2dNative
3 api_description: Applies a 2-D depthwise convolution to a 4-D input by using separate
  depth-1 filters per input channel, expanding each channel by the channel multiplier
  and concatenating the results.
4 api_signature: tf.raw_ops.DepthwiseConv2dNative(input,filter,strides,padding,data_format,dilations,name)
5 api_details: ''
6 api_parameters:
- input: The input tensor to be convolved.
