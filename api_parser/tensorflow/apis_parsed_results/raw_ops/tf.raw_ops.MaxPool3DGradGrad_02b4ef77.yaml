2 api_name: tensorflow.raw_ops.MaxPool3DGradGrad
3 api_description: Computes the second-order gradient of 3D max pooling, returning
  how the pooled output gradient changes with respect to the original input and pooling
  parameters.
4 api_signature: tf.raw_ops.MaxPool3DGradGrad(orig_input,grad,ksize,strides,padding)
5 api_details: ''
6 api_parameters:
- orig_input: The original input tensor used to compute the MaxPool3DGradGrad operation.
- grad: The upstream gradient tensor, matching `orig_input`'s type and shaped as `[batch,
    depth, rows, cols, channels]`.
- ksize: The 5-D pooling window sizes, with the batch and channel dimensions fixed
    at 1.
- strides: The 5-D sliding window strides, with the batch and channel dimensions fixed
    at 1.
- padding: The padding mode to apply for pooling, either `SAME` or `VALID`.
