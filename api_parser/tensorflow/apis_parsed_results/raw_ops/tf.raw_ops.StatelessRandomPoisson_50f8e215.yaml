2 api_name: tensorflow.raw_ops.StatelessRandomPoisson
3 api_description: Generates deterministic pseudorandom samples from a Poisson distribution
  based on shape, seed, and lam.
4 api_signature: tf.raw_ops.StatelessRandomPoisson(shape,seed,lam,dtype)
5 api_details: ''
6 api_parameters:
- shape: Specifies the output tensor dimensions.
- seed: Provides the two-element stateless random seed.
- lam: Sets the Poisson rate for each output value and must match the rightmost dimensions
    of `shape`.
- dtype: Determines the data type of the generated samples.
