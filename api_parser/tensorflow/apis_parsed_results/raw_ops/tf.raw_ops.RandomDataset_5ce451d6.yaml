2 api_name: tensorflow.raw_ops.RandomDataset
3 api_description: Creates a dataset that yields a stream of uniformly distributed
  pseudorandom 64-bit signed integers.
4 api_signature: tf.raw_ops.RandomDataset(seed,seed2,output_types,output_shapes)
5 api_details: ''
6 api_parameters:
- seed: Sets the primary random seed for the dataset's random number generator; if
    either seed is non-zero, it is used to seed the generator.
- seed2: Sets a secondary seed value to reduce seed collisions when generating random
    data.
- output_types: Specifies the data types of the dataset's output components.
- output_shapes: Specifies the shapes of the dataset's output components.
