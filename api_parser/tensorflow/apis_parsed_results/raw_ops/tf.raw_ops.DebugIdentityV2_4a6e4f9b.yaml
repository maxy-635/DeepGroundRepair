2 api_name: tensorflow.raw_ops.DebugIdentityV2
3 api_description: Returns the input tensor unchanged while logging its contents to
  DebugEventsWriter for debugging, with the logged data determined by tensor_debug_mode.
4 api_signature: tf.raw_ops.DebugIdentityV2(input,tensor_debug_mode,debug_urls,circular_buffer_size)
5 api_details: ''
6 api_parameters:
- input: The tensor to pass through unchanged for debugging.
