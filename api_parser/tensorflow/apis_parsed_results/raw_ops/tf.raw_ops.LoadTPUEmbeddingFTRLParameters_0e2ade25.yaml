2 api_name: tensorflow.raw_ops.LoadTPUEmbeddingFTRLParameters
3 api_description: Loads FTRL optimization parameters into TPU HBM for embedding tables,
  typically after configuration and before training begins.
4 api_signature: tf.raw_ops.LoadTPUEmbeddingFTRLParameters(parameters,accumulators,linears,num_shards,shard_id,table_id)
5 api_details: ''
6 api_parameters:
- parameters: Holds the FTRL parameter values to be loaded.
