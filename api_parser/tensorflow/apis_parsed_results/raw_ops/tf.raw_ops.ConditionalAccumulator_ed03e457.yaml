2 api_name: tensorflow.raw_ops.ConditionalAccumulator
3 api_description: Aggregates gradients conditionally by step, accepts only updates
  at or above the current global step, and returns the average once enough gradients
  are collected while resetting the accumulator and advancing the global step.
4 api_signature: tf.raw_ops.ConditionalAccumulator(dtype,shape,reduction_type,name)
5 api_details: ''
6 api_parameters:
- dtype: Specifies the data type of the values that will be accumulated.
- shape: Defines the expected shape of the accumulated values, or leaves it unknown
    if empty.
- reduction_type: Chooses how accumulated values are combined, either by averaging
    or summing.
- name: Assigns an optional name to the operation.
