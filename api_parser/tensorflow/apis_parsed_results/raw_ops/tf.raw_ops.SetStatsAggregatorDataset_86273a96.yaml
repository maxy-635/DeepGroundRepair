4 api_signature: tf.raw_ops.SetStatsAggregatorDataset(input_dataset,stats_aggregator,tag,counter_prefix)
5 api_details: ''
6 api_parameters:
- input_dataset: The input dataset to which the stats aggregator settings are attached.
- stats_aggregator: The resource handle for the stats aggregator that will collect
