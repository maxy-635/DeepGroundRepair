2 api_name: tensorflow.raw_ops.ApplyProximalAdagrad
3 api_description: 'Updates a variable and its accumulator using Proximal Adagrad:
  it accumulates squared gradients, applies an Adagrad-scaled gradient step, then
  performs FOBOS proximal shrinkage with L1/L2 regularization.'
4 api_signature: tf.raw_ops.ApplyProximalAdagrad(var,accum,lr,grad)
5 api_details: ''
6 api_parameters:
- var: The variable to be updated in place by the proximal Adagrad step.
- accum: The accumulator that stores the running squared-gradient history used by
    the optimizer.
- lr: The scalar learning-rate tensor that controls the update size.
- grad: The gradient tensor used to compute the parameter update.
