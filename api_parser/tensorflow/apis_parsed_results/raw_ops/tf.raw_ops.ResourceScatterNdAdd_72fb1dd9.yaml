2 api_name: tensorflow.raw_ops.ResourceScatterNdAdd
3 api_description: Adds sparse update values into a variable at the locations specified
  by integer indices, either updating individual elements or whole slices.
4 api_signature: ResourceScatterNdAdd(ref,indices,updates)
5 api_details: ''
6 api_parameters:
- ref: The resource tensor to be updated, originating from a `VarHandleOp`.
