2 api_name: tensorflow.raw_ops.ApproximateEqual
3 api_description: Element-wise compares two tensors and returns whether their absolute
  difference is less than a given tolerance.
4 api_signature: tf.raw_ops.ApproximateEqual(x,y,tolerance)
5 api_details: ''
6 api_parameters:
- x: The first input tensor whose values are compared for approximate equality.
- y: The second input tensor, which must have the same type as `x`, to compare against
    `x`.
- tolerance: The maximum allowed difference between corresponding values for them
    to be considered approximately equal.
