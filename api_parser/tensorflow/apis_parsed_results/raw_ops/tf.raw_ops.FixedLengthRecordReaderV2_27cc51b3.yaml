2 api_name: tensorflow.raw_ops.FixedLengthRecordReaderV2
3 api_description: Reads fixed-length records from a file and returns them as sequential
  outputs.
4 api_signature: tf.raw_ops.FixedLengthRecordReaderV2(record_bytes,header_bytes,footer_bytes,hop_bytes)
5 api_details: ''
6 api_parameters:
- record_bytes: Sets the size in bytes of each fixed-length record to read.
- header_bytes: Skips this many bytes at the start of the file before reading records.
- footer_bytes: Ignores this many bytes at the end of the file after reading records.
- hop_bytes: Sets the byte stride between record reads; if 0, it uses `record_bytes`.
