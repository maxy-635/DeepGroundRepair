2 api_name: tensorflow.raw_ops.ExperimentalChooseFastestDataset
3 api_description: Selects the fastest dataset from a list of candidate input datasets
  and forwards data from that choice.
4 api_signature: tf.raw_ops.ExperimentalChooseFastestDataset(input_datasets,num_experiments,output_types,output_shapes)
5 api_details: ''
6 api_parameters:
- input_datasets: Provides two or more candidate dataset variants for the op to choose
    the fastest one from.
- num_experiments: Specifies how many trials to run when comparing the candidate datasets.
- output_types: Defines the data types of the elements produced by the selected dataset.
- output_shapes: Defines the shapes of the elements produced by the selected dataset.
