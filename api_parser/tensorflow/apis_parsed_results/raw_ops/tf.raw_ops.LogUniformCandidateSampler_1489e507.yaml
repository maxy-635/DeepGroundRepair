2 api_name: tensorflow.raw_ops.LogUniformCandidateSampler
3 api_description: Samples a batch-wide set of candidate labels from a log-uniform
  distribution for candidate sampling, with fixed candidates independent of context
  and true labels.
4 api_signature: tf.raw_ops.LogUniformCandidateSampler(true_classes,num_true,num_sampled,unique,range_max)
5 api_details: ''
6 api_parameters:
- true_classes: Provides the true class IDs for each example in the batch.
- num_true: Specifies how many true labels are associated with each context.
- num_sampled: Sets how many candidate classes to randomly sample.
- unique: Determines whether sampled candidates must be unique within a batch.
- range_max: Defines the exclusive upper bound of the sampling range.
