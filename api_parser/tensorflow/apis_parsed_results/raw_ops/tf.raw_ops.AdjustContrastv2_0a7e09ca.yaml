2 api_name: tensorflow.raw_ops.AdjustContrastv2
3 api_description: Adjusts the contrast of images by computing each channel’s mean
  and scaling pixel values around that mean by a contrast factor, independently for
  each channel and image.
4 api_signature: tf.raw_ops.AdjustContrastv2(images,contrast_factor)
5 api_details: ''
6 api_parameters:
- images: The input image tensor whose contrast will be adjusted; it must be at least
