2 api_name: tensorflow.raw_ops.SparseApplyProximalGradientDescent
3 api_description: Applies a sparse proximal gradient descent update to selected rows
  of `var` using fixed learning rate, combining gradient descent with L1/L2 regularization
  via the FOBOS rule.
4 api_signature: tf.raw_ops.SparseApplyProximalGradientDescent(var,grad,indices,alpha,l1,l2)
5 api_details: ''
6 api_parameters:
- var: The mutable variable tensor to be updated in place.
- alpha: The scalar step-size scaling factor for the update.
- l1: The scalar L1 regularization strength applied during the update.
- l2: The scalar L2 regularization strength applied during the update.
- grad: The gradient tensor used to compute the sparse update.
- indices: The vector of row indices in `var` and `accum` that should be updated.
