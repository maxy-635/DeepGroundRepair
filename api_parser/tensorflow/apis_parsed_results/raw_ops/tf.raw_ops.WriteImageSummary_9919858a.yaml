2 api_name: tensorflow.raw_ops.WriteImageSummary
3 api_description: Writes an image tensor as a summary entry at a given step and tag
  using a summary writer.
4 api_signature: tf.raw_ops.WriteImageSummary(writer,step,tag,tensor,max_images)
5 api_details: ''
6 api_parameters:
- writer: Identifies the summary writer resource that receives the image summary.
- step: Specifies the global step value associated with the written summary.
- tag: Provides the name or label under which the image summary is recorded.
- tensor: Supplies the image data tensor to be written, using one of the supported
    numeric types.
- max_images: Limits how many images from the tensor are written, with a default of
    3.
