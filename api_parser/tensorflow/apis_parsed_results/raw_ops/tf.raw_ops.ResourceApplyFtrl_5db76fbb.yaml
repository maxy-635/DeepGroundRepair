2 api_name: tensorflow.raw_ops.ResourceApplyFtrl
3 api_description: Updates a variable using the FTRL-proximal optimization rule, adjusting
  the accumulator and linear terms from the gradient to produce a sparsity-friendly
  parameter update.
4 api_signature: tf.raw_ops.ResourceApplyFtrl(var,accum,linear,grad,lr,l1,l2,lr_power)
5 api_details: ''
6 api_parameters:
- var: The variable to update in place with the FTRL optimizer.
- accum: The accumulator variable used to track historical gradient information.
- linear: The linear component variable used by the FTRL update rule.
- grad: The gradient tensor used to compute the update.
- lr: The scalar learning rate that scales the update step.
- l1: The scalar L1 regularization strength applied to the update.
- l2: The scalar L2 regularization strength applied to the update.
- lr_power: The scalar learning-rate power that controls the adaptive step size.
