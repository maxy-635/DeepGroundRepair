2 api_name: tensorflow.raw_ops.XlaSplitND
3 api_description: Splits an input tensor into row-major slices across multiple dimensions
  using `num_splits`, optionally padding each slice before returning the results.
4 api_signature: tf.raw_ops.XlaSplitND(input,N,num_splits,paddings)
5 api_details: ''
6 api_parameters:
- input: The tensor to be split across all dimensions.
- N: The number of output tensors to produce, which must be at least 1.
- num_splits: A list specifying how many splits to make along each dimension, with
    each dimension evenly divisible by its split count.
- paddings: An optional list of right-padding values to apply per dimension before
    splitting so dimensions can become evenly divisible.
