2 api_name: tensorflow.raw_ops.ResourceApplyAdagrad
3 api_description: Applies the Adagrad update to a resource variable by accumulating
  squared gradients and adjusting the variable using the learning rate scaled by the
  inverse square root of that accumulator.
4 api_signature: tf.raw_ops.ResourceApplyAdagrad(var,accum,lr,grad)
5 api_details: ''
6 api_parameters:
- var: Resource variable containing the model weights to be updated in place.
- accum: Resource variable that stores the accumulated squared gradients for Adagrad.
- lr: Scalar learning-rate scaling factor that controls the update size.
- grad: Gradient tensor used to compute the parameter update.
