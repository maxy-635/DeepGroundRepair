2 api_name: tensorflow.raw_ops.UniformRequantize
3 api_description: Requantizes a quantized tensor from one set of scales, zero points,
  and quantization bounds to another by rescaling, re-centering, and clipping the
  values.
4 api_signature: tf.raw_ops.UniformRequantize(input,input_scales,input_zero_points,output_scales,output_zero_points,Tout,name)
5 api_details: ''
6 api_parameters:
- input: The quantized tensor to be requantized.
