    quantized.
- input_zero_points: The zero-point values that describe how the input tensor was
    originally quantized.
- output_scales: The scale values to use for the new quantization format.
- output_zero_points: The zero-point values to use for the new quantization format.
- Tout: The data type of the output quantized tensor.
