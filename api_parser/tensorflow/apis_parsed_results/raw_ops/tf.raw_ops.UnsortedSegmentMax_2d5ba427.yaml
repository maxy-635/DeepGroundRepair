2 api_name: tensorflow.raw_ops.UnsortedSegmentMax
3 api_description: Computes the maximum value for each unsorted segment of a tensor
  using `segment_ids`; negative IDs are ignored, and empty segments are filled with
  the lowest value for the tensor’s numeric type.
4 api_signature: tf.raw_ops.UnsortedSegmentMax(data,segment_ids,num_segments)
5 api_details: ''
6 api_parameters:
- data: The input tensor whose values are reduced by segment.
- segment_ids: A tensor that assigns each data slice to a segment index.
- num_segments: The total number of output segments to produce.
7 api_usage_example:
