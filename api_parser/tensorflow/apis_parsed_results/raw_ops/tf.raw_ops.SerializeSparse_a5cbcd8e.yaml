2 api_name: tensorflow.raw_ops.SerializeSparse
3 api_description: Serializes a SparseTensor into a rank-1 tensor containing its indices,
  values, and dense shape.
4 api_signature: tf.raw_ops.SerializeSparse(sparse_indices,sparse_values,sparse_shape,out_type)
5 api_details: ''
6 api_parameters:
- sparse_indices: The 2-D int64 indices that locate each nonzero element in the sparse
    tensor.
- sparse_values: The 1-D tensor of values corresponding to the listed sparse indices.
- sparse_shape: The 1-D int64 tensor describing the full shape of the sparse tensor.
- out_type: The output serialization type, either `tf.string` by default or `tf.variant`.
