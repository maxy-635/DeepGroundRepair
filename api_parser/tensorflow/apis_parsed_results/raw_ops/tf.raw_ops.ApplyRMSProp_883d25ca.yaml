2 api_name: tensorflow.raw_ops.ApplyRMSProp
3 api_description: Applies RMSProp updates to `var` using the current gradient, maintaining
  running averages of squared gradients and momentum to scale the step size and subtract
  the momentum-adjusted update from the variable.
4 api_signature: tf.raw_ops.ApplyRMSProp(var,ms,mom,lr,rho,momentum,epsilon,grad)
5 api_details: ''
6 api_parameters:
- var: The variable being updated in place by the RMSProp optimizer.
- ms: The moving average of squared gradients used to normalize updates.
- mom: The momentum accumulator that smooths and carries update history.
- lr: The learning rate scalar that controls the update step size.
- rho: The decay rate scalar that determines how quickly the squared-gradient average
    decays.
- momentum: The momentum scalar that controls how strongly past updates influence
    the current update.
- epsilon: A small scalar added for numerical stability to avoid division by zero.
- grad: The gradient tensor used to compute the parameter update.
