2 api_name: tensorflow.raw_ops.UniformQuantizedConvolution
3 api_description: Performs quantized convolution on equal-rank quantized input and
  filter tensors, producing a quantized output tensor.
4 api_signature: tf.raw_ops.UniformQuantizedConvolution(lhs,rhs,lhs_scales,lhs_zero_points,rhs_scales,rhs_zero_points,output_scales,output_zero_points,Tout,padding,window_strides,dimension_numbers,name)
5 api_details: ''
6 api_parameters:
- lhs: The quantized input tensor to convolve, with rank at least 3 and type `qint8`.
- rhs: The quantized convolution kernel tensor, matching `lhs` in type and rank.
- lhs_scales: Scale factor(s) used to quantize the original values represented by
    `lhs`.
- lhs_zero_points: Zero point(s) used to quantize the original values represented
    by `lhs`.
- rhs_scales: Scale factor(s) used to quantize the original values represented by
    `rhs`.
- rhs_zero_points: Zero point(s) used to quantize the original values represented
    by `rhs`.
- output_scales: Scale factor(s) used to quantize the convolution output values.
- output_zero_points: Zero point(s) used to quantize the convolution output values.
- Tout: The output tensor data type, which must be `qint32`.
- padding: 'The padding algorithm to use: `SAME`, `VALID`, or `EXPLICIT`.'
- window_strides: Optional stride values for the convolution window across spatial
    dimensions.
- dimension_numbers: Optional serialized dimension layout describing how convolution
    dimensions are arranged.
- name: Optional name for the operation.
