2 api_name: tensorflow.raw_ops.BlockLSTMGrad
3 api_description: Computes backward propagation for an LSTM over an entire time sequence,
  producing gradients for use with LSTMBlock.
4 api_signature: tf.raw_ops.BlockLSTMGrad(x,w,b,cs,h,cs_grad,h_grad,use_peephole,name)
5 api_details: ''
6 api_parameters:
- x: The input sequence tensor for the LSTM across time.
- w: The LSTM weight matrix used to compute gradients.
- b: The LSTM bias vector used to compute gradients.
- cs: The saved cell state values before the tanh activation at each time step.
- f: The saved forget gate activations for the full sequence.
- o: The saved output gate activations for the full sequence.
- h: The saved output hidden states for the full sequence.
- cs_grad: The incoming gradient with respect to the cell state.
- h_grad: The incoming gradient with respect to the hidden output.
- use_peephole: Indicates whether peephole connections are enabled in the LSTM.
- name: An optional name for the operation.
7 api_usage_example: null
8 api_shape: ''
