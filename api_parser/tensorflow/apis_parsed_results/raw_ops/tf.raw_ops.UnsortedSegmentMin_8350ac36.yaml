2 api_name: tensorflow.raw_ops.UnsortedSegmentMin
3 api_description: Computes the minimum value for each segment of a tensor based on
  `segment_ids`, returning the largest possible value for any segment with no elements.
4 api_signature: tf.raw_ops.UnsortedSegmentMin(data,segment_ids,num_segments)
5 api_details: ''
6 api_parameters:
- data: The input tensor whose values are reduced by taking the minimum within each
    segment.
- segment_ids: A tensor that assigns each slice of `data` to a segment index.
- num_segments: The total number of segments to produce in the output.
7 api_usage_example:
- c = tf.constant([[1,2,3,4], [5,6,7,8], [4,3,2,1]])
- tf.math.unsorted_segment_min(c, tf.constant([0, 1, 0]), num_segments=2).numpy()
