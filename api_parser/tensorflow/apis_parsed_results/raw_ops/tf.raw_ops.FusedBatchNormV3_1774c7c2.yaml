2 api_name: tensorflow.raw_ops.FusedBatchNormV3
3 api_description: Applies fused batch normalization to a 4D tensor using the given
  scale, offset, mean, and variance, supporting NHWC or NCHW layouts and matching
  1D parameter sizes to the channel dimension.
4 api_signature: tf.raw_ops.FusedBatchNormV3(x,scale,offset,epsilon,is_training)
5 api_details: ''
6 api_parameters:
- x: The 4D input tensor to be batch-normalized.
