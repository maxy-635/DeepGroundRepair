2 api_name: tensorflow.raw_ops.LoadTPUEmbeddingProximalYogiParameters
3 api_description: Loads Proximal Yogi optimizer parameters into TPU embedding tables
  for use during TPU embedding training.
4 api_signature: tf.raw_ops.LoadTPUEmbeddingProximalYogiParameters(parameters,v,m,num_shards,shard_id,table_id)
5 api_details: ''
6 api_parameters:
- parameters: The input parameter tensor containing the proximal Yogi optimizer values
    to load into TPU embedding state.
- v: The first momentum/variance-related tensor used by the proximal Yogi optimizer.
- m: The second momentum-related tensor used by the proximal Yogi optimizer.
- num_shards: The total number of shards the embedding parameters are divided across.
- shard_id: The index of the current shard being loaded or updated.
- table_id: The optional embedding table identifier to target, defaulting to -1 when
    unspecified.
