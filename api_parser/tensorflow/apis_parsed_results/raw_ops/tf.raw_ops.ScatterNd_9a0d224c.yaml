2 api_name: tensorflow.raw_ops.ScatterNd
3 api_description: Scatters sparse updates into a zero-initialized tensor of the given
  shape, summing updates at duplicate indices; it is the inverse of `gather_nd`.
4 api_signature: tf.raw_ops.ScatterNd(indices,updates,shape)
5 api_details: ''
6 api_parameters:
- indices: Specifies the locations in the output tensor where values from `updates`
    will be written.
- updates: Provides the values that will be scattered into the output tensor at the
    given indices.
- shape: Defines the 1-D shape of the output tensor to be created.
