2 api_name: tensorflow.raw_ops.ResourceSparseApplyAdagrad
3 api_description: Applies sparse Adagrad updates to selected rows of `var` and `accum`
  using the provided gradients, increasing the accumulator by squared gradients and
  adjusting variables with a learning-rate-scaled inverse square root step.
4 api_signature: tf.raw_ops.ResourceSparseApplyAdagrad(var,accum,lr,grad,indices)
5 api_details: ''
6 api_parameters:
- var: Resource variable holding the parameters to be updated.
- accum: Resource variable holding the accumulated squared gradients for Adagrad.
- lr: Scalar learning rate controlling the update step size.
- grad: Gradient tensor used to update the selected variable entries.
- indices: Vector of row indices in `var` and `accum` to update.
