2 api_name: tensorflow.raw_ops.StatelessRandomUniformFullIntV2
3 api_description: Generates deterministic pseudorandom integers uniformly across
  the full range of the output dtype, based on shape, key, counter, and algorithm.
4 api_signature: tf.raw_ops.StatelessRandomUniformFullIntV2(shape,key,counter,alg,dtype)
5 api_details: ''
6 api_parameters:
- shape: Specifies the dimensions of the random output tensor to generate.
- key: Provides the 64-bit key used by the counter-based random number generator.
- counter: Provides the initial 64-bit counter state used to seed the counter-based
    random number generator.
- alg: Selects which counter-based RNG algorithm to use.
- dtype: Sets the integer type of the generated random values.
