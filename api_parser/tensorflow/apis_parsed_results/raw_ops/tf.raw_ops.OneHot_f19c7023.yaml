2 api_name: tensorflow.raw_ops.OneHot
3 api_description: Creates a one-hot tensor from indices, placing on_value at indexed
  positions and off_value everywhere else, with an extra axis added at the specified
  position.
4 api_signature: tf.raw_ops.OneHot(indices,depth,on_value,off_value)
5 api_details: ''
6 api_parameters:
- indices: Specifies the positions to encode as one-hot vectors.
- depth: Sets the size of the one-hot dimension.
- on_value: Provides the value used where an index matches the active class.
- off_value: Provides the value used where an index does not match the active class.
