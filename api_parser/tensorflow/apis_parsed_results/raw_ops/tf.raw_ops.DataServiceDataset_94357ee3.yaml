- protocol: Specifies the communication protocol used to talk to the data service.
- output_types: Defines the data types of the dataset elements that will be produced.
- output_shapes: Defines the shapes of the dataset elements that will be produced.
- target_workers: Controls which workers should be targeted when consuming data, defaulting
    to automatic selection.
- name: Assigns an optional name to the operation for easier identification.
