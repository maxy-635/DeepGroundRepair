4 api_signature: tf.raw_ops.DataServiceDataset(dataset_id,processing_mode,address,protocol,output_types,output_shapes,target_workers,name)
5 api_details: ''
6 api_parameters:
- dataset_id: Identifies the remote dataset to read from the data service.
- processing_mode: Specifies how input data should be processed or distributed by
    the data service.
