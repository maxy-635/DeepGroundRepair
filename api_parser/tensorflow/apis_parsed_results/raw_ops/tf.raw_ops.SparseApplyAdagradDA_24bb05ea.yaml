2 api_name: tensorflow.raw_ops.SparseApplyAdagradDA
3 api_description: Applies a proximal Adagrad update to sparse variable entries, adjusting
  `var` and `accum` using the provided gradients, learning rate, regularization, and
  clipping parameters.
