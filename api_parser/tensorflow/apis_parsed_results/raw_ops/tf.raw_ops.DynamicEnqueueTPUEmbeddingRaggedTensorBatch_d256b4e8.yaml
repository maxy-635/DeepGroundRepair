2 api_name: tensorflow.raw_ops.DynamicEnqueueTPUEmbeddingRaggedTensorBatch
3 api_description: Enqueues a ragged tensor batch of embedding inputs to TPU embedding
  tables dynamically, using per-feature metadata such as sample indices and row splits.
4 api_signature: tf.raw_ops.DynamicEnqueueTPUEmbeddingRaggedTensorBatch(sample_splits,embedding_indices,aggregation_weights,table_ids,combiners,max_sequence_lengths)
5 api_details: ''
6 api_parameters:
- sample_splits: Defines how each ragged sample is split into rows or segments for
    each input feature.
- embedding_indices: Provides the embedding IDs or indices to enqueue for each sample
    split.
- aggregation_weights: Supplies per-index weights used when aggregating embedding
    lookups.
- table_ids: Identifies which embedding table each input feature should target.
- combiners: Specifies the aggregation method to use for each table, such as sum or
    mean.
- max_sequence_lengths: Sets the maximum sequence length for each table when handling
    sequence features.
