2 api_name: tensorflow.raw_ops.CudnnRNNV3
3 api_description: Runs a cuDNN-backed RNN/LSTM/GRU forward pass using input, initial
  state, params, and sequence lengths, and returns the output and final states; optionally
  produces reserve space for training.
4 api_signature: tf.raw_ops.CudnnRNNV3(input,input_h,input_c,params,rnn_mode,direction,is_training,name)
5 api_details: ''
6 api_parameters:
- input: The input sequence tensor fed into the CuDNN RNN.
- input_h: The initial hidden state tensor for the RNN.
- input_c: The initial cell state tensor for the RNN, used for LSTM-style cells.
- params: The flattened weight and bias parameters for the CuDNN RNN.
- rnn_mode: Selects the RNN cell type to run, such as LSTM, GRU, or vanilla RNN.
- direction: Chooses whether the RNN runs in one direction or both directions.
- is_training: Indicates whether the operation is being used for training or inference.
- name: An optional name used to label the operation in the graph.
