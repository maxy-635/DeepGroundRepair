2 api_name: tensorflow.raw_ops.ExperimentalGroupByReducerDataset
3 api_description: Creates a dataset that groups input elements by key and reduces
  each group using a specified reducer.
4 api_signature: tf.raw_ops.ExperimentalGroupByReducerDataset(input_dataset,key_func,init_func,reduce_func,finalize_func,output_types,output_shapes,name)
5 api_details: ''
6 api_parameters:
- input_dataset: Provides the input dataset as a variant tensor that the reducer will
    process.
- key_func: Computes an int64 key for each input element to determine which group
    it belongs to.
- init_func: Creates the initial reducer state for each group key.
- reduce_func: Updates the reducer state by combining the current state with each
    new element in the group.
- finalize_func: Transforms the final reducer state into the output element for each
    group.
- output_types: Specifies the data types of the dataset elements produced by the operation.
- output_shapes: Specifies the shapes of the dataset elements produced by the operation.
- name: Optionally assigns a name to the operation.
