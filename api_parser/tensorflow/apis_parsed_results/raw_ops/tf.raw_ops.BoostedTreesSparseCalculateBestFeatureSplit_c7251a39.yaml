- stats_summary_values: Provides the corresponding numeric values for each sparse
    stats summary entry.
- stats_summary_shape: Defines the dense shape of the sparse stats summary tensor.
- logits_dimension: Sets the number of logit dimensions or classes used to interpret
    the statistics.
- split_type: Chooses whether the split search uses inequality or equality comparisons.
- name: Assigns an optional name to the operation.
