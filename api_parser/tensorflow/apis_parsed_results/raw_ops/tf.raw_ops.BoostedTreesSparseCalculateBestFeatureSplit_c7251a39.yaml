2 api_name: tensorflow.raw_ops.BoostedTreesSparseCalculateBestFeatureSplit
3 api_description: Computes split gains for each feature and returns the best threshold,
  gain, and left/right node contributions for each splittable node, along with the
  node IDs each feature can split.
4 api_signature: tf.raw_ops.BoostedTreesSparseCalculateBestFeatureSplit(node_id_range,stats_summary_indices,stats_summary_values,stats_summary_shape,logits_dimension,split_type,name)
5 api_details: ''
6 api_parameters:
- node_id_range: Specifies the inclusive-exclusive range of tree node IDs whose split
    statistics should be processed.
- stats_summary_indices: Provides the sparse tensor indices for per-node, per-feature,
