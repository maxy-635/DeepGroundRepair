2 api_name: tensorflow.raw_ops.CollectiveReduceScatterV2
3 api_description: Mutually reduces same-shaped tensors, then scatters the reduced
  result across participants; stateless mode uses runtime-unique keys to distinguish
  collective groups.
4 api_signature: tf.raw_ops.CollectiveReduceScatterV2(input,group_size,group_key,instance_key,merge_op,final_op)
5 api_details: ''
6 api_parameters:
- input: The tensor to be reduced and then scattered across participating devices.
- group_size: The number of devices participating in the collective operation.
- group_key: An integer identifier that groups related collective operations together.
- instance_key: An integer identifier that distinguishes this specific collective
    operation instance.
- merge_op: The reduction operation used to combine values across devices before scattering.
- final_op: The final transformation applied after reduction, either leaving values
    unchanged or dividing them by the group size.
