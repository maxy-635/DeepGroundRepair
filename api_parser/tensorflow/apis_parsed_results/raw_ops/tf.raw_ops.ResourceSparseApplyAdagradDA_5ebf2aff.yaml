4 api_signature: tf.raw_ops.ResourceSparseApplyAdagradDA(var,grad,indices,lr,l1,l2,global_step)
5 api_details: ''
6 api_parameters:
- var: Resource variable to be updated in place by the sparse AdagradDA optimization
