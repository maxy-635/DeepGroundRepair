2 api_name: tensorflow.raw_ops.Fingerprint
3 api_description: Computes per-batch fingerprints for the raw contents of each data
  slice along the first dimension, returning each hash as a little-endian byte array
  and ignoring tensor metadata like shape and dtype.
4 api_signature: tf.raw_ops.Fingerprint(data,method)
5 api_details: ''
6 api_parameters:
