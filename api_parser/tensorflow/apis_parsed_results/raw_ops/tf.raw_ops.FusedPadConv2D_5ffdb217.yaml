2 api_name: tensorflow.raw_ops.FusedPadConv2D
3 api_description: Fuses padding with Conv2D preprocessing in NHWC format to reduce
  intermediate memory use and improve latency.
4 api_signature: tf.raw_ops.FusedPadConv2D(input,paddings,filter,strides,padding)
5 api_details: ''
6 api_parameters:
- input: The 4-D input tensor to be padded and convolved, with shape [batch, in_height,
