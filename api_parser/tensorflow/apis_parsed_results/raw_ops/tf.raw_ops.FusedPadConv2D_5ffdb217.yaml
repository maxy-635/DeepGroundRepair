- paddings: An int32 matrix that specifies how much padding to add for each input
    dimension.
- filter: The 4-D convolution kernel tensor, matching the input type and shaped [filter_height,
    filter_width, in_channels, out_channels].
- strides: A 4-element list that sets the sliding-window stride for each input dimension.
- padding: A string that selects the padding algorithm, either `SAME` or `VALID`.
