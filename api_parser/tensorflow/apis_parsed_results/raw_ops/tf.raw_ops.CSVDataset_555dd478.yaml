2 api_name: tensorflow.raw_ops.CSVDataset
3 api_description: Creates a dataset from one or more CSV files by parsing rows into
  columns, with options to select records, control delimiters, defaults, and output
  dtypes/shapes.
4 api_signature: tf.raw_ops.CSVDataset(filenames,record_defaults,field_delim,header,name)
5 api_details: ''
6 api_parameters:
- filenames: Specifies the CSV file paths to read from.
- header: Indicates whether the first row contains column names and should be skipped.
- field_delim: Sets the character string used to separate fields in each CSV record.
- record_defaults: Provides default values and expected types for each CSV column
    when data is missing or parsing needs guidance.
- name: Assigns an optional name to the operation.
