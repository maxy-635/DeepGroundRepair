2 api_name: tensorflow.raw_ops.Conv2DBackpropFilterV2
3 api_description: Computes the gradient of a convolution operation with respect to
  the filter weights, given the input and output gradients.
4 api_signature: tf.raw_ops.Conv2DBackpropFilterV2(input,filter,out_backprop,strides,padding,name)
5 api_details: ''
6 api_parameters:
- input: The input feature map tensor used to compute gradients for the convolution
    filter.
