    filter to compute.
- out_backprop: The gradient tensor from the convolution output used as backpropagated
    error signal.
- strides: The sliding-window stride for each input dimension of the convolution.
- padding: The padding scheme that controls how the convolution windows are applied
    at the borders.
- name: An optional operation name for identifying this TensorFlow op.
