2 api_name: tensorflow.raw_ops.ResourceApplyAdamWithAmsgrad
3 api_description: Applies the Adam optimizer with AMSGrad to update a variable using
  the current gradient, first and second moment estimates, and the running maximum
  of the second moment for more stable adaptive learning-rate updates.
4 api_signature: tf.raw_ops.ResourceApplyAdamWithAmsgrad(var,m,v,vhat,grad,lr,beta1,beta2,epsilon)
5 api_details: ''
6 api_parameters:
- var: The variable tensor whose value will be updated by the Adam-with-Amsgrad optimizer.
- m: The first-moment accumulator that stores the momentum estimate for the variable.
- v: The second-moment accumulator that stores the uncapped squared-gradient estimate.
- vhat: The maximum second-moment accumulator used by Amsgrad to track the running
    maximum of squared gradients.
- lr: The scalar learning rate that controls the update step size.
- beta1: The scalar decay rate for the first-moment momentum estimate.
- beta2: The scalar decay rate for the second-moment estimate.
- epsilon: The small scalar constant added for numerical stability.
- grad: The gradient tensor used to compute the parameter update.
7 api_usage_example: null
