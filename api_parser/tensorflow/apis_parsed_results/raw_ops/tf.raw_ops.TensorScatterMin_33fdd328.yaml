2 api_name: tensorflow.raw_ops.TensorScatterMin
3 api_description: Applies an elementwise minimum update to a tensor at specified
  indices, returning a new tensor with the scattered minimum values.
4 api_signature: tf.raw_ops.TensorScatterMin(tensor,indices,updates)
5 api_details: ''
6 api_parameters:
- tensor: The tensor whose values will be updated in place by taking elementwise minima
    at the specified indices.
- indices: The integer indices that identify which positions in the tensor should
    be updated.
- updates: The values to compare against the existing tensor values and scatter into
    the output using the minimum operation.
