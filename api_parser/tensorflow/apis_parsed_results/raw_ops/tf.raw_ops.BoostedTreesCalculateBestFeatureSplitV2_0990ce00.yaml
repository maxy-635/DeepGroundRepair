2 api_name: tensorflow.raw_ops.BoostedTreesCalculateBestFeatureSplitV2
3 api_description: Computes the best split candidate for each splittable node and
  feature in boosted trees, returning per-node gains, thresholds, and left/right contributions
  along with the corresponding node IDs; nodes that cannot be split on a feature are
  omitted.
4 api_signature: tf.raw_ops.BoostedTreesCalculateBestFeatureSplitV2(candidate_feature_ids,stats_summaries_list,split_types)
5 api_details: ''
6 api_parameters:
- stats_summaries_list: Provides per-node, per-feature, per-bucket accumulated statistics
    used to evaluate candidate splits and choose the best one.
- split_types: Specifies whether each feature should use an inequality split or an
    equality split.
- candidate_feature_ids: Lists the real feature IDs corresponding to the candidate
