- reduce_func: Defines how to reduce the elements collected in each group/window.
- window_size_func: Determines the window size for each group based on the input element.
- output_types: Specifies the data types of the dataset elements produced by the operation.
- output_shapes: Specifies the shapes of the dataset elements produced by the operation.
