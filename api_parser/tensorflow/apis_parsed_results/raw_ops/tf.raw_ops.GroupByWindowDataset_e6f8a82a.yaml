2 api_name: tensorflow.raw_ops.GroupByWindowDataset
3 api_description: Creates a dataset that groups elements from `input_dataset` into
  windows and computes grouped results for each window.
4 api_signature: tf.raw_ops.GroupByWindowDataset(input_dataset,key_func,reduce_func,window_size_func,output_types,output_shapes)
5 api_details: ''
6 api_parameters:
- input_dataset: The source dataset to read elements from and group into windows.
