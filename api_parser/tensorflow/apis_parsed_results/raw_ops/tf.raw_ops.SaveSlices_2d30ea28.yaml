2 api_name: tensorflow.raw_ops.SaveSlices
3 api_description: Saves tensor slices to disk, recording each slice’s position within
  a larger tensor shape so they can be restored as parts of full tensors later.
4 api_signature: tf.raw_ops.SaveSlices(filename,tensor_names,shapes_and_slices,data)
5 api_details: ''
6 api_parameters:
- filename: Specifies the output file path where the tensors will be saved.
- tensor_names: Lists the names of the tensors being written to the file.
- shapes_and_slices: Provides the shape and slice layout used to save each tensor.
- data: Contains the tensor values that will be saved.
- name: Optionally assigns a name to the operation.
