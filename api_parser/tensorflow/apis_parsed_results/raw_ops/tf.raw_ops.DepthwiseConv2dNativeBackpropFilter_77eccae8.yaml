2 api_name: tensorflow.raw_ops.DepthwiseConv2dNativeBackpropFilter
3 api_description: Computes the gradient of a depthwise convolution with respect to
  the filter weights.
4 api_signature: tf.raw_ops.DepthwiseConv2dNativeBackpropFilter(input,filter_sizes,out_backprop,strides,padding,data_format,dilations,name)
5 api_details: ''
6 api_parameters:
- input: The forward input tensor whose values are used, along with `out_backprop`,
    to compute the filter gradient.
- filter_sizes: The shape of the depthwise filter to backpropagate for, specifying
    the filter height, width, input channels, and depthwise multiplier.
- out_backprop: The gradient tensor flowing back from the convolution output, used
    to compute gradients with respect to the filter.
- strides: The sliding-window step sizes applied across the input dimensions during
    the convolution backpropagation calculation.
- padding: The padding mode that determines how borders are handled when computing
    the gradient.
- data_format: The layout of the input and output tensors, such as NHWC or NCHW.
- dilations: The spacing between filter elements along each spatial dimension when
    computing the gradient.
- name: An optional operation name used to label the TensorFlow op.
