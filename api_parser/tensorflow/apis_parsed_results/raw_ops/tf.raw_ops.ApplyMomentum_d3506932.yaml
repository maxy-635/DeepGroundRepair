2 api_name: tensorflow.raw_ops.ApplyMomentum
3 api_description: Applies the momentum optimization update to a variable using a
  gradient and accumulator, optionally using Nesterov momentum.
4 api_signature: tf.raw_ops.ApplyMomentum(var,accum,lr,grad,momentum)
5 api_details: ''
6 api_parameters:
- var: The variable being updated in place by the momentum optimization step.
- accum: The accumulator that stores the running momentum state for the variable.
- lr: The scalar learning rate that controls the size of the update.
- grad: The gradient tensor used to compute the update direction.
- momentum: The scalar momentum factor that determines how much past updates influence
    the current step.
