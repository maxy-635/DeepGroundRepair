2 api_name: tensorflow.raw_ops.LoadTPUEmbeddingAdagradParameters
3 api_description: Loads Adagrad embedding optimizer parameters into TPU HBM for embedding
  tables, typically from a checkpoint after TPU embedding host configuration.
4 api_signature: tf.raw_ops.LoadTPUEmbeddingAdagradParameters(parameters,accumulators,num_shards,shard_id,table_id,table_name)
5 api_details: ''
6 api_parameters:
- parameters: Holds the Adagrad parameter values to be loaded into TPU embedding state.
- accumulators: Holds the Adagrad accumulator values to be loaded into TPU embedding
    state.
- num_shards: Specifies the total number of shards that make up the embedding table.
- shard_id: Specifies which shard this operation is responsible for loading.
- table_id: Optionally identifies the embedding table by numeric ID, defaulting to
    -1 when unset.
- table_name: Optionally identifies the embedding table by name, defaulting to an
    empty string when unset.
- name: Sets an optional name for the operation.
