2 api_name: tensorflow.config.get_logical_device_configuration
3 api_description: Returns the previously set virtual (logical) device configuration
  for a physical TensorFlow device.
4 api_signature: tf.config.get_logical_device_configuration(device)
5 api_details: ''
6 api_parameters:
- device: The physical device whose logical device configuration you want to retrieve.
7 api_usage_example:
- physical_devices = tf.config.list_physical_devices('CPU')
