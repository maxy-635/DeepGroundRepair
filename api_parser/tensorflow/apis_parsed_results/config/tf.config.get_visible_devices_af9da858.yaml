2 api_name: tensorflow.config.get_visible_devices
3 api_description: Returns the physical devices currently visible to TensorFlow's
  runtime, such as GPUs or CPUs.
4 api_signature: tf.config.get_visible_devices(device_type)
5 api_details: ''
6 api_parameters:
- device_type: Filters the returned devices to only those matching the specified device
    type, such as `CPU` or `GPU`.
7 api_usage_example:
- physical_devices = tf.config.list_physical_devices('GPU')
- 'try:'
- '  # Disable all GPUS'
- '  tf.config.set_visible_devices([], ''GPU'')'
- '  visible_devices = tf.config.get_visible_devices()'
- '  for device in visible_devices:'
- '    assert device.device_type != ''GPU'''
- 'except:'
- '  # Invalid device or cannot modify virtual devices once initialized.'
- '  pass'
