2 api_name: tensorflow.linalg.LinearOperatorCirculant
3 api_description: Represents a batched circulant linear operator that behaves like
  an N x N circulant matrix without materializing it, supporting broadcasting across
  batch dimensions.
4 api_signature: tf.linalg.LinearOperatorCirculant(spectrum,input_output_dtype,is_non_singular,is_self_adjoint,is_positive_definite,is_square)
5 api_details: ''
6 api_parameters:
- spectrum: Provides the eigenvalues/DFT spectrum that defines the circulant operator.
- input_output_dtype: Sets the dtype used for inputs and outputs of the operator.
- is_non_singular: Declares that the operator is assumed to be invertible.
- is_self_adjoint: Declares that the operator is assumed to equal its Hermitian transpose.
- is_positive_definite: Declares that the operator is assumed to be positive definite.
- is_square: Declares that the operator is assumed to represent square matrices.
7 api_usage_example: null
8 api_shape: ''
