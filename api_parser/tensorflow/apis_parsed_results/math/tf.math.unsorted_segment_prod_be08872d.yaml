2 api_name: tensorflow.math.unsorted_segment_prod
3 api_description: Computes the product of tensor values grouped by unsorted segment
  IDs, producing one product per segment.
4 api_signature: tf.math.unsorted_segment_prod(data,segment_ids,num_segments)
5 api_details: ''
6 api_parameters:
- data: Input tensor whose values are multiplied within each segment.
- segment_ids: Tensor of segment labels that assigns each element in `data` to a segment.
- num_segments: Total number of output segments to produce.
