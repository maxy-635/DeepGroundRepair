2 api_name: tensorflow.math.approx_max_k
3 api_description: Returns the top k largest values and their indices from an input
  tensor using an approximate algorithm, optimized for TPU.
4 api_signature: tf.math.approx_max_k(operand,k,reduction_dimension,recall_target)
5 api_details: ''
6 api_parameters:
- operand: The floating-point array to search for the top-k maximum values.
- k: The number of maximum values to return.
- reduction_dimension: The dimension along which to perform the top-k search, defaulting
    to the last axis.
- recall_target: The desired recall level used to control the approximation accuracy.
7 api_usage_example:
- import tensorflow as tf
- '@tf.function(jit_compile=True)'
- 'def mips(qy, db, k=10, recall_target=0.95):'
- '  dists = tf.einsum(''ik,jk->ij'', qy, db)'
- '  # returns (f32[qy_size, k], i32[qy_size, k])'
- '  return tf.nn.approx_max_k(dists, k=k, recall_target=recall_target)'
- qy = tf.random.uniform((256,128))
- db = tf.random.uniform((2048,128))
- dot_products, neighbors = mips(qy, db, k=20)
8 api_shape: ''
