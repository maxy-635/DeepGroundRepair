2 api_name: tensorflow.math.reduce_variance
3 api_description: Computes the variance of a tensor's elements along specified axes,
  or across all dimensions if `axis` is None.
4 api_signature: tf.math.reduce_variance(input_tensor,axis)
5 api_details: ''
6 api_parameters:
- input_tensor: The tensor whose values are used to compute the variance.
- axis: The dimension or dimensions to reduce when calculating the variance.
7 api_usage_example:
- x = tf.constant([[1., 2.], [3., 4.]])
- tf.math.reduce_variance(x)
- tf.math.reduce_variance(x, 0)
- tf.math.reduce_variance(x, 1)
