2 api_name: tensorflow.math.segment_sum
3 api_description: Sums tensor values within each segment ID, producing one output
  per segment and 0 for any empty segment.
4 api_signature: tf.math.segment_sum(data,segment_ids)
5 api_details: ''
6 api_parameters:
- data: The tensor of values to be summed within each segment.
- segment_ids: A 1-D tensor of sorted, possibly repeated segment labels that determines
    which first-dimension entries are grouped and summed.
7 api_usage_example:
- c = tf.constant([[1,2,3,4], [4, 3, 2, 1], [5,6,7,8]])
- tf.math.segment_sum(c, tf.constant([0, 0, 1])).numpy()
8 api_shape: ''
