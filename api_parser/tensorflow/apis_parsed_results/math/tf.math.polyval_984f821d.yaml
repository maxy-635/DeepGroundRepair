2 api_name: tensorflow.math.polyval
3 api_description: Evaluates a polynomial elementwise on x using Horner's method from
  a list of coefficients.
4 api_signature: tf.math.polyval(coeffs,x)
5 api_details: ''
6 api_parameters:
- coeffs: Specifies the polynomial coefficients to evaluate, with each tensor contributing
    a coefficient term.
- x: Provides the input tensor value at which the polynomial is evaluated.
7 api_usage_example:
