2 api_name: tensorflow.sparse.map_values
3 api_description: Applies an operation to the values of one or more SparseTensors,
  preserving their indices and dense shape in the returned SparseTensor.
4 api_signature: tf.sparse.map_values(op,*args)
5 api_details: ''
6 api_parameters:
