5 api_details: ''
6 api_parameters:
- tensor: The input tensor whose values are used to compute the norm.
- ord: Specifies the norm order, such as Euclidean, Frobenius, p-norm, or other supported
    norm types.
- axis: Selects which axis or axes to reduce over, determining whether the norm is
    computed for a vector, batch of vectors, or batch of matrices.
