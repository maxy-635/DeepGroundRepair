2 api_name: tensorflow.keras.ops.diag
3 api_description: Returns the diagonal of a tensor or builds a diagonal tensor from
  a 1D input.
4 api_signature: tf.keras.ops.diag(x,k)
5 api_details: ''
6 api_parameters:
- x: Input tensor; extracts its k-th diagonal if 2-D, or places its values on the
    k-th diagonal of a 2-D tensor if 1-D.
- k: Selects which diagonal to use, with 0 as the main diagonal, positive values above
    it, and negative values below it.
7 api_usage_example:
- ops.diag(ops.diag(x)))
8 api_shape: ''
