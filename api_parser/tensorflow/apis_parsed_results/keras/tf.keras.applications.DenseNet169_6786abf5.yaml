2 api_name: tensorflow.keras.applications.DenseNet169
3 api_description: Builds the DenseNet169 image classification model, optionally loading
  ImageNet pretrained weights, using the Keras data format configured in ~/.keras/keras.json.
4 api_signature: tf.keras.applications.DenseNet169(include_top,weights,input_shape,pooling,classes)
5 api_details: ''
6 api_parameters:
- include_top: Controls whether the model ends with its built-in classification head.
- weights: Selects pretrained weights to load, random initialization, or a custom
    weight file.
- input_shape: Sets the input tensor shape when using the model without the top classification
    layer.
- pooling: Chooses the global pooling method used to convert feature maps into vectors
    when `include_top` is False.
- classes: Specifies the number of output classes for the final classification layer
    when training from scratch.
