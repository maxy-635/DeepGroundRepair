2 api_name: tensorflow.keras.losses.CategoricalCrossentropy
3 api_description: Computes crossentropy loss for multi-class one-hot labels and predictions,
  returning a loss value for each batch.
4 api_signature: tf.keras.losses.CategoricalCrossentropy(from_logits,label_smoothing)
5 api_details: ''
