2 api_name: tensorflow.keras.applications.EfficientNetV2S
3 api_description: Builds the EfficientNetV2S image classification model, with optional
  ImageNet pretrained weights for transfer learning and fine-tuning.
4 api_signature: tf.keras.applications.EfficientNetV2S(weights,include_top,input_shape,pooling,classes)
5 api_details: ''
6 api_parameters:
- include_top: Controls whether the model includes the final classification layer.
- weights: Specifies whether to load pretrained weights, use random initialization,
    or load weights from a file.
- input_shape: Defines the input tensor shape when building the model without the
    top classification layer.
- pooling: Chooses the global pooling method applied to the output when the top layer
    is omitted.
- classes: Sets the number of output classes for classification when using a custom
    top layer without pretrained weights.
