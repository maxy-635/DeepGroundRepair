3 api_description: Returns the promoted dtype for the given inputs by standardizing
  their dtypes and applying Keras type promotion rules to find their least upper bound.
4 api_signature: tf.keras.backend.result_type(*dtypes)
5 api_details: ''
6 api_parameters:
