2 api_name: tensorflow.keras.optimizers.schedules.PolynomialDecay
3 api_description: Applies a polynomial learning-rate decay from an initial value
  to an end value over a fixed number of optimizer steps.
4 api_signature: tf.keras.optimizers.schedules.PolynomialDecay(initial_learning_rate,decay_steps,end_learning_rate,power)
5 api_details: ''
6 api_parameters:
- initial_learning_rate: Sets the starting learning rate for the schedule.
- decay_steps: Specifies how many steps it takes to decay toward the end learning
    rate.
- end_learning_rate: Sets the minimum learning rate the schedule will decay to.
- power: Controls the shape of the decay curve, with higher values changing the polynomial
    rate of decay.
