- weights: Selects pretrained weights to load, random initialization, or a custom
    weights file.
- input_shape: Specifies the input tensor shape when omitting the top classification
    layer, with 3 channels required.
- classes: Sets the number of output classes when using the top layer without pretrained
    weights.
