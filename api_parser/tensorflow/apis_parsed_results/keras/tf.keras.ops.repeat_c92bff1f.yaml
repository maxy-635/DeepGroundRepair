2 api_name: tensorflow.keras.ops.repeat
3 api_description: Repeats each tensor element a specified number of times along a
  given axis, or flattens and repeats when no axis is provided.
4 api_signature: tf.keras.ops.repeat(x,repeats,axis)
5 api_details: ''
6 api_parameters:
- x: The input tensor whose values will be repeated.
