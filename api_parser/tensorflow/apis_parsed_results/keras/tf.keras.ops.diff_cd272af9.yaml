2 api_name: tensorflow.keras.ops.diff
3 api_description: Computes the n-th discrete difference of an array along a specified
  axis by subtracting each element from the next, recursively for higher-order differences.
4 api_signature: '"tf.keras.ops.diff(a,n,axis)"'
5 api_details: ''
6 api_parameters:
- a: The input tensor whose values will be differenced.
- n: The number of times to apply the discrete difference operation.
- axis: The axis along which to compute the discrete differences.
7 api_usage_example:
- x = ops.convert_to_tensor([[1, 3, 6, 10], [0, 5, 6, 8]])
- ops.diff(x)
- ops.diff(x, axis=0)
