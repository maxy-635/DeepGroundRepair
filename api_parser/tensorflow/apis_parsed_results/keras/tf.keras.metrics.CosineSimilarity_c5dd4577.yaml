2 api_name: tensorflow.keras.metrics.CosineSimilarity
3 api_description: Computes and tracks the average cosine similarity between labels
  and predictions over a stream of batches.
4 api_signature: tf.keras.metrics.CosineSimilarity(axis)
5 api_details: ''
6 api_parameters:
- axis: Specifies the dimension along which cosine similarity is calculated, with
    `-1` as the default last axis.
7 api_usage_example:
- '# l2_norm(y_true) = [[0., 1.], [1./1.414, 1./1.414]]'
- '# l2_norm(y_pred) = [[1., 0.], [1./1.414, 1./1.414]]'
- '# l2_norm(y_true) . l2_norm(y_pred) = [[0., 0.], [0.5, 0.5]]'
- '# result = mean(sum(l2_norm(y_true) . l2_norm(y_pred), axis=1))'
- '#        = ((0. + 0.) +  (0.5 + 0.5)) / 2'
- m = keras.metrics.CosineSimilarity(axis=1)
- m.update_state([[0., 1.], [1., 1.]], [[1., 0.], [1., 1.]])
- m.result()
- m.reset_state()
- m.update_state([[0., 1.], [1., 1.]], [[1., 0.], [1., 1.]],
- '               sample_weight=[0.3, 0.7])'
- m.result()
8 api_shape: ''
