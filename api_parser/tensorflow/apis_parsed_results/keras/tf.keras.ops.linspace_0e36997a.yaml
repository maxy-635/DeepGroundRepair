2 api_name: tensorflow.keras.ops.linspace
3 api_description: Generate `num` evenly spaced values between `start` and `stop`,
  with an option to exclude the endpoint.
4 api_signature: tf.keras.ops.linspace(start,stop,num,endpoint,dtype)
5 api_details: ''
6 api_parameters:
- start: Sets the first value of the generated sequence.
- stop: Sets the final value of the sequence, or the excluded upper bound when `endpoint`
    is `False`.
- num: Specifies how many evenly spaced samples to generate.
- endpoint: Controls whether `stop` is included as the last sample.
- dtype: Specifies the output tensor's data type.
