2 api_name: tensorflow.keras.ops.in_top_k
3 api_description: Returns a boolean tensor indicating whether each target label is
  among the top-k predicted values for its corresponding sample.
4 api_signature: tf.keras.ops.in_top_k(targets,predictions,k)
5 api_details: ''
6 api_parameters:
- targets: Provides the true labels used to check whether the correct class appears
    among the top predictions.
- predictions: Provides the predicted scores or labels that are ranked to determine
    the top-k results.
- k: Sets how many of the highest-ranked predictions to consider when checking for
    inclusion of the true label.
7 api_usage_example:
- targets = keras.ops.convert_to_tensor([2, 5, 3])
- predictions = keras.ops.convert_to_tensor(
- '[[0.1, 0.4, 0.6, 0.9, 0.5],'
- ' [0.1, 0.7, 0.9, 0.8, 0.3],'
- ' [0.1, 0.6, 0.9, 0.9, 0.5]])'
- in_top_k(targets, predictions, k=3)
8 api_shape: ''
