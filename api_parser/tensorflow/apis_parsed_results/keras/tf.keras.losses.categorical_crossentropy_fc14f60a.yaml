2 api_name: tensorflow.keras.losses.categorical_crossentropy
3 api_description: Computes the categorical crossentropy loss between one-hot encoded
  targets and predicted probabilities.
4 api_signature: tf.keras.losses.categorical_crossentropy(y_true,y_pred)
5 api_details: ''
6 api_parameters:
- y_true: Supplies the one-hot encoded ground-truth class labels used to compute the
    loss.
- y_pred: Supplies the model’s predicted class probabilities used to compare against
    the true labels.
7 api_usage_example:
- y_true = [[0, 1, 0], [0, 0, 1]]
- y_pred = [[0.05, 0.95, 0], [0.1, 0.8, 0.1]]
- loss = keras.losses.categorical_crossentropy(y_true, y_pred)
- assert loss.shape == (2,)
- loss
