2 api_name: tensorflow.keras.applications.EfficientNetB7
3 api_description: Builds the EfficientNetB7 image classification model, optionally
  with ImageNet pretrained weights, for classification or transfer learning.
4 api_signature: tf.keras.applications.EfficientNetB7(include_top,weights,input_shape,pooling,classes)
5 api_details: ''
6 api_parameters:
- include_top: Controls whether the model includes the final classification layer.
- weights: Selects the pretrained weights to load, uses random initialization, or
    points to a custom weights file.
- input_shape: Sets the input tensor shape when using the model without the top classification
    layer.
- pooling: Chooses the global pooling mode for feature extraction when the top layer
    is omitted.
- classes: Specifies how many output classes the classifier should predict when the
    top layer is included.
