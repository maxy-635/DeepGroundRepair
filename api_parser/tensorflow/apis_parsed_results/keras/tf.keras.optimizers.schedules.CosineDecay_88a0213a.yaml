2 api_name: tensorflow.keras.optimizers.schedules.CosineDecay
3 api_description: A learning-rate schedule that linearly warms up from an initial
  value to a target over a set number of steps, then applies cosine decay toward a
  minimum value based on the current optimizer step.
4 api_signature: tf.keras.optimizers.schedules.CosineDecay(initial_learning_rate,decay_steps,alpha,warmup_target,warmup_steps)
5 api_details: ''
6 api_parameters:
- initial_learning_rate: Sets the starting learning rate used by the schedule.
- decay_steps: Specifies how many training steps the learning rate takes to decay
    over.
- alpha: Sets the minimum learning rate as a fraction of the initial learning rate.
- warmup_target: Sets the target learning rate reached after the warmup phase, or
    skips warmup if `None`.
- warmup_steps: Specifies how many steps are used to warm up the learning rate.
