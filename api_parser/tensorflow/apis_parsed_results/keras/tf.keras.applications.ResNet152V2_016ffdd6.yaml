2 api_name: tensorflow.keras.applications.ResNet152V2
3 api_description: Builds the ResNet152V2 image classification model architecture
  for use in training, transfer learning, and fine-tuning.
4 api_signature: tf.keras.applications.ResNet152V2(weights,input_shape,pooling,classes)
5 api_details: ''
6 api_parameters:
- weights: Chooses whether to use random initialization, ImageNet-pretrained weights,
    or a custom weights file.
- input_shape: Sets the input tensor shape when not using the top classification layer,
    with 3 channels and minimum spatial size of 32.
- pooling: Specifies the global pooling method to use for feature extraction when
    the top layer is excluded.
- classes: Defines the number of output classes for classification when using the
    top layer without pretrained weights.
