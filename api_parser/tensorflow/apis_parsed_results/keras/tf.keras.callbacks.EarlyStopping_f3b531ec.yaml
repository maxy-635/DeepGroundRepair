2 api_name: tensorflow.keras.callbacks.EarlyStopping
3 api_description: Stops training early when a monitored metric, such as loss, stops
  improving for a set patience, based on the chosen mode and min_delta.
4 api_signature: tf.keras.callbacks.EarlyStopping(monitor,patience,mode,restore_best_weights)
5 api_details: ''
6 api_parameters:
- monitor: The metric to track during training to decide when to stop.
- patience: The number of epochs to wait without improvement before stopping.
- mode: 'The optimization direction for the monitored metric: decrease, increase,
    or auto-detect.'
- restore_best_weights: Whether to restore the model weights from the best epoch after
    training stops.
7 api_usage_example:
- callback = keras.callbacks.EarlyStopping(monitor='loss',
- '                                              patience=3)'
- '# This callback will stop the training when there is no improvement in'
- '# the loss for three consecutive epochs.'
- model = keras.models.Sequential([keras.layers.Dense(10)])
- model.compile(keras.optimizers.SGD(), loss='mse')
- history = model.fit(np.arange(100).reshape(5, 20), np.zeros(5),
- '                    epochs=10, batch_size=1, callbacks=[callback],'
- '                    verbose=0)'
- 'len(history.history[''loss''])  # Only 4 epochs are run.'
