2 api_name: tensorflow.keras.applications.DenseNet201
3 api_description: Builds the DenseNet201 image classification model and can optionally
  load ImageNet-pretrained weights using the Keras data format configuration.
4 api_signature: tf.keras.applications.DenseNet201(weights,include_top,input_shape,pooling,classes)
5 api_details: ''
6 api_parameters:
- include_top: Controls whether the model ends with its original classification layer.
- weights: Selects the initial weights to use, either random, ImageNet-pretrained,
    or a custom weights file.
- input_shape: Sets the input tensor shape when using the model without the top classification
    layer.
- pooling: Chooses the global pooling method to apply when the top classification
    layer is omitted.
- classes: Specifies how many output classes the model should predict when building
    a custom classifier head.
