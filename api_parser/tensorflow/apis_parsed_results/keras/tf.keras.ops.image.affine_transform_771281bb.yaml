2 api_name: tensorflow.keras.ops.image.affine_transform
3 api_description: Applies affine transformations to one or more images, transforming
  their spatial layout using the provided transform parameters.
4 api_signature: tf.keras.ops.image.affine_transform(image,transform)
5 api_details: ''
6 api_parameters:
- image: The input image or batch of images to transform, provided as a 3D or 4D tensor.
- transform: The projective transform coefficients that map each output point back
    to a corresponding input point, with optional perspective terms supported only
    on the TensorFlow backend.
