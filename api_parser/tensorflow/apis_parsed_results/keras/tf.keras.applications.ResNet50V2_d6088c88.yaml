6 api_parameters:
- include_top: Controls whether the model includes its final classification layer.
- weights: Specifies the source of pretrained weights, or uses random initialization
    if set to None.
- input_shape: Defines the input tensor shape when not using the top classification
    layer.
- pooling: Chooses the pooling strategy for feature extraction when the top layer
    is excluded.
- classes: Sets the number of output classes when using the top layer without pretrained
    weights.
