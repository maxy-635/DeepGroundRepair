2 api_name: tensorflow.keras.ops.append
3 api_description: Appends tensor x2 to the end of tensor x1 and returns the combined
  tensor.
4 api_signature: tf.keras.ops.append(x1,x2,axis)
5 api_details: ''
6 api_parameters:
- x1: The first tensor to which the second tensor will be appended.
- x2: The second tensor that will be appended to the first tensor.
- axis: The axis along which to append `x2` to `x1`, or `None` to flatten both tensors
    first.
7 api_usage_example:
- x1 = keras.ops.convert_to_tensor([1, 2, 3])
- x2 = keras.ops.convert_to_tensor([[4, 5, 6], [7, 8, 9]])
- keras.ops.append(x1, x2)
8 api_shape: ''
