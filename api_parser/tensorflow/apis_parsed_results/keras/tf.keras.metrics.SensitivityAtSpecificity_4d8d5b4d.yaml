2 api_name: tensorflow.keras.metrics.SensitivityAtSpecificity
3 api_description: Computes the best sensitivity achievable at or above a specified
  specificity threshold by scanning prediction thresholds and using true/false positive/negative
  counts, with optional sample weighting and class filtering.
4 api_signature: tf.keras.metrics.SensitivityAtSpecificity(specificity,num_thresholds,class_id)
5 api_details: ''
6 api_parameters:
- specificity: Sets the target specificity level that the metric should achieve or
    exceed.
- num_thresholds: Controls how many prediction thresholds are evaluated when searching
    for the target specificity.
- class_id: Selects the class index to compute the binary sensitivity-at-specificity
    metric for.
7 api_usage_example:
- m.reset_state()
- m.update_state([0, 0, 0, 1, 1], [0, 0.3, 0.8, 0.3, 0.8],
- '               sample_weight=[1, 1, 2, 2, 1])'
- m.result()
