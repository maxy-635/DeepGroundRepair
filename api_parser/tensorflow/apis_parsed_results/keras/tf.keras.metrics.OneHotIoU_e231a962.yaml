2 api_name: tensorflow.keras.metrics.OneHotIoU
3 api_description: Computes mean Intersection-over-Union for one-hot encoded labels
  by argmaxing labels and predictions, accumulating a weighted confusion matrix, and
  deriving IoU per class; use it when labels and predictions share the same one-hot
  shape and num_classes matches the data.
4 api_signature: tf.keras.metrics.OneHotIoU(num_classes,target_class_ids,ignore_class)
5 api_details: ''
6 api_parameters:
- num_classes: Sets the total number of possible class labels in the prediction task.
- target_class_ids: Specifies which class IDs to compute the IoU metric for.
- ignore_class: Excludes a specified class ID from metric computation, such as a void
    label.
7 api_usage_example:
- y_true = np.array([[0, 0, 1], [1, 0, 0], [0, 1, 0], [1, 0, 0]])
- y_pred = np.array([[0.2, 0.3, 0.5], [0.1, 0.2, 0.7], [0.5, 0.3, 0.1],
- '                      [0.1, 0.4, 0.5]])'
- sample_weight = [0.1, 0.2, 0.3, 0.4]
- m = keras.metrics.OneHotIoU(num_classes=3, target_class_ids=[0, 2])
- m.update_state(
- '    y_true=y_true, y_pred=y_pred, sample_weight=sample_weight)'
- '# cm = [[0, 0, 0.2+0.4],'
- '#       [0.3, 0, 0],'
- '#       [0, 0, 0.1]]'
- '# sum_row = [0.3, 0, 0.7], sum_col = [0.6, 0.3, 0.1]'
- '# true_positives = [0, 0, 0.1]'
- '# single_iou = true_positives / (sum_row + sum_col - true_positives))'
- '# mean_iou = (0 / (0.3 + 0.6 - 0) + 0.1 / (0.7 + 0.1 - 0.1)) / 2'
- m.result()
8 api_shape: ''
