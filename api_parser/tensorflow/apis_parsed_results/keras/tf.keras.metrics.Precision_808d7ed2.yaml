2 api_name: tensorflow.keras.metrics.Precision
3 api_description: Computes precision by tracking true positives and false positives,
  then returning true_positives / (true_positives + false_positives); supports sample
  weighting, top-k precision, and class-specific precision via class_id.
4 api_signature: tf.keras.metrics.Precision(thresholds,top_k,class_id,name,dtype)
5 api_details: ''
6 api_parameters:
- thresholds: Sets one or more cutoff values used to decide whether predicted scores
    count as positive.
- top_k: Limits the metric to the top-k highest predictions when computing precision.
- class_id: Restricts precision calculation to a single class index in multi-class
    predictions.
- name: Assigns a name to the metric instance for identification in logs and outputs.
- dtype: Specifies the data type used for the metric’s result values.
7 api_usage_example:
- '# With top_k=4, it will calculate precision over y_true[:4]'
- '# and y_pred[:4]'
- m = keras.metrics.Precision(top_k=4)
- m.update_state([0, 0, 1, 1], [1, 1, 1, 1])
- m.result()
8 api_shape: ''
