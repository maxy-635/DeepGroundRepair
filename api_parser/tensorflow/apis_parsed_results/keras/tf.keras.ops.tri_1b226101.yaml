2 api_name: tensorflow.keras.ops.tri
3 api_description: Creates a tensor filled with ones on and below a diagonal, and
  zeros above it.
4 api_signature: tf.keras.ops.tri(N,M,k,dtype)
5 api_details: ''
6 api_parameters:
- N: Sets the number of rows in the generated tensor.
