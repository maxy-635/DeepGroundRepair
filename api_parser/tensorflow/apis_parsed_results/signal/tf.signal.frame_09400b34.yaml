2 api_name: tensorflow.signal.frame
3 api_description: Slices a tensor along one axis into sliding frames of fixed length
  and step, optionally padding the final partial frames.
4 api_signature: tf.signal.frame(signal,frame_length,frame_step,pad_end,axis)
5 api_details: ''
6 api_parameters:
- signal: The input tensor whose samples are split into frames along the chosen axis.
- frame_length: The number of samples to include in each frame.
- frame_step: The number of samples to move forward between consecutive frames.
- pad_end: Whether to pad the signal so frames can be computed at the end.
- axis: The axis of the signal to frame, using negative values to count from the end.
7 api_usage_example:
- '# A batch size 3 tensor of 9152 audio samples.'
- audio = tf.random.normal([3, 9152])
- '# Compute overlapping frames of length 512 with a step of 180 (frames overlap'
- '# by 332 samples). By default, only 49 frames are generated since a frame'
- '# with start position j*180 for j > 48 would overhang the end.'
- frames = tf.signal.frame(audio, 512, 180)
- frames.shape.assert_is_compatible_with([3, 49, 512])
- '# When pad_end is enabled, the final two frames are kept (padded with zeros).'
- frames = tf.signal.frame(audio, 512, 180, pad_end=True)
- frames.shape.assert_is_compatible_with([3, 51, 512])
8 api_shape: ''
