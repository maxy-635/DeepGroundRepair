2 api_name: tensorflow.distribute.MultiWorkerMirroredStrategy
3 api_description: Synchronously trains a model across multiple workers and local
  devices by replicating variables/computations and coordinating updates with distributed
  collectives such as all-reduce.
4 api_signature: tf.distribute.MultiWorkerMirroredStrategy(cluster_resolver,communication_options)
5 api_details: ''
6 api_parameters:
- cluster_resolver: Specifies how to resolve the multi-worker cluster configuration,
    defaulting to `TFConfigClusterResolver` when not provided.
- communication_options: Sets the default cross-device communication settings used
    by the strategy unless overridden by specific communication calls.
7 api_usage_example:
- strategy = tf.distribute.MirroredStrategy(["GPU:0", "GPU:1"])
- '# Variable created inside scope:'
- 'with strategy.scope():'
- '  mirrored_variable = tf.Variable(1.)'
- mirrored_variable
- '# Variable created outside scope:'
- regular_variable = tf.Variable(1.)
- regular_variable
8 api_shape: ''
