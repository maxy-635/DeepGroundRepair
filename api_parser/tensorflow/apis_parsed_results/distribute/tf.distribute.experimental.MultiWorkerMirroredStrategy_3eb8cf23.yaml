2 api_name: tensorflow.distribute.experimental.MultiWorkerMirroredStrategy
3 api_description: Enables synchronous distributed training across multiple workers
  by replicating variables and computations on each worker and coordinating updates
  with collective communication such as all-reduce.
4 api_signature: tf.distribute.experimental.MultiWorkerMirroredStrategy(cluster_resolver)
5 api_details: ''
6 api_parameters:
- cluster_resolver: Specifies the cluster configuration and current task for multi-worker
    distributed training; if omitted, TensorFlow uses `TFConfigClusterResolver` from
    the environment.
7 api_usage_example:
- strategy = tf.distribute.MirroredStrategy(["GPU:0", "GPU:1"])
- '# Variable created inside scope:'
- 'with strategy.scope():'
- '  mirrored_variable = tf.Variable(1.)'
- mirrored_variable
- '# Variable created outside scope:'
- regular_variable = tf.Variable(1.)
- regular_variable
