2 api_name: tensorflow.distribute.MirroredStrategy
3 api_description: Synchronizes training across replicas on a single machine, typically
  multiple GPUs, by mirroring variables and coordinating updates; if no devices are
  specified it uses all available GPUs or falls back to CPUs.
4 api_signature: tf.distribute.MirroredStrategy(devices,cross_device_ops)
5 api_details: ''
6 api_parameters:
- devices: Specifies which device strings MirroredStrategy should use for replication;
    if omitted, it uses all available GPUs or falls back to CPU.
- cross_device_ops: Lets you choose the cross-device reduction implementation, defaulting
    to NCCL-based all-reduce unless you provide a custom CrossDeviceOps.
7 api_usage_example:
- strategy = tf.distribute.MirroredStrategy(["GPU:0", "GPU:1"])
- '# Variable created inside scope:'
- 'with strategy.scope():'
- '  mirrored_variable = tf.Variable(1.)'
- mirrored_variable
- '# Variable created outside scope:'
- regular_variable = tf.Variable(1.)
- regular_variable
8 api_shape: ''
