2 api_name: tensorflow.distribute.experimental.ParameterServerStrategy
3 api_description: A distributed TensorFlow strategy for parameter-server training
  that places variables on parameter servers and runs computation on workers, coordinated
  centrally for asynchronous custom training loops or Keras Model.fit.
4 api_signature: tf.distribute.experimental.ParameterServerStrategy(cluster_resolver,variable_partitioner)
5 api_details: ''
6 api_parameters:
- cluster_resolver: Provides the cluster information needed to configure the parameter
    server strategy.
- variable_partitioner: Controls how variables are split into partitions, or leaves
    them unpartitioned if `None`.
7 api_usage_example:
- strategy = tf.distribute.MirroredStrategy(["GPU:0", "GPU:1"])
- '# Variable created inside scope:'
- 'with strategy.scope():'
- '  mirrored_variable = tf.Variable(1.)'
- mirrored_variable
- '# Variable created outside scope:'
- regular_variable = tf.Variable(1.)
- regular_variable
8 api_shape: ''
