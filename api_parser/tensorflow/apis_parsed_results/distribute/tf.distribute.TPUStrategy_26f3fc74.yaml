2 api_name: tensorflow.distribute.TPUStrategy
3 api_description: Provides synchronous distributed training on TPUs and TPU Pods
  by creating a strategy object that coordinates model execution across TPU devices.
4 api_signature: tf.distribute.TPUStrategy(tpu_cluster_resolver)
5 api_details: ''
6 api_parameters:
- tpu_cluster_resolver: Specifies the TPU cluster resolver that provides TPU cluster
    information, or defaults to a local TPU worker when omitted.
7 api_usage_example:
- strategy = tf.distribute.MirroredStrategy(["GPU:0", "GPU:1"])
- '# Variable created inside scope:'
- 'with strategy.scope():'
- '  mirrored_variable = tf.Variable(1.)'
- mirrored_variable
- '# Variable created outside scope:'
- regular_variable = tf.Variable(1.)
- regular_variable
